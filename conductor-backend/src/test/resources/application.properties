spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Must match production (application.properties sets this false). Spring Boot defaults it to true,
# which holds the Hibernate session open for the whole request — so a controller that maps a lazily
# loaded association *after* its service's transaction closed passes in tests and 500s in production.
# That gap hid a LazyInitializationException that made doc comments unreadable on every document.
spring.jpa.open-in-view=false

# Fail connection acquisition fast in tests. The default is 30s; without this,
# @Scheduled tasks (scheduling-1) that fire while a Spring context is being torn
# down block the full 30s acquiring a connection from the closing pool, which
# dominated the CI test runtime. Legitimate acquisition against a local
# Testcontainer/H2 is sub-millisecond, so 2s is ample.
spring.datasource.hikari.connection-timeout=2000

# Shared by integration tests so their Spring context configuration is identical
# (no per-class @DynamicPropertySource), letting the context cache reuse one
# context instead of building a fresh one per class. CI's WORKFLOW_SECRETS_KEY env
# var still overrides this when set. Any valid Base64 32-byte key works
# ("test-secrets-key-32-chars-padded").
# (local.storage.path is set in AbstractE2ETest via @DynamicPropertySource — it
#  must be absolute and must outrank application-local.properties' ./local-uploads.)
workflow.secrets.key=dGVzdC1zZWNyZXRzLWtleS0zMi1jaGFycy1wYWRkZWQ=
jwt.secret=test-secret-key-must-be-at-least-32-chars-long-enough
jwt.expiry-hours=24
firebase.service-account-key=
resend.api-key=
gcp.storage.bucket-name=test-bucket
gcp.service-account-key=
gcp.signed-url.expiry-minutes=15
GOOGLE_OAUTH_CLIENT_ID=test-client-id
GOOGLE_OAUTH_CLIENT_SECRET=test-client-secret

# ConnectorFeedScheduler claims globally-scoped rows and its dispatch path enqueues a whole workflow
# run's worth of jobs -- letting it run against the shared test database the way most schedulers do
# would let one test's context claim rows another test just inserted. A constant here (not a per-class
# @DynamicPropertySource) keeps every class's Spring context configuration identical so the context
# cache still reuses one context; see docs/testing-guidelines.md. The one or two tests that actually
# need this scheduler live carry their own private @Container plus @TestPropertySource to flip it back
# on in isolation.
conductor.connector-feed.enabled=false

# Same reasoning as conductor.connector-feed.enabled above, for KnowledgeIngestScheduler: its dispatch
# path also enqueues workflow jobs against the one Postgres database shared by every
# AbstractPostgresIntegrationTest subclass, so a live 30s tick could claim/dispatch another test's
# just-inserted knowledge sources. Diagnosed after an intermittent ConditionTimeout in
# KnowledgeIngestSchedulerIntegrationTest#laneAlreadyProcessing_blocksOnlyThatLane_othersStillDispatch
# on main's post-merge CD run (not reproducible from the PR's own CI, which doesn't share state with
# other tests the same way). KnowledgeIngestSchedulerIntegrationTest carries its own private @Container
# plus @TestPropertySource to flip this back on in isolation.
conductor.knowledge.ingest-scheduler.enabled=false

# Same reasoning as conductor.connector-feed.enabled above, for PostPublishScheduler: its due poll
# selects every due post_publish_target row in the database, not a project's, so a live 30s tick would
# claim and dispatch rows another test's context just inserted. A constant here (not a per-class
# @DynamicPropertySource) keeps every class's Spring context configuration identical so the context
# cache still reuses one context; see docs/testing-guidelines.md. PostPublishSchedulerIntegrationTest
# drives PostPublishScheduler#runTick directly instead of flipping this back on.
conductor.post-publish.enabled=false
