spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Fail connection acquisition fast in tests. The default is 30s; without this,
# @Scheduled tasks (scheduling-1) that fire while a Spring context is being torn
# down block the full 30s acquiring a connection from the closing pool, which
# dominated the CI test runtime. Legitimate acquisition against a local
# Testcontainer/H2 is sub-millisecond, so 2s is ample.
spring.datasource.hikari.connection-timeout=2000

# Shared by integration tests so their Spring context configuration is identical
# (no per-class @DynamicPropertySource), letting the context cache reuse one
# context instead of building a fresh one per class. CI's WORKFLOW_SECRETS_KEY env
# var still overrides this when set. Any valid Base64 32-byte key works
# ("test-secrets-key-32-chars-padded").
# (local.storage.path is set in AbstractE2ETest via @DynamicPropertySource — it
#  must be absolute and must outrank application-local.properties' ./local-uploads.)
workflow.secrets.key=dGVzdC1zZWNyZXRzLWtleS0zMi1jaGFycy1wYWRkZWQ=
jwt.secret=test-secret-key-must-be-at-least-32-chars-long-enough
jwt.expiry-hours=24
firebase.service-account-key=
resend.api-key=
gcp.storage.bucket-name=test-bucket
gcp.service-account-key=
gcp.signed-url.expiry-minutes=15
GOOGLE_OAUTH_CLIENT_ID=test-client-id
GOOGLE_OAUTH_CLIENT_SECRET=test-client-secret
