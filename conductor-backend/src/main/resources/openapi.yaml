  /projects/{projectId}/knowledge/sources:
    post:
      tags: [knowledge]
      summary: Submit a knowledge source into the ingestion inbox
      description: >-
        Accepts one unit of inbound material (a Slack message, a GitHub PR, a manual note, etc.) into the
        inbox for later processing by the librarian. Idempotent on `dedupKey` (derived server-side when
        omitted) — a repeat delivery of the same underlying event returns the original source's id with
        status `DUPLICATE` instead of inserting again. `origin` is derived server-side from the caller's
        auth, never accepted from the client.
      operationId: submitKnowledgeSource
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeSourceSubmitRequest'
      responses:
        '202':
          description: Accepted into the inbox (new row, or a dedup hit against an existing one)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSourceReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [knowledge]
      summary: List or multi-get knowledge sources
      description: >-
        Two modes: pass `ids` (comma-separated) for a multi-get by id, resolving any offloaded payload
        back from storage; otherwise browses the inbox filtered by `status` (default `PENDING`), never
        resolving offloaded payload content. `ids` and `status` are mutually exclusive filters — `ids`
        takes precedence when both are supplied.
      operationId: listKnowledgeSources
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string}
        - name: status
          in: query
          required: false
          description: Filter by lifecycle status. Ignored when `ids` is supplied. Defaults to PENDING.
          schema:
            $ref: '#/components/schemas/KnowledgeSourceStatus'
        - name: ids
          in: query
          required: false
          description: Comma-separated source ids for a multi-get. Resolves offloaded payloads.
          schema: {type: string}
        - name: domain
          in: query
          required: false
          description: >-
            Restrict to sources routed to this domain lane (exact match against the slug stamped at
            submit time). Ignored when `ids` is supplied. Omit for every lane, including the
            unclassified/null lane.
          schema: {type: string}
      responses:
        '200':
          description: Matching knowledge sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeSourceDto'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{projectId}/knowledge/sources/counts:
    get:
      tags: [knowledge]
      summary: Inbox status counts for a project
      description: >-
        Cheap summary of the ingestion inbox by status (pending/processing/processed/skipped/dead) —
        for the UI's inbox badge/summary without a full listSources per status. Statuses with no rows
        are reported as 0, not omitted.
      operationId: getKnowledgeSourceCounts
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Inbox status counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSourceCounts'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{projectId}/knowledge/sources/retry:
    post:
      tags: [knowledge]
      summary: Retry every needs-attention (DEAD) source in a project
      description: >-
        ADMIN only. An ops recovery action, not a member action — resets every DEAD source in the
        project back to PENDING (attempts, nextAttemptAt, and errorMessage all cleared) so the
        ingestion scheduler re-claims them on its next tick. No request body.
      operationId: retryDeadKnowledgeSources
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Sources reset to PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSourceRetryResult'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{projectId}/knowledge/domains:
    get:
      tags: [knowledge]
      summary: List the project's knowledge domain registry
      description: >-
        Every domain row (ACTIVE, plus any SUGGESTED gap report or DISMISSED past suggestion), slug-
        ordered, each with its live pending/processing/processed source counts. Membership-gated like
        every other knowledge endpoint — no admin requirement for reading.
      operationId: listKnowledgeDomains
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The project's domain registry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeDomainDto'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [knowledge]
      summary: Raise a knowledge domain gap report
      description: >-
        Claim-or-return on `(projectId, slug)`: the first call for a slug inserts a SUGGESTED row; any
        later call (whatever the row's current state — ACTIVE, still SUGGESTED, or DISMISSED) returns
        the existing row unchanged instead of erroring or resetting it. A DISMISSED result means an
        admin already declined this slug — don't call this again for it. Activation is a separate step
        (the admin PATCH transitioning `state` to ACTIVE, which also seeds a skeleton schema page).
        Membership-gated, not admin-only — any project principal (including an agent's run-scoped MCP
        token) can raise a gap report; only approving one is privileged.
      operationId: createKnowledgeDomain
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeDomainRequest'
      responses:
        '200':
          description: The existing domain row (already suggested, active, or dismissed) — created is false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDomainDto'
        '201':
          description: A new SUGGESTED row was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDomainDto'
        '400':
          description: Invalid slug (must match `^[a-z0-9][a-z0-9-]*$`) or missing displayName.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{projectId}/knowledge/domains/{slug}/specialist:
    post:
      tags: [knowledge]
      summary: Create (or reassign) a specialist agent for a knowledge domain
      description: >-
        ADMIN only. Creates a project Agent `knowledge-<slug>` (provider `claude`, the same 6 knowledge
        tools and `maxToolTurns` as the generalist librarian, a domain-focused system prompt, a
        deterministic avatar) if one doesn't already exist under that slug, then assigns it as the
        domain's `owningAgentSlug` — one transaction. Idempotent: calling this again when the agent
        already exists just re-assigns it, never duplicates the Agent row. No request body.
      operationId: createKnowledgeDomainSpecialist
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string}
        - name: slug
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The domain, now owned by its specialist agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDomainDto'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such domain slug in this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{projectId}/knowledge/domains/{slug}:
    patch:
      tags: [knowledge]
      summary: Update a knowledge domain's metadata, owning agent, or state
      description: >-
        All-optional partial update; ADMIN only. `displayName`/`description`/`sourceTypePatterns` are
        classic PATCH semantics — omit a field to leave it unchanged. `state` transitions the domain
        (e.g. approving a SUGGESTED gap report to ACTIVE). `owningAgentSlug` assigns a specialist agent
        (validated to exist in this project); to clear an existing assignment, set `clearOwningAgent`
        true — a plain omitted/null `owningAgentSlug` alone is treated as "leave unchanged", since this
        API has no wire-level way to distinguish an absent field from an explicit `null` for one field
        in an otherwise-partial body.
      operationId: updateKnowledgeDomain
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string}
        - name: slug
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKnowledgeDomainRequest'
      responses:
        '200':
          description: The updated domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDomainDto'
        '400':
          description: Unknown owningAgentSlug (no such agent in this project)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such domain slug in this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{projectId}/knowledge/pages/batch-write:
    post:
      tags: [knowledge]
      summary: Atomically create, update, or delete a batch of knowledge pages
      description: >-
        Applies every write atomically with optimistic concurrency (`baseVersion`): any conflict across
        the whole batch aborts it entirely (nothing written) — see the 409 response. On success, rebuilds
        each written page's link graph and, if `sourceIds`/`skipped` are supplied, marks those ingestion
        sources PROCESSED/SKIPPED (respectively) in the same transaction so a crash never leaves a source
        silently re-processed or a write silently lost. `writes` may be empty when `sourceIds`/`skipped`
        cover the batch, to settle sources with no page change. A source id must appear in at most one of
        `sourceIds`/`skipped` — both is a 400. The write's `actor`/origin provenance is derived
        server-side from the caller's auth, never accepted from the client.
      operationId: batchWriteKnowledgePages
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgePageBatchWriteRequest'
      responses:
        '200':
          description: All writes applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePageBatchWriteResponse'
        '400':
          description: >-
            Invalid path, a duplicate path within the batch, a `skipped` entry with a blank/null
            sourceId or reason, or a source id present in both `sourceIds` and `skipped`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Malformed frontmatter (missing/unterminated delimiters, or missing the required `type` field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            One or more writes lost a concurrency race. The response body carries a `conflicts` extension
            property (`[{path, currentVersion, currentContent}]`, `currentContent` null when the path has
            no live page) alongside the standard problem fields — re-read the conflicting paths and retry.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{projectId}/knowledge/pages/dismiss:
    post:
      tags: [knowledge]
      summary: '"Not worth filing": delete a page and record why on its governing curation policy'
      description: >-
        Soft-deletes the page at `path` and, in the same transaction, appends a dated rule recording
        `reason` to the `_curation.md` page that governs it (root, or the owning area's) -- the page the
        librarian reads before every batch, so the next similar source isn't refiled. One endpoint
        rather than two client-side `batch-write` calls because the two halves must not come apart: a
        deleted page with no recorded reason is one the librarian will cheerfully recreate from the next
        similar source. Membership-gated (a member can already delete any page via `batch-write`;
        admin-gating the reason-recording path would only push people toward the rawer one).
      operationId: dismissKnowledgePage
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgePageDismissRequest'
      responses:
        '200':
          description: Page dismissed and the curation rule recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePageDismissResponse'
        '400':
          description: Blank reason, invalid path, or an attempt to dismiss a _schema.md/_curation.md policy page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No live page at that path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The page's baseVersion is stale -- it changed since the caller last read it. The response
            body carries a `conflicts` extension alongside the standard problem fields.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Malformed frontmatter on the existing curation page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{projectId}/knowledge/pages:
    get:
      tags: [knowledge]
      summary: Multi-get knowledge pages by path
      description: >-
        Full-content read of the given paths. Unknown or deleted paths are silently omitted (multi-get
        semantics) — the response array may be shorter than the request. `index.md` resolves to the
        generated virtual index instead of a stored page.
      operationId: getKnowledgePages
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string}
        - name: paths
          in: query
          required: true
          description: Comma-separated page paths (e.g. `a.md,dir/b.md`).
          schema: {type: string}
      responses:
        '200':
          description: The pages that exist among the requested paths
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgePageView'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{projectId}/knowledge/index:
    get:
      tags: [knowledge]
      summary: Get the generated knowledge bundle index
      description: >-
        The virtual `index.md` page: every live page grouped by directory, for an LLM librarian to orient
        itself. Generated on read, not stored.
      operationId: getKnowledgeIndex
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The generated index page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePageView'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{projectId}/knowledge/search:
    get:
      tags: [knowledge]
      summary: Full-text search over the knowledge bundle
      operationId: searchKnowledge
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string}
        - name: q
          in: query
          required: true
          schema: {type: string}
        - name: type
          in: query
          required: false
          description: Restrict to pages of this frontmatter `type`.
          schema: {type: string}
        - name: pathPrefix
          in: query
          required: false
          description: Restrict to pages whose path starts with this prefix.
          schema: {type: string}
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Ranked search hits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeSearchHit'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{projectId}/knowledge/revisions:
    get:
      tags: [knowledge]
      summary: Revision history for one knowledge page
      description: >-
        Newest first, with actor and linked-source provenance. `path` is a query parameter (not a path
        segment) because page paths themselves contain slashes.
      operationId: listKnowledgePageRevisions
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string}
        - name: path
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Revisions for the page, newest first (empty if the page doesn't exist)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgePageRevisionView'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{projectId}/knowledge/pipeline/health:
    get:
      tags: [pipeline]
      summary: Live per-stage health for the source-to-wiki-page pipeline
      description: >-
        One entry per fixed pipeline stage (webhooks, feeds, digests, inbox, librarian runs, pages
        written), each with status-keyed counts for a recent window. Read-only, membership-gated like
        the rest of the knowledge surface — no admin requirement. The digests stage always reports a
        `skipped` bucket on its own (never folded into another bucket) so a quiet-by-design period
        (nothing material happened) reads as healthy, not broken — see issue #342.
      operationId: getPipelineHealth
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Per-stage health snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineHealthDto'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{projectId}/knowledge/pipeline/trace:
    get:
      tags: [pipeline]
      summary: Walk one item's trace across the pipeline
      description: >-
        Given exactly one typed anchor (`pageId`, `sourceId`, `feedId`, or `webhookEventId`), returns
        the ordered chain of pipeline stages that produced it (or that it produced), backward and/or
        forward as applicable. A step whose underlying record has since been hard-deleted by
        retention (a `DEAD` source past its retention window) is reported as a terminal `degraded`
        placeholder node rather than a 404 for the whole trace. Exactly one anchor parameter must be
        supplied — zero or more than one is a 400.
      operationId: getPipelineTrace
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string}
        - name: pageId
          in: query
          required: false
          schema: {type: string}
        - name: sourceId
          in: query
          required: false
          schema: {type: string}
        - name: feedId
          in: query
          required: false
          schema: {type: string}
        - name: webhookEventId
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: The trace, oldest step first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineTraceDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  responses:
    Forbidden:
      description: Caller is not authorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: External service temporarily unavailable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: http
      scheme: bearer
      description: API key authentication (Bearer token)

  schemas:
    GithubInstallUrlResponse:
      type: object
      properties:
        installUrl:
          type: string
    GithubRepository:
      type: object
      properties:
        fullName:
          type: string
        private:
          type: boolean
    GithubRepositoriesResponse:
      type: object
      properties:
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/GithubRepository'
        installationHtmlUrl:
          type: string
        accountLogin:
          type: string
        repositorySelection:
          type: string
    BindGithubPatRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
        label:
          type: string
          nullable: true
          description: Defaults to "PAT (@<login>)" (GitHub-reported login) when omitted.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Fallback only — used when GitHub does not report an expiration for this token (e.g. a
            non-expiring classic PAT). Ignored when GitHub's own
            github-authentication-token-expiration response header is present.
    IntegrationListItem:
      type: object
      properties:
        connectorId:
          type: string
        name:
          type: string
        category:
          type: string
        authType:
          type: string
        capabilities:
          type: array
          items:
            type: string
        singleInstance:
          type: boolean
        description:
          type: string
        iconLabel:
          type: string
        connected:
          type: boolean
        configFields:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorConfigFieldDto'
        connections:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionSummary'

    ConnectorCatalogEntryDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        authType:
          type: string
        capabilities:
          type: array
          items:
            type: string
        configFields:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorCatalogConfigFieldDto'
        connected:
          type: boolean
        activeConnectionIds:
          type: array
          items:
            type: string
        ingest:
          type: array
          description: >-
            The connector's declared Knowledge Center feeds (its IngestSpec entries) — the
            registry-driven source of what's provisionable, independent of whether any project has
            connected yet. See GET .../feeds for a project's already-provisioned feed instances.
          items:
            $ref: '#/components/schemas/ConnectorCatalogIngestDto'

    ConnectorCatalogConfigFieldDto:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        type:
          type: string
        required:
          type: boolean
        secret:
          type: boolean

    ConnectorCatalogIngestDto:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        isMetricFeed:
          type: boolean

    ConnectorFeedDto:
      type: object
      properties:
        id:
          type: string
        ingestId:
          type: string
        label:
          type: string
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
        intervalMinutes:
          type: integer
        status:
          type: string
          enum: [ACTIVE, PAUSED, SETUP_REQUIRED, DEAD]
        lastRunAt:
          type: string
          format: date-time
          nullable: true
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
        consecutiveFailures:
          type: integer
        nextRunAt:
          type: string
          format: date-time
        isMetricFeed:
          type: boolean

    UpdateConnectorFeedRequest:
      type: object
      description: >-
        Partial update — only the fields present are changed. Cursor/status/nextRunAt are
        platform-owned scheduling state and are deliberately not part of this request shape.
      properties:
        enabled:
          type: boolean
          nullable: true
        intervalMinutes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 44640

    IntegrationToolItem:
      type: object
      properties:
        connectionId:
          type: string
        connectorId:
          type: string
        displayLabel:
          type: string
        capabilities:
          type: array
          items:
            type: string
        toolMetadata:
          type: object
          description: Tool metadata including description, operations, actions, and connection-specific config hints
          additionalProperties: true

    ConnectorConfigFieldDto:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        hint:
          type: string
          nullable: true
        type:
          type: string
        source:
          type: string
        required:
          type: boolean
        secret:
          type: boolean

    ConnectionSummary:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
          nullable: true
        status:
          type: string
        authType:
          type: string
          nullable: true
        tokenExpiresAt:
          type: string
          format: date-time
          nullable: true
        healthStatus:
          type: string
          nullable: true
          description: >
            Whether this connection is usable. UNHEALTHY means the platform has rejected its
            credentials (expired or revoked token, withdrawn permission) and a human must
            reconnect the account — the connection is still ACTIVE, it just cannot be used.
            HEALTHY/DEGRADED/SETUP_REQUIRED grade the connector's last data fetch instead.
            UNHEALTHY takes precedence over a fetch grade. Null when never checked.
        healthCheckedAt:
          type: string
          format: date-time
          nullable: true
          description: When the connection's own health was last determined.
        healthMessage:
          type: string
          nullable: true
          description: >
            The platform's explanation of an UNHEALTHY verdict, for display to the human who has
            to fix it. Null while healthy.
        fetchedAt:
          type: string
          format: date-time
          nullable: true

    CreateConnectionRequest:
      type: object
      properties:
        label:
          type: string
          nullable: true
        apiKey:
          type: string
          nullable: true
        serviceAccountKey:
          type: string
          nullable: true
          description: >
            Service-account JSON key (SERVICE_ACCOUNT connectors). Write-only; never returned.
        configJson:
          type: object
          additionalProperties: true
          nullable: true

    UpdateConnectionRequest:
      type: object
      properties:
        label:
          type: string
          nullable: true
        config:
          type: object
          additionalProperties: true
          nullable: true

    ConnectionResponse:
      type: object
      properties:
