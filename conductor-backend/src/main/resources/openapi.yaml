      summary: Cancel a workflow run
      description: >
        Requests cancellation of a pending or running workflow run. Returns 202 once the run has been
        marked CANCELLING and no further jobs will be dispatched; in-flight steps are cancelled
        best-effort and the run settles to CANCELLED once nothing is left running. Idempotent if the
        run is already CANCELLING. Returns 409 if the run has already reached a terminal status
        (SUCCESS, FAILED, or CANCELLED).
      operationId: cancelWorkflowRun
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Cancellation requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRunDto"
        "404":
          description: Run not found
        "409":
          description: Run has already finished

  /projects/{projectId}/workflows/{workflowId}/runs/cancel-queued:
    post:
      tags: [workflows]
      summary: Cancel all queued runs for a workflow
      description: >
        Drains the queued backlog without touching in-flight work: cancels every run that's either
        PENDING, or blocked on a self-hosted job no daemon has claimed yet (with no other job on it
        that's RUNNING or already claimed) — via the same path as a single-run cancel. This set is a
        strict subset of what the UI counts as "Queued": the UI's queued view also includes a run
        blocked on an unclaimed job even when another job on that same run is genuinely in flight, but
        this endpoint excludes it. A run with any genuinely in-flight job (RUNNING, or a claimed
        AWAITING_PICKUP) is left untouched even if it also happens to have an unclaimed job elsewhere.
        A no-op returning cancelledCount 0 if nothing qualifies.
      operationId: cancelQueuedWorkflowRuns
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Queued runs cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelQueuedRunsResponse"
        "404":
          description: Workflow not found

  /projects/{projectId}/daemon/events:
    get:
      tags:
        - daemon
      summary: Poll for pending daemon events
      operationId: getDaemonEvents
      security:
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
