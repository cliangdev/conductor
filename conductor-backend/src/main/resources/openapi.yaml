  /projects/{projectId}/workflows/{workflowId}/publish:
    post:
      tags:
        - workflows
      summary: Publish a DRAFT Workflow definition
      description: >-
        Promotes the Workflow's DRAFT definition to PUBLISHED after validation. Only a
        PUBLISHED version is bindable by Work Items; in-flight Work Items stay pinned to
        the version they started on. (COND-18 P0-1/P0-2; the impact preview is computed
        client-side from this and the runs/work-item queries.)
      operationId: publishWorkflow
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinitionDto"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN/CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Definition failed semantic validation (unreachable status, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

