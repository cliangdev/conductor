      responses:
        "200":
          description: Interpolated dispatch payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDispatchPayloadDto"
        "401":
          description: Unauthorized
        "403":
          description: API key does not belong to this run's project
        "404":
          description: Run or job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Job is not awaiting pickup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

