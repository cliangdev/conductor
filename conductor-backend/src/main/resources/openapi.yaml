  /integrations/github/app/callback:
    get:
      tags: [github]
      summary: GitHub App Setup-URL redirect target (public, 302 back to the app)
      description: >-
        Public callback hit by GitHub's browser redirect after an install. The single-use, short-TTL,
        random state binds the install to (projectId, connectedBy) — it is the CSRF binding. installation_id
        is trusted as delivered by GitHub's redirect.
      operationId: handleGithubSetupCallback
      parameters:
        - name: installation_id
          in: query
          required: false
          schema: {type: string}
        - name: setup_action
          in: query
          required: false
          schema: {type: string}
        - name: state
          in: query
          required: false
          schema: {type: string}
      security: []
      responses:
