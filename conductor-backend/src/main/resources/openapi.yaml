  /workflow-runs/{runId}/jobs/{jobId}/dispatch-payload:
    get:
      tags:
        - daemon
      summary: Fetch the interpolated dispatch payload for a self-hosted job awaiting pickup
      description: >
        Env, per-step prompts/inputs, and the run token are interpolated on read and never persisted —
        the DaemonEvent that announces this job is a pointer only. Only valid while the job is
        AWAITING_PICKUP; returns 409 once it has moved on.
      operationId: getJobDispatchPayload
      security:
        - apiKeyAuth: []
      parameters:
        - name: runId
          in: path
          required: true
