          nullable: true
        domain:
          type: string
          nullable: true
          description: >-
            Explicit domain-lane request, validated against the project's ACTIVE registry (unknown/
            inactive slug is a 400). Omit to let KnowledgeDomainResolver route by sourceType pattern.

    KnowledgeSourceReceipt:
      type: object
      required:
        - sourceId
        - status
      properties:
        sourceId:
          type: string
        status:
          type: string
          enum: [ACCEPTED, DUPLICATE]
          description: ACCEPTED — a new row was inserted. DUPLICATE — the dedup key matched an existing row.

    KnowledgeSourceDto:
      type: object
      required:
        - id
        - projectId
        - sourceType
        - status
      properties:
        id:
          type: string
        projectId:
          type: string
        sourceType:
          type: string
        sourceRef:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        contentType:
          type: string
          nullable: true
        payload:
          type: string
          nullable: true
          description: Null when not resolved (browse mode) or when offloaded and not requested by id.
        payloadOffloaded:
          type: boolean
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        origin:
          $ref: '#/components/schemas/KnowledgeOrigin'
        occurredAt:
          type: string
          format: date-time
          nullable: true
        receivedAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/KnowledgeSourceStatus'
        attempts:
          type: integer
        errorMessage:
          type: string
          nullable: true
        skipReason:
          type: string
          nullable: true
          description: >-
            Set when status is SKIPPED -- why the librarian judged this source not worth a page. Null
            for every other status.
        purgedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Set once KnowledgeRetentionService has compacted this source's payload (nulled the inline
            column and/or deleted the offloaded GCS object). Null means the payload is still intact.
        domain:
          type: string
          nullable: true
          description: The domain lane this source was routed to at submit time. Null is the unclassified/generalist lane.

    KnowledgeSourceCounts:
      type: object
      description: Inbox status counts for a project — a cheap summary for the UI, avoiding a full listSources per status.
      required:
        - pending
        - processing
        - processed
        - skipped
        - dead
      properties:
        pending:
          type: integer
          format: int64
        processing:
          type: integer
          format: int64
        processed:
          type: integer
          format: int64
        skipped:
          type: integer
          format: int64
        dead:
          type: integer
          format: int64

    KnowledgeSourceRetryResult:
      type: object
      description: Result of resetting a project's DEAD sources back to PENDING.
      required:
        - retried
      properties:
        retried:
          type: integer
          description: Number of sources moved from DEAD to PENDING.

    PipelineStage:
      type: string
      enum: [WEBHOOKS, FEEDS, DIGESTS, INBOX, LIBRARIAN_RUNS, PAGES_WRITTEN]
      description: A fixed stage in the source-to-wiki-page pipeline (issue #342).

    PipelineStageHealth:
      type: object
      required:
        - stage
        - label
        - counts
      properties:
        stage:
          $ref: '#/components/schemas/PipelineStage'
        label:
          type: string
          description: Human-readable stage name for display.
        counts:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: >-
            Status-keyed counts for this stage. Bucket names vary per stage (e.g. the DIGESTS stage
            always includes a `skipped` bucket) — a plain map keeps this additive as stages gain new
            buckets, without a schema change per bucket.

    PipelineStageEdge:
      type: object
      required:
        - from
        - to
      properties:
        from:
          $ref: '#/components/schemas/PipelineStage'
        to:
          $ref: '#/components/schemas/PipelineStage'
      description: >-
        A directed edge in the pipeline's actual data-flow graph (issue #342 correction) — data-driven,
        not positional. Consumers must not infer an edge from two stages being adjacent in any list.

    PipelineHealthDto:
      type: object
      required:
        - stages
        - edges
      properties:
        stages:
          type: array
          items:
            $ref: '#/components/schemas/PipelineStageHealth'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/PipelineStageEdge'
          description: The pipeline's directed stage graph. See PipelineTopology.EDGES on the backend.

    PipelineTraceNode:
      type: object
      required:
        - stage
        - id
        - degraded
      properties:
        stage:
          $ref: '#/components/schemas/PipelineStage'
        id:
          type: string
        status:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time
          nullable: true
        label:
          type: string
          nullable: true
        link:
          type: string
          nullable: true
          description: Frontend-routable path for this node, or null if not linkable.
        degraded:
          type: boolean
          description: >-
            True when the underlying record no longer exists (purged by retention) and this is a
            terminal placeholder rather than a resolved node.

    PipelineTraceDto:
      type: object
      required:
        - nodes
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/PipelineTraceNode'
          description: Ordered oldest-step-first.

    KnowledgeDomainState:
      type: string
      enum: [ACTIVE, SUGGESTED, DISMISSED]
      description: >-
        ACTIVE domains route sources and appear in the Domains panel. SUGGESTED is a librarian-raised
        gap report awaiting admin approval. DISMISSED is a declined suggestion the librarian should not
        re-raise for the same slug.

    KnowledgeDomainDto:
      type: object
      required:
        - slug
        - displayName
        - pathPrefix
        - schemaPagePath
        - sourceTypePatterns
        - state
        - pendingCount
        - processingCount
        - processedCount
      properties:
        slug:
          type: string
        displayName:
          type: string
        description:
          type: string
          nullable: true
        pathPrefix:
          type: string
          description: The wiki directory this domain owns, e.g. `engineering/`.
        schemaPagePath:
          type: string
          description: Path of this domain's schema page, e.g. `engineering/_schema.md`.
        sourceTypePatterns:
          type: array
          items:
            type: string
          description: Glob patterns (`*` wildcard) matched against a submission's sourceType when no explicit domain is given, in slug order.
        owningAgentSlug:
          type: string
          nullable: true
          description: Specialist agent slug, if one is assigned. Null falls back to the generalist knowledge-librarian at dispatch.
        state:
          $ref: '#/components/schemas/KnowledgeDomainState'
        suggestionReason:
          type: string
          nullable: true
          description: Set only for a SUGGESTED (or since-DISMISSED) row -- why the librarian raised this gap report.
        pendingCount:
          type: integer
          format: int64
        processingCount:
          type: integer
          format: int64
        processedCount:
          type: integer
          format: int64

    UpdateKnowledgeDomainRequest:
      type: object
      description: >-
        All-optional partial update. `owningAgentSlug`/`clearOwningAgent` are a discriminated pair (see
        `updateKnowledgeDomain`'s description) rather than a plain nullable field, since this API has no
        wire-level way to distinguish an omitted field from an explicit `null` for one field in an
        otherwise-partial body.
      properties:
        displayName:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        sourceTypePatterns:
          type: array
          nullable: true
          items:
            type: string
          description: Omit to leave unchanged. An empty array is a valid value (clears all patterns), distinct from omitted.
        owningAgentSlug:
          type: string
          nullable: true
          description: Assigns this agent slug (must exist in this project). Ignored unless non-null -- to clear an assignment, use clearOwningAgent instead.
        clearOwningAgent:
          type: boolean
          default: false
          description: Set true to clear an existing owningAgentSlug assignment. Takes precedence over owningAgentSlug if both are set.
        state:
          $ref: '#/components/schemas/KnowledgeDomainState'

    CreateKnowledgeDomainRequest:
      type: object
      description: Raises a gap report for a domain that doesn't exist in the registry yet. Always lands SUGGESTED -- activation is a separate admin PATCH.
      required:
        - slug
        - displayName
      properties:
        slug:
          type: string
          description: Must match `^[a-z0-9][a-z0-9-]*$` -- it becomes the domain's wiki path prefix.
        displayName:
          type: string
        description:
          type: string
          nullable: true
        sourceTypePatterns:
          type: array
          nullable: true
          items:
            type: string
          description: Optional glob patterns to seed the registry row with, if known upfront. Defaults to empty.
        reason:
          type: string
          nullable: true
          description: Why this domain is being suggested -- surfaced to the admin reviewing the gap report.

    KnowledgePageWrite:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          description: Bundle-relative page path, e.g. dir/page.md.
        content:
          type: string
          nullable: true
          description: Full document (frontmatter + body). Ignored for a delete.
        baseVersion:
          type: integer
          nullable: true
          description: The version the caller last observed. Null means "this path doesn't exist yet". Any mismatch against the current stored version is a conflict.
        delete:
          type: boolean
          default: false

    KnowledgeSkippedSource:
      type: object
      required:
        - sourceId
        - reason
      properties:
        sourceId:
          type: string
        reason:
          type: string
          description: Why this source was reviewed and deliberately not filed. Required -- shown to a human in the Inbox.

    KnowledgePageBatchWriteRequest:
      type: object
      required:
        - writes
      properties:
        writes:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgePageWrite'
        sourceIds:
          type: array
          nullable: true
          items:
            type: string
          description: Ingestion sources this batch was derived from. Marked PROCESSED in the same transaction on success.
        skipped:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/KnowledgeSkippedSource'
          description: >-
            Ingestion sources this batch reviewed and deliberately did not file. Marked SKIPPED with the
            given reason in the same transaction on success. A source id must appear in at most one of
            `sourceIds`/`skipped` -- both is a 400.

    KnowledgePageWriteResult:
      type: object
      required:
        - path
        - version
        - contentHash
      properties:
        path:
          type: string
        version:
          type: integer
        contentHash:
          type: string

    KnowledgePageBatchWriteResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgePageWriteResult'

    KnowledgePageDismissRequest:
      type: object
      required:
        - path
        - baseVersion
        - reason
      properties:
        path:
          type: string
          description: Bundle-relative path of the page being dismissed.
        baseVersion:
          type: integer
          description: The version the caller last observed. A stale value is a 409.
        reason:
          type: string
          description: >-
            Why this page shouldn't exist. Required -- appended as a dated rule on the governing
            _curation.md.

    KnowledgePageDismissResponse:
      type: object
      required:
        - path
        - version
        - curationPagePath
        - curationPageVersion
      properties:
        path:
          type: string
        version:
          type: integer
          description: The dismissed page's new (tombstone) version.
        curationPagePath:
          type: string
          description: Path of the _curation.md page the dismissal reason was recorded on.
        curationPageVersion:
          type: integer
          description: The curation page's new version after the rule was appended.

    KnowledgePageView:
      type: object
      required:
        - path
        - version
        - type
      properties:
        path:
          type: string
        version:
          type: integer
          description: 0 for generated virtual pages (index.md, log.md).
        type:
          type: string
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        content:
          type: string
          description: Canonical render (frontmatter + body).

    KnowledgeSearchHit:
      type: object
      required:
        - path
        - type
        - rank
      properties:
        path:
          type: string
        type:
          type: string
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        snippet:
          type: string
          nullable: true
        rank:
          type: number
          format: double

    KnowledgeActor:
      type: object
      description: Who/what performed a page write.
      properties:
        kind:
          type: string
          description: Free-form discriminator, e.g. user, workflow, librarian.
        id:
          type: string
          nullable: true
        workflowRunId:
          type: string
          nullable: true

    KnowledgePageRevisionView:
      type: object
      required:
        - version
        - changeKind
        - createdAt
      properties:
        version:
          type: integer
        changeKind:
          type: string
          enum: [CREATE, UPDATE, DELETE]
        actor:
          $ref: '#/components/schemas/KnowledgeActor'
        createdAt:
          type: string
          format: date-time
        sourceRefs:
          type: array
          items:
            type: string
