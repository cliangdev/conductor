  /projects/{projectId}/workflows/{workflowId}/runs:
    get:
      tags: [workflows]
      summary: List workflow runs
      operationId: listWorkflowRuns
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: status
          in: query
          required: false
          explode: true
          style: form
          description: >-
            Filter to runs in any of the given statuses (repeat the param, e.g.
            `?status=PENDING&status=RUNNING`). Omit to return runs in all statuses. An unrecognized
            status value is rejected with 400. Mutually exclusive with `state` — supplying both is
            rejected with 400.
          schema:
            type: array
            items:
              type: string
        - name: state
          in: query
          required: false
          description: >-
            Derived, UI-facing alternative to `status`: "queued" matches a run that hasn't started
            (PENDING/PENDING_LOCAL_PICKUP) OR is RUNNING at the run level purely because it's blocked
            on a self-hosted job no daemon has claimed yet; "running" matches a run that's actually
            executing (RUNNING/CANCELLING) with no such unclaimed job. The two are mutually exclusive,
            but not exhaustive over every non-terminal run: LOCAL_PICKUP_TIMEOUT is non-terminal and
            matches neither (a timed-out run has no unclaimed AWAITING_PICKUP job and isn't
            PENDING/PENDING_LOCAL_PICKUP or RUNNING/CANCELLING) — use `status` or the unfiltered list to
            see it. An unrecognized value is rejected with 400; supplying both `state` and `status` is
            rejected with 400.
          schema:
            type: string
            enum: [queued, running]
      responses:
        "200":
          description: List of runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowRunDto"
        "400":
          description: Unrecognized status/state value, or both status and state given

