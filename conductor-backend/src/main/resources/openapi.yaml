    get:
      tags: [agents]
      summary: Report whether a BYO API key is configured for a provider
      description: Never returns the key itself — only whether one is stored.
      operationId: getProviderCredentialStatus
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string}
        - name: provider
          in: path
          required: true
          schema: {type: string}
      security:
        - bearerAuth: []
