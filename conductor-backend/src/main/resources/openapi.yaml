          type: string
        description:
          type: string
    WorkflowKind:
      type: string
      description: >-
        Explicit kind of a Workflow definition so callers never infer it from payload shape.
        LIFECYCLE = a statechart that drives Work Item state (has a `definition`); AUTOMATION =
        a YAML run-automation. Derived server-side and authoritative.
      enum:
        - LIFECYCLE
        - AUTOMATION

    WorkflowView:
      type: object
      description: >-
        Lean, render-ready projection of a Workflow's statechart for the UI. Resolved by slug via the
        Workflow resolver, so it covers built-in workflows (e.g. ENGINEERING) as well as project-authored ones.
      required: [slug, noun, defaultView, version, types, statuses, transitions]
      properties:
        slug:
          type: string
        noun:
          type: string
          description: Display noun for this Workflow's Work Items (e.g. "Issue").
        area:
          type: string
          nullable: true
          description: Nav-grouping slug from the statechart (e.g. "ENGINEERING"); used for breadcrumbs.
        defaultView:
          type: string
          description: Default Work Item list rendering (list | board | calendar).
        version:
          type: integer
        types:
          type: array
          items:
            type: string
        assetTypes:
          type: array
          items:
            type: string
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStatusView"
        transitions:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowTransitionView"
        metric:
          $ref: "#/components/schemas/WorkflowMetricView"

    WorkflowStatusView:
      type: object
      required: [id, label, category]
      properties:
        id:
          type: string
        label:
          type: string
          description: Human-friendly display name; falls back to the id.
        category:
          type: string
          description: Lane grouping — open | in_progress | terminal. Drives Active/Done bucketing and color.
        initial:
          type: boolean
        terminal:
          type: boolean

    WorkflowTransitionView:
      type: object
      required: [from, to, label]
      properties:
        from:
          type: string
        to:
          type: string
        label:
          type: string
        requiresReview:
          type: boolean
        reviewerRole:
          type: string
          nullable: true
        trigger:
          type: string
          nullable: true

    WorkflowMetricView:
      type: object
      required: [name, direction]
      properties:
        name:
          type: string
        unit:
          type: string
          nullable: true
        direction:
          type: string

