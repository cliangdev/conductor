          type: string
        image:
          type: string
          description: Artifact Registry image reference pinned on the Cloud Run Job at provision time.
        jobName:
          type: string
          nullable: true
          description: "Defaults to conductor-<name> when omitted."

    UpdateRuntimeTargetRequest:
      type: object
      description: Only config fields are mutable — name, provider, and connection are immutable after create. Any change re-provisions.
      properties:
        region:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        jobName:
          type: string
          nullable: true

    RuntimeTargetResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
        connectionId:
          type: string
        gcpProjectId:
          type: string
        region:
          type: string
        jobName:
          type: string
        image:
          type: string
        status:
          type: string
          enum: [PROVISIONING, ACTIVE, ERROR]
        errorMessage:
          type: string
          nullable: true
        warnings:
          type: array
          nullable: true
          items:
            type: string
        resolvedImage:
          type: string
          nullable: true
          description: >-
            The image reference GCP echoed back on the last successful provision (create/update
            Job) call. Cloud Run resolves a tag to a specific digest at that moment and pins it on
            the Job — this is the ground truth for "what's actually running", since `image` above
            is only the configured tag and a later push to that tag has no effect until the target
            is re-provisioned (see lastProvisionedAt).
        lastProvisionedAt:
          type: string
          format: date-time
          nullable: true
          description: When the Job resource was last successfully created or updated (from GCP's own Job.update_time, not Conductor's clock).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

