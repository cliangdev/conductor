        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        eventPayload:
          type: object
          readOnly: true
          description: The run's trigger payload (event fields, and `inputs` for a manual dispatch).
        waitReason:
          type: string
          readOnly: true
          nullable: true
          description: >-
            Why this run isn't making progress yet — a free-form code (only "AWAITING_RUNNER" today)
            rather than an enum, so a future wait condition doesn't need an API change.
            "AWAITING_RUNNER" means the run has at least one job in AWAITING_PICKUP that no self-hosted
            daemon has claimed yet — not merely dispatched: a self-hosted job stays AWAITING_PICKUP for
            its entire execution once claimed, so an unclaimed check is what actually distinguishes
            "waiting for a runner" from "running on one". Null once every AWAITING_PICKUP job on the
            run has been claimed, and for a run with no wait condition at all, including every terminal
            run.

