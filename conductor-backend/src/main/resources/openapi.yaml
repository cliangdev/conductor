      summary: List workflows for a project
      description: >-
        Returns the project's Workflow definitions. Optional filters narrow to lifecycle (statechart) vs
        automation (YAML) workflows and by lifecycle state — e.g. `?lifecycle=true&state=PUBLISHED` for the
        published statechart workflows a sidebar/nav needs, so callers don't filter on internal shape.
      operationId: listWorkflows
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: lifecycle
          in: query
          required: false
          description: >-
            true → only lifecycle (statechart) workflows (have a `definition`); false → only automation
            (YAML) workflows; omit for all.
          schema:
            type: boolean
        - name: state
          in: query
          required: false
          description: Filter by lifecycle state (DRAFT | PUBLISHED).
          schema:
            type: string
        - name: sidebar
          in: query
          required: false
          description: >-
            true → only Workflows flagged to appear in the sidebar nav; false → only those not flagged;
