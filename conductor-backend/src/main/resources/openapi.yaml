          type: array
          items:
            type: string
          description: Status IDs present in this version but absent from the previous.
        statusesRemoved:
          type: array
          items:
            type: string
          description: Status IDs present in the previous version but absent from this one.

    WorkflowVersionsResponse:
      type: object
      required:
        - totalWorkItems
