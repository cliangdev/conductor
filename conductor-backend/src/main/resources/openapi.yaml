        still-pending pre-created step runs) terminal, then propagates to dependent jobs same as a
        conductor-hosted job finishing.
      operationId: completeWorkflowJob
      security:
        - apiKeyAuth: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteWorkflowJobRequest"
      responses:
        "200":
          description: Job marked terminal (or already-terminal no-op)
        "401":
          description: Unauthorized
        "403":
          description: API key does not belong to this run's project
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

