  /projects/{projectId}/docs/{docId}/images:
    post:
      tags:
        - project-docs
      summary: Upload an image to a doc
      description: >
        Stores the image and returns a Markdown snippet to paste into the document. The URL in that
        snippet is a short-lived signed URL, but saving it into the doc is safe: the server rewrites
        any doc-image URL to a stable reference on write and mints a fresh signed URL on every read,
        so embedded images do not expire.
      operationId: uploadDocImage
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: docId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocImageUploadResponse"
        "403":
          description: Caller may not act on this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid file type

