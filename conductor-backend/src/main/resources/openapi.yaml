          type: integer
          nullable: true
          description: The current active version number (new Work Items bind to this).
        totalWorkItems:
          type: integer
          description: Total Work Items bound to this workflow across all versions.
        versions:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowVersionSummary"

    WorkflowVersionSummary:
      type: object
      required: [version, publishedAt]
      properties:
        version:
          type: integer
        schemaVersion:
          type: integer
          nullable: true
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          type: string
          nullable: true
        active:
          type: boolean
          description: True when new Work Items bind to this version.
        workItemCount:
          type: integer
          description: Work Items currently pinned to this version.
        changeSummary:
          $ref: "#/components/schemas/WorkflowVersionChangeSummary"

    WorkflowDefinitionDto:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        slug:
          type: string
          description: >-
            Statechart slug (`definition.id`) for lifecycle workflows; null for automations. First-class
            so nav/clients never parse the raw `definition`. (COND-22)
        noun:
          type: string
          description: >-
            Display noun (singular, e.g. "Issue") for lifecycle workflows, with the server's default
            applied; null for automations. (COND-22)
        yaml:
          type: string
          description: >-
            Legacy automation source. Deprecated by COND-18 in favor of `definition`;
            existing YAML automations migrate to a no-status `definition`.
          deprecated: true
        enabled:
          type: boolean
        kind:
          $ref: "#/components/schemas/WorkflowKind"
        sidebarEnabled:
          type: boolean
          description: >-
            Whether this lifecycle Workflow is shown as a nav entry in the sidebar. Opt-in per
            Workflow; toggled live via PATCH .../workflows/{id}/sidebar without republishing. (COND-22)
        webhookToken:
          type: string
        version:
          type: integer
          description: Monotonic version; in-flight Work Items pin to their version. (COND-18)
        state:
          $ref: "#/components/schemas/WorkflowState"
        area:
          type: string
          description: Nav-grouping slug; single-Workflow Areas render flat. (COND-18)
        tag:
          type: string
          nullable: true
          maxLength: 64
          description: Free-text grouping label. "default" and "system" are reserved.
        schemaVersion:
          type: integer
          description: Version of the workflow-definition schema this definition targets. (COND-18)
        workItemCount:
          type: integer
          description: Work Items bound to this workflow across all versions. Lifecycle only; 0 for automations.
        definition:
          type: object
          additionalProperties: true
          description: >-
            The versioned statechart (statuses, transitions, reviews, steps, triggers,
            types, asset_types, metric, noun, default_view). Authoritative shape:
            conductor-backend/src/main/resources/schema/workflow-definition-v1.schema.json,
            validated in Java by WorkflowDefinitionValidator. (COND-18 P0-1.)
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowValidationWarning"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        autoPausedAt:
          type: string
          format: date-time
          description: >-
            Set when WorkflowFailureCircuitBreaker auto-disabled this workflow after consecutiveFailures
            reached its trip threshold — distinguishes "the system paused this" from a human unchecking
            `enabled`. Null unless auto-paused; re-enabling (PATCH .../enabled) clears it.
        autoPauseReason:
          type: string
          description: >-
            Why autoPausedAt is set — a free-form code (only "CONSECUTIVE_FAILURES" today) rather than
            an enum, so a future trip condition doesn't need an API change. Null unless auto-paused.
        autoPausedRunId:
          type: string
          description: The WorkflowRun that tripped the breaker, so the UI can link straight to the failure.
        consecutiveFailures:
          type: integer
          description: Consecutive FAILED run completions since the last SUCCESS (or since last re-enabled).

    WorkflowCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        area:
          type: string
          description: Nav-grouping slug (e.g. "marketing", "engineering")
        tag:
          type: string
          nullable: true
          maxLength: 64
          description: Free-text grouping label. "default" and "system" are reserved.
        yaml:
