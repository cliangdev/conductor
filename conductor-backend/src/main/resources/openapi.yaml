    post:
      tags:
        - workflows
      summary: Disable a PUBLISHED lifecycle Workflow
      description: Transitions a PUBLISHED lifecycle Workflow to DISABLED — hidden from sidebar
        and new Work Item creation, but existing pinned Work Items keep resolving their
        version snapshot. Use POST .../enable to reverse.
      operationId: disableWorkflow
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinitionDto"
        "400":
          description: Workflow is not PUBLISHED or is not a lifecycle workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/workflows/{workflowId}/enable:
    post:
      tags:
        - workflows
      summary: Re-enable a DISABLED lifecycle Workflow
      description: Transitions a DISABLED lifecycle Workflow back to PUBLISHED (state only — no
        new version snapshot). Sidebar visibility is restored automatically if sidebarEnabled
        was true before disabling.
      operationId: enableWorkflow
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow re-enabled (state is now PUBLISHED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinitionDto"
        "400":
          description: Workflow is not DISABLED or is not a lifecycle workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/workflows:
    get:
      tags: [workflows]
      summary: List workflows for a project
      description: >-
        Returns the project's Workflow definitions. Optional filters narrow to lifecycle (statechart) vs
        automation (YAML) workflows and by lifecycle state — e.g. `?lifecycle=true&state=PUBLISHED` for the
        published statechart workflows a sidebar/nav needs, so callers don't filter on internal shape.
      operationId: listWorkflows
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: lifecycle
          in: query
          required: false
          description: >-
            true → only lifecycle (statechart) workflows (have a `definition`); false → only automation
            (YAML) workflows; omit for all.
          schema:
            type: boolean
        - name: state
          in: query
          required: false
          description: Filter by lifecycle state (DRAFT | PUBLISHED).
          schema:
            type: string
        - name: sidebar
          in: query
          required: false
          description: >-
            true → only Workflows flagged to appear in the sidebar nav; false → only those not flagged;
            omit for all. Composes with `lifecycle` and `state`.
          schema:
            type: boolean
      responses:
        "200":
          description: List of workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowDefinitionDto"
    post:
      tags: [workflows]
      summary: Create a workflow
      operationId: createWorkflow
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowCreateRequest"
      responses:
        "201":
          description: Workflow created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowCreateResponse"
        "422":
          description: Validation error or limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

