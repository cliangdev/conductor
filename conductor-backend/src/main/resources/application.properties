spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/conductor}
spring.datasource.username=${DATABASE_USERNAME:conductor}
spring.datasource.password=${DATABASE_PASSWORD:conductor}

# HikariCP — keep pool small when fronted by PgBouncer
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Spring's default @Scheduled pool size is 1 -- every @Scheduled bean (KnowledgeIngestScheduler,
# WorkflowScheduler, WorkflowExecutionEngine's queue poller, ActionInvocationService,
# WebhookRetryScheduler, ConnectorFeedScheduler, ...) would share that single thread, so one tick that
# blocks longer than expected (a hung call not bounded by a timeout, a lock wait) freezes every other
# scheduled task in the app, not just the one that hung. Sized to the number of distinct @Scheduled
# methods so no two ever contend for a thread.
spring.task.scheduling.pool.size=13

# ConnectorFeedScheduler is on by default in every real deployment; the test profile flips this off
# (see src/test/resources/application.properties) since its claimed rows are globally scoped and a
# pull can enqueue a whole workflow run's worth of jobs -- see the scheduler's class javadoc.
conductor.connector-feed.enabled=true

# PostPublishScheduler (COND-23) is on by default in every real deployment; the local profile and the
# test profile flip it off (see application-local.properties and src/test/resources/application.properties)
# since its due poll claims globally-scoped post_publish_target rows -- see the scheduler's class javadoc.
conductor.post-publish.enabled=true

# NativeHandoffService (COND-23) is on by default in every real deployment; the local profile and the
# test profile flip it off (see application-local.properties and src/test/resources/application.properties)
# since its deferred-handoff sweep claims globally-scoped post_publish_target rows and hands them to a
# real platform scheduler -- see the service's class javadoc.
conductor.native-handoff.enabled=true

# Hibernate + JDBC — PgBouncer transaction-mode compatibility
# prepareThreshold=0: disable server-side prepared statements (PgBouncer doesn't persist them across connections)
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.jpa.properties.hibernate.criteria.literal_handling_mode=INLINE
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${APP_JWT_SECRET:test-secret-key-must-be-at-least-32-chars-long}
jwt.expiry-hours=${JWT_EXPIRY_HOURS:24}
firebase.service-account-key=${FIREBASE_SERVICE_ACCOUNT_KEY:}
resend.api-key=${RESEND_API_KEY:}
gcp.storage.bucket-name=${GCP_STORAGE_BUCKET_NAME}
gcp.service-account-key=${GCP_SERVICE_ACCOUNT_KEY:}
gcp.signed-url.expiry-minutes=${GCP_SIGNED_URL_EXPIRY_MINUTES:15}
gcp.cloudrun.project-id=${GCP_CLOUDRUN_PROJECT_ID:}
gcp.cloudrun.region=${GCP_CLOUDRUN_REGION:us-central1}
gcp.cloudrun.claude-job-name=${GCP_CLOUDRUN_CLAUDE_JOB_NAME:conductor-claude-code}
gcp.tasks.location=${GCP_TASKS_LOCATION:us-central1}
gcp.tasks.queue-name=${GCP_TASKS_QUEUE_NAME:workflow-jobs}
# The backend's own externally-reachable base URL, e.g. https://conductor-backend-xxxxx.us-central1.run.app
# — Cloud Tasks needs an absolute URL to call back into. Required for workflow jobs to ever dispatch;
# see CloudTasksJobDispatcher.
gcp.tasks.dispatch-base-url=${GCP_TASKS_DISPATCH_BASE_URL:}
logging.structured.format.console=logstash

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
frontend.url=${FRONTEND_URL:http://localhost:3000}
workflow.secrets.key=${WORKFLOW_SECRETS_KEY:}
# Public base URL containers/daemons use for step-complete/log callbacks. Falls back to
# BACKEND_URL (the deployed service's canonical public-URL env var, also used for OAuth
# redirects) so Cloud Run deploys work without a second env var.
conductor.backend.url=${CONDUCTOR_BACKEND_URL:${BACKEND_URL:http://localhost:8080}}
conductor.worker.url=${CONDUCTOR_WORKER_URL:http://localhost:8081}
conductor.worker.secret=${CONDUCTOR_WORKER_SECRET:}
conductor.kms.location=global
conductor.kms.key-ring=conductor-secrets
conductor.kms.key-name=integration-credentials-kek
conductor.integration.local-encryption-key=dev-only-32-byte-key-not-4-prod
# Knowledge Center ingestion-inbox retention (KnowledgeRetentionService, hourly sweep).
conductor.knowledge.retention.processed-days=${KNOWLEDGE_RETENTION_PROCESSED_DAYS:30}
conductor.knowledge.retention.dead-days=${KNOWLEDGE_RETENTION_DEAD_DAYS:90}
