          nullable: true
        fadeOutSec:
          type: number
          nullable: true
        fadeInSec:
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
          type: number
          nullable: true
        targetLufs:
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
          type: number
          nullable: true

    CreativeRenderSpec:
      type: object
      description: The render input a local job (MCP tool or CLI) renders from. Returned only by the POST that creates a render (and, with renderId `draft`, by the draft-spec POST), never by a GET.
      required:
        - renderId
        - previewOnly
        - creative
        - brand
        - placements
      properties:
