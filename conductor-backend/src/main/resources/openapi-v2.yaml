                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/insights:
    get:
      tags:
        - publish-metrics
      summary: What is working across the project's published Posts
      description: >-
        A structured reading of every `post_metrics` snapshot in the window: totals, engagement rate by
        platform, by format, by hour of day and by weekday, the best and worst destinations, and how the
        window compares with the one before it. Engagement rate is (likes + comments + shares + saves) over
        views; a group with no views reports null. Groups are computed over destinations that fired inside
        the window, using each destination's latest snapshot. Empty groups are omitted, so a project with
        one platform sees one platform row. `coverage` names what a platform does not report so a reader
        does not mistake a missing counter for a zero.
      operationId: getMarketingInsights
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: window
          in: query
          required: false
          schema:
            type: string
            default: 30d
          description: 7d, 30d (default) or 90d — how far back from now the window reaches.
        - name: platform
          in: query
          required: false
          schema:
            type: string
          description: Restrict to one platform (facebook, instagram, tiktok, youtube).
      responses:
        "200":
          description: The insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingInsightsResponse"
        "400":
          description: Unknown window or platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/work-items/{workItemId}/publish-preflight:
