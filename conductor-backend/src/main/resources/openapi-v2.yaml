        headline metrics, acquisition by source (App Store organic search is store search downloads minus Apple
        Ads installs, floored at 0, and flagged `derived`), the in-app funnel with its biggest drop, the daily
        store impressions and ad spend, the scorecard of every metric that has a target or an area, the top 25
        Apple Ads keywords by spend joined with in-app outcomes, ads, stored benchmarks against the report's
        own values, and the marketing change log (Work Items on the MARKETING_CHANGES workflow). Windows are
        full UTC days ending at each channel's `dataCompleteThrough`. Percent values are fractions (0.12 = 12%).
