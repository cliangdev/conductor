          description: The Post's status and publish targets after the retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryPublishResponse"
        "400":
          description: >-
            The Post is not in a status a retry can fire from — only a Post sitting at its failed or
            its scheduled status may be retried, so a Post sent back for review never re-publishes
