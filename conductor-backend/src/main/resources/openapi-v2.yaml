          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/publish-metrics/top-posts:
    get:
      tags:
        - publish-metrics
      summary: The project's best-performing published destinations
      description: >-
        Every destination's latest snapshot, ranked by one metric. One row per destination, so a Post
        that went to two accounts can appear twice.
      operationId: listTopPosts
      security:
