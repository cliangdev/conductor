          description: The family's performance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativePerformanceResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/render-runs:
    post:
      tags:
        - creatives
      summary: Render a Creative on the workspace's self-hosted daemon
      description: >-
        Dispatches the system workflow `conductor-creative-render` (seeded on first use) for a Creative that
        needs a browser or ffmpeg: a STILL or MOTION, a CAROUSEL with a music track, or a CLIP whose sound is
        replaced, mixed or muted. The run executes on the workspace's conductor daemon, which renders and
        uploads the result as a normal render. Requires ADMIN or CREATOR. Returns 202 with the run; follow it
        through `GET .../render-runs/latest`. Refused with 422 `RENDER_NOT_NEEDED` when the render is assembled
        in the backend (use the normal render), 422 with `violations` when the Creative fails the render
        validation, 409 `RENDER_RUN_ACTIVE` while a run for this Creative is queued or running, 409
        `RENDER_WORKFLOW_DISABLED` when the workflow was switched off, 409 `RENDER_WORKFLOW_NAME_TAKEN` when a
        user workflow already uses the name.
      operationId: createCreativeRenderRun
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: The render run was queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeRenderRun"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not an ADMIN or CREATOR of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found in this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            `RENDER_RUN_ACTIVE` (body carries the active run's `workflowId` and `runId`),
            `RENDER_WORKFLOW_DISABLED` or `RENDER_WORKFLOW_NAME_TAKEN` (body carries `workflowId`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - type: object
                    properties:
                      workflowId:
                        type: string
                      runId:
                        type: string
        "422":
          description: >-
            `RENDER_NOT_NEEDED`, or the Creative failed the render validation (body carries `violations`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/render-runs/latest:
    get:
      tags:
        - creatives
      summary: The latest render run of a Creative
      description: >-
        The most recent `conductor-creative-render` run dispatched for this Creative, with its status, why it
        is waiting (`waitReason`, e.g. `AWAITING_RUNNER`) and, once it failed, the reason. 204 when none was
        ever dispatched. Cheap enough to poll.
      operationId: getLatestCreativeRenderRun
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The latest render run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeRenderRun"
        "204":
          description: No render run was ever dispatched for this Creative
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not a member of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found in this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/renders:
    get:
      tags:
        - creatives
      summary: List a Creative's renders
      description: Latest first, at most 20. A RUNNING render older than 30 minutes is reported (and persisted) as FAILED "timed out" — there is no scheduler; the sweep happens on this read.
      operationId: listCreativeRenders
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The Creative's renders, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreativeRenderResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - creatives
      summary: Request a render
      description: >-
        Rendering happens on the user's own machine (the Conductor MCP server or CLI, or a self-hosted
        Workflow) — this only records the render as RUNNING and returns the render input (`spec`) the
        local job renders from. `spec` is only ever returned by this call, never by a GET. Refuses with
        422 (same shape as the Creative validator) if the Creative lacks a photo or headline, or fails any
        other T2 structural rule. Requires ADMIN or CREATOR.
      operationId: createCreativeRender
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCreativeRenderRequest"
      responses:
        "201":
          description: The new render, RUNNING, plus its spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeRenderResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The Creative lacks a photo or headline, or fails a T2 structural rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeValidationProblem"

  /projects/{projectId}/marketing/creatives/{creativeId}/renders/{renderId}:
    get:
      tags:
        - creatives
      summary: Get one render
      description: >-
        As with the list, a RUNNING render older than 30 minutes is reported (and persisted) as FAILED
        "timed out" on this read.
      operationId: getCreativeRender
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
        - name: renderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The render
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeRenderResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Render not found, does not belong to this Creative, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/renders/{renderId}/frames/{placementKey}:
    put:
      tags:
        - creatives
      summary: Upload one rendered frame
      description: >-
        The local render job PUTs each placement's frame here as it finishes, one call per frame. A STILL
        placement frame is JPEG (Instagram feed images and TikTok photo posts both refuse PNG); the `sheet`
        contact sheet for a preview-only render stays PNG; a MOTION render's frame is `video/mp4` (COND-24
        PR2), with `durationSeconds`/`hasAudio` query params stored on the frame. Upserts the frame row on
        `(placementKey, index)`; `platform` is derived from the placement registry. Only accepted while the
        render is RUNNING — 409 once it has SUCCEEDED or FAILED. Requires ADMIN or CREATOR.
      operationId: putCreativeRenderFrame
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
        - name: renderId
          in: path
          required: true
          schema:
            type: string
        - name: placementKey
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: query
          required: false
          description: Sequence position for a story/carousel frame; omitted for a single-frame placement.
          schema:
            type: integer
        - name: width
          in: query
          required: true
          schema:
            type: integer
        - name: height
          in: query
          required: true
          schema:
            type: integer
        - name: durationSeconds
          in: query
          required: false
          description: A MOTION (video/mp4) frame's running time, in seconds. Ignored for an image frame.
          schema:
            type: number
        - name: hasAudio
          in: query
          required: false
          description: Whether a MOTION (video/mp4) frame carries an audio track. Ignored for an image frame.
          schema:
            type: boolean
      requestBody:
        required: true
        description: >-
          Raw bytes. A STILL placement frame is JPEG (at most 20 MB); the `sheet` contact sheet is PNG (at
          most 20 MB); a MOTION frame is video/mp4 (at most 500 MB).
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          video/mp4:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Frame stored
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Render not found, does not belong to this Creative, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The render is no longer RUNNING (already SUCCEEDED or FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Content-Type is not image/jpeg, image/png or video/mp4
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/renders/{renderId}/frames/{placementKey}/poster:
    put:
      tags:
        - creatives
      summary: Upload a MOTION render frame's poster
      description: >-
        COND-24 PR2: the local render job PUTs a MOTION frame's poster JPEG here (the end-card frame) once
        the frame itself is stored. Sets the frame's `posterUrl`, exactly as a CLIP frame's poster is a copy
        of its source media's. Only accepted while the render is RUNNING — 409 once it has SUCCEEDED or
        FAILED; refused with a plain 400 if no frame is stored yet for this placement/index. Requires ADMIN
        or CREATOR.
      operationId: putCreativeRenderFramePoster
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
        - name: renderId
          in: path
          required: true
          schema:
            type: string
        - name: placementKey
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: query
          required: false
          description: Sequence position for a story/carousel frame; omitted for a single-frame placement.
          schema:
            type: integer
      requestBody:
        required: true
        description: Raw JPEG bytes, at most 20 MB.
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Poster stored
        "400":
          description: No frame is stored yet for this placement/index
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Render not found, does not belong to this Creative, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The render is no longer RUNNING (already SUCCEEDED or FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Content-Type is not image/jpeg
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/renders/{renderId}/complete:
