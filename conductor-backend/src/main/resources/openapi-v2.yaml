          type: number
          format: double
          nullable: true
        observedAt:
          type: string
          format: date-time

    InsightsMover:
      type: object
      required:
        - metric
        - current
        - previous
      properties:
        metric:
          type: string
          description: posts, views, likes, comments, shares, saves or engagementRate.
        current:
          type: number
          format: double
        previous:
          type: number
          format: double
        deltaPct:
          type: number
          format: double
          nullable: true
          description: (current − previous) / previous × 100; null when previous is zero.

    InsightsCoverage:
      type: object
      required:
        - platforms
        - notes
      properties:
        platforms:
          type: array
          items:
            type: string
          description: Platforms with at least one snapshot in the window.
        notes:
          type: array
          items:
            type: string
          description: Plain sentences about what is not being counted — a platform that reports no views, a connection that needs reconnecting for insights.

    PublishPreflightResponse:
      type: object
      description: The approval gate's verdict on a Work Item, read without attempting a transition.
      required:
        - publishing
        - ready
        - blockers
        - warnings
        - consent
        - review
      properties:
        publishing:
          type: boolean
          description: Whether the Work Item's Workflow publishes at all. False means nothing else applies.
        ready:
          type: boolean
          description: True when no blocker stands — the next gate transition would be accepted by the validators.
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/PublishPreflightFinding"
          description: >-
            What the gate would refuse the item for, in the order a 422 lists them. Empty when ready.
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PublishPreflightFinding"
          description: Advisories a platform will act on without refusing (a Short, a cropped carousel).
        nextTransition:
          $ref: "#/components/schemas/PublishPreflightTransition"
        consent:
          $ref: "#/components/schemas/PublishPreflightConsent"
        review:
          $ref: "#/components/schemas/PublishPreflightReview"
        earliestFireTime:
          type: string
          format: date-time
          nullable: true
          description: >-
            The soonest `scheduledFor` the current destinations accept — "as soon as possible". Now plus the
            longest lead any selected platform demands (ten minutes for Facebook's native scheduler, a
            minute for an app-managed destination, nothing for a manual one). Null off a publishing Workflow.

    PublishPreflightFinding:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: >-
            Stable, machine-readable rule name — NO_FIRE_TIME, NO_TIMEZONE, UNKNOWN_TIMEZONE,
            FIRE_TIME_TOO_SOON, NO_TARGETS, NO_MEDIA, TARGET_MEDIA_MISSING, MEDIA_FORMAT, MEDIA_COMPOSITION,
            COPY_TOO_LONG, PUBLISH_OPTIONS, CONSENT_NEVER_GIVEN, CONSENT_SUPERSEDED; warnings carry
            MEDIA_ADVISORY. Messages may be reworded; codes may not.
        message:
          type: string
          description: The human sentence, exactly as a refused transition's 422 would carry it.
        targetId:
          type: string
          nullable: true
          description: The publish target the finding is about, or null for a Post-level finding.

    PublishPreflightTransition:
      type: object
      description: >-
        The move a ready item takes next: the first gate edge out of the current status, else the edge that
        hands it to review (Draft → In Review). Absent when the current status has neither (already
        scheduled, or published).
      required:
        - to
        - requiresReview
      properties:
        to:
          type: string
        label:
          type: string
          nullable: true
        requiresReview:
          type: boolean

    PublishPreflightConsent:
      type: object
      required:
        - required
        - verdict
      properties:
        required:
          type: boolean
          description: Whether a selected destination needs the creator's recorded consent.
        verdict:
          type: string
          enum:
            - NOT_REQUIRED
            - VALID
            - NEVER_GIVEN
            - SUPERSEDED

    PublishPreflightReview:
      type: object
      required:
        - gated
        - assignedReviewers
        - satisfied
      properties:
        gated:
          type: boolean
          description: Whether the Workflow has a review gate at all. A Workflow without one publishes on schedule entry.
        assignedReviewers:
          type: integer
          description: How many reviewers are assigned to this item. Zero on a gated Workflow means nobody has been asked.
        satisfied:
          type: boolean
          description: Whether an approval currently opens the gate — bound to the open review round and the bundle as it stands.
        reviewerRole:
          type: string
          nullable: true
          description: The project role the gate asks its approval from, or null when any approval satisfies it.

    PublishTargetResponse:
      type: object
      description: One publish target selected on a Work Item (a persisted post_publish_target row).
      required:
        - id
        - workItemId
        - platform
        - lane
        - state
        - effectiveAssetIds
      properties:
        id:
          type: string
        workItemId:
          type: string
        platform:
          type: string
          enum:
            - facebook
            - instagram
            - youtube
            - tiktok
        connectorId:
          type: string
          nullable: true
          description: Null on the MANUAL lane, which publishes through no connector.
        connectionId:
          type: string
          nullable: true
          description: >-
            The connected account this target publishes through. Null on the MANUAL lane, which reaches its
            platform through a human rather than a credential.
        label:
          type: string
          nullable: true
          description: Account label captured at selection time (post_publish_target.platform_account_label).
        lane:
          type: string
          description: >-
            How this target reaches its platform. NATIVE hands the post to the platform's own scheduler;
            APP_MANAGED means Conductor publishes it at fire time; MANUAL means nobody automates it — a
            human posts it and records the result, and no credential is used.
          enum:
            - NATIVE
            - APP_MANAGED
            - MANUAL
        state:
          type: string
          description: >-
            One of PENDING, HANDED_OFF, PUBLISHING, AWAITING_MANUAL, PUBLISHED, FAILED, REVOKED.
            AWAITING_MANUAL is a target waiting on a person: a MANUAL one whose fire time has passed, or an
            automated one the platform handed back (TikTok's pre-audit inbox upload, explained in
            errorMessage). Either is finished with the manual-publish call.
        stateLabel:
          type: string
          readOnly: true
          description: >-
            The human label for `state` (Waiting, Handed off, Publishing, Post it now, Published, Failed,
            Taken back), for direct display — the same words the UI's own status pill uses.
        platformPostId:
          type: string
          nullable: true
          description: The platform's id for the created post, once it exists.
        permalink:
          type: string
          nullable: true
          description: >-
            Link to the live post on the platform, captured when the target reaches PUBLISHED. This is the
            per-target evidence the Post detail renders; null until the publish is confirmed.
        errorMessage:
          type: string
          nullable: true
          description: >-
            The first human sentence of the platform's failure, with any JSON body, trace id and HTTP
            status prefix stripped. Null unless the target is FAILED or AWAITING_MANUAL.
        errorDetail:
          type: string
          nullable: true
          readOnly: true
          description: >-
            The platform's full failure text behind errorMessage — JSON body and all — for support and
            debugging. Null unless the target is FAILED or AWAITING_MANUAL.
        fireTime:
          type: string
          format: date-time
          nullable: true
          description: >-
            When this target publishes. Copied from the Work Item's scheduledFor and re-stamped whenever the
            Post re-enters its scheduled status, so it is the authoritative time for this target.
        publishOptions:
          $ref: "#/components/schemas/PublishOptions"
        captionOverride:
          type: string
          nullable: true
          description: >-
            This destination's own copy, or null when it uses the Post's caption. See `effectiveCaption`
            for what actually goes out.
        format:
          $ref: "#/components/schemas/PostFormat"
        assetIds:
          type: array
          nullable: true
          description: >-
            This destination's own ordered media selection, or **null when it inherits the Post's whole
            set**. Null and a list matching the Post's assets are different states: the first keeps
            following the Post as files change, the second does not.
          items:
            type: string
        effectiveAssetIds:
          type: array
          description: >-
            The media that actually goes out here, in order — this target's own selection, or the Post's
            set when it inherits. Empty when there is none to send, which blocks approval. A client
            rendering a preview should read this rather than re-deriving the inherit rule.
          items:
            type: string
        effectiveCaption:
          type: string
          nullable: true
          description: The copy that actually goes out here — `captionOverride` if set, else the Post's caption.

    RetryPublishResponse:
      type: object
      description: >-
        The result of re-firing a Post's failed publish targets: the Post's status afterwards and
        every one of its targets, so a client can render the new state without a second request.
      required:
        - workItemId
        - status
        - retriedCount
        - targets
      properties:
        workItemId:
          type: string
        status:
          type: string
          description: >-
            The Post's Workflow-defined status after the retry — its scheduled status when anything
            was re-fired, otherwise whatever it already was.
        retriedCount:
          type: integer
          format: int32
          description: How many targets were reset to PENDING. Zero when nothing had failed.
        targets:
          type: array
          description: Every publish target on the Post after the retry, failed or not.
          items:
            $ref: "#/components/schemas/PublishTargetResponse"

    PublishTargetSelection:
      type: object
      required:
        - platform
      properties:
        platform:
          type: string
          enum:
            - facebook
            - instagram
            - youtube
            - tiktok
        connectionId:
          type: string
          nullable: true
          description: >-
            The connected account to publish through. Omit it (or send null) to select this platform's
            MANUAL destination instead — the one a human publishes by hand. There is exactly one manual
            destination per platform, so the platform alone identifies it.
        format:
          $ref: "#/components/schemas/PostFormat"
        publishOptions:
          $ref: "#/components/schemas/PublishOptions"
        captionOverride:
          type: string
          nullable: true
          description: >-
            Copy for this destination alone, replacing the Post's caption when it goes out here. Omit it or
            send null to use the Post's caption. Set-replace like every other field on this schema: a client
            that re-sends a target without this field clears an override it previously set.
        assetIds:
          type: array
          nullable: true
          description: >-
            An ordered subset of the Post's uploaded media that this destination publishes. Omit it or send
            an empty array to inherit the Post's whole media set in Post order — which is the default, and
            keeps following the Post as files are added and removed.


            Order is content, not presentation: Instagram crops every carousel item to the first item's
            aspect ratio, and TikTok takes a photo post's cover from the first image. Each id must be a file
            asset of this Work Item. Set-replace, like `captionOverride`.
          items:
            type: string

    PostFormat:
      type: string
      description: >-
        The shape a destination publishes in. `feed` is the platform's ordinary post — an image, a video, a
        carousel, a photo set — and the default. `reel` is short vertical video on Facebook or Instagram.
        `story` is a single image or clip on Facebook or Instagram that disappears after 24 hours, takes
        no caption, and is fired by Conductor at its time because the platforms cannot schedule one. Each
        option row lists the formats its platform offers under `formats`; selecting one it does not offer
        is refused.
      enum:
        - feed
        - reel
        - story
      default: feed

    PublishOptions:
      type: object
      additionalProperties: true
      description: >-
        How the post goes out on this one platform — a per-platform bag of option keys, read against the
        target's own `platform` and nothing else. Omitted or null means nothing has been chosen, which is
        not the same as "the defaults are fine": a TikTok target with no `privacyLevel` blocks approval
        rather than publishing to the creator alone. (TIK-1.)


        TikTok keys: `privacyLevel` (string — one of the connection's cached privacyLevelOptions, e.g.
        PUBLIC_TO_EVERYONE, MUTUAL_FOLLOW_FRIENDS, FOLLOWER_OF_CREATOR, SELF_ONLY), `disableComment`,
        `disableDuet`, `disableStitch` (booleans), `brandContentToggle` (boolean — paid partnership; TikTok
        refuses it combined with SELF_ONLY) and `brandOrganicToggle` (boolean — the creator's own brand).
      example:
        privacyLevel: PUBLIC_TO_EVERYONE
        disableComment: false
        brandContentToggle: true

    PublishConsentResponse:
      type: object
      description: >-
        The creator's posting consent on a Post, and whether it still describes the Post. (MKT-1.)
      required:
        - workItemId
        - required
        - valid
        - verdict
      properties:
        workItemId:
          type: string
        required:
          type: boolean
          description: >-
            True when the Post publishes to at least one `tiktok` account. A Facebook-only or
            YouTube-only Post is never gated on consent.
        valid:
          type: boolean
          description: >-
            True only when consent was given and still covers the Post's current accounts, publish
            options and uploaded media. False on a Post that needs no consent at all.
        verdict:
          type: string
          description: >-
            The same fact in one word, for a client that needs to say what is wrong.
            `NOT_REQUIRED` — no TikTok target. `VALID` — consent stands. `NEVER_GIVEN` — nobody has
            consented (or it was withdrawn). `SUPERSEDED` — consent was given, then the accounts,
            options or media changed under it and it has to be given again.
          enum:
            - NOT_REQUIRED
            - VALID
            - NEVER_GIVEN
            - SUPERSEDED
        consentedAt:
          type: string
          format: date-time
          nullable: true
          description: When consent was last given; null when it never was, or was withdrawn.
        consentedByUserId:
          type: string
          nullable: true
          description: The member who consented; null when consent has never been given.
        consentedByName:
          type: string
          nullable: true
          description: That member's display name, so the record reads as a name rather than an id.

    RecordPublishConsentRequest:
      type: object
      required:
        - consented
      properties:
        consented:
          type: boolean
          description: >-
            True to consent to this Post going out to its current accounts under their current publish
            options, with its current media. False to withdraw consent.

    CompleteManualPublishRequest:
      type: object
      required:
        - permalink
      properties:
        permalink:
          type: string
          description: >-
            Link to the post that actually went out. Required, and the reason this endpoint exists: it is
            the only record that a manual destination was ever published, so a blank one is refused rather
            than stored.
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When it actually went out. Defaults to now. Recorded as the target's fireTime so the calendar
            and the outcome panel show when the post really happened rather than when it was scheduled to.

    ReplacePublishTargetsRequest:
      type: object
      required:
        - targets
      properties:
        targets:
          type: array
          description: The complete selection. An empty array clears every target on the Work Item.
          items:
            $ref: "#/components/schemas/PublishTargetSelection"

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: string

    BrandImageSlot:
      type: string
      description: One of the four optional Brand Kit image slots.
      enum:
        - mark
        - wordmark_dark
        - wordmark_light
        - badge

    CopyRuleField:
      type: string
      enum:
        - headline
        - body
        - caption

    CopyRule:
      type: object
      description: >-
        One brand copy rule, enforced by CreativeValidator against every field it names. The frontend
        runs the same rule in JS for live validation, so `pattern`/`exceptPattern`/`flags` stick to the
        regex subset both a Java `Pattern` and a JS `RegExp` accept — no lookbehind, no named groups,
        no Java-only or JS-only escapes.
      required:
        - id
        - pattern
        - message
        - fields
      properties:
        id:
          type: string
        pattern:
          type: string
          description: A regular expression tested against the field's text.
        flags:
          type: string
          nullable: true
          description: Any combination of `i` (case-insensitive) and `m` (multiline). Omit for neither.
        message:
          type: string
          description: Shown verbatim when the rule fails — this is the text AC-P0-2.1 checks for.
        fields:
          type: array
          items:
            $ref: "#/components/schemas/CopyRuleField"
        exceptPattern:
          type: string
          nullable: true
          description: >-
            When set, every match of this pattern is stripped from the field's text before `pattern`
            is tested — the "Add All to Shopping List" exact-button-name exemption in nexus.

    BrandKitResponse:
      type: object
      required:
        - id
        - projectId
        - slug
        - name
        - isDefault
        - tokens
        - accentPhraseRequired
        - copyRules
        - approvedLines
        - enabledPlacements
        - knowledgePagePath
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        projectId:
          type: string
        slug:
          type: string
        name:
          type: string
        isDefault:
          type: boolean
        tokens:
          type: object
          description: "CSS custom properties the renderer maps to: accent, accent2, darkBg, darkInk, lightBg, lightCard, ink, ink2. Each value is a #RRGGBB hex colour."
          additionalProperties:
            type: string
        fontFamily:
          type: string
          nullable: true
        fontUrl:
          type: string
          nullable: true
        markUrl:
          type: string
          nullable: true
          description: Short-lived signed GET URL, or null when this slot has no image.
        wordmarkDarkUrl:
          type: string
          nullable: true
        wordmarkLightUrl:
          type: string
          nullable: true
        badgeUrl:
          type: string
          nullable: true
        ctaClaim:
          type: string
          nullable: true
        accentPhraseRequired:
          type: boolean
        copyRules:
          type: array
          items:
            $ref: "#/components/schemas/CopyRule"
        approvedLines:
          type: array
          items:
            type: string
        enabledPlacements:
          type: array
          description: Placement keys (from the creative registry) this kit exports by default.
          items:
            type: string
        knowledgePagePath:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateBrandKitRequest:
      type: object
      required:
        - slug
        - name
      properties:
        slug:
          type: string
        name:
          type: string
        tokens:
          type: object
          nullable: true
          additionalProperties:
            type: string
        fontFamily:
          type: string
          nullable: true
        fontUrl:
          type: string
          nullable: true
        ctaClaim:
          type: string
          nullable: true
        accentPhraseRequired:
          type: boolean
          default: false
        copyRules:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CopyRule"
        approvedLines:
          type: array
          nullable: true
          items:
            type: string
        enabledPlacements:
          type: array
          nullable: true
          items:
            type: string
        knowledgePagePath:
          type: string
          nullable: true

    PatchBrandKitRequest:
      type: object
      description: Every field is optional and set-replace; omit a field to leave it unchanged.
      properties:
        name:
          type: string
        isDefault:
          type: boolean
        tokens:
          type: object
          nullable: true
          additionalProperties:
            type: string
        fontFamily:
          type: string
          nullable: true
        fontUrl:
          type: string
          nullable: true
        ctaClaim:
          type: string
          nullable: true
        accentPhraseRequired:
          type: boolean
        copyRules:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CopyRule"
        approvedLines:
          type: array
          nullable: true
          items:
            type: string
        enabledPlacements:
          type: array
          nullable: true
          items:
            type: string
        knowledgePagePath:
          type: string

    MintUploadRequest:
      type: object
      required:
        - contentType
        - sizeBytes
      properties:
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64

    UploadTicketResponse:
      type: object
      required:
        - uploadUrl
        - gcsPath
      properties:
        uploadUrl:
          type: string
        gcsPath:
          type: string

    ConfirmUploadRequest:
      type: object
      required:
        - gcsPath
      properties:
        gcsPath:
          type: string

    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string

    FieldValidationProblem:
      type: object
      description: A 422 ProblemDetail body carrying which field(s) failed and why.
      required:
        - message
        - fieldErrors
      properties:
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    CreativeViolation:
      type: object
      required:
        - field
        - ruleId
        - message
      properties:
        field:
          type: string
        ruleId:
          type: string
          description: >-
            A stable rule identifier (e.g. `layout`, `theme`, `accentPhrase`, `sequence`, or a Brand
            Kit copy rule's own `id`) — never a positional index, so a client can key off it.
        message:
          type: string
          description: The failing rule's own message (a Brand Kit copy rule's `message` verbatim, per AC-P0-2.1).

    CreativeValidationProblem:
      type: object
      description: The 422 ProblemDetail body CreativeValidator produces.
      required:
        - message
        - violations
      properties:
        message:
          type: string
        violations:
          type: array
          items:
            $ref: "#/components/schemas/CreativeViolation"

    MediaKind:
      type: string
      enum:
        - IMAGE
        - VIDEO
        - AUDIO
      description: A Creative media library item's kind (COND-24 PR1). Defaults to IMAGE.

    CreativePhotoResponse:
      type: object
      required:
        - id
        - projectId
        - contentType
        - sizeBytes
        - aiGenerated
        - checked
        - blocked
        - focal
        - uploadStatus
        - mediaKind
        - warnings
        - createdAt
      properties:
        id:
          type: string
        projectId:
          type: string
        label:
          type: string
          nullable: true
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        mediaKind:
          $ref: "#/components/schemas/MediaKind"
        durationSeconds:
          type: number
          nullable: true
          description: Running time in seconds; set for VIDEO/AUDIO.
        hasAudio:
          type: boolean
          nullable: true
          description: Whether a VIDEO carries an audio track; null for IMAGE/AUDIO.
        posterUrl:
          type: string
          nullable: true
          description: Short-lived signed GET URL of a VIDEO's poster JPEG, once set.
        source:
          type: string
          nullable: true
        licence:
          type: string
          nullable: true
        aiGenerated:
          type: boolean
        checked:
          type: boolean
        blocked:
          type: boolean
        blockedReason:
          type: string
          nullable: true
        focal:
          type: object
          description: 'Per-placement focal point, e.g. `{"9x16": "50% 30%"}`.'
          additionalProperties:
            type: string
        uploadStatus:
          type: string
          enum:
            - PENDING
            - UPLOADED
        url:
          type: string
          nullable: true
          description: Short-lived signed GET URL, present only once UPLOADED.
        uploadUrl:
          type: string
          nullable: true
          description: The signed PUT URL to upload bytes to — present only on the create response.
        warnings:
          type: array
          items:
            type: string
          description: e.g. a long edge under 2160px. Advisory only — never a refusal.
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateCreativePhotoRequest:
      type: object
      required:
        - contentType
        - sizeBytes
      properties:
        label:
          type: string
          nullable: true
        mediaKind:
          allOf:
            - $ref: "#/components/schemas/MediaKind"
          default: IMAGE
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - video/mp4
            - video/quicktime
            - video/webm
            - audio/mpeg
            - audio/mp4
            - audio/aac
            - audio/wav
        sizeBytes:
          type: integer
          format: int64
        width:
          type: integer
          nullable: true
          description: Required for IMAGE/VIDEO; ignored for AUDIO.
        height:
          type: integer
          nullable: true
          description: Required for IMAGE/VIDEO; ignored for AUDIO.
        durationSeconds:
          type: number
          nullable: true
          description: Required for VIDEO/AUDIO.
        hasAudio:
          type: boolean
          nullable: true
          description: Whether a VIDEO carries an audio track. Optional.
        codec:
          type: string
          nullable: true
          description: Advisory codec hint (e.g. h264); never validated.
        source:
          type: string
          nullable: true
        licence:
          type: string
          nullable: true
        aiGenerated:
          type: boolean
          default: false

    ConfirmCreativePhotoRequest:
      type: object
      properties:
        sizeBytes:
          type: integer
          format: int64
          nullable: true
          description: The byte count actually written, re-validated against the upload ceiling.

    MintCreativePhotoPosterResponse:
      type: object
      required:
        - uploadUrl
        - gcsPath
      properties:
        uploadUrl:
          type: string
          description: The signed PUT URL to upload the JPEG poster bytes to.
        gcsPath:
          type: string
          description: The object path the poster will live at — hand back unchanged to the confirm call.

    ConfirmCreativePhotoPosterRequest:
      type: object
      required:
        - gcsPath
      properties:
        gcsPath:
          type: string
          description: The path this same mint call returned.

    PatchCreativePhotoRequest:
      type: object
      properties:
        label:
          type: string
        source:
          type: string
        licence:
          type: string
        aiGenerated:
          type: boolean
        checked:
          type: boolean
        blocked:
          type: boolean
        blockedReason:
          type: string
        focal:
          type: object
          nullable: true
          additionalProperties:
            type: string

    CreativeState:
      type: string
      enum:
        - DRAFT
        - READY
        - ARCHIVED

    CreativeTheme:
      type: string
      enum:
        - dark
        - light

    CreativeLockup:
      type: string
      enum:
        - plain
        - chip
      description: '"chip" puts the logo lockup on a white pill instead of bare on the photo, for busy photography.'

    CreativeKind:
      type: string
      enum:
        - STILL
        - MOTION
        - CLIP
      description: >-
        STILL (default) is today's brand-layout Creative. CLIP is a finished video used as-is, one file
        for all placements or one per placement (COND-24 PR1) — no brand layout, no local rendering; the
        backend assembles CLIP renders by copying the chosen media. MOTION (PR2) is a branded animated
        video; the API accepts it today, but rendering it currently refuses with 422.

    CreativeLayoutOverrides:
      type: object
      nullable: true
      description: "Per-placement overrides of layout-derived numbers, in pixels. An absent placement key falls back to the layout's own default."
      properties:
        band:
          type: object
          nullable: true
          description: 'Overrides the stacked layout''s photo band height per placement, e.g. {"9x16": 1200}.'
          additionalProperties:
            type: integer
        padBottom:
          type: object
          nullable: true
          description: Overrides the 9x16 panel's bottom safe-zone clearance per placement.
          additionalProperties:
            type: integer

    SequenceKind:
      type: string
      enum:
        - story
        - carousel

    SequenceBeat:
      type: object
      description: One story beat or carousel card; each inherits the Creative and overrides only what changes.
      properties:
        headline:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        photoId:
          type: string
          nullable: true
        cta:
          type: boolean
          nullable: true

    CreativeResponse:
      type: object
      required:
        - id
        - projectId
        - brandKitId
        - number
        - variantLetter
        - displayId
        - state
        - layout
        - theme
        - placements
        - sequence
        - typeOverrides
        - lockup
        - kind
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        projectId:
          type: string
        brandKitId:
          type: string
        number:
          type: integer
        variantLetter:
          type: string
        displayId:
          type: string
          description: "number and variantLetter joined, e.g. \"12a\"."
        parentCreativeId:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        state:
          $ref: "#/components/schemas/CreativeState"
        layout:
          type: string
        theme:
          $ref: "#/components/schemas/CreativeTheme"
        photoId:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
          description: Short-lived signed GET URL of the photo, for convenience — the frontend still fetches the photo separately for its metadata.
        focalOverride:
          type: object
          nullable: true
          additionalProperties:
            type: string
        headline:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        caption:
          type: string
          nullable: true
        altText:
          type: string
          nullable: true
        placements:
          type: array
          items:
            type: string
        sequenceKind:
          $ref: "#/components/schemas/SequenceKind"
        sequence:
          type: array
          items:
            $ref: "#/components/schemas/SequenceBeat"
        carouselRatio:
          type: string
          nullable: true
        typeOverrides:
          type: object
          description: Pinned per-placement [fontSize, lineHeight, letterSpacing].
          additionalProperties:
            type: array
            items:
              type: number
        layoutOverrides:
          allOf:
            - $ref: "#/components/schemas/CreativeLayoutOverrides"
          nullable: true
        lockup:
          $ref: "#/components/schemas/CreativeLockup"
        kind:
          $ref: "#/components/schemas/CreativeKind"
        clipMedia:
          type: object
          nullable: true
          description: '{"default": mediaId, "<placementKey>": mediaId, ...} for a CLIP creative.'
          additionalProperties:
            type: string
        version:
          type: integer
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        latestRenderId:
          type: string
          nullable: true
          description: Id of the last SUCCEEDED, non-preview render, if any. Present on both list and detail reads.
        latestRenderThumbnailUrl:
          type: string
          nullable: true
          description: Signed GET URL of that render's 4x5 frame, or its first frame if there is no 4x5. Present on both list and detail reads.
        latestRender:
          allOf:
            - $ref: "#/components/schemas/CreativeRenderResponse"
          nullable: true
          description: The full last SUCCEEDED, non-preview render with its frames. Populated only on the single-Creative GET, null on list reads.
        activeExperimentId:
          type: string
          nullable: true
          description: The family's RUNNING hook experiment, if any (COND-24 T5). Same value on every letter in the family.

    CreateCreativeRequest:
      type: object
      properties:
        brandKitId:
          type: string
          nullable: true
          description: Defaults to the project's default Brand Kit.
        name:
          type: string
          nullable: true
        state:
          $ref: "#/components/schemas/CreativeState"
        layout:
          type: string
          nullable: true
          description: Defaults to the registry's first layout.
        theme:
          $ref: "#/components/schemas/CreativeTheme"
        photoId:
          type: string
          nullable: true
        focalOverride:
          type: object
          nullable: true
          additionalProperties:
            type: string
        headline:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        caption:
          type: string
          nullable: true
        altText:
          type: string
          nullable: true
        placements:
          type: array
          items:
            type: string
        sequenceKind:
          $ref: "#/components/schemas/SequenceKind"
        sequence:
          type: array
          items:
            $ref: "#/components/schemas/SequenceBeat"
        carouselRatio:
          type: string
          nullable: true
        lockup:
          $ref: "#/components/schemas/CreativeLockup"
        kind:
          $ref: "#/components/schemas/CreativeKind"
        clipMedia:
          type: object
          nullable: true
          description: '{"default": mediaId, "<placementKey>": mediaId, ...} for a CLIP creative.'
          additionalProperties:
            type: string
        layoutOverrides:
          allOf:
            - $ref: "#/components/schemas/CreativeLayoutOverrides"
          nullable: true

    PatchCreativeRequest:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          description: Must equal the Creative's current version, or the write is refused with 409.
        brandKitId:
          type: string
        name:
          type: string
        state:
          $ref: "#/components/schemas/CreativeState"
        layout:
          type: string
        theme:
          $ref: "#/components/schemas/CreativeTheme"
        photoId:
          type: string
          nullable: true
        focalOverride:
          type: object
          nullable: true
          additionalProperties:
            type: string
        headline:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        caption:
          type: string
          nullable: true
        altText:
          type: string
          nullable: true
        placements:
          type: array
          nullable: true
          items:
            type: string
        sequenceKind:
          $ref: "#/components/schemas/SequenceKind"
        sequence:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/SequenceBeat"
        carouselRatio:
          type: string
          nullable: true
        typeOverrides:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: number
        lockup:
          $ref: "#/components/schemas/CreativeLockup"
        kind:
          $ref: "#/components/schemas/CreativeKind"
        clipMedia:
          type: object
          nullable: true
          description: '{"default": mediaId, "<placementKey>": mediaId, ...} for a CLIP creative.'
          additionalProperties:
            type: string
        layoutOverrides:
          allOf:
            - $ref: "#/components/schemas/CreativeLayoutOverrides"
          nullable: true

    CreateCreativeVariantRequest:
      type: object
      properties:
        headline:
          type: string
          nullable: true
          description: Defaults to a copy of the source Creative's headline.
        name:
          type: string
          nullable: true

    CreativeReadinessItem:
      type: object
      required:
        - key
        - ok
        - blocking
        - message
      properties:
        key:
          type: string
        ok:
          type: boolean
        blocking:
          type: boolean
        message:
          type: string

    CreativeReadinessResponse:
      type: object
      required:
        - ready
        - items
      properties:
        ready:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreativeReadinessItem"

    CreativeRegistryLayout:
      type: object
      required:
        - themes
      properties:
        themes:
          type: array
          items:
            type: string

    CreativeRegistryPlacement:
      type: object
      required:
        - key
        - label
        - width
        - height
        - default
      properties:
        key:
          type: string
        label:
          type: string
        platform:
          type: string
          nullable: true
        width:
          type: integer
        height:
          type: integer
        default:
          type: boolean

    CreativeRegistryResponse:
      type: object
      required:
        - layouts
        - placements
      properties:
        layouts:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CreativeRegistryLayout"
        placements:
          type: array
          items:
            $ref: "#/components/schemas/CreativeRegistryPlacement"

    # ── Renders (COND-24 T3) ───────────────────────────────────────────────────────────────────────

    CreativeRenderState:
      type: string
      enum:
        - RUNNING
        - SUCCEEDED
        - FAILED

    CreateCreativeRenderRequest:
      type: object
      properties:
        previewOnly:
          type: boolean
          default: false
          description: A browser-preview export the creative page keeps to itself — never counted as the Creative's latestRender.
        renderer:
          type: string
          nullable: true
          description: 'Free text naming what will run the job: mcp, cli, workflow.'
        workflowRunId:
          type: string
          nullable: true
          description: Set when a self-hosted Workflow is running the render.

    CreativeRenderSpecLogos:
      type: object
      description: Signed GET URLs (valid at least 30 minutes), each null when the kit has not set that slot.
      properties:
        mark:
          type: string
          nullable: true
        wordmarkDark:
          type: string
          nullable: true
        wordmarkLight:
          type: string
          nullable: true
        badge:
          type: string
          nullable: true

    CreativeRenderSpecBrand:
      type: object
      required:
        - tokens
        - enabledPlacements
      properties:
        tokens:
          type: object
          additionalProperties:
            type: string
        fontFamily:
          type: string
          nullable: true
        fontUrl:
          type: string
          nullable: true
        logos:
          $ref: "#/components/schemas/CreativeRenderSpecLogos"
        ctaClaim:
          type: string
          nullable: true
        enabledPlacements:
          type: array
          items:
            type: string

    CreativeRenderSpecBeat:
      type: object
      description: One story beat or carousel card, resolved to what the render actually needs — a photo URL and focal point, inheriting the Creative's own photo when the beat has none of its own.
      properties:
        headline:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        cta:
          type: boolean
          nullable: true
        photoUrl:
          type: string
          nullable: true
        focal:
          type: object
          additionalProperties:
            type: string

    CreativeRenderSpecCreative:
      type: object
      required:
        - layout
        - theme
        - placements
        - typeOverrides
        - focal
      properties:
        layout:
          type: string
        theme:
          $ref: "#/components/schemas/CreativeTheme"
        headline:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        caption:
          type: string
          nullable: true
        placements:
          type: array
          items:
            type: string
          description: The Creative's own opt-in placements, distinct from the resolved top-level `placements` this render actually produces.
        focalOverride:
          type: object
          nullable: true
          additionalProperties:
            type: string
        sequenceKind:
          $ref: "#/components/schemas/SequenceKind"
        sequence:
          type: array
          items:
            $ref: "#/components/schemas/CreativeRenderSpecBeat"
        typeOverrides:
          type: object
          additionalProperties:
            type: array
            items:
              type: number
        photoUrl:
          type: string
          nullable: true
        focal:
          type: object
          additionalProperties:
            type: string
        lockup:
          $ref: "#/components/schemas/CreativeLockup"
        layoutOverrides:
          allOf:
            - $ref: "#/components/schemas/CreativeLayoutOverrides"
          nullable: true

    CreativeRenderSpec:
      type: object
      description: The render input a local job (MCP tool or CLI) renders from. Returned only by the POST that creates a render, never by a GET.
      required:
        - renderId
        - previewOnly
        - creative
        - brand
        - placements
      properties:
        renderId:
          type: string
        previewOnly:
          type: boolean
        creative:
          $ref: "#/components/schemas/CreativeRenderSpecCreative"
        brand:
          $ref: "#/components/schemas/CreativeRenderSpecBrand"
        placements:
          type: array
          items:
            type: string
          description: The resolved placements this render must produce one frame per (kit-enabled ∪ Creative opt-ins) ∩ registry, or ["story"]/[carouselRatio] for a sequence Creative.

    CreativeRenderFrameResponse:
      type: object
      required:
        - id
        - placementKey
        - url
        - width
        - height
        - sizeBytes
        - contentType
        - warnings
      properties:
        id:
          type: string
        placementKey:
          type: string
        platform:
          type: string
          nullable: true
        sequenceIndex:
          type: integer
          nullable: true
        url:
          type: string
          description: Short-lived signed GET URL.
        width:
          type: integer
        height:
          type: integer
        sizeBytes:
          type: integer
          format: int64
        contentType:
          type: string
          description: image/jpeg or image/png for a STILL frame; a video content type for a CLIP frame.
        durationSeconds:
          type: number
          nullable: true
          description: Set for a CLIP (video) frame; null for an image frame.
        hasAudio:
          type: boolean
          nullable: true
          description: Set for a CLIP (video) frame; null for an image frame.
        posterUrl:
          type: string
          nullable: true
          description: Short-lived signed GET URL of a CLIP frame's poster JPEG, if the source media had one.
        warnings:
          type: array
          items:
            type: string

    CreativeRenderResponse:
      type: object
      required:
        - id
        - state
        - previewOnly
        - creativeVersion
        - requestedAt
        - frames
      properties:
        id:
          type: string
        state:
          $ref: "#/components/schemas/CreativeRenderState"
        previewOnly:
          type: boolean
        renderer:
          type: string
          nullable: true
        workflowRunId:
          type: string
          nullable: true
        creativeVersion:
          type: integer
        requestedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
        frames:
          type: array
          items:
            $ref: "#/components/schemas/CreativeRenderFrameResponse"
        spec:
          allOf:
            - $ref: "#/components/schemas/CreativeRenderSpec"
          nullable: true
          description: Only ever set on the response to the POST that creates the render.

    CreativeRenderWarning:
      type: object
      required:
        - placementKey
        - message
      properties:
        placementKey:
          type: string
        index:
          type: integer
          nullable: true
        message:
          type: string

    CompleteCreativeRenderRequest:
      type: object
      properties:
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/CreativeRenderWarning"

    FailCreativeRenderRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        log:
          type: string
          nullable: true

    # ── Attach (COND-24 T3) ────────────────────────────────────────────────────────────────────────

    AttachCreativeRequest:
      type: object
      required:
        - renderId
        - workItemId
      properties:
        renderId:
          type: string
        workItemId:
          type: string
          description: The Post (Work Item) this render's frames attach to.

    AttachedCreativeAsset:
      type: object
      required:
        - assetId
        - frameId
        - placementKey
      properties:
        assetId:
          type: string
        frameId:
          type: string
        placementKey:
          type: string
        sequenceIndex:
          type: integer
          nullable: true

    AttachCreativeTargetUpdate:
      type: object
      required:
        - targetId
        - platform
        - assetIds
      properties:
        targetId:
          type: string
        platform:
          type: string
        assetIds:
          type: array
          items:
            type: string
          description: In publish order — never re-sorted.

    AttachCreativeTargetSkip:
      type: object
      required:
        - targetId
        - platform
        - reason
      properties:
        targetId:
          type: string
        platform:
          type: string
        reason:
          type: string

    AttachCreativeResponse:
      type: object
      required:
        - assets
        - targetsUpdated
        - targetsSkipped
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/AttachedCreativeAsset"
        targetsUpdated:
          type: array
          items:
            $ref: "#/components/schemas/AttachCreativeTargetUpdate"
        targetsSkipped:
          type: array
          items:
            $ref: "#/components/schemas/AttachCreativeTargetSkip"

    CreativePerformancePlatform:
      type: object
      description: One platform's slice of one Creative variant's numbers.
      required:
        - platform
        - posts
        - views
      properties:
        platform:
          type: string
        posts:
          type: integer
        views:
          type: integer
          format: int64
        engagementRate:
          type: number
          format: double
          nullable: true

    CreativePerformanceEntry:
      type: object
      description: One Creative variant's attributed performance — published destinations whose media traces back to one of its rendered frames.
      required:
        - creativeId
        - label
        - posts
        - views
        - byPlatform
      properties:
        creativeId:
          type: string
        label:
          type: string
          description: The variant's display id, e.g. "12b".
        headline:
          type: string
          nullable: true
        posts:
          type: integer
          description: Published, attributed destinations with at least one reported snapshot.
        views:
          type: integer
          format: int64
        engagementRate:
          type: number
          format: double
          nullable: true
          description: (likes + comments + shares + saves) / views across every attributed destination; null when views are zero or there is no data.
        avgViewPct:
          type: number
          format: double
          nullable: true
          description: Mean average-view-percentage where a platform reports it (YouTube); null otherwise.
        views72h:
          type: integer
          format: int64
          nullable: true
          description: Summed views at the snapshot nearest at or after each destination's fireTime + 72h; null when no destination has reached that snapshot yet.
        byPlatform:
          type: array
          items:
            $ref: "#/components/schemas/CreativePerformancePlatform"

    CreativePerformanceResponse:
      type: object
      required:
        - creativeId
        - family
      properties:
        creativeId:
          type: string
          description: The Creative id this performance read was requested for (echoed back).
        family:
          type: array
          items:
            $ref: "#/components/schemas/CreativePerformanceEntry"
          description: Every lettered variant of this Creative's family, oldest letter first.

    CreativeExperimentMetric:
      type: string
      enum:
        - views
        - engagement_rate
        - avg_view_pct
      description: >-
        The metric requested at creation. The decision itself prefers avg_view_pct whenever every variant
        reports it, regardless of this value — see CreativeExperimentService.

    CreativeExperimentState:
      type: string
      enum:
        - RUNNING
        - DECIDED
        - INCONCLUSIVE

    CreateCreativeExperimentRequest:
      type: object
      required:
        - creativeId
      properties:
        creativeId:
          type: string
          description: Any Creative in the family (a lettered variant or the root) — resolved to the family's root automatically.
        metric:
          $ref: "#/components/schemas/CreativeExperimentMetric"
        windowHours:
          type: integer
          description: Defaults to 72.

    CreativeExperimentResponse:
      type: object
      required:
        - id
        - projectId
        - parentCreativeId
        - metric
        - windowHours
        - state
        - createdAt
      properties:
        id:
          type: string
        projectId:
          type: string
        parentCreativeId:
          type: string
          description: The family's root Creative id (variant letter "a").
        metric:
          $ref: "#/components/schemas/CreativeExperimentMetric"
        windowHours:
          type: integer
        state:
          $ref: "#/components/schemas/CreativeExperimentState"
        winnerCreativeId:
          type: string
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        summary:
          type: object
          nullable: true
          additionalProperties: true
          description: Per-variant numbers used to decide (or why a decision could not be made yet). Shape documented in docs/creatives.md.
        winnerLineConfirmedAt:
          type: string
          format: date-time
          nullable: true
        winnerLineConfirmedBy:
          type: string
          nullable: true
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
