  /projects/{projectId}/marketing/competitors:
    post:
      tags:
        - marketing-growth-signals
      summary: Watch a competitor's App Store listing
      description: >-
        Starts the weekly snapshot, reviews and keyword positions for the app. `appId` is the numeric App Store id
        (digits only). Idempotent per `appId`: adding an app already watched (or removed earlier) updates its name
        and country and watches it again (200); a new one is 201. `country` is a two-letter App Store country and
        defaults to the workspace's own. The workspace's own app cannot be a competitor. Requires ADMIN or CREATOR.
      operationId: addMarketingCompetitor
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGrowthCompetitorRequest"
      responses:
        "200":
          description: The competitor was already known; it is watched again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowthCompetitor"
        "201":
          description: The competitor is now watched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowthCompetitor"
        "400":
          description: An app id that is not digits, a missing name, a country that is not two letters, or the workspace's own app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Requires ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - marketing-growth-signals
      summary: Stop watching a competitor
      description: >-
        Idempotent: removing an app that is not watched is a no-op. Its stored snapshots and reviews are kept and
        reappear if the app is added again. Requires ADMIN or CREATOR.
      operationId: removeMarketingCompetitor
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: appId
          in: query
          required: true
          schema:
            type: string
          description: The numeric App Store id of the competitor.
      responses:
        "204":
          description: Removed
        "400":
          description: An app id that is not digits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Requires ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/tracked-keywords:
    put:
      tags:
        - marketing-growth-signals
      summary: Replace the keywords whose App Store position is tracked
      description: >-
        Idempotent full replace of the project's keyword list (at most 25; an empty list clears it). Keywords are
        trimmed, lower-cased and de-duplicated. The weekly job searches each keyword once in `country` (default: the
        workspace's own) and records every watched app's position. The list is used only while the PRODUCT feed has no
        `aso:<keyword>` rows; otherwise those keywords are tracked instead. Requires ADMIN or CREATOR.
      operationId: setMarketingTrackedKeywords
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTrackedKeywordsRequest"
      responses:
        "200":
          description: The stored list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowthTrackedKeywords"
        "400":
          description: More than 25 keywords, a blank or over-long keyword, or a country that is not two letters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Requires ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/verification:
    get:
      tags:
        - marketing-verification
      summary: The verification ledger
      description: >-
        One row per metric of every connected channel that can be checked (derived ratios are left out): Conductor's
        value for the window, the product backend's value over the settled days both have (when a pair exists),
        the latest direct platform read with Conductor's own figure over that read's days, and which to trust.
        `verdict` is BOTH (every second source available agrees), CONNECTOR (trust the connector: a platform read
        agrees with it, or the backend disagrees and no read exists yet), BACKEND (backend and platform read agree,
        the connector does not), PLATFORM (the platform read disagrees with every other source) or UNCHECKED (no
        second source at all; never verified). `mismatch` is true when any second source that could be compared
        disagrees with Conductor. A read recorded more than 7 days ago is `readStale`. Only settled days are
        compared. Computed on read; the only stored data is the reads themselves.
      operationId: getMarketingVerification
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: window
          in: query
          required: false
          schema:
            type: string
            default: 28d
          description: >-
            7d, 28d (default) or 90d, or a fixed range of whole days `YYYY-MM-DD..YYYY-MM-DD` (first day not after
            the last, last day yesterday or earlier, at most 92 days).
      responses:
        "200":
          description: The ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingVerificationLedger"
        "400":
          description: Unknown or invalid window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not a member of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/verification/reads:
    get:
      tags:
        - marketing-verification
      summary: The platform reads recorded for a metric, newest first
      description: >-
        The append-only history of direct platform reads, newest first. Filter by `channel` and `metric`. Reads
        are never updated or deleted, so this is the audit trail behind every verdict.
      operationId: listMarketingPlatformReads
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: channel
          in: query
          required: false
          schema:
            type: string
          description: WEB, SEARCH, SOCIAL, STORE, ADS or PRODUCT (case-insensitive).
        - name: metric
          in: query
          required: false
          schema:
            type: string
          description: The metric key within the channel, e.g. installs.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: The reads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingPlatformReadList"
        "400":
          description: Unknown channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not a member of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - marketing-verification
      summary: Record a direct platform read
      description: >-
        Records what the platform's own UI or API showed for one metric over an explicit range of whole days
        (`from` to `to`, `to` yesterday or earlier, at most 92 days). The read is append-only: it is never
        updated or deleted, and a newer read supersedes it in the ledger. Conductor's value, the backend's value
        and the verdict at the time of recording are stored with it. Returns the recomputed ledger row for exactly
        the read's days. Requires ADMIN or CREATOR. Not idempotent: each call adds a read.
      operationId: recordMarketingPlatformRead
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketingPlatformReadRequest"
      responses:
        "201":
          description: Recorded; the recomputed ledger row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationRow"
        "400":
          description: Unknown channel or metric, a metric that cannot be read directly, an invalid range or a negative value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Requires ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/links:
    get:
      tags:
        - marketing-links
      summary: List the project's tracked links, newest first
      description: >-
        A tracked link is an App Store campaign link (`pt` provider token, `ct` campaign token) that tells Apple
        which Post, bio, creator or email a first-time download came from. Every new Post in a publishing Workflow
        gets one automatically (kind POST, family `posts`) once the project's App Store Connect connection has an
        app id and a provider token. `url` is stored as it was handed out. Filter by `kind` (POST, BIO, CREATOR,
        EMAIL or OTHER) or by the Work Item the link belongs to. Any project member can read.
      operationId: listTrackedLinks
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            type: string
          description: "POST, BIO, CREATOR, EMAIL or OTHER. Omit for every kind."
        - name: workItemId
          in: query
          required: false
          schema:
            type: string
          description: Only the links that belong to this Work Item.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: "How many links to return, 1 to 1000. Default 200. `total` always counts every match."
      responses:
        "200":
          description: The links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedLinkListResponse"
        "400":
          description: kind is not one of the five kinds, or limit is out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not a member of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - marketing-links
      summary: Create a tracked link for a bio, creator, email or Post
      description: >-
        Builds `https://apps.apple.com/app/apple-store/id{appId}?pt={providerToken}&ct={token}` from the project's
        App Store Connect connection. `token` (the `ct`) is lowercase letters, digits and dashes, starting with a
        letter or digit, at most 40 characters. `family` (lowercase letters, digits and dashes, at most 64) is how
        tokens roll up: Apple drops downloads below about 5 per token, so one family can show downloads where each
        token alone would show none. A family holds one kind of link, and the family `posts` is reserved for POST
        links. A POST link needs `workItemId` and a Post has at most one. Requires ADMIN or CREATOR. Answers 409 when
        the project has no App Store Connect connection or the connection has no provider token (App Store Connect →
        App Analytics → Campaigns → Generate a Link), when the token is taken, when the family holds another kind of
        link, or when the Post already has a link.
      operationId: createTrackedLink
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTrackedLinkRequest"
      responses:
        "201":
          description: The new link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedLink"
        "400":
          description: kind, family or token is missing or malformed, a POST link has no workItemId, or the family `posts` was used for another kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Requires ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: workItemId is not a Work Item of this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No App Store Connect connection or provider token, the token is taken, the family holds another kind of link, or the Post already has a link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/links/performance:
    get:
      tags:
        - marketing-links
      summary: Downloads and views per link family
      description: >-
        Per family: how many tokens it has, first-time downloads Apple attributed to those tokens over the window
        (the App Downloads Detailed report, settled days only), and for POST links the latest views of the linked
        Posts' destinations. Apple omits a token's downloads below its privacy threshold (about 5), so a family with
        no row in the window is never read as 0: `downloads` is null, `belowThreshold` is true and `note` says
        "below Apple's reporting threshold". `views` is cumulative as of each destination's latest snapshot (not
        limited to the window) and is null when no linked Post has reported views. The window defaults to the last
        28 settled days: it ends on the latest settled App Store day (yesterday when there is none) and starts 27
        days earlier. Days are UTC.
      operationId: getTrackedLinkPerformance
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: "First day, inclusive (UTC). With only `to`, 27 days before it."
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: "Last day, inclusive (UTC). With only `from`, the default end day."
      responses:
        "200":
          description: The families, ordered by family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkPerformanceResponse"
        "400":
          description: from is after to, or the window is longer than 366 days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not a member of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/ai-visibility:
    get:
      tags:
        - marketing-ai-visibility
      summary: Whether AI assistants name the brand, per question and assistant, with a weekly trend
      description: >-
        Once a week (Monday 07:00 UTC) each active question is put to each AI assistant the workspace holds a
        provider key for (Settings, AI Providers), and whether the answer names the brand is recorded. A brand term
        counts when it appears as a whole word in any case, with an optional plural "s" ("Rexipe", "REXIPES" and
        "rexipe.io" count; "rexipeapp" does not). `brandTerms` are the terms in force (the workspace name until set).
        `questions` lists the active questions, plus dropped ones that still have readings in the window. Per
        assistant, `latest` is its newest reading in the window (`rankInAnswer` is the 1-based position of the first
        list item naming the brand when the answer was a numbered or bulleted list, else null; `excerpt` is about 200
        characters either side of the first mention, or the start of the answer when not named) and `trend` is one
        point per week read, oldest first. A week with no reading is absent from the trend, never `named: false`:
        an assistant with no credential, an error or a skipped question leaves no reading. `skipped` lists the
        assistants the workspace has no credential for.
      operationId: getAiVisibility
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: weeks
          in: query
          required: false
          description: How many ISO weeks back to read, including this one (1 to 52).
          schema:
            type: integer
            minimum: 1
            maximum: 52
            default: 8
      responses:
        "200":
          description: The AI-assistant visibility readings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiVisibility"
        "400":
          description: weeks is outside 1 to 52
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not a member of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/ai-visibility/questions:
    put:
      tags:
        - marketing-ai-visibility
      summary: Replace the questions put to the AI assistants each week
      description: >-
        Idempotent full replace of the active question set (at most 20; an empty list switches every question
        off). Questions are trimmed, whitespace-collapsed and de-duplicated ignoring case. A listed question is
        active (one dropped earlier is reactivated with its history), a question left out becomes inactive and its
        history stays readable. The response lists every question of the workspace, the listed ones first in the
        order given. Requires ADMIN or CREATOR.
      operationId: setAiVisibilityQuestions
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAiQuestionsRequest"
      responses:
        "200":
          description: Every question of the workspace after the replace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiQuestionList"
        "400":
          description: A blank question, one over 400 characters, or more than 20 questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Requires ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/ai-visibility/brand-terms:
    put:
      tags:
        - marketing-ai-visibility
      summary: Replace the words that count as naming the brand
      description: >-
        Idempotent full replace of the brand terms (at most 10, each up to 80 characters). Terms are trimmed and
        de-duplicated ignoring case. An empty list goes back to the default, the workspace name. Applies to the
        next check; stored readings are not re-judged. Requires ADMIN or CREATOR.
      operationId: setAiVisibilityBrandTerms
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAiBrandTermsRequest"
      responses:
        "200":
          description: The brand terms now in force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiBrandTerms"
        "400":
          description: More than 10 terms, or a term over 80 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Requires ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/ai-visibility/run:
    post:
      tags:
        - marketing-ai-visibility
      summary: Run this week's AI-visibility checks now
      description: >-
        Runs the checks the weekly job would run, for this workspace and this ISO week (Monday, UTC), and waits for
        them. Idempotent: a question and assistant already read this week is not asked again, so a repeat makes no
        calls; a check that failed earlier is retried. At most 20 assistant calls are made per workspace per week.
        `skipped` reports assistants with no credential and checks held back by that limit; `errors` reports
        provider failures. Neither writes a reading, so neither can appear as "not named". Requires ADMIN.
      operationId: runAiVisibilityCheck
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
