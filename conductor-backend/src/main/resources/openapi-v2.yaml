  /projects/{projectId}/work-items/{workItemId}/publish-targets/{targetId}/manual-publish:
    post:
      tags:
        - publish-outcomes
      summary: Record that a human published a manual target by hand
      description: >-
        Marks one MANUAL publish target as published, storing the live URL the person pasted back. This is
        the only way a target reaches PUBLISHED without a platform reporting it, and it is refused for any
        target that is not on the MANUAL lane: an automated target has a poller that will publish it and
        report the real outcome, so letting a human declare it published would strand a post that is still
        queued to go out.


        Everything downstream is the ordinary success path — the target moves to PUBLISHED, a typed
        destination Asset is recorded on the Post, and the Post rolls up to its published status once every
        target has landed. Idempotent: a second call on an already-published target changes nothing.
      operationId: completeManualPublish
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
        - name: targetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteManualPublishRequest"
      responses:
        "200":
          description: The target as it stands after being recorded as published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishTargetResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project, Work Item or target not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            The target is not on the MANUAL lane, was revoked, or no permalink was supplied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/work-items/{workItemId}/publish-targets:
    get:
      tags:
        - publish-targets
      summary: List the publish targets selected on a Work Item
      operationId: listWorkItemPublishTargets
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The Work Item's selected publish targets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublishTargetResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - publish-targets
      summary: Replace the publish targets selected on a Work Item
      description: >-
        Idempotent set-replace. Newly selected targets are created, deselected ones are deleted, and
        a target that was already selected is left untouched — its row keeps its state, its
        `platformPostId` and its idempotency key, so re-saving an unchanged selection never
        re-creates a row that has already been handed to a platform. Each target may carry its own
        `publishOptions`; changing them on an already-selected target updates that row in place rather
        than re-creating it. Editing the selection — adding a target, dropping one, or changing one's
        `publishOptions` — on an Approved-or-later Post revokes any native-lane hand-off and reverts the
        Post to its review status first; if that revocation fails the whole request fails and the
        selection is unchanged. (COND-23 AC-P0-1.5, TIK-1.)
      operationId: replaceWorkItemPublishTargets
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplacePublishTargetsRequest"
      responses:
        "200":
          description: The Work Item's publish targets after the replace
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublishTargetResponse"
        "400":
          description: A selected target is not one of the project's selectable targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/work-items/{workItemId}/publish-consent:
    get:
      tags:
        - publish-targets
      summary: Read the creator's posting consent on a Post
      description: >-
        Whether the creator's TikTok posting consent stands for this Post **as it is now**. `required`
        is true when the Post carries at least one `tiktok` target; every other Post needs no consent
        and reports `valid: false, required: false`, which blocks nothing.


        `valid` is not a stored flag — consent is recorded against the exact target set (accounts and
        their `publishOptions`) and uploaded media it was given for, so swapping a destination account,
        changing a privacy level or replacing the video silently withdraws it. Read `consentedAt`
        alongside `valid` to tell the two apart: null means nobody ever consented, and a timestamp with
        `valid: false` means someone did and the Post has changed since. (MKT-1.)
      operationId: getPublishConsent
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The Post's consent as it currently stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishConsentResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - publish-targets
      summary: Record or withdraw the creator's posting consent on a Post
      description: >-
        Records that the creator has reviewed the preview and the destination accounts and consents to
        this Post going out, or withdraws that consent (`consented: false`). TikTok's Content Sharing
        Guidelines require the consent before anything is uploaded, and a Post with a `tiktok` target
        cannot enter a review-gated status without it.


        What is consented to is computed server-side from the Post's current targets and media — a
        client never supplies it, because a client-supplied subject would let a caller consent to
        something the Post is not. Idempotent: re-recording rewrites the same single consent with the
        current subject, and withdrawing returns the Post to "never consented". (MKT-1.)
      operationId: recordPublishConsent
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPublishConsentRequest"
      responses:
        "200":
          description: The Post's consent after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishConsentResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/work-items/{workItemId}/publish-targets/retry:
    post:
      tags:
        - publish-outcomes
      summary: Re-fire the publish targets that failed on a Post
      description: >-
        Re-attempts **only** the targets in state `FAILED`. Each one is reset to `PENDING`, its stored
        error is cleared and it is stamped with a **fresh** idempotency key — a reused key would make
        the action-invocation layer's claim-or-return replay the previous attempt's result instead of
        posting. Targets in any other state are left completely untouched: a `PUBLISHED` target is
        never re-published, and its permalink Asset stays exactly where it is.


        The Post itself is moved back to its scheduled status while the retry is in flight, so the
        due poller picks the reset rows up. Calling this on a Post with no failed targets is a
        no-op that returns the current state, which makes a double-click harmless. (COND-23 T6.2.)
      operationId: retryFailedPublishTargets
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The Post's status and publish targets after the retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryPublishResponse"
        "400":
          description: >-
            The Post is not in a status a retry can fire from — only a Post sitting at its failed or
            its scheduled status may be retried, so a Post sent back for review never re-publishes
            under an approval that no longer describes it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: http
      scheme: bearer
      description: API key authentication (Bearer token)

  schemas:
    WorkItemResponse:
      type: object
      required:
        - id
        - projectId
        - type
        - title
        - status
        - createdBy
        - createdAt
        - updatedAt
        - sequenceNumber
        - displayId
      properties:
        id:
          type: string
        projectId:
          type: string
        type:
          type: string
          description: Work Item type — a Workflow-defined string (e.g. PRD).
        title:
          type: string
        description:
          type: string
        status:
          type: string
          description: Current status — a Workflow-defined status id (e.g. DRAFT).
        workflow:
          type: string
          description: The bound Workflow definition id (slug, e.g. ENGINEERING).
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sequenceNumber:
          type: integer
        displayId:
          type: string
          description: Human-readable ID (e.g. "COND-42")
        unresolvedCommentCount:
          type: integer
        assignee:
          $ref: "#/components/schemas/WorkItemAssignee"
        scheduledFor:
          type: string
          format: date-time
          nullable: true
          description: >-
            When this Work Item is due, as an ISO-8601 date-time. Workflow-agnostic — any Workflow may put
            an item on a clock. Null when the item is not scheduled.
        scheduleTimezone:
          type: string
          nullable: true
          description: >-
            IANA zone id the schedule was authored in (e.g. America/New_York), retained alongside the
            absolute instant so a local-wall-clock reading survives DST. Null when unscheduled.
        externalLinks:
          type: array
          description: >-
            Where this Work Item ended up outside Conductor: every link Asset recorded on it, oldest first.
            Workflow-agnostic by construction — it is whatever the item's own `asset_types` allow, so a
            Post carries the live posts it published to and an Issue carries its pull request. Empty until
            something is recorded.


            It is on the list response, not only the detail one, because a link nobody can reach without
            opening the item is a link nobody finds: the calendar and list surfaces are where a human looks
            to ask "did that go out, and where is it?".
          items:
            $ref: "#/components/schemas/WorkItemExternalLink"

    WorkItemExternalLink:
      type: object
      required:
        - url
        - type
      properties:
        url:
          type: string
          description: The Asset's ref — the address of the thing itself.
        type:
          type: string
          description: >-
            The Asset type, one of the bound Workflow's declared `asset_types` (e.g. `instagram_post`,
            `github_pr`). A client uses it to choose an icon or a label; it is not an enum here because the
            set is Workflow-defined.
        label:
          type: string
          nullable: true
          description: Human-readable name captured when the link was recorded (e.g. the account it went to).

    WorkItemAssignee:
      type: object
      required:
        - userId
        - name
      properties:
        userId:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
          nullable: true

    CreateWorkItemRequest:
      type: object
      required:
        - type
        - title
      properties:
        workflow:
          type: string
          description: >-
            Required (enforced by the controller, not schema-`required`, so the 400 carries actionable
            guidance rather than a generic "must not be null"). The lifecycle Workflow definition id (slug,
            e.g. ENGINEERING) that governs this Work Item — the canonical v2 surface never silently defaults it;
            discover options via `GET /projects/{projectId}/workflows?lifecycle=true`. (The legacy v1 `/issues`
            create keeps an ENGINEERING default for back-compat.)
        type:
          type: string
          description: >-
            Work Item type — a Workflow-defined string (e.g. PRD), validated against the
            chosen Workflow's allowed types.
        title:
          type: string
          maxLength: 255
        description:
          type: string

    PatchWorkItemRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
        status:
          type: string
          description: >-
            Target status — a Workflow-defined status id (e.g. IN_REVIEW). The move is
            validated against the bound Workflow and the Review gate.
        assigneeId:
          type: string
          nullable: true
          description: User ID to assign to this Work Item, or null to unassign
        scheduledFor:
          type: string
          format: date-time
          nullable: true
          description: >-
            When this Work Item is due, as an ISO-8601 date-time. Omit to leave the existing schedule
            unchanged.
        scheduleTimezone:
          type: string
          nullable: true
          description: >-
            IANA zone id the schedule is authored in (e.g. America/New_York). Omit to leave unchanged, or
            send an empty string to clear it. An unrecognized zone is rejected with a 400.

    AvailableTransition:
      type: object
      required:
        - toStatus
        - label
      properties:
        toStatus:
          type: string
          description: The status this transition moves the Work Item to.
        label:
          type: string
          description: Human-readable action label (e.g. "Submit for review").
        requiresReview:
          type: boolean
          description: Whether taking this transition will open a Review gate.

    AvailableTransitionsResponse:
      type: object
      required:
        - workflow
        - currentStatus
        - transitions
      properties:
        workflow:
          type: string
          description: The Work Item's Workflow definition id (slug).
        currentStatus:
          type: string
        noun:
          type: string
          description: The Workflow's display noun (e.g. Issue, Post).
        transitions:
          type: array
          items:
            $ref: "#/components/schemas/AvailableTransition"

    AssignReviewerRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          description: User ID to assign as reviewer

    AssignReviewerResponse:
      type: object
      required:
        - workItemId
        - userId
        - assignedAt
      properties:
        workItemId:
          type: string
        userId:
          type: string
        assignedAt:
          type: string
          format: date-time

    ReviewerResponse:
      type: object
      required:
        - userId
        - assignedAt
      properties:
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        avatarUrl:
          type: string
        reviewVerdict:
          type: string

    DocumentResponse:
      type: object
      required:
        - id
        - workItemId
        - filename
        - contentType
        - createdAt
      properties:
        id:
          type: string
        workItemId:
          type: string
        filename:
          type: string
        contentType:
          type: string
        content:
          type: string
          nullable: true
          description: Inline content for text/markdown and text/plain; null for binary types
        storagePath:
          type: string
        storageUrl:
          type: string
          description: GCP V4 signed URL (valid for configured expiry, default 15 minutes)
        storageUrlExpiresAt:
          type: string
          format: date-time
          description: ISO timestamp when the signed URL expires
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateDocumentRequest:
      type: object
      required:
        - filename
      properties:
        filename:
          type: string
        content:
          type: string
        contentType:
          type: string

    UpsertDocumentByFilenameRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
        contentType:
          type: string
          default: text/markdown

    CreateCommentRequest:
      type: object
      required:
        - documentId
        - content
        - lineNumber
      properties:
        documentId:
          type: string
        content:
          type: string
        lineNumber:
          type: integer

    CommentResponse:
      type: object
      required:
        - id
        - documentId
        - authorId
        - content
        - createdAt
      properties:
        id:
          type: string
        documentId:
          type: string
        authorId:
          type: string
        content:
          type: string
        lineNumber:
          type: integer
        quotedText:
          type: string
        lineStale:
          type: boolean
        resolvedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    CommentReplyResponse:
      type: object
      required:
        - id
        - commentId
        - authorId
        - content
        - createdAt
      properties:
        id:
          type: string
        commentId:
          type: string
        authorId:
          type: string
        authorName:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    CommentWithRepliesResponse:
      type: object
      required:
        - id
        - documentId
        - authorId
        - content
        - createdAt
        - replies
      properties:
        id:
          type: string
        documentId:
          type: string
        authorId:
          type: string
        authorName:
          type: string
        content:
          type: string
        lineNumber:
          type: integer
        quotedText:
          type: string
        lineStale:
          type: boolean
        documentName:
          type: string
        resolvedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        replies:
          type: array
          items:
            $ref: "#/components/schemas/CommentReplyResponse"

    AddCommentReplyRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          nullable: true

    SubmitReviewRequest:
      type: object
      required:
        - verdict
      properties:
        verdict:
          type: string
          description: "Review verdict: APPROVED, CHANGES_REQUESTED, or COMMENTED"
        body:
          type: string
          nullable: true

    ReviewResponse:
      type: object
      required:
        - id
        - reviewerId
        - verdict
        - submittedAt
      properties:
        id:
          type: string
        reviewerId:
          type: string
        verdict:
          type: string
        body:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time

    ReviewWithUserResponse:
      type: object
      required:
        - reviewerId
        - verdict
        - submittedAt
      properties:
        reviewerId:
          type: string
        name:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        verdict:
          type: string
        body:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: >-
            Whether this review still describes the Work Item as it stands, and so still counts toward the
            review gate. False for one cast in an earlier review round, or — on an item with publish
            targets — against a different publish bundle: changing the caption, the schedule, the targets
            or the media withdraws an approval rather than letting it cover a post nobody has seen.


            Computed exactly the way the server's own gate computes it, so a client can never show
            "approved" for a review the gate is ignoring.

    AssetResponse:
      type: object
      required:
        - id
        - workItemId
        - type
        - kind
        - ref
        - done
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        workItemId:
          type: string
        type:
          type: string
          description: Asset type validated against the Workflow's asset_types (e.g. github_pr).
        label:
          type: string
        kind:
          type: string
          enum:
            - link
            - file
        ref:
          type: string
          description: A URL (kind=link) or a stored-file reference (kind=file).
        done:
          type: boolean
        uploadStatus:
          type: string
          nullable: true
          description: >-
            Upload lifecycle of a kind=file Asset: PENDING once the upload URL is minted, UPLOADED
            once the client confirms. Null for kind=link Assets and for file rows recorded without
            the upload flow. One of PENDING, UPLOADED. (COND-23.)
        contentType:
          type: string
          nullable: true
          description: Media type of the stored object (kind=file only).
        sizeBytes:
          type: integer
          format: int64
          nullable: true
          description: Size of the stored object in bytes (kind=file only).
        width:
          type: integer
          format: int32
          nullable: true
          description: >-
            Pixel width of the media, or null when unknown. Derived from the bytes at confirm for
            images; for video it is only ever what the client measured at upload. (COND-23.)
        height:
          type: integer
          format: int32
          nullable: true
          description: Pixel height of the media, or null when unknown. Same provenance as width.
        durationSeconds:
          type: number
          nullable: true
          description: >-
            Playback length in seconds for a video Asset, or null when unknown. The browser is the
            only source — no container parser ships with the JDK.
        previewUrl:
          type: string
          nullable: true
          description: >-
            Short-lived (15 minute) signed read URL for the stored object. Populated only for a
            kind=file Asset whose uploadStatus is UPLOADED; null otherwise. Never persisted — it is
            minted per response, so don't cache it.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AreaAssetResponse:
      type: object
      description: One uploaded file Asset in an Area's library, with the Work Item that produced it.
      required:
        - assetId
        - previewUrl
        - uploadedAt
        - workItem
      properties:
        assetId:
          type: string
        previewUrl:
          type: string
          description: >-
            Short-lived (15 minute) signed read URL for the stored object, minted per response and
            never persisted — don't cache it.
        contentType:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          format: int64
          nullable: true
        uploadedAt:
          type: string
          format: date-time
          description: When the upload was initiated (the Asset row's creation instant).
        workItem:
          $ref: "#/components/schemas/AreaAssetWorkItemRef"

    AreaAssetWorkItemRef:
      type: object
      description: The Work Item that owns an Area-library Asset, enough to label and link the row.
      required:
        - id
        - displayId
        - title
        - status
        - workflow
      properties:
        id:
          type: string
        displayId:
          type: string
          description: Human-facing key, `{projectKey}-{sequenceNumber}` (e.g. MK-12).
        title:
          type: string
        status:
          type: string
          description: The Work Item's current Workflow-defined status.
        workflow:
          type: string
          description: Slug of the Workflow the Work Item is bound to.

    CreateAssetUploadRequest:
      type: object
      required:
        - type
        - filename
        - contentType
        - sizeBytes
      properties:
        type:
          type: string
          description: Asset type, validated against the Workflow's asset_types (e.g. instagram_post).
        label:
          type: string
          description: Human label; defaults to the sanitized filename.
        filename:
          type: string
          description: >-
            Client-supplied file name. Sanitized to a single safe path segment before it is appended
            to the storage path.
        contentType:
          type: string
          description: >-
            Media type of the bytes about to be uploaded. Must be on the server's allowlist
            (image/png, image/jpeg, image/gif, image/webp, video/mp4, video/quicktime).
        sizeBytes:
          type: integer
          format: int64
          description: Size of the bytes about to be uploaded. Must be positive and within the server ceiling.
        width:
          type: integer
          format: int32
          description: >-
            Client-measured pixel width of the media. Optional. An image's real width is re-derived
            from the bytes at confirm, so this only matters for video.
        height:
          type: integer
          format: int32
          description: Client-measured pixel height of the media. Same provenance as width.
        durationSeconds:
          type: number
          description: >-
            Client-measured playback length in seconds. Video only, and the browser is the only
            source — no container parser ships with the JDK, so a video that omits it can never
            satisfy a per-target duration rule at approval.

    CreateAssetUploadResponse:
      type: object
      required:
        - assetId
        - uploadUrl
        - gcsPath
        - expiresAt
      properties:
        assetId:
          type: string
          description: Id of the PENDING Asset row; use it to confirm the upload.
        uploadUrl:
          type: string
          description: URL to PUT the raw bytes to (signed PUT on GCS, internal passthrough locally).
        gcsPath:
          type: string
          description: Object path the bytes are stored at.
        expiresAt:
          type: string
          format: date-time
          description: When uploadUrl stops being usable.

    ConfirmAssetUploadRequest:
      type: object
      properties:
        sizeBytes:
          type: integer
          format: int64
          description: >-
            Bytes actually written. Re-validated against the upload ceiling and persisted when
            present; the size declared at mint is kept when omitted.

    CreateAssetRequest:
      type: object
      required:
        - type
        - kind
        - ref
      properties:
        type:
          type: string
        label:
          type: string
        kind:
          type: string
          enum:
            - link
            - file
        ref:
          type: string
        done:
          type: boolean
          default: false

    PatchAssetRequest:
      type: object
      properties:
        label:
          type: string
        ref:
          type: string
        done:
          type: boolean

    MetricObservation:
