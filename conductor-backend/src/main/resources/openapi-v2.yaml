          description: The draft's render spec and readiness. Nothing was persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeDraftSpecResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
