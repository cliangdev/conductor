  /projects/{projectId}/work-items/{workItemId}/dependencies:
    get:
      tags:
        - work-item-dependencies
      summary: List the dependencies around a Work Item
      description: >-
        Grouped by what they mean to this item: `blocks` (this item blocks them), `blockedBy`, `discoveredFrom`
        and `discovered`. Each entry carries the `dependencyId` to remove it with.
      operationId: listWorkItemDependencies
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: workItemId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The grouped dependencies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemDependencies"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - work-item-dependencies
      summary: Add a dependency
      description: >-
        Records "this item `kind` `relatedWorkItemId`" (`BLOCKS`: this item blocks the related one). Idempotent:
        an existing link is returned as is. Both items must be in the project, an item cannot depend on itself,
        BLOCKS must stay acyclic and an item has at most 25 outgoing and 25 incoming BLOCKS links.
      operationId: addWorkItemDependency
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: workItemId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWorkItemDependencyRequest"
      responses:
        "200":
          description: The item's dependencies after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemDependencies"
        "400":
          description: Unknown kind, self-link, or an item outside this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Would create a BLOCKS cycle, or exceeds the per-item BLOCKS cap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/work-items/{workItemId}/dependencies/{dependencyId}:
    delete:
      tags:
        - work-item-dependencies
      summary: Remove a dependency
      operationId: removeWorkItemDependency
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: workItemId, in: path, required: true, schema: {type: string}}
        - {name: dependencyId, in: path, required: true, schema: {type: string}}
      responses:
        "204":
          description: Removed
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
