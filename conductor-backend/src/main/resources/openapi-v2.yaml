        validators would raise, the next gate move, whether a review currently satisfies the gate and
        whether the creator's consent stands. Read it before submitting, after every edit, or to explain a
        422. `earliestFireTime` is "as soon as possible" for the current destinations — set `scheduledFor`
        to it rather than guessing a lead time. On a Workflow that does not publish, `publishing` is false
        and everything else is empty.
      operationId: getWorkItemPublishPreflight
      security:
        - bearerAuth: []
        - apiKeyAuth: []
