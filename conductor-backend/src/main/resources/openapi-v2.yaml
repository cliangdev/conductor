                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/work-items/{workItemId}/publish-targets:
    get:
      tags:
        - publish-targets
      summary: List the publish targets selected on a Work Item
      operationId: listWorkItemPublishTargets
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The Work Item's selected publish targets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublishTargetResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - publish-targets
      summary: Replace the publish targets selected on a Work Item
      description: >-
        Idempotent set-replace. Newly selected targets are created, deselected ones are deleted, and
        a target that was already selected is left untouched — its row keeps its state, its
        `platformPostId` and its idempotency key, so re-saving an unchanged selection never
        re-creates a row that has already been handed to a platform. Each target may carry its own
        `publishOptions`; changing them on an already-selected target updates that row in place rather
        than re-creating it. Editing the selection — adding a target, dropping one, or changing one's
        `publishOptions` — on an Approved-or-later Post revokes any native-lane hand-off and reverts the
        Post to its review status first; if that revocation fails the whole request fails and the
        selection is unchanged. (COND-23 AC-P0-1.5, TIK-1.)
      operationId: replaceWorkItemPublishTargets
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplacePublishTargetsRequest"
      responses:
        "200":
          description: The Work Item's publish targets after the replace
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublishTargetResponse"
        "400":
          description: A selected target is not one of the project's selectable targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/work-items/{workItemId}/publish-consent:
    get:
      tags:
        - publish-targets
      summary: Read the creator's posting consent on a Post
      description: >-
        Whether the creator's TikTok posting consent stands for this Post **as it is now**. `required`
        is true when the Post carries at least one `tiktok` target; every other Post needs no consent
        and reports `valid: false, required: false`, which blocks nothing.


        `valid` is not a stored flag — consent is recorded against the exact target set (accounts and
        their `publishOptions`) and uploaded media it was given for, so swapping a destination account,
        changing a privacy level or replacing the video silently withdraws it. Read `consentedAt`
        alongside `valid` to tell the two apart: null means nobody ever consented, and a timestamp with
        `valid: false` means someone did and the Post has changed since. (MKT-1.)
      operationId: getPublishConsent
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The Post's consent as it currently stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishConsentResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - publish-targets
      summary: Record or withdraw the creator's posting consent on a Post
      description: >-
        Records that the creator has reviewed the preview and the destination accounts and consents to
        this Post going out, or withdraws that consent (`consented: false`). TikTok's Content Sharing
        Guidelines require the consent before anything is uploaded, and a Post with a `tiktok` target
        cannot enter a review-gated status without it.


        What is consented to is computed server-side from the Post's current targets and media — a
        client never supplies it, because a client-supplied subject would let a caller consent to
        something the Post is not. Idempotent: re-recording rewrites the same single consent with the
        current subject, and withdrawing returns the Post to "never consented". (MKT-1.)


        **Recording consent (`consented: true`) needs a person in their own signed-in session** — a user
        JWT sent in the `Authorization` header; an API key, project key, run token or cookie-only JWT gets
        403 (and the attempt is audited). Withdrawing stays open to any member. To record the creator's
        choices as well, use `PUT .../tiktok-consent`.
      operationId: recordPublishConsent
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPublishConsentRequest"
      responses:
        "200":
          description: The Post's consent after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishConsentResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Recording consent from anything but a person's own session (see above)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/work-items/{workItemId}/tiktok-consent:
    put:
      tags:
        - publish-targets
      summary: Record the creator's posting consent and TikTok choices on a Post (person only)
      description: >-
        The atomic consent write behind the TikTok consent page. In one transaction it checks the caller,
        the `If-Match` ETag and the choices against TikTok's live creator options, merges the six
        human-only publish options (`privacyLevel`, `disableComment`, `disableDuet`, `disableStitch`,
        `brandContentToggle`, `brandOrganicToggle`) into each TikTok target, upserts the standing consent
        and appends an audit event.


        **Only a person in their own signed-in browser session can call this** — a user JWT sent in the
        `Authorization` header. A user API key, a project key, a run token or a cookie-only JWT gets 403,
        and the refusal is audited. TikTok requires the creator to choose the privacy level and each
        interaction personally, so no agent can.


        `If-Match` carries the Post's current consent ETag (`"<hash>"`, from `etag` in the consent page
        read, or in this response). Missing is 428; a stale value is 412 ("This post changed — review it
        again"). The body must hold exactly one entry per non-MANUAL TikTok target, keyed by
        `connectionId`. Allowed while the Post is frozen under review: consent normally happens during
        review and publish options are not part of the review bundle.
      operationId: recordTikTokConsent
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: false
          description: >-
            The strong ETag of the Post's consent subject. Declared optional here only so the server can
            answer 428 itself with a problem body; a request without it is refused.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordTikTokConsentRequest"
      responses:
        "200":
          description: Consent recorded; the Post's consent after the change, with its new `etag`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishConsentResponse"
        "400":
          description: >-
            The choices are not valid for this creator or Post (a level the account does not offer, an
            interaction the creator has disabled, branded content with `SELF_ONLY`, a missing or unknown
            target) or the creator cannot post right now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Not a person in their own session (API key, project key, run token, cookie-only token), or the
            `requestId` was created for someone else
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: The `requestId` has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "412":
          description: The Post changed since the ETag was read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          description: No `If-Match` header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/tiktok-consent-requests:
    post:
      tags:
        - publish-targets
      summary: Ask a person to review and consent to TikTok Posts in their browser
      description: >-
        Creates a consent request: a short-lived (24 hours) pointer to a set of Posts, bound to the calling
        user, that the consent page opens. This is how an agent gets ten Posts consented without ten
        trips — it makes one request and hands the person the returned `consentUrl`. **The agent cannot
        consent**; the request grants no authority, and the page works only for the user who created it.


        `workItemIds` omitted means every Post in the project that still needs TikTok consent. Posts that
        need no consent, already have valid consent, or do not exist are not included and are reported in
        `skipped`. Accepts a user API key or JWT (there must be a user to bind the request to); a project
        key or run token gets 403. Poll `GET .../tiktok-consent-requests/{requestId}` for progress.
      operationId: createTikTokConsentRequest
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTikTokConsentRequest"
      responses:
        "201":
          description: The request, with the link to give the person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TikTokConsentRequestResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is a project key or run token, which has no user to bind the request to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/tiktok-consent-requests/{requestId}:
    get:
      tags:
        - publish-targets
      summary: Poll a TikTok consent request
      description: >-
        Where each Post in the request stands. Any member credential may read it. `complete` turns true
        the first time every Post is `VALID` (and stays true); an expired request still answers, with
        `expired: true`.
      operationId: getTikTokConsentRequest
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request's progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TikTokConsentRequestStatus"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Request not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/tiktok-consent/summary:
    get:
      tags:
        - publish-targets
      summary: How many Posts are waiting on TikTok consent
      description: >-
        A cheap count for "N posts need TikTok consent" badges: Posts with a TikTok target that publishes
        through the API, has not gone out, and whose consent is not `VALID`. Database only — TikTok is
        never called. Any member credential may read it.
      operationId: getTikTokConsentSummary
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The pending count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TikTokConsentSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/tiktok-consent:
    get:
      tags:
        - publish-targets
      summary: Everything the TikTok consent page needs, in one read (person only)
      description: >-
        The page read. With `request=<id>` it returns that request's Posts and requires the caller to be
        the user who created it (403 "This link was created for <name>" otherwise; 410 once expired).
        Without it, every Post in the project still pending consent — Posts whose consent is already
        `VALID` are **excluded**. With it, the request's Posts are all returned, `VALID` ones included
        (verdict `VALID`, with their stored `consented` choices), so the page can show them collapsed.


        Per Post: identity, caption, schedule, consent `verdict`, the `etag` to send as `If-Match`, and the
        TikTok targets with their effective media. A target's stored human-only choices are included only
        when the Post's verdict is `VALID`. Per distinct TikTok account: creator options queried from
        TikTok now (nickname, avatar, privacy levels, disabled interactions, duration cap, `canPost`).


        Like the write, this needs a person in their own signed-in session: user JWT in the
        `Authorization` header. The Post ids always come from the stored request, never from the URL.
      operationId: getTikTokConsentPage
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: request
          in: query
          required: false
          description: A consent request id. Omit for every Post pending consent.
          schema:
            type: string
      responses:
        "200":
          description: The consent page's data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TikTokConsentPage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a person in their own session, or the request was created for someone else
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Request not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: The request has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/work-items/{workItemId}/publish-targets/retry:
    post:
      tags:
        - publish-outcomes
      summary: Re-fire the publish targets that failed on a Post
      description: >-
        Re-attempts **only** the targets in state `FAILED`. Each one is reset to `PENDING`, its stored
        error is cleared and it is stamped with a **fresh** idempotency key — a reused key would make
        the action-invocation layer's claim-or-return replay the previous attempt's result instead of
        posting. Targets in any other state are left completely untouched: a `PUBLISHED` target is
        never re-published, and its permalink Asset stays exactly where it is.


        The Post itself is moved back to its scheduled status while the retry is in flight, so the
        due poller picks the reset rows up. Calling this on a Post with no failed targets is a
        no-op that returns the current state, which makes a double-click harmless. (COND-23 T6.2.)
      operationId: retryFailedPublishTargets
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The Post's status and publish targets after the retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryPublishResponse"
        "400":
          description: >-
            The Post is not in a status a retry can fire from — only a Post sitting at its failed or
            its scheduled status may be retried, so a Post sent back for review never re-publishes
            under an approval that no longer describes it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/budget:
    get:
      tags:
        - marketing-budget
      summary: Month-to-date paid spend against the monthly cap, per paid channel
      description: >-
        Paces the month's paid budget across the paid channels (any channel with a `spend` metric; today Apple Ads,
        channel ADS). Computed on read from settled days only: provisional days (the source may still restate them)
        are reported apart as `provisionalSpend` and never count toward month-to-date spend, a cost per install or a
        stop rule. `capAmount`, `expectedSpend` and `pacePct` are null when the month has no cap (never a cap of 0).
        Pace is straight line: `pacePct = mtdSpend / (capAmount * daysElapsed / daysInMonth)`, 1.0 = on pace, and
        `projectedSpend = mtdSpend / daysElapsed * daysInMonth`. Each channel carries `compliant` (a paid channel
        with no active stop rule is non-compliant, reason "no stop rule"), every active rule with its observed value
        and whether it is tripped, and the marginal cost per install (last 7 settled days, the 7 before, and
        month-to-date). A rule below its `minSample` never trips. Days are UTC. Conductor only proposes and records:
        a bid or budget change is made by a human in the ad platform.
      operationId: getMarketingBudget
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: month
          in: query
          required: false
          schema:
            type: string
          description: "YYYY-MM (UTC). Defaults to the current UTC month."
      responses:
        "200":
          description: The pacing view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetPacing"
        "400":
          description: month is not YYYY-MM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not a member of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/budget/{month}:
    put:
      tags:
        - marketing-budget
      summary: Set the paid budget cap for a month
      description: >-
        Idempotent upsert of the month's cap (YYYY-MM, UTC). `capAmount` must be greater than 0: a month with no
        cap simply has none (pacing reads null), a cap of 0 is refused. `currency` is a three-letter code and
        defaults to USD; spend is summed as the ad platform reports it, so keep the cap in the account currency.
        Requires ADMIN or CREATOR.
      operationId: setMarketingBudget
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: month
          in: path
          required: true
          schema:
            type: string
          description: "YYYY-MM (UTC)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetCapRequest"
      responses:
        "200":
          description: The stored cap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingBudgetCap"
        "400":
          description: month is not YYYY-MM, or capAmount is missing, not above 0 or too large, or currency is not a three-letter code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Requires ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/stop-rules:
    get:
      tags:
        - marketing-budget
      summary: List the project's active stop rules
      description: Active rules only, oldest first. A removed rule stays on record but is not listed.
      operationId: listMarketingStopRules
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The active rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopRuleListResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not a member of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - marketing-budget
      summary: Add a stop rule for a paid channel
      description: >-
        A stop rule reads "when `metric` is above (GT) or below (LT) `threshold` over the last `windowDays` settled
        days at `scope`, once the window holds at least `minSample` taps". A paid channel with spend needs at least
        one active rule or it shows as non-compliant. Rules are evaluated, never enforced: tripping one means a
        human should look at the bid or budget in the ad platform. Requires ADMIN or CREATOR.
      operationId: createMarketingStopRule
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopRuleRequest"
      responses:
        "201":
          description: The stored rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopRule"
        "400":
          description: >-
            Unknown channel, scope, metric or comparator, a missing or negative threshold, a negative minSample,
            windowDays outside 1-90, or a note over 500 characters (the message lists the allowed values)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Requires ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/stop-rules/{ruleId}:
    delete:
      tags:
        - marketing-budget
      summary: Remove a stop rule
      description: >-
        Soft removal (the rule is marked inactive and kept on record). Idempotent: removing a rule that is already
        removed succeeds. Requires ADMIN or CREATOR.
      operationId: deleteMarketingStopRule
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Requires ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such rule in this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/report:
    get:
      tags:
        - marketing-report
      summary: The marketing report in one call
      description: >-
        Everything a marketing report needs, assembled from the overview (no second set of numbers): health
        headline metrics, acquisition by source (App Store organic search is search first-time downloads minus
        Apple Ads first-time downloads, and search impressions minus Apple Ads impressions, over the days both
        have settled, floored at 0 and flagged `derived`; the row's `derivation` says which days), the in-app
        funnel with its biggest drop (store downloads read Apple Sales Reports when present, with their
        coverage), the daily store impressions and ad spend, the scorecard of every metric that has a target or
        an area, the top 25 Apple Ads keywords by spend joined with in-app outcomes, per-campaign keyword and
        search-term spend coverage, ads, stored benchmarks against the report's own values (judged only against
        a metric with the same definition), the definition of every metric the report mentions, and the
        marketing change log (Work Items on the MARKETING_CHANGES workflow) with the days changes went live.
        Windows are full UTC days ending at each channel's `dataCompleteThrough`. Percent values are fractions
        (0.12 = 12%).
      operationId: getMarketingReport
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: window
          in: query
          required: false
          schema:
            type: string
            default: 28d
          description: 7d or 28d (default).
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingReport"
        "400":
          description: Unknown window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not a member of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/changes/import:
    post:
      tags:
        - marketing-changes
      summary: Import change records into the MARKETING_CHANGES workflow
      description: >-
        Imports an outside change log (up to 500 records per call) as Work Items on the project's
        MARKETING_CHANGES workflow, each created directly in the status its record has (planned -> PLANNED,
        live -> LIVE, reviewed -> REVIEWED, abandoned or stopped -> ABANDONED). Transition gates and the
        required-fields check are skipped, since the record already happened; the type and the verdict must still
        be valid for the workflow. A `reference` record is skipped, not imported. A verdict is mapped, never
        coerced: worked, hurt (did_not_work), no effect (no_effect), expected... (expected) and inconclusive;
        any other verdict refuses that record. When the original wording differs from the mapped option the
        outcome ends with an `Original verdict:` line. A date such as `2026-09-01 (approved ...)` fills liveSince or
        dueOn from its leading date and keeps the full text in the description. Idempotent on (source, record id):
        a record already imported from the same source is reported in `alreadyImported` and left untouched. A
        refused record never blocks the others. Requires ADMIN or CREATOR.
      operationId: importMarketingChanges
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketingChangesImportRequest"
      responses:
        "200":
          description: What was created, skipped, refused or already there
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingChangesImportResponse"
        "400":
          description: No records, more than 500 records, or an invalid source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Requires ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The project has no MARKETING_CHANGES workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/benchmarks:
    get:
      tags:
        - marketing-report
      summary: List the project's industry benchmarks
      operationId: listMarketingBenchmarks
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The benchmarks, ordered by metric reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingBenchmarkListResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not a member of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/benchmarks/{metricRef}:
    put:
      tags:
        - marketing-report
      summary: Set the benchmark for a metric
      description: >-
        Idempotent upsert. `metricRef` is `CHANNEL.metric` (for example `STORE.conversion_rate` or
        `ADS.tap_through_rate`), or `PRODUCT.<key>` for an in-app metric. A benchmark must name its source:
        `sourceName`, an http(s) `sourceUrl` and `checkedOn` (not in the future). Percent values are fractions
        (0.03 = 3%). Optionally say what the benchmark measures with `numerator`, `denominator` and `sourceType`
        (for example total_downloads / unique_impressions on APP_STORE_SEARCH): the report judges a benchmark only
        against a metric with the same definition, and one without a definition reads "definition missing". This is a
        full replace, so a PUT that omits the definition fields clears a stored definition. Requires ADMIN or CREATOR.
      operationId: setMarketingBenchmark
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: metricRef
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketingBenchmarkRequest"
      responses:
        "200":
          description: The stored benchmark
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingBenchmark"
        "400":
          description: >-
            Unknown channel, invalid reference, URL or date, a missing source, or an invalid definition (an unknown
            measure or sourceType, or a denominator or sourceType without a numerator; the message lists the allowed values)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Requires ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - marketing-report
      summary: Remove the benchmark for a metric
      description: "Idempotent: removing a benchmark that does not exist is a no-op. Requires ADMIN or CREATOR."
      operationId: deleteMarketingBenchmark
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: metricRef
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "400":
          description: Invalid reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Requires ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/growth-signals:
    get:
      tags:
        - marketing-growth-signals
      summary: Seasonal moments, ratings, reviews and the competitor watch in one call
      description: >-
        What the growth layer knows, from public data only. `moments` are the workspace's seasonal moments with
        their surfaces: a surface whose due date has passed (UTC today is after `dueOn`) with no linked change
        carries a `warning`, and the moment's `status` is `warning`; a moment within `leadDays` of its date with a
        surface not yet overdue is `upcoming`. `ratings` holds the workspace's own app (`ours`, its App Store
        Connect app) and each watched competitor with the latest and previous weekly snapshot and
        `weeklyGrowth`, the rating-count change between them (null, never 0, until two snapshots of the same storefront exist).
        `reviews` are the most recent public App Store reviews (10 for our app, 5 per competitor).
        `competitorChanges` lists what changed on a competitor's listing between its last two snapshots (only
        competitors that changed). `keywordPresence` gives, per tracked keyword, each app's 1-based App Store
        search position in the latest snapshot; an app absent from the map or null was not among the first 50
        results. `trackedKeywords` says which keywords are looked up: the PRODUCT feed's `aso:<keyword>` rows when it
        has any, else the list set with `PUT .../tracked-keywords`. A value Apple did not return reads null.
      operationId: getGrowthSignals
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The growth signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowthSignals"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not a member of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/moments/{key}:
    put:
      tags:
        - marketing-growth-signals
      summary: Set a seasonal moment and the surfaces that must change for it
      description: >-
        Idempotent full replace of the moment at `key` (lower-case letters, digits, hyphens and underscores, for
        example `thanksgiving-2026`). `surfaces` is the whole list (it may be empty): a surface already on the moment
        (matched by name) keeps its linked change and takes the new `dueOn`, a new name is added, and a name left out
        is removed. An omitted `leadDays` is 21. Requires ADMIN or CREATOR.
      operationId: setMarketingMoment
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketingMomentRequest"
      responses:
        "200":
          description: The stored moment, evaluated as of UTC today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowthMoment"
        "400":
          description: An invalid key, name, date, leadDays or surface list (duplicate names, more than 25 surfaces)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Requires ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/moments/{key}/surfaces/{surfaceId}/change:
