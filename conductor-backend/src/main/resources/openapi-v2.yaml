            (the `documentHash` the client sent when commenting, or the document's hash at that moment if it
            sent none). False when they match, and also false when either hash is unknown (a comment written
            before hashing existed, or a document without inline content): the server then cannot tell, so it
            does not claim the comment is outdated.
        lineStale:
