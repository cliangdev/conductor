        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
        - name: renderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailCreativeRenderRequest"
      responses:
