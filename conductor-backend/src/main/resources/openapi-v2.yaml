        "404":
          description: Work Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - work-item-criteria
      summary: Replace a Work Item's acceptance criteria
      description: >-
        The sent list becomes the item's criteria, in that order. A criterion sent again (same `externalRef`,
        or same text when it has none) keeps its met state and evidence. `kind` defaults to `auto`.
      operationId: replaceWorkItemCriteria
      security:
        - bearerAuth: []
        - apiKeyAuth: []
