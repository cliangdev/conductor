  /projects/{projectId}/marketing/creatives/{creativeId}/slide-text-edits:
    post:
      tags:
        - creatives
      summary: Edit the text on a slideshow's slides and re-render them
      description: >-
        Replaces editable text (see `GET .../revisions` and the text-field registry) on a CAROUSEL Creative that
        has a `slideshowSpec`. Records a PENDING revision holding the candidate spec and dispatches the
        `conductor-creative-render` workflow, whose job (`conductor creative render-slides`) re-composes only the
        changed slides at 9x16 and 4x5 and posts them back to `.../revisions/{revisionId}/complete`; the
        Creative's `slides` change only then. Requires ADMIN or CREATOR. Returns 202 with the revision and its
        run; follow it through `GET .../revisions/{revisionId}` or the Creative's `pendingRevision` /
        `latestRevision`.
        Refused with 404 (unknown Creative / non-member), 422 `slideshowSpecMissing` (no stored spec),
        409 (`version` is stale; a PENDING revision exists, `SLIDE_EDIT_ACTIVE`; a render run is active,
        `RENDER_RUN_ACTIVE`; the render workflow is disabled / its name taken; the Post named by `postId` is not in
        review, `slideTextEditPostNotInReview`; or a reviewer who is not an editor would send other approved or
        scheduled Posts back to review, `slideTextEditNeedsEditor`: body `code` and `ruleId` carry it, `message`
        names the Post), 422 `slideTextEditInvalid`
        (field `edits[i]`: not an editable path, missing, not text, too long, no such slide) or 422
        `slideTextEditNoop` (the edits change nothing) or 422 `slideTextEditUnsupportedRatio` (field `slides`: the
        Creative has a non-empty 1x1 list, or a list that is neither 9:16 nor 4:5; the message says to re-compose
        it locally with `compose_slideshow`).
      operationId: createCreativeSlideTextEdit
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCreativeSlideTextEditRequest"
      responses:
        "202":
          description: The revision was recorded and the render run queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeSlideTextEditResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            Stale `version`, a revision / render run is already active, the Post is not in review, or a reviewer
            must hand this to an editor (body `code` says which; `slideTextEditNeedsEditor` also sets `ruleId`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            `slideshowSpecMissing`, `slideTextEditInvalid`, `slideTextEditNoop` or `slideTextEditUnsupportedRatio`
            (body carries `violations`), or the Creative fails the render validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeValidationProblem"

  /projects/{projectId}/marketing/creatives/{creativeId}/affected-posts:
    get:
      tags:
        - creative-edits
      summary: The Posts a slide-text edit of this Creative would move, and where each one goes
      description: >-
        Every Post that holds a frame of this Creative, with the `outcome` a saved edit would have on it, so the
        editor can say so before saving: `back-to-review` (Approved or Scheduled: unscheduled and sent back to the
        review status with a new round), `new-round` (in review: stays there, a new round, standing approvals stop
        counting), `updated` (before review: just re-pointed at the new slides), `unchanged` (published, or past
        the point of change: left alone). With `?postId=` naming one of them that is in review, that Post reads
        `reviewer-fix` instead of `new-round` (it keeps its round) when the caller is one of that Post's reviewers.
        A Post with any destination already published is `unchanged` however its status reads. `blockedReason` is set
        when the caller, acting as a reviewer of `postId` without being an editor (ADMIN / CREATOR), may not save
        because another Post using the Creative is approved or scheduled and would go back to review (saving
        answers 409 `slideTextEditNeedsEditor` with the same message); null otherwise. Any project member may read.
      operationId: listCreativeAffectedPosts
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
        - name: postId
          in: query
          required: false
          schema:
            type: string
          description: The Post a reviewer is fixing text from (see `CreateCreativeSlideTextEditRequest.postId`).
      responses:
        "200":
          description: The affected Posts, ordered by their number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeAffectedPostsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

