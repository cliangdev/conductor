        - placementKey
        - url
        - width
        - height
        - sizeBytes
        - contentType
        - warnings
      properties:
        id:
          type: string
        placementKey:
          type: string
        platform:
          type: string
          nullable: true
        sequenceIndex:
          type: integer
          nullable: true
        url:
          type: string
          description: Short-lived signed GET URL.
        width:
          type: integer
        height:
          type: integer
        sizeBytes:
          type: integer
          format: int64
        contentType:
          type: string
          description: image/jpeg or image/png for an image frame (a STILL, or a CAROUSEL slide); video/mp4 for a video frame (CLIP, MOTION, or a CAROUSEL's slideshow with its track).
        durationSeconds:
          type: number
          nullable: true
          description: Set for a video frame; null for an image frame.
        hasAudio:
          type: boolean
          nullable: true
          description: Set for a video frame; null for an image frame.
        posterUrl:
          type: string
          nullable: true
          description: Short-lived signed GET URL of a video frame's poster JPEG, if it has one.
        warnings:
          type: array
          items:
            type: string

