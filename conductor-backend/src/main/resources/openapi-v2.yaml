        - createdAt
        - updatedAt
      properties:
        postCount:
          type: integer
          nullable: true
          description: >-
            List response only. How many distinct Work Items (Posts) use a rendered frame of this Creative.
            Null on the single-item reads.
        id:
          type: string
        projectId:
          type: string
        brandKitId:
          type: string
        number:
          type: integer
        variantLetter:
          type: string
        displayId:
          type: string
          description: "number and variantLetter joined, e.g. \"12a\"."
        parentCreativeId:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        state:
          $ref: "#/components/schemas/CreativeState"
        layout:
          type: string
        theme:
          $ref: "#/components/schemas/CreativeTheme"
        photoId:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
          description: Short-lived signed GET URL of the photo, for convenience — the frontend still fetches the photo separately for its metadata.
        focalOverride:
          type: object
          nullable: true
          additionalProperties:
            type: string
        headline:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        caption:
          type: string
          nullable: true
        altText:
          type: string
          nullable: true
        placements:
          type: array
          items:
            type: string
        sequenceKind:
          $ref: "#/components/schemas/SequenceKind"
        sequence:
          type: array
          items:
            $ref: "#/components/schemas/SequenceBeat"
        carouselRatio:
          type: string
          nullable: true
        typeOverrides:
          type: object
          description: Pinned per-placement [fontSize, lineHeight, letterSpacing].
          additionalProperties:
            type: array
            items:
              type: number
        layoutOverrides:
          allOf:
            - $ref: "#/components/schemas/CreativeLayoutOverrides"
          nullable: true
        lockup:
          $ref: "#/components/schemas/CreativeLockup"
        kind:
          $ref: "#/components/schemas/CreativeKind"
        clipMedia:
          type: object
          nullable: true
          description: '{"default": mediaId, "<placementKey>": mediaId, ...} for a CLIP creative.'
          additionalProperties:
            type: string
        slides:
          type: object
          nullable: true
          description: >-
            For a CAROUSEL creative: `{"default": [mediaId...], "4x5": [...], "9x16": [...], "1x1": [...]}`,
            ordered IMAGE media ids. A targeted placement without its own list uses `default`. In a
            draft-spec request an id may be `local:<key>`.
          additionalProperties:
            type: array
            items:
              type: string
        slideAltText:
          type: array
          nullable: true
          description: >-
            For a CAROUSEL creative: index-aligned alt text; entry N describes slide N in every placement.
          items:
            type: string
        motion:
          allOf:
            - $ref: "#/components/schemas/CreativeMotion"
          nullable: true
          description: The animation timeline for a MOTION creative, defaults already applied.
        audio:
          allOf:
            - $ref: "#/components/schemas/CreativeAudio"
          nullable: true
          description: The audio of a MOTION, CAROUSEL or CLIP creative, defaults already applied. Null when none was set.
        slideStyle:
          allOf:
            - $ref: "#/components/schemas/SlideshowStyle"
          nullable: true
          description: >-
            The slide style a CAROUSEL was built with (so a Brand Kit style can later be made from it); null when none was recorded. CAROUSEL only — 422 on any other kind.
        slideshowSpec:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            The editable slideshow spec (`{id, grain?, style?, slides:[...]}`, the shape `compose_slideshow` takes) a
            CAROUSEL's slides were composed from; null when none was stored. Every image field is `media:<id>` of an
            IMAGE in the project's media library.
        pendingRevision:
          allOf:
            - $ref: "#/components/schemas/CreativePendingRevision"
          nullable: true
          description: The slide-text edit being rendered right now, if any. Populated on the single-Creative read only.
        latestRevision:
          allOf:
            - $ref: "#/components/schemas/CreativeLatestRevision"
          nullable: true
          description: The newest recorded revision of the slideshow spec (FAILED ones included, with `error` / `checks`). Populated on the single-Creative read only.
        slideshow:
          allOf:
            - $ref: "#/components/schemas/CreativeSlideshow"
          nullable: true
          description: The slideshow settings of a CAROUSEL creative; `zoom` is always set, `slideDurations` is absent when the defaults (3.0 s, then 2.5 s per slide) apply.
        renderedVideo:
          allOf:
            - $ref: "#/components/schemas/CreativeRenderedVideo"
          nullable: true
          description: >-
            The video/mp4 frame of the latest SUCCEEDED non-preview render, for a CAROUSEL or CLIP; null
            for any other kind or when that render has no video frame. Populated on the single-Creative
            GET and on list reads.
        version:
          type: integer
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        latestRenderId:
          type: string
          nullable: true
          description: Id of the last SUCCEEDED, non-preview render, if any. Present on both list and detail reads.
        latestRenderThumbnailUrl:
          type: string
          nullable: true
          description: Signed GET URL of that render's 4x5 frame, or its first frame if there is no 4x5. Present on both list and detail reads.
        latestRender:
          allOf:
            - $ref: "#/components/schemas/CreativeRenderResponse"
          nullable: true
          description: The full last SUCCEEDED, non-preview render with its frames. Populated only on the single-Creative GET, null on list reads.
        activeExperimentId:
          type: string
          nullable: true
          description: The family's RUNNING hook experiment, if any (COND-24 T5). Same value on every letter in the family.

    CreativeRenderRun:
      type: object
      description: A run of the `conductor-creative-render` system workflow for one Creative.
      required: [workflowId, runId, status]
      properties:
        workflowId:
          type: string
        runId:
          type: string
        status:
          type: string
          description: The workflow run's status (PENDING, PENDING_LOCAL_PICKUP, RUNNING, CANCELLING, SUCCESS, FAILED, CANCELLED, LOCAL_PICKUP_TIMEOUT).
        waitReason:
          type: string
          nullable: true
          description: "`AWAITING_RUNNER` while no daemon has picked the job up yet."
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
          description: Why a FAILED run failed (e.g. DAEMON_PICKUP_TIMEOUT when no daemon claimed it).
        runtime:
          type: string
          enum: [self-hosted, target]
          description: >-
            Where the render runs: `target` is the workspace's designated Cloud Run runtime target (its render
            job was READY at dispatch), `self-hosted` is the workspace's daemon. Runs from before this field
            existed report `self-hosted`.
        targetName:
          type: string
          nullable: true
          description: The runtime target's name when `runtime` is `target`.

    CreateCreativeRequest:
      type: object
      properties:
        brandKitId:
          type: string
          nullable: true
          description: Defaults to the project's default Brand Kit.
        name:
          type: string
          nullable: true
        state:
          $ref: "#/components/schemas/CreativeState"
