          type: string
        sequenceIndex:
          type: integer
          nullable: true

    AttachCreativeTargetUpdate:
      type: object
      required:
        - targetId
        - platform
        - assetIds
      properties:
        targetId:
          type: string
        platform:
          type: string
        assetIds:
          type: array
          items:
            type: string
          description: In publish order — never re-sorted.
        altText:
          type: string
          nullable: true
          description: >-
            The alt text attach set on this Instagram destination's `altText` option (from the Creative's
            alt text). Null when attach set none.
        carouselAs:
          type: string
          nullable: true
          enum:
            - photos
            - video
          description: >-
            For a CAROUSEL Creative with a track: how attach resolved this destination, now stored in its
            `carouselAs` option. Null for any other Creative.
        warning:
          type: string
          nullable: true
          description: Something the person should know about what this destination got (e.g. video wanted but none rendered).

    AttachCreativeTargetSkip:
      type: object
      required:
        - targetId
        - platform
        - reason
      properties:
        targetId:
          type: string
        platform:
          type: string
        reason:
          type: string

    AttachCreativeResponse:
      type: object
      required:
        - assets
        - targetsUpdated
        - targetsSkipped
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/AttachedCreativeAsset"
        targetsUpdated:
          type: array
          items:
            $ref: "#/components/schemas/AttachCreativeTargetUpdate"
        targetsSkipped:
          type: array
          items:
            $ref: "#/components/schemas/AttachCreativeTargetSkip"
        creativeState:
          $ref: "#/components/schemas/CreativeState"
          description: >-
            The Creative's state once the attach is done. A DRAFT Creative that passes the readiness
            checklist is promoted to READY by the attach; any other state is left as it was.
        stateNote:
          type: string
          nullable: true
          description: >-
            Null, or one plain-English sentence saying why the Creative stayed DRAFT (names the first
            blocking readiness issue).

    CreativePerformancePlatform:
      type: object
      description: One platform's slice of one Creative variant's numbers.
      required:
        - platform
        - posts
        - views
      properties:
        platform:
          type: string
        posts:
          type: integer
        views:
          type: integer
          format: int64
        engagementRate:
          type: number
          format: double
          nullable: true

    CreativePerformanceEntry:
      type: object
      description: One Creative variant's attributed performance — published destinations whose media traces back to one of its rendered frames.
      required:
        - creativeId
        - label
        - posts
        - views
        - byPlatform
      properties:
        creativeId:
          type: string
        label:
          type: string
          description: The variant's display id, e.g. "12b".
        headline:
          type: string
          nullable: true
        posts:
          type: integer
          description: Published, attributed destinations with at least one reported snapshot.
        views:
          type: integer
          format: int64
        engagementRate:
          type: number
          format: double
          nullable: true
          description: (likes + comments + shares + saves) / views across every attributed destination; null when views are zero or there is no data.
        avgViewPct:
          type: number
          format: double
          nullable: true
          description: Mean average-view-percentage where a platform reports it (YouTube); null otherwise.
        views72h:
          type: integer
          format: int64
          nullable: true
          description: Summed views at the snapshot nearest at or after each destination's fireTime + 72h; null when no destination has reached that snapshot yet.
        byPlatform:
          type: array
          items:
            $ref: "#/components/schemas/CreativePerformancePlatform"

    CreateCreativeSlideTextEditRequest:
      type: object
      required: [version, edits]
      properties:
        version:
          type: integer
          description: The Creative's `version` the edit was made against (409 when stale).
        edits:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/SlideTextEdit"
        postId:
          type: string
          nullable: true
          description: >-
            Set when the edit is made from a Post's review (a reviewer's "Fix text"). The caller may then be an
            editor or a reviewer of that Post (any project role); the Post must use this Creative (422
            `slideTextEditPostMismatch`) and be in its review status (409 `slideTextEditPostNotInReview`). A reviewer
            of the Post makes the revision `source: REVIEWER`, recorded with the Post and its current review round;
            once applied, that Post stays in the same round (its standing approvals go stale because the media
            changed) while every other Post using the Creative goes back to review as usual. A reviewer who is not
            an editor (ADMIN / CREATOR) may only do this when no OTHER Post using the Creative is approved or
            scheduled (409 `slideTextEditNeedsEditor`, `ruleId` set; ask an editor). A Post with any destination
            already published is left alone.

    SlideTextEdit:
      type: object
      required: [slide, path, text]
      properties:
        slide:
          type: integer
          description: 1-based slide number.
        path:
          type: string
          description: A concrete editable path within the slide, e.g. `texts[0].t`.
        text:
          type: string
          description: The new text (at most 500 characters; may contain newlines).

    CreativeSlideTextEditResponse:
      type: object
      required: [revision]
      properties:
        revision:
          $ref: "#/components/schemas/CreativeRevision"
        renderRun:
          allOf:
            - $ref: "#/components/schemas/CreativeRenderRun"
          nullable: true

    CreativeAffectedPostsResponse:
      type: object
      required: [posts, blockedReason]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/CreativeAffectedPost"
        blockedReason:
          type: string
          nullable: true
          description: >-
            Why this caller may not save the edit (a reviewer of `postId`, not an editor, while other Posts using the
            Creative are approved or scheduled), or null. The message `slideTextEditNeedsEditor` answers with.

    CreativeAffectedPost:
      type: object
      required: [workItemId, displayId, title, status, statusLabel, outcome]
      properties:
        workItemId:
          type: string
        displayId:
          type: string
          description: e.g. `RE-101`.
        title:
          type: string
        status:
          type: string
        statusLabel:
          type: string
        outcome:
          type: string
          enum: [back-to-review, new-round, updated, unchanged, reviewer-fix]

    CreativeRenderAvailability:
      type: object
      required: [runtime]
      properties:
        runtime:
          type: string
          enum: [target, self-hosted]
        targetName:
          type: string
          nullable: true
          description: The runtime target's name when `runtime` is `target`, else null.
        daemonOnline:
          type: boolean
          nullable: true
          description: Whether a self-hosted daemon is connected; null because Conductor does not track it.

    PostContentChangeListResponse:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/PostContentChange"

    PostContentChange:
      type: object
      required: [id, creativeId, revisionId, revisionNo, source, textDiff, reviewRoundBefore, reviewRoundAfter, createdAt]
      properties:
        id:
          type: string
        creativeId:
          type: string
        creativeDisplayId:
          type: string
          nullable: true
          description: e.g. `158a`.
        revisionId:
          type: string
        revisionNo:
          type: integer
        source:
          type: string
          enum: [EDITOR, REVIEWER, MCP]
        actorUserId:
          type: string
          nullable: true
        actorName:
          type: string
          nullable: true
        fromStatus:
          type: string
          nullable: true
        toStatus:
          type: string
          nullable: true
        reviewRoundBefore:
          type: integer
        reviewRoundAfter:
          type: integer
        textDiff:
          type: array
          items:
            $ref: "#/components/schemas/CreativeRevisionTextChange"
        createdAt:
          type: string
          format: date-time

    SlideshowCheck:
      type: object
      required: [slide, ratio, rule, severity, message]
      properties:
        slide:
          type: integer
          description: 1-based slide number (the real slide, not its position in the changed set).
        ratio:
          type: string
          enum: ["9x16", "4x5"]
        rule:
          type: string
        severity:
          type: string
          enum: [error, warning]
        message:
          type: string

    CompleteCreativeRevisionRequest:
      type: object
      required: [slideMedia]
      properties:
        slideMedia:
          type: object
          description: 'Ratio ("9x16" / "4x5") -> 1-based slide number (string) -> the uploaded media id.'
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        checks:
          type: array
          items:
            $ref: "#/components/schemas/SlideshowCheck"

    FailCreativeRevisionRequest:
      type: object
      required: [error]
      properties:
        error:
          type: string
        checks:
          type: array
          items:
            $ref: "#/components/schemas/SlideshowCheck"

    CreativeRevisionDetail:
      type: object
      description: >-
        A `CreativeRevision` (its fields at the top level) plus what the render job needs to do its work.
      allOf:
        - $ref: "#/components/schemas/CreativeRevision"
        - $ref: "#/components/schemas/CreativeRevisionDetailExtras"

    CreativeRevisionDetailExtras:
      type: object
      required: [spec, changedSlides, renderLists]
      properties:
        spec:
          type: object
          additionalProperties: true
          description: The candidate slideshow spec (image fields `media:<id>`).
        changedSlides:
          type: array
          items:
            type: integer
          description: The distinct 1-based slides whose text changed, ascending.
        renderLists:
          type: array
          items:
            $ref: "#/components/schemas/CreativeRevisionRenderList"
          description: >-
            The Creative's stored slide lists the job re-renders, each with the ratio it is made at. The backend
            decides this (a `default` list is classified by the shape of its images, within 2%); the job must not
            infer it. `slideMedia` on `.../complete` is keyed by the distinct ratios here and each ratio's media
            replaces the changed slides of every list with that ratio. Empty when the Creative cannot be
            text-edited (see `slideTextEditUnsupportedRatio`).
        altTextFlags:
          type: array
          nullable: true
          items:
            type: integer
          description: 1-based slides whose alt text quoted replaced text; null until applied.
        slides:
          type: object
          nullable: true
          description: The Creative's current `slides` map (ratio / `default` -> media ids).
          additionalProperties:
            type: array
            items:
              type: string
        slideStyle:
          allOf:
            - $ref: "#/components/schemas/SlideshowStyle"
          nullable: true
          description: The Creative's current slide style, if any.
        media:
          type: array
          items:
            $ref: "#/components/schemas/CreativePhotoResponse"
          description: >-
            The Media the render job reads, each with a signed download `url` and its provenance (`source`,
            `licence`, `aiGenerated`): the images the changed slides of `spec` use, and the entries of the
            Creative's `slides` lists at the changed positions (the slides being replaced). A run token cannot
            read `GET .../photos/{photoId}`, so the job takes everything it reads from here.

    CreativeRevisionRenderList:
      type: object
      required: [list, ratio]
      properties:
        list:
          type: string
          enum: ["9x16", "4x5", default]
          description: The key of the list in the Creative's `slides` map.
        ratio:
          type: string
          enum: ["9x16", "4x5"]
          description: The ratio its slides are re-rendered at.

    CreativePendingRevision:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [PENDING]
        createdAt:
          type: string
          format: date-time
        workflowRunId:
          type: string
          nullable: true

    CreativeLatestRevision:
      type: object
      required: [id, revisionNo, status, source, createdAt]
      properties:
        id:
          type: string
        revisionNo:
          type: integer
        status:
          type: string
          enum: [PENDING, APPLIED, FAILED]
        source:
          type: string
          enum: [EDITOR, REVIEWER, MCP, IMPORT, COMMIT]
        error:
          type: string
          nullable: true
        checks:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true
        createdAt:
          type: string
          format: date-time

    CreativeRevisionListResponse:
      type: object
      required:
        - revisions
      properties:
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/CreativeRevision"
          description: Newest first, at most 50.

    CreativeRevision:
      type: object
      required:
        - id
        - revisionNo
        - creativeVersion
        - status
        - source
        - textDiff
        - createdAt
      properties:
        id:
          type: string
        revisionNo:
          type: integer
          description: 1.. per Creative.
        creativeVersion:
          type: integer
          description: The Creative's `version` after this revision applied.
        status:
          type: string
          enum: [PENDING, APPLIED, FAILED]
        source:
          type: string
          enum: [EDITOR, REVIEWER, MCP, IMPORT, COMMIT]
        textDiff:
          type: array
          description: The editable text this revision changed (empty for IMPORT).
          items:
            $ref: "#/components/schemas/CreativeRevisionTextChange"
        checks:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true
        authorUserId:
          type: string
          nullable: true
        authorName:
          type: string
          nullable: true
          description: The author's display name; set on `GET .../revisions` items (one batched lookup), null elsewhere.
        postId:
          type: string
          nullable: true
        reviewRound:
          type: integer
          nullable: true
        renderId:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        baseVersion:
          type: integer
          nullable: true
          description: For an edit, the Creative `version` it was made against.
        workflowRunId:
          type: string
          nullable: true
          description: For an edit, the render workflow run that is (or was) producing the slides.
        createdAt:
          type: string
          format: date-time
        appliedAt:
          type: string
          format: date-time
          nullable: true

    CreativeRevisionTextChange:
      type: object
      required:
        - slide
        - path
      properties:
        slide:
          type: integer
          description: 1-based slide number.
        path:
          type: string
          description: A path within the slide, e.g. `texts[0].t` or `rows[1].items[2]`.
        old:
          type: string
          nullable: true
        new:
          type: string
          nullable: true

    CreativePerformanceResponse:
      type: object
      required:
        - creativeId
        - family
      properties:
        creativeId:
          type: string
          description: The Creative id this performance read was requested for (echoed back).
        family:
          type: array
          items:
            $ref: "#/components/schemas/CreativePerformanceEntry"
          description: Every lettered variant of this Creative's family, oldest letter first.

    CreativeExperimentMetric:
      type: string
      enum:
        - views
        - engagement_rate
        - avg_view_pct
      description: >-
        The metric requested at creation. The decision itself prefers avg_view_pct whenever every variant
        reports it, regardless of this value — see CreativeExperimentService.

    CreativeExperimentState:
      type: string
      enum:
        - RUNNING
        - DECIDED
        - INCONCLUSIVE

    CreateCreativeExperimentRequest:
      type: object
      required:
        - creativeId
      properties:
        creativeId:
          type: string
          description: Any Creative in the family (a lettered variant or the root) — resolved to the family's root automatically.
        metric:
          $ref: "#/components/schemas/CreativeExperimentMetric"
        windowHours:
          type: integer
          description: Defaults to 72.

    CreativeExperimentResponse:
      type: object
      required:
        - id
        - projectId
        - parentCreativeId
        - metric
        - windowHours
        - state
        - createdAt
      properties:
        id:
          type: string
        projectId:
          type: string
        parentCreativeId:
          type: string
          description: The family's root Creative id (variant letter "a").
        metric:
          $ref: "#/components/schemas/CreativeExperimentMetric"
        windowHours:
          type: integer
        state:
          $ref: "#/components/schemas/CreativeExperimentState"
        winnerCreativeId:
          type: string
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        summary:
          type: object
          nullable: true
          additionalProperties: true
          description: Per-variant numbers used to decide (or why a decision could not be made yet). Shape documented in docs/creatives.md.
        winnerLineConfirmedAt:
          type: string
          format: date-time
          nullable: true
        winnerLineConfirmedBy:
          type: string
          nullable: true
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
