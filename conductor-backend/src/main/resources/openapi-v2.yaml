            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            The draft fails a rule `createCreative` enforces (same shape), a `local:<key>` reference that
            is not declared in `localMedia` or is the wrong kind for its field, a malformed local key, or
            a CLIP kind (a CAROUSEL is accepted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeValidationProblem"

