      tags:
        - creatives
      summary: Upload one rendered frame
      description: >-
        The local render job PUTs each placement's frame here as it finishes, one call per frame. Placement
        frames are JPEG (Instagram feed images and TikTok photo posts both refuse PNG); the `sheet`
        contact sheet for a preview-only render stays PNG. Upserts the frame row on `(placementKey, index)`;
        `platform` is derived from the placement registry. Only accepted while the render is RUNNING — 409
        once it has SUCCEEDED or FAILED. Requires ADMIN or CREATOR.
      operationId: putCreativeRenderFrame
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
        - name: renderId
          in: path
          required: true
          schema:
            type: string
        - name: placementKey
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: query
          required: false
          description: Sequence position for a story/carousel frame; omitted for a single-frame placement.
          schema:
            type: integer
        - name: width
          in: query
          required: true
          schema:
            type: integer
        - name: height
          in: query
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        description: >-
          Raw image bytes, at most 20 MB. A placement frame is JPEG; the `sheet` contact sheet is PNG.
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Frame stored
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Render not found, does not belong to this Creative, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The render is no longer RUNNING (already SUCCEEDED or FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Content-Type is not image/jpeg or image/png
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/renders/{renderId}/complete:
    post:
      tags:
        - creatives
      summary: Mark a render SUCCEEDED
      operationId: completeCreativeRender
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
        - name: renderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteCreativeRenderRequest"
      responses:
        "200":
          description: The render, now SUCCEEDED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeRenderResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Render not found, does not belong to this Creative, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The render is no longer RUNNING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/renders/{renderId}/fail:
    post:
      tags:
        - creatives
      summary: Mark a render FAILED
      description: Deletes every frame already written for this render (AC-P0-3.2) — a failed render leaves nothing behind for attach to find.
      operationId: failCreativeRender
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
        - name: renderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailCreativeRenderRequest"
      responses:
        "200":
          description: The render, now FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeRenderResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Render not found, does not belong to this Creative, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The render is no longer RUNNING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/attach:
    post:
      tags:
        - creatives
      summary: Attach a render's frames to a Post
      description: >-
        Copies every non-`sheet` frame of a SUCCEEDED render into the Post's own assets, then — for
        targets with `custom_media = false` only — sets each destination's media by placement (`9x16` to
        TikTok and Instagram Reels, `4x5` to Instagram feed, `1x1` to Facebook, `story` to story-format
        targets; sequences in index order, never sorted) through the same target media-selection path a
        person uses, so the approval gate and bundle hash treat it exactly like any other customisation.
        A target with `custom_media = true` is reported in `targetsSkipped` and left untouched. Requires
        ADMIN or CREATOR, and the Work Item must be a Post in this project the caller can edit.
      operationId: attachCreative
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachCreativeRequest"
      responses:
        "200":
          description: What was attached and how each target's media selection changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachCreativeResponse"
        "400":
          description: The Work Item is not a Post (its Workflow does not declare publishing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found; render not found or does not belong to this Creative; Work Item not found or not in this project; or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The render is not SUCCEEDED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/experiments:
    get:
      tags:
        - creatives
      summary: List hook experiments (COND-24 T5)
      operationId: listCreativeExperiments
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: query
          required: false
          schema:
            type: string
          description: Restrict to one Creative family — any lettered variant or the root, resolved automatically.
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CreativeExperimentState"
      responses:
        "200":
          description: Experiments, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreativeExperimentResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: creativeId given but not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - creatives
      summary: Start a hook experiment
      description: >-
        Opens one RUNNING experiment on a Creative family. The family (found from creativeId, any
        lettered variant or the root) must have at least two variants, and may have at most one RUNNING
        experiment at a time. Call getCreativeExperiment (or getCreative, which carries
        activeExperimentId) after to verify.
      operationId: createCreativeExperiment
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCreativeExperimentRequest"
      responses:
        "201":
          description: The new RUNNING experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeExperimentResponse"
        "400":
          description: The family has fewer than two variants, or an unknown metric was given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The family already has a RUNNING experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/experiments/{experimentId}:
    get:
      tags:
        - creatives
      summary: Read one hook experiment
      operationId: getCreativeExperiment
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: experimentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeExperimentResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Experiment not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/experiments/{experimentId}/decide:
    post:
      tags:
        - creatives
      summary: Decide a hook experiment
      description: >-
        Settles a RUNNING experiment once every variant in the family has at least one published,
        attributed destination with a snapshot at or after fireTime + windowHours: the winner is the
        variant with the highest avg_view_pct when every variant reports it, else the experiment's own
        metric (default views). An exact tie among the leaders settles INCONCLUSIVE immediately. While any
        variant is still missing window data this is a safe no-op that leaves the experiment RUNNING and
        returns it unchanged — unless the last outstanding variant's deadline is more than seven days
        past, in which case the experiment gives up and settles INCONCLUSIVE rather than wait forever.
        Calling this on an already-DECIDED or already-INCONCLUSIVE experiment returns it unchanged.
      operationId: decideCreativeExperiment
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: experimentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The experiment after the decision attempt (state may be unchanged)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeExperimentResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Experiment not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/experiments/{experimentId}/confirm-winner:
    post:
      tags:
        - creatives
      summary: Confirm a decided experiment's winning headline into the Brand Kit
      description: >-
        Appends the winning variant's headline to its family's Brand Kit approved_lines (deduplicated) and
        stamps who confirmed it and when. Requires ADMIN or CREATOR — this is the one human action that
        lets a decided winner influence future brand copy; it is never automatic, and decide never calls
        it. Refused with 400 when the experiment has no decided winner. Idempotent: calling it again on an
        already-confirmed experiment is a no-op that never appends the line twice.
      operationId: confirmCreativeExperimentWinner
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: experimentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The experiment with winnerLineConfirmedAt/By set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeExperimentResponse"
        "400":
          description: The experiment has no decided winner (not DECIDED, or DECIDED with no winner)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Experiment not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: http
      scheme: bearer
      description: API key authentication (Bearer token)

  schemas:
    WorkItemResponse:
      type: object
      required:
        - id
        - projectId
        - type
        - title
        - status
        - createdBy
        - createdAt
        - updatedAt
        - sequenceNumber
        - displayId
      properties:
        id:
          type: string
        projectId:
          type: string
        type:
          type: string
          description: Work Item type — a Workflow-defined string (e.g. PRD).
        title:
          type: string
        description:
          type: string
        status:
          type: string
          description: Current status — a Workflow-defined status id (e.g. DRAFT).
        statusLabel:
          type: string
          readOnly: true
          description: >-
            The status's human display label from the item's resolved Workflow statechart (e.g. "In
            Review" for IN_REVIEW), or a humanized form of the id when the statechart sets none.
        workflow:
          type: string
          description: The bound Workflow definition id (slug, e.g. ENGINEERING).
        createdBy:
          type: string
          nullable: true
          description: >-
            Creating user's id. Null when a machine actor (e.g. an addressable agent) created this
            item — createdByLabel carries its identity instead. Exactly one of the two is set.
        createdByLabel:
          type: string
          description: Machine actor's display label (e.g. "Agent (ceo)"), set only when createdBy is null.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sequenceNumber:
          type: integer
        displayId:
          type: string
          description: Human-readable ID (e.g. "COND-42")
        unresolvedCommentCount:
          type: integer
        assignee:
          $ref: "#/components/schemas/WorkItemAssignee"
        scheduledFor:
          type: string
          format: date-time
          nullable: true
          description: >-
            When this Work Item is due, as an ISO-8601 date-time. Workflow-agnostic — any Workflow may put
            an item on a clock. Null when the item is not scheduled.
        scheduleTimezone:
          type: string
          nullable: true
          description: >-
            IANA zone id the schedule was authored in (e.g. America/New_York), retained alongside the
            absolute instant so a local-wall-clock reading survives DST. Null when unscheduled.
        publishOnApproval:
          type: boolean
          description: >-
            Publish as soon as approved. The Post needs no fire time before its scheduled status; entering
            it stamps scheduledFor with the earliest time every destination accepts.
        tags:
          type: array
          description: >-
            Freeform labels on this Work Item, for grouping work across type, status and Workflow.
            Stored lower-cased, so "Autumn" and "autumn" are one tag rather than two that look identical
            in a filter list. Empty until something is tagged.
          items:
            type: string
        externalLinks:
          type: array
          description: >-
            Where this Work Item ended up outside Conductor: every link Asset recorded on it, oldest first.
            Workflow-agnostic by construction — it is whatever the item's own `asset_types` allow, so a
            Post carries the live posts it published to and an Issue carries its pull request. Empty until
            something is recorded.


            It is on the list response, not only the detail one, because a link nobody can reach without
            opening the item is a link nobody finds: the calendar and list surfaces are where a human looks
            to ask "did that go out, and where is it?".
          items:
            $ref: "#/components/schemas/WorkItemExternalLink"

    WorkItemExternalLink:
      type: object
      required:
        - url
        - type
      properties:
        url:
          type: string
          description: The Asset's ref — the address of the thing itself.
        type:
          type: string
          description: >-
            The Asset type, one of the bound Workflow's declared `asset_types` (e.g. `instagram_post`,
            `github_pr`). A client uses it to choose an icon or a label; it is not an enum here because the
            set is Workflow-defined.
        label:
          type: string
          nullable: true
          description: Human-readable name captured when the link was recorded (e.g. the account it went to).

    WorkItemAssignee:
      type: object
      required:
        - userId
        - name
      properties:
        userId:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
          nullable: true

    CreateWorkItemRequest:
      type: object
      required:
        - type
        - title
      properties:
        workflow:
          type: string
          description: >-
            Required (enforced by the controller, not schema-`required`, so the 400 carries actionable
            guidance rather than a generic "must not be null"). The lifecycle Workflow definition id (slug,
            e.g. ENGINEERING) that governs this Work Item — the canonical v2 surface never silently defaults it;
            discover options via `GET /projects/{projectId}/workflows?lifecycle=true`. (The legacy v1 `/issues`
            create keeps an ENGINEERING default for back-compat.)
        type:
          type: string
          description: >-
            Work Item type — a Workflow-defined string (e.g. PRD), validated against the
            chosen Workflow's allowed types.
        title:
          type: string
          maxLength: 255
        description:
          type: string
        tags:
          type: array
          description: >-
            Freeform labels for this Work Item. Sent whole — the stored set becomes exactly this list, so
            omit the field to leave existing tags alone and send an empty array to clear them. Values are
            trimmed, lower-cased and de-duplicated.
          items:
            type: string

    PatchWorkItemRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
        status:
          type: string
          description: >-
            Target status — a Workflow-defined status id (e.g. IN_REVIEW). The move is
            validated against the bound Workflow and the Review gate.
        assigneeId:
          type: string
          nullable: true
          description: User ID to assign to this Work Item, or null to unassign
        scheduledFor:
          type: string
          format: date-time
          nullable: true
          description: >-
            When this Work Item is due, as an ISO-8601 date-time. Omit to leave the existing schedule
            unchanged.
        scheduleTimezone:
          type: string
          nullable: true
          description: >-
            IANA zone id the schedule is authored in (e.g. America/New_York). Omit to leave unchanged, or
            send an empty string to clear it. An unrecognized zone is rejected with a 400.
        publishOnApproval:
          type: boolean
          nullable: true
          description: >-
            Publish as soon as approved (see WorkItemResponse.publishOnApproval). Omit to leave unchanged.
        tags:
          type: array
          description: >-
            Freeform labels for this Work Item. Sent whole — the stored set becomes exactly this list, so
            omit the field to leave existing tags alone and send an empty array to clear them. Values are
            trimmed, lower-cased and de-duplicated.
          items:
            type: string

    AvailableTransition:
      type: object
      required:
        - toStatus
        - label
      properties:
        toStatus:
          type: string
          description: The status this transition moves the Work Item to.
        label:
          type: string
          description: Human-readable action label (e.g. "Submit for review").
        requiresReview:
          type: boolean
          description: Whether taking this transition will open a Review gate.

    AvailableTransitionsResponse:
      type: object
      required:
        - workflow
        - currentStatus
        - transitions
      properties:
        workflow:
          type: string
          description: The Work Item's Workflow definition id (slug).
        currentStatus:
          type: string
        noun:
          type: string
          description: The Workflow's display noun (e.g. Issue, Post).
        transitions:
          type: array
          items:
            $ref: "#/components/schemas/AvailableTransition"

    AssignReviewerRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          description: User ID to assign as reviewer

    AssignReviewerResponse:
      type: object
      required:
        - workItemId
        - userId
        - assignedAt
      properties:
        workItemId:
          type: string
        userId:
          type: string
        assignedAt:
          type: string
          format: date-time

    ReviewerResponse:
      type: object
      required:
        - userId
        - assignedAt
      properties:
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        avatarUrl:
          type: string
        reviewVerdict:
          type: string

    DocumentResponse:
      type: object
      required:
        - id
        - workItemId
        - filename
        - contentType
        - createdAt
      properties:
        id:
          type: string
        workItemId:
          type: string
        filename:
          type: string
        contentType:
          type: string
        content:
          type: string
          nullable: true
          description: Inline content for text/markdown and text/plain; null for binary types
        storagePath:
          type: string
        storageUrl:
          type: string
          description: GCP V4 signed URL (valid for configured expiry, default 15 minutes)
        storageUrlExpiresAt:
          type: string
          format: date-time
          description: ISO timestamp when the signed URL expires
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateDocumentRequest:
      type: object
      required:
        - filename
      properties:
        filename:
          type: string
        content:
          type: string
        contentType:
          type: string

    UpsertDocumentByFilenameRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
        contentType:
          type: string
          default: text/markdown

    CreateCommentRequest:
      type: object
      required:
        - documentId
        - content
        - lineNumber
      properties:
        documentId:
          type: string
        content:
          type: string
        lineNumber:
          type: integer

    CommentResponse:
      type: object
      required:
        - id
        - documentId
        - authorId
        - content
        - createdAt
      properties:
        id:
          type: string
        documentId:
          type: string
        authorId:
          type: string
        content:
          type: string
        lineNumber:
          type: integer
        quotedText:
          type: string
        lineStale:
