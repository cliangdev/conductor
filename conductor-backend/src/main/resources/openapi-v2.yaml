    WorkItemPriority:
      type: string
      description: Priority, P0 (most urgent) to P3. Absent when the item has none.
      enum: [P0, P1, P2, P3]

    WorkItemProgress:
      type: object
      description: >-
        How far the branch under a Work Item has got. Counts leaf items only (an epic is its children);
        done means terminal in the item's own Workflow. Present on a single read, and on the list with
        `withProgress=true`, for an item that has children.
      required:
        - total
        - done
        - percent
        - criteriaTotal
        - criteriaMet
      properties:
        total:
          type: integer
        done:
          type: integer
        percent:
          type: integer
          description: done / total as a whole percentage; 0 when there is nothing to count.
        criteriaTotal:
          type: integer
        criteriaMet:
          type: integer

    WorkItemTreeNode:
      type: object
      description: A Work Item in a tree read, with its sub-items nested beneath it.
      required:
        - id
        - displayId
        - title
        - type
        - status
        - terminal
        - childCount
        - children
      properties:
        id:
          type: string
        displayId:
          type: string
        title:
          type: string
        type:
          type: string
        workflow:
          type: string
        status:
          type: string
        statusLabel:
          type: string
        terminal:
          type: boolean
          description: Whether the status is terminal in the item's own Workflow.
        priority:
          $ref: "#/components/schemas/WorkItemPriority"
        parentWorkItemId:
          type: string
          nullable: true
        milestoneId:
          type: string
          nullable: true
        assignee:
          $ref: "#/components/schemas/WorkItemAssignee"
        childCount:
          type: integer
        criteriaTotal:
          type: integer
