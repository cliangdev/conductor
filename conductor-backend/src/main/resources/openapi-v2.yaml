            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
        - name: surfaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkMomentChangeRequest"
      responses:
        "200":
          description: The moment with the change linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowthMoment"
        "400":
          description: The Work Item is not a MARKETING_CHANGES Work Item in this project
          content:
            application/json:
