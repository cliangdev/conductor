          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTikTokConsentRequest"
      responses:
        "201":
          description: The request, with the link to give the person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TikTokConsentRequestResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is a project key or run token, which has no user to bind the request to
