  /projects/{projectId}/work-items/{workItemId}/agent-sessions/{sessionKey}:
    put:
      tags:
        - work-item-agent-sessions
      summary: Report what an agent session is doing
      description: >-
        Idempotent upsert by `sessionKey`: the first report creates the session, later ones refresh its
        activity, note and heartbeat. DONE and ERRORED close it; WORKING or NEEDS_INPUT reopens a closed one.
        Never changes the item's assignee.
      operationId: upsertWorkItemAgentSession
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: workItemId, in: path, required: true, schema: {type: string}}
        - {name: sessionKey, in: path, required: true, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertAgentSessionRequest"
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemAgentSessionResponse"
        "400":
          description: Unknown mode or activity, or a step run that is not this item's
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
