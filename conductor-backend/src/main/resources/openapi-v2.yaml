  /projects/{projectId}/marketing/creatives/{creativeId}/renders/{renderId}/fail:
    post:
      tags:
        - creatives
      summary: Mark a render FAILED
      description: Deletes every frame already written for this render (AC-P0-3.2) — a failed render leaves nothing behind for attach to find.
      operationId: failCreativeRender
      security:
        - bearerAuth: []
        - apiKeyAuth: []
