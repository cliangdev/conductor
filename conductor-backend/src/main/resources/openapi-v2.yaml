          type: string
          description: Human-readable account name (Page name, @handle, channel title, creator nickname).
        lane:
          type: string
          description: >-
            NATIVE hands the post and its schedule to the platform's own scheduler; APP_MANAGED keeps
            it here until its fire time and Conductor publishes it; MANUAL publishes nothing at all — at
            fire time the target waits for a human to post it and record the live URL. A MANUAL option is
            offered for every platform whether or not the project has connected one, and is the only
            destination available to a project with no social integration.
          enum:
            - NATIVE
            - APP_MANAGED
            - MANUAL
        healthStatus:
          type: string
          nullable: true
          description: >-
            Last credential verdict on the underlying connection — HEALTHY or UNHEALTHY, or null when
            it has never been checked. An UNHEALTHY target should be offered disabled, not hidden.
        healthMessage:
          type: string
          nullable: true
          description: The platform's own explanation of an UNHEALTHY verdict, in a human sentence; null while healthy.
        healthDetail:
          type: string
          nullable: true
          readOnly: true
          description: >-
            The platform's full error behind healthMessage — JSON body and all — for support and
            debugging. Null while healthy.
        privacyLevelOptions:
          type: array
          nullable: true
          items:
            type: string
          description: >-
            The privacy levels this one creator may publish under, cached on the connection when the
            account was connected (e.g. PUBLIC_TO_EVERYONE, MUTUAL_FOLLOW_FRIENDS, FOLLOWER_OF_CREATOR,
            SELF_ONLY). TikTok reports a different set per creator — a private account is offered fewer
            than a public one — so this is the only source for a target's allowed `privacyLevel`, and it
            is what `PublishOptionsValidator` checks the chosen level against at the approval gate.
            Null for every non-TikTok platform, and null for a TikTok connection made before the levels
            were cached: that account has to be reconnected, not guessed for. (TIK-3.)
        commentDisabled:
          type: boolean
          nullable: true
          description: >-
            TikTok only: the creator has switched comments off, as of the last creator_info read (the
            consent page refreshes it). Null for other platforms and when never read.
        duetDisabled:
          type: boolean
          nullable: true
          description: As `commentDisabled`, for duets.
        stitchDisabled:
          type: boolean
          nullable: true
          description: As `commentDisabled`, for stitches.
        maxVideoPostDurationSec:
          type: integer
          nullable: true
          description: >-
            TikTok only, the creator's video length cap in seconds; null when unknown.
        creatorNickname:
          type: string
          nullable: true
          description: >-
            The handle the creator would recognise, for the consent step's "you are posting to @…".
            TikTok's audit requirement is that the creator sees which account a post is going to, so
            this is the account's own name rather than the connection's label. Null for every
            non-TikTok platform, and null when the connection never cached it. (TIK-3.)
        optionKeys:
          type: array
          items:
            type: string
          description: >-
            The `publishOptions` keys a target on this platform accepts (e.g. `privacyLevel`,
            `disableComment` on TikTok), in the order the platform's publish action declares them. Empty
            for a platform with no per-target options. A key outside this list is dropped at dispatch, so
            a client should read this rather than guess from the platform name.
        formats:
          type: array
          description: The post formats this platform publishes, e.g. `[feed, reel, story]`. Every platform lists `feed`.
          items:
            $ref: "#/components/schemas/PostFormat"

    PublishMetricSnapshot:
      type: object
      description: One reading of a destination's counters. A null counter is one the platform does not report.
      required:
        - observedAt
        - unavailable
      properties:
        observedAt:
          type: string
          format: date-time
        views:
          type: integer
          format: int64
          nullable: true
        likes:
          type: integer
          format: int64
          nullable: true
        comments:
          type: integer
          format: int64
          nullable: true
        shares:
          type: integer
          format: int64
          nullable: true
        saves:
          type: integer
          format: int64
          nullable: true
        reach:
          type: integer
          format: int64
          nullable: true
        impressions:
          type: integer
          format: int64
          nullable: true
        watchTimeSeconds:
          type: integer
          format: int64
          nullable: true
        unavailable:
          type: boolean
          description: The platform no longer returns this post (deleted there, or the account lost it).

    PublishMetricsTarget:
      type: object
      required:
        - targetId
        - platform
        - latest
        - series
      properties:
        targetId:
          type: string
        platform:
          type: string
        accountLabel:
          type: string
          nullable: true
        permalink:
          type: string
          nullable: true
        latest:
          $ref: "#/components/schemas/PublishMetricSnapshot"
        series:
          type: array
          items:
            $ref: "#/components/schemas/PublishMetricSnapshot"

    PublishMetricsResponse:
      type: object
      required:
        - workItemId
        - targets
      properties:
        workItemId:
          type: string
        targets:
          type: array
          items:
            $ref: "#/components/schemas/PublishMetricsTarget"
        totals:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PublishMetricSnapshot"
          description: The sum of every available destination's latest snapshot; null when nothing has been read yet.

    TopPostEntry:
      type: object
      required:
        - workItemId
        - targetId
        - platform
        - metric
        - value
        - observedAt
      properties:
        workItemId:
          type: string
        displayId:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        targetId:
          type: string
        platform:
          type: string
        accountLabel:
          type: string
          nullable: true
        permalink:
          type: string
          nullable: true
        metric:
          type: string
        value:
          type: integer
          format: int64
        observedAt:
          type: string
          format: date-time

    MarketingOverviewResponse:
      type: object
      required: [window, funnel, channels]
      properties:
        window:
          $ref: "#/components/schemas/OverviewWindow"
        funnel:
          type: array
          items:
            $ref: "#/components/schemas/OverviewFunnelStage"
        channels:
          type: array
          items:
            $ref: "#/components/schemas/OverviewChannel"
        funnelBasis:
          type: string
          enum: [EVENT, COHORT]
          description: COHORT when the in-app stages count people who first opened in the window and followed them to now (each stage carries its own `basis`); EVENT otherwise.

    OverviewWindow:
      type: object
      description: >-
        Inclusive UTC day ranges. Each channel's window ends at its dataCompleteThrough (at most yesterday) and
        the previous window is the same length immediately before `from`. On the overview this is the overall
        range: the earliest channel `from` to the latest channel `to`.
      required: [from, previousFrom, previousTo]
      properties:
        from: {type: string, format: date}
        to:
          type: string
          format: date
          nullable: true
          description: Overview - the latest dataCompleteThrough among channels that have data; null when none has. Channel detail - the channel's dataCompleteThrough.
        previousFrom: {type: string, format: date}
        previousTo: {type: string, format: date}
        dataCompleteThroughMin:
          type: string
          format: date
          nullable: true
          description: The earliest dataCompleteThrough among channels that have data (equal to `to` on a channel); null when none has.

    OverviewFunnelStage:
      type: object
      required: [key, label, source, available, path]
      properties:
        key: {type: string}
        label: {type: string}
        value: {type: number, format: double, nullable: true}
        previous: {type: number, format: double, nullable: true}
        change: {type: number, format: double, nullable: true}
        source:
          type: string
          description: The channel (WEB, SEARCH, SOCIAL, STORE, ADS, PRODUCT) the stage reads from.
        available: {type: boolean}
        unavailableReason: {type: string, nullable: true}
        path:
          type: string
          enum: [WEB, STORE, ADS, PRODUCT]
          description: The parallel path the stage belongs to; stages convert only within a path, except that the first PRODUCT stage converts from store downloads.
        conversionFromKey:
          type: string
          nullable: true
          description: Key of the previous stage on the same path that this stage converts from; null at a path start and when either stage is unavailable.
        dataCompleteThrough:
          type: string
          format: date
          nullable: true
          description: The last day included in the stage's value (its channel's dataCompleteThrough); null when the stage has no channel yet.
        basis:
          type: string
          enum: [EVENT, COHORT]
          description: EVENT counts what happened in the window. COHORT (in-app stages a product backend declares so) counts the people who first opened in the window and reached the stage by now, so a later stage can still grow as the cohort matures.

    OverviewChannel:
      type: object
      required: [channel, label, status, connections, metrics, dataCompleteThrough]
      properties:
        dataCompleteThrough:
          type: string
          format: date
          description: The channel's window ends here, the latest day with non-provisional data across its connections (never later than yesterday; yesterday when there is none).
        channel: {type: string, description: "WEB, SEARCH, SOCIAL, STORE, ADS or PRODUCT."}
        label: {type: string}
        status:
          type: string
          enum: [LIVE, STALE, NOT_CONNECTED, COMING_SOON, MISMATCH]
          description: MISMATCH means the product metrics feed's reference figure (store downloads, ad spend) disagrees with this channel's own connector by more than 1%; see `mismatch`. STALE also covers a feed that keeps running while this channel's data ends more than 7 days before the freshest channel's; such a channel no longer holds the funnel window back and its funnel stages are unavailable ("No Web data since Sep 10").
        lastFetchedAt: {type: string, format: date-time, nullable: true}
        targetsEditable:
          type: boolean
          description: False when the channel's targets are owned by its connection (PRODUCT), so a target cannot be set or cleared here.
        mismatch:
          allOf:
            - $ref: "#/components/schemas/OverviewMismatch"
          nullable: true
        connections:
          type: array
          items:
            $ref: "#/components/schemas/OverviewConnection"
        connectHint:
          allOf:
            - $ref: "#/components/schemas/OverviewConnectHint"
          nullable: true
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/OverviewMetric"

    OverviewMismatch:
      type: object
      description: Set when status is MISMATCH. Both figures cover the same settled days, `from` to `to`.
      required: [metric, label, referenceValue, channelValue, gapPct, from, to]
      properties:
        channelSource: {type: string, description: "Name of the connection(s) behind this channel's own figure, e.g. App Store Connect."}
        referenceSource: {type: string, description: "Name of the product metrics connection(s) that reported the reference figure."}
        metric: {type: string, description: "The channel metric compared, e.g. downloads or spend."}
        label: {type: string}
        referenceValue: {type: number, format: double, description: "What the product metrics feed reports."}
        channelValue: {type: number, format: double, description: "What this channel's own connector reports."}
        gapPct: {type: number, format: double, description: "Absolute gap as a fraction of the larger figure (0.05 is 5%)."}
        from: {type: string, format: date}
        to: {type: string, format: date}

    OverviewConnection:
      type: object
      required: [id, connectorId, name, status]
      properties:
        id: {type: string}
        connectorId: {type: string}
        name: {type: string}
        status:
          type: string
          enum: [LIVE, STALE]

    OverviewConnectHint:
      type: object
      required: [connectorId, connectors]
      properties:
        connectorId:
          type: string
          description: Deprecated; the first connector not yet connected. Use `connectors`.
        connectors:
          type: array
          description: Every connector that can feed the channel, with its display name.
          items:
            $ref: "#/components/schemas/OverviewConnectorRef"

    OverviewConnectorRef:
      type: object
      required: [connectorId, name]
      properties:
        connectorId: {type: string}
        name: {type: string}

    OverviewMetric:
      type: object
      required: [metric, label, unit, goodDirection, noise, provisionalDays, series]
      properties:
        metric: {type: string}
        label: {type: string}
        unit:
          type: string
          enum: [COUNT, CURRENCY, PERCENT, POSITION, RATING]
        goodDirection:
          type: string
          enum: [UP, DOWN]
          description: Which way a move reads as good news (DOWN for cost per install or search position).
        value: {type: number, format: double, nullable: true}
        previous: {type: number, format: double, nullable: true}
        change: {type: number, format: double, nullable: true}
        changePct: {type: number, format: double, nullable: true}
        asOf:
          type: string
          format: date
          nullable: true
          description: For a level metric (followers etc.), the day of the snapshot `value` reads, the latest at or before today whatever the flow window; `previous` is the snapshot one window earlier. Null for flow metrics and when no snapshot exists.
        historyStartsOn:
          type: string
          format: date
          nullable: true
          description: When `previous` is null, the first day this metric has data (history starts here); null otherwise.
        noise:
          type: boolean
          description: True when the change is within normal variation (it did not clear the change detector's gates).
        insufficientData:
          type: boolean
          description: True when the feed reported a sample size under 20 for the window; `noise` is then also true.
        aggregation:
          type: string
          description: "How daily values combine over a window: SUM (a window total, so a target is a total and does not belong on a per-day chart), LEVEL (a stock, latest value) or DERIVED (a ratio of two metrics)."
        funnelOrder:
          type: integer
          nullable: true
          description: PRODUCT only - the metric's place among the in-app funnel stages (1 first); null for a metric that is not a stage.
        status:
          type: string
          enum: [ON_TRACK, WATCH, OFF_TRACK, TOO_EARLY, NO_TARGET]
          description: Where the value stands against its target (Conductor-owned or declared by the product feed). TOO_EARLY - no value, or a rate resting on fewer than 20 observations. NO_TARGET - no target. ON_TRACK - target met. WATCH - missed by no more than the target's watchBandPct (default 10%). OFF_TRACK - missed by more. A count or currency total is compared with its target prorated to the requested window.
        missPct:
          type: number
          format: double
          nullable: true
          description: How far short of the (prorated) target the value is, as a fraction of the target (0.05 is 5%); 0 when the target is met. Null with NO_TARGET, TOO_EARLY or a zero target.
        sampleSize:
          type: integer
          format: int64
          nullable: true
          description: Observations behind the value when known (the feed's own count, or a ratio's denominator); null otherwise.
        area:
          type: string
          nullable: true
          enum: [ACQUISITION, ACTIVATION, RETENTION, REVENUE]
          description: PRODUCT only - the part of the growth scorecard the metric belongs to, when the feed says.
        description:
          type: string
          nullable: true
          description: PRODUCT only - what the metric counts, in the feed's words (for example "Installs that started a free trial").
        headline:
          type: integer
          nullable: true
          description: PRODUCT only - the metric's priority among the feed's headline metrics (1 first); null when it is not one.
        basis:
          type: string
          enum: [EVENT, COHORT]
          description: PRODUCT only - COHORT when each day's value counts the people who first opened that day, followed to now.
        provisionalDays:
          type: integer
          description: Number of provisional days after the channel's dataCompleteThrough that appear at the end of the series. Values and changes exclude them.
        target:
          allOf:
            - $ref: "#/components/schemas/MarketingTarget"
          nullable: true
        series:
          type: array
          items:
            $ref: "#/components/schemas/OverviewSeriesPoint"

    OverviewSeriesPoint:
      type: object
      required: [day, provisional]
      properties:
        day: {type: string, format: date}
        value: {type: number, format: double, nullable: true}
        provisional:
          type: boolean
          description: True for days the source may still restate, including every day after the channel's dataCompleteThrough. Draw them differently; they are not in the totals.

    MarketingBenchmark:
      type: object
      required: [metricRef, value, sourceName, sourceUrl, checkedOn, updatedAt]
      properties:
        metricRef: {type: string, description: "CHANNEL.metric, e.g. STORE.conversion_rate, or PRODUCT.<key>."}
        label: {type: string, nullable: true}
        value: {type: number, format: double}
        rangeText: {type: string, nullable: true, description: "The published range the value summarises, e.g. \"2-4%\"."}
        segment: {type: string, nullable: true, description: "What the benchmark covers, e.g. \"Health and fitness, US\"."}
        sourceName: {type: string}
        sourceUrl: {type: string}
        checkedOn: {type: string, format: date}
        notes: {type: string, nullable: true}
        updatedAt: {type: string, format: date-time}

    MarketingBenchmarkRequest:
      type: object
      required: [value, sourceName, sourceUrl, checkedOn]
      properties:
        label: {type: string, maxLength: 200}
        value: {type: number, format: double}
        rangeText: {type: string, maxLength: 200}
        segment: {type: string, maxLength: 200}
        sourceName: {type: string, maxLength: 200}
        sourceUrl: {type: string, maxLength: 2000}
        checkedOn: {type: string, format: date, description: "The day the source was read; not in the future."}
        notes: {type: string, maxLength: 2000}

    MarketingBenchmarkListResponse:
      type: object
      required: [benchmarks]
      properties:
        benchmarks:
          type: array
          items:
            $ref: "#/components/schemas/MarketingBenchmark"

    MarketingReport:
      type: object
      required: [window, generatedAt, sources, headline, acquisition, funnel, daily, scorecard, keywords, ads, benchmarks, changes]
      properties:
        window:
          $ref: "#/components/schemas/ReportWindow"
        generatedAt: {type: string, format: date-time}
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ReportSource"
        headline:
          type: array
          items:
            $ref: "#/components/schemas/ReportMetric"
        acquisition:
          type: array
          items:
            $ref: "#/components/schemas/ReportAcquisitionRow"
        funnel:
          $ref: "#/components/schemas/ReportFunnel"
        daily:
          type: array
          items:
            $ref: "#/components/schemas/ReportDay"
        scorecard:
          type: array
          items:
            $ref: "#/components/schemas/ReportScorecardRow"
        keywords:
          type: array
          items:
            $ref: "#/components/schemas/ReportKeyword"
        ads:
          type: array
          items:
            $ref: "#/components/schemas/ReportAd"
        benchmarks:
          type: array
          items:
            $ref: "#/components/schemas/ReportBenchmark"
        changes:
          $ref: "#/components/schemas/ReportChanges"

    ReportWindow:
      type: object
      required: [from]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date, nullable: true, description: "Null when no channel has data."}

    ReportSource:
      type: object
      required: [channel, status]
      properties:
        channel: {type: string, description: "WEB, SEARCH, SOCIAL, STORE, ADS or PRODUCT."}
        connector: {type: string, nullable: true, description: "The connected connector id(s); null when none is connected."}
        status: {type: string, description: "LIVE, STALE, MISMATCH, NOT_CONNECTED or COMING_SOON."}
        dataCompleteThrough: {type: string, format: date, nullable: true}
        lastFetchedAt: {type: string, format: date-time, nullable: true}

    ReportMetric:
      type: object
      required: [channel, key, label, unit, goodDirection, status]
      properties:
        channel: {type: string}
        key: {type: string}
        label: {type: string}
        unit: {type: string, description: "COUNT, CURRENCY, PERCENT, POSITION or RATING."}
        value: {type: number, format: double, nullable: true}
        previous: {type: number, format: double, nullable: true}
        target: {type: number, format: double, nullable: true}
        status: {type: string, description: "ON_TRACK, WATCH, OFF_TRACK, TOO_EARLY or NO_TARGET."}
        missPct: {type: number, format: double, nullable: true}
        sampleSize: {type: integer, format: int64, nullable: true}
        goodDirection: {type: string, enum: [UP, DOWN]}

    ReportAcquisitionRow:
      type: object
      required: [key, label, status, derived]
      properties:
        key: {type: string}
        label: {type: string}
        status: {type: string, description: "The status of the channel the row reads from."}
        reach: {type: number, format: double, nullable: true}
        reachLabel: {type: string, nullable: true}
        actions: {type: number, format: double, nullable: true}
        actionsLabel: {type: string, nullable: true}
        installs: {type: number, format: double, nullable: true}
        cost: {type: number, format: double, nullable: true}
        derived: {type: boolean, description: "True when the installs are computed from two sources rather than read."}
        note: {type: string, nullable: true}

    ReportFunnel:
      type: object
      required: [basis, stages]
      properties:
        basis: {type: string, enum: [EVENT, COHORT]}
        stages:
          type: array
          items:
            $ref: "#/components/schemas/ReportFunnelStage"

    ReportFunnelStage:
      type: object
      required: [key, label, biggestDrop]
      properties:
        key: {type: string}
        label: {type: string}
        value: {type: number, format: double, nullable: true}
        dropPct: {type: number, format: double, nullable: true, description: "Share lost since the previous stage (0.25 = 25% fewer)."}
        biggestDrop: {type: boolean}

    ReportDay:
      type: object
      required: [day, provisional]
      properties:
        day: {type: string, format: date}
        storeImpressions: {type: number, format: double, nullable: true}
        adSpend: {type: number, format: double, nullable: true}
        provisional: {type: boolean}

    ReportScorecardRow:
      type: object
      required: [key, label, status, source]
      properties:
        key: {type: string}
        label: {type: string}
        area: {type: string, nullable: true, description: "ACQUISITION, ACTIVATION, RETENTION or REVENUE."}
        value: {type: number, format: double, nullable: true}
        target: {type: number, format: double, nullable: true}
        targetWindow: {type: string, nullable: true, description: "The period a count or currency target is stated for, e.g. \"28d\"."}
        status: {type: string}
        missPct: {type: number, format: double, nullable: true}
        basis: {type: string, nullable: true, description: "What the number counts, or \"2 of 30\" for a ratio with no description."}
        sampleSize: {type: integer, format: int64, nullable: true}
        source:
          $ref: "#/components/schemas/ReportScorecardSource"

    ReportScorecardSource:
      type: object
      required: [channel]
      properties:
        channel: {type: string}
        connector: {type: string, nullable: true}

    ReportKeyword:
      type: object
      required: [keywordId, text, judgeable]
      properties:
        keywordId: {type: string}
        text: {type: string}
        adGroup: {type: string, nullable: true}
        campaign: {type: string, nullable: true}
        status: {type: string, nullable: true}
        matchType: {type: string, nullable: true}
        bid: {type: number, format: double, nullable: true}
        impressions: {type: number, format: double, nullable: true}
        taps: {type: number, format: double, nullable: true}
        tapRate: {type: number, format: double, nullable: true}
        installs: {type: number, format: double, nullable: true}
        installRate: {type: number, format: double, nullable: true}
        spend: {type: number, format: double, nullable: true}
        cpi: {type: number, format: double, nullable: true}
        trials: {type: number, format: double, nullable: true, description: "In-app trial starts attributed to the keyword; null when the product feed has none."}
        activations: {type: number, format: double, nullable: true}
        judgeable: {type: boolean, description: "True with at least 20 taps; fewer is too early to judge."}

    ReportAd:
      type: object
      required: [adId, name]
      properties:
        adGroup: {type: string, nullable: true}
        adId: {type: string}
        name: {type: string}
        creativeType: {type: string, nullable: true}
        productPageId: {type: string, nullable: true}
        status: {type: string, nullable: true}
        impressions: {type: number, format: double, nullable: true}
        taps: {type: number, format: double, nullable: true}
        installs: {type: number, format: double, nullable: true}
        installRate: {type: number, format: double, nullable: true}
        spend: {type: number, format: double, nullable: true}
        cpi: {type: number, format: double, nullable: true}

    ReportBenchmark:
      type: object
      required: [metricRef, value, judged, stale, benchmark, sourceName, sourceUrl, checkedOn]
      properties:
        metricRef: {type: string}
        label: {type: string, nullable: true}
        value: {type: number, format: double, nullable: true, description: "The report's own value for the metric; null when there is none."}
        benchmark: {type: number, format: double}
        rangeText: {type: string, nullable: true}
        segment: {type: string, nullable: true}
        sourceName: {type: string}
        sourceUrl: {type: string}
        checkedOn: {type: string, format: date}
        ratio: {type: number, format: double, nullable: true, description: "value / benchmark."}
        goodDirection: {type: string, enum: [UP, DOWN], nullable: true}
        sampleSize: {type: integer, format: int64, nullable: true}
        judged: {type: boolean, description: "False when there is no value, or a rate rests on fewer than 20 observations."}
        stale: {type: boolean, description: "True when checkedOn is more than 90 days old."}

    ReportChanges:
      type: object
      required: [open, dueForReview, reviewedInWindow]
      properties:
        open:
          type: array
          description: Changes still PLANNED or LIVE.
          items:
            $ref: "#/components/schemas/ReportChange"
        dueForReview:
          type: array
          description: LIVE changes whose review date has passed.
          items:
            $ref: "#/components/schemas/ReportChange"
        reviewedInWindow:
          type: array
          description: Changes moved to REVIEWED during the report window.
          items:
            $ref: "#/components/schemas/ReportChange"

    ReportChange:
      type: object
      required: [id, displayId, title, type, status]
      properties:
        id: {type: string}
        displayId: {type: string}
        title: {type: string}
        type: {type: string}
        status: {type: string}
        assignee:
          allOf:
            - $ref: "#/components/schemas/WorkItemAssignee"
          nullable: true
        dueOn: {type: string, format: date, nullable: true}
        fields:
          type: object
          additionalProperties: true
          nullable: true

    MarketingTarget:
      type: object
      required: [value, direction]
      properties:
        value: {type: number, format: double}
        direction:
          type: string
          enum: [UP, DOWN]
        readOnly:
          type: boolean
          description: True when a connector feed owns the target (cannot be set or cleared here).
        window:
          type: string
          nullable: true
          description: The period a count or currency total target is stated for, e.g. "28d"; the status prorates it to the requested window. Null means the target is compared as stated, never prorated.
        effectiveValue:
          type: number
          format: double
          nullable: true
          description: The target the value was judged against in the requested window - value prorated from window when the target declares one, otherwise value. Present on metric output.
        watchBandPct:
          type: number
          format: double
          nullable: true
          description: How close a miss counts as WATCH rather than OFF_TRACK, in percent of the target. Null means 10.
        source:
          type: string
          nullable: true
          description: Where a read-only target is set, e.g. "Set in Product metrics".

    MarketingTargetRequest:
      type: object
      required: [target]
      properties:
        target:
          type: number
          format: double
          minimum: 0
        direction:
          type: string
          enum: [UP, DOWN]

    MarketingChannelDetailResponse:
      type: object
      required: [window, channel, dimensions]
      properties:
        window:
          $ref: "#/components/schemas/OverviewWindow"
        channel:
          $ref: "#/components/schemas/OverviewChannel"
        dimensions:
          type: array
          items:
            $ref: "#/components/schemas/OverviewDimension"
        topPosts:
          type: array
          description: SOCIAL only; the top 5 posts of the window by engagement rate.
          items:
            $ref: "#/components/schemas/InsightsPost"

    OverviewDimension:
      type: object
      required: [key, label, columns, rows]
      properties:
        key: {type: string, description: "referrers, queries, campaigns or platforms."}
        label: {type: string}
        columns:
          type: array
          items:
            $ref: "#/components/schemas/OverviewDimensionColumn"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/OverviewDimensionRow"

    OverviewDimensionColumn:
      type: object
      required: [key, label, unit]
      properties:
        key: {type: string}
        label: {type: string}
        unit:
          type: string
          enum: [COUNT, CURRENCY, PERCENT, POSITION, RATING]

    OverviewDimensionRow:
      type: object
      required: [key, label, values]
      properties:
        key: {type: string}
        label: {type: string}
        values:
          type: array
          description: One entry per column, in column order.
          items: {type: number, format: double, nullable: true}
        state:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            The member's current state as its connector reports it (for an Apple Ads keyword: status, bidAmount,
            matchType, adGroupName, campaignName, campaignStatus); absent when the connector reports none.

    MarketingInsightsResponse:
      type: object
      required:
        - window
        - totals
        - byPlatform
        - byFormat
        - byHour
        - byWeekday
        - topPosts
        - bottomPosts
        - movers
        - coverage
        - creatives
      properties:
        window:
          $ref: "#/components/schemas/InsightsWindow"
        totals:
          $ref: "#/components/schemas/InsightsGroup"
        byPlatform:
          type: array
          items:
            $ref: "#/components/schemas/InsightsGroup"
          description: One row per platform, key = platform id, sorted by engagement rate descending (nulls last).
        byFormat:
          type: array
          items:
            $ref: "#/components/schemas/InsightsGroup"
          description: One row per format (FEED, REEL, STORY, …), key = format.
        byHour:
          type: array
          items:
            $ref: "#/components/schemas/InsightsGroup"
          description: One row per UTC hour of the destination's fire time that has at least one post, key = "0".."23", sorted by hour.
        byWeekday:
          type: array
          items:
            $ref: "#/components/schemas/InsightsGroup"
          description: One row per UTC weekday of the fire time, key = MONDAY..SUNDAY, sorted Monday first.
        topPosts:
          type: array
          items:
            $ref: "#/components/schemas/InsightsPost"
          description: Up to ten destinations with the highest engagement rate (views ≥ 1), best first.
        bottomPosts:
          type: array
          items:
            $ref: "#/components/schemas/InsightsPost"
          description: Up to five destinations with the lowest engagement rate (views ≥ 1), worst first. Empty when fewer than ten destinations reported.
        movers:
          type: array
          items:
            $ref: "#/components/schemas/InsightsMover"
          description: How this window's totals compare with the window of the same length immediately before it.
        coverage:
          $ref: "#/components/schemas/InsightsCoverage"
        creatives:
          type: array
          items:
            $ref: "#/components/schemas/CreativePerformanceEntry"
          description: >-
            Up to ten Creative variants (COND-24 T5) with the highest views among destinations published
            through them that fired inside the window, best first. Empty on a workspace that has not
            attached any Creative to a Post yet.

    InsightsWindow:
      type: object
      required:
        - from
        - to
        - days
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        days:
          type: integer

    InsightsGroup:
      type: object
      description: The counters of one grouping of destinations, summed over each destination's latest snapshot.
      required:
        - key
        - posts
        - views
        - likes
        - comments
        - shares
        - saves
      properties:
        key:
          type: string
          description: The group's identity — a platform, a format, an hour, a weekday, or "all" for totals.
        label:
          type: string
          nullable: true
          description: A display name where the key is not one (e.g. "Instagram").
        posts:
          type: integer
          description: Destinations in the group with at least one snapshot.
        views:
          type: integer
          format: int64
        likes:
          type: integer
          format: int64
        comments:
          type: integer
          format: int64
        shares:
          type: integer
          format: int64
        saves:
          type: integer
          format: int64
        engagementRate:
          type: number
          format: double
          nullable: true
          description: (likes + comments + shares + saves) / views; null when views are zero.
        medianViews:
          type: integer
          format: int64
          nullable: true
          description: The median of the group's latest per-destination views; null when no destination has views.
        avgViewPct:
          type: number
          format: double
          nullable: true
          description: Mean of the destinations' average-view-percentage where a platform reports it (YouTube); null otherwise.

    InsightsPost:
      type: object
      required:
        - workItemId
        - targetId
        - platform
        - views
        - observedAt
      properties:
        workItemId:
          type: string
        displayId:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        workflowSlug:
          type: string
          nullable: true
          description: The Work Item's Workflow slug (e.g. "posts"), so a client can build the Post page route without guessing the Area's Workflow.
        captionExcerpt:
          type: string
          nullable: true
          description: The first 140 characters of the caption that went to this destination.
        targetId:
          type: string
        platform:
          type: string
        format:
          type: string
          nullable: true
        accountLabel:
          type: string
          nullable: true
        permalink:
          type: string
          nullable: true
        firedAt:
          type: string
          format: date-time
          nullable: true
        views:
          type: integer
          format: int64
        likes:
          type: integer
          format: int64
          nullable: true
        comments:
          type: integer
          format: int64
          nullable: true
        shares:
          type: integer
          format: int64
          nullable: true
        saves:
          type: integer
          format: int64
          nullable: true
        engagementRate:
          type: number
          format: double
          nullable: true
        avgViewPct:
          type: number
          format: double
          nullable: true
        observedAt:
          type: string
          format: date-time

    InsightsMover:
      type: object
      required:
        - metric
        - current
        - previous
      properties:
        metric:
          type: string
          description: posts, views, likes, comments, shares, saves or engagementRate.
        current:
          type: number
          format: double
        previous:
          type: number
          format: double
        deltaPct:
          type: number
          format: double
          nullable: true
          description: (current − previous) / previous × 100; null when previous is zero.

    InsightsCoverage:
      type: object
      required:
        - platforms
        - notes
      properties:
        platforms:
          type: array
          items:
            type: string
          description: Platforms with at least one snapshot in the window.
        notes:
          type: array
          items:
            type: string
          description: Plain sentences about what is not being counted — a platform that reports no views, a connection that needs reconnecting for insights.

    PublishPreflightResponse:
      type: object
      description: The approval gate's verdict on a Work Item, read without attempting a transition.
      required:
        - publishing
        - ready
        - blockers
        - warnings
        - consent
        - review
      properties:
        publishing:
          type: boolean
          description: Whether the Work Item's Workflow publishes at all. False means nothing else applies.
        ready:
          type: boolean
          description: True when no blocker stands — the next gate transition would be accepted by the validators.
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/PublishPreflightFinding"
          description: >-
            What the gate would refuse the item for, in the order a 422 lists them. Empty when ready.
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PublishPreflightFinding"
          description: Advisories a platform will act on without refusing (a Short, a cropped carousel).
        nextTransition:
          $ref: "#/components/schemas/PublishPreflightTransition"
        consent:
          $ref: "#/components/schemas/PublishPreflightConsent"
        review:
          $ref: "#/components/schemas/PublishPreflightReview"
        earliestFireTime:
          type: string
          format: date-time
          nullable: true
          description: >-
            The soonest `scheduledFor` the current destinations accept — "as soon as possible". Now plus the
            longest lead any selected platform demands (ten minutes for Facebook's native scheduler, a
            minute for an app-managed destination, nothing for a manual one). Null off a publishing Workflow.

    PublishPreflightFinding:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: >-
            Stable, machine-readable rule name — NO_FIRE_TIME, NO_TIMEZONE, UNKNOWN_TIMEZONE,
            FIRE_TIME_TOO_SOON, NO_TARGETS, NO_MEDIA, TARGET_MEDIA_MISSING, MEDIA_FORMAT, MEDIA_COMPOSITION,
            COPY_TOO_LONG, PUBLISH_OPTIONS, CONSENT_NEVER_GIVEN, CONSENT_SUPERSEDED; warnings carry
            MEDIA_ADVISORY. Messages may be reworded; codes may not.
        message:
          type: string
          description: The human sentence, exactly as a refused transition's 422 would carry it.
        targetId:
          type: string
          nullable: true
          description: The publish target the finding is about, or null for a Post-level finding.

    PublishPreflightTransition:
      type: object
      description: >-
        The move a ready item takes next: the first gate edge out of the current status, else the edge that
        hands it to review (Draft → In Review). Absent when the current status has neither (already
        scheduled, or published).
      required:
        - to
        - requiresReview
      properties:
        to:
          type: string
        label:
          type: string
          nullable: true
        requiresReview:
          type: boolean

    PublishPreflightConsent:
      type: object
      required:
        - required
        - verdict
      properties:
        required:
          type: boolean
          description: Whether a selected destination needs the creator's recorded consent.
        verdict:
          type: string
          enum:
            - NOT_REQUIRED
            - VALID
            - NEVER_GIVEN
            - SUPERSEDED

    PublishPreflightReview:
      type: object
      required:
        - gated
        - assignedReviewers
        - satisfied
      properties:
        gated:
          type: boolean
          description: Whether the Workflow has a review gate at all. A Workflow without one publishes on schedule entry.
        assignedReviewers:
          type: integer
          description: How many reviewers are assigned to this item. Zero on a gated Workflow means nobody has been asked.
        satisfied:
          type: boolean
          description: Whether an approval currently opens the gate — bound to the open review round and the bundle as it stands.
        reviewerRole:
          type: string
          nullable: true
          description: The project role the gate asks its approval from, or null when any approval satisfies it.

    PublishTargetResponse:
      type: object
      description: One publish target selected on a Work Item (a persisted post_publish_target row).
      required:
        - id
        - workItemId
        - platform
        - lane
        - state
        - effectiveAssetIds
      properties:
        id:
          type: string
        workItemId:
          type: string
        platform:
          type: string
          enum:
            - facebook
            - instagram
            - youtube
            - tiktok
        connectorId:
          type: string
          nullable: true
          description: Null on the MANUAL lane, which publishes through no connector.
        connectionId:
          type: string
          nullable: true
          description: >-
            The connected account this target publishes through. Null on the MANUAL lane, which reaches its
            platform through a human rather than a credential.
        label:
          type: string
          nullable: true
          description: Account label captured at selection time (post_publish_target.platform_account_label).
        lane:
          type: string
          description: >-
            How this target reaches its platform. NATIVE hands the post to the platform's own scheduler;
            APP_MANAGED means Conductor publishes it at fire time; MANUAL means nobody automates it — a
            human posts it and records the result, and no credential is used.
          enum:
            - NATIVE
            - APP_MANAGED
            - MANUAL
        state:
          type: string
          description: >-
            One of PENDING, HANDED_OFF, PUBLISHING, AWAITING_MANUAL, PUBLISHED, FAILED, REVOKED.
            AWAITING_MANUAL is a target waiting on a person: a MANUAL one whose fire time has passed, or an
            automated one the platform handed back (TikTok's pre-audit inbox upload, explained in
            errorMessage). Either is finished with the manual-publish call.
        stateLabel:
          type: string
          readOnly: true
          description: >-
            The human label for `state` (Waiting, Handed off, Publishing, Post it now, Published, Failed,
            Taken back), for direct display — the same words the UI's own status pill uses.
        platformPostId:
          type: string
          nullable: true
          description: The platform's id for the created post, once it exists.
        permalink:
          type: string
          nullable: true
          description: >-
            Link to the live post on the platform, captured when the target reaches PUBLISHED. This is the
            per-target evidence the Post detail renders; null until the publish is confirmed.
        errorMessage:
          type: string
          nullable: true
          description: >-
            The first human sentence of the platform's failure, with any JSON body, trace id and HTTP
            status prefix stripped. Null unless the target is FAILED or AWAITING_MANUAL.
        errorDetail:
          type: string
          nullable: true
          readOnly: true
          description: >-
            The platform's full failure text behind errorMessage — JSON body and all — for support and
            debugging. Null unless the target is FAILED or AWAITING_MANUAL.
        fireTime:
          type: string
          format: date-time
          nullable: true
          description: >-
            When this target publishes. Copied from the Work Item's scheduledFor and re-stamped whenever the
            Post re-enters its scheduled status, so it is the authoritative time for this target.
        publishOptions:
          $ref: "#/components/schemas/PublishOptions"
        captionOverride:
          type: string
          nullable: true
          description: >-
            This destination's own copy, or null when it uses the Post's caption. See `effectiveCaption`
            for what actually goes out.
        format:
          $ref: "#/components/schemas/PostFormat"
        assetIds:
          type: array
          nullable: true
          description: >-
            This destination's own ordered media selection, or **null when it inherits the Post's whole
            set**. Null and a list matching the Post's assets are different states: the first keeps
            following the Post as files change, the second does not.
          items:
            type: string
        effectiveAssetIds:
          type: array
          description: >-
            The media that actually goes out here, in order — this target's own selection, or the Post's
            set when it inherits. Empty when there is none to send, which blocks approval. A client
            rendering a preview should read this rather than re-deriving the inherit rule.
          items:
            type: string
        effectiveCaption:
          type: string
          nullable: true
          description: The copy that actually goes out here — `captionOverride` if set, else the Post's caption.

    RetryPublishResponse:
      type: object
      description: >-
        The result of re-firing a Post's failed publish targets: the Post's status afterwards and
        every one of its targets, so a client can render the new state without a second request.
      required:
        - workItemId
        - status
        - retriedCount
        - targets
      properties:
        workItemId:
          type: string
        status:
          type: string
          description: >-
            The Post's Workflow-defined status after the retry — its scheduled status when anything
            was re-fired, otherwise whatever it already was.
        retriedCount:
          type: integer
          format: int32
          description: How many targets were reset to PENDING. Zero when nothing had failed.
        targets:
          type: array
          description: Every publish target on the Post after the retry, failed or not.
          items:
            $ref: "#/components/schemas/PublishTargetResponse"

    PublishTargetSelection:
      type: object
      required:
        - platform
      properties:
        platform:
          type: string
          enum:
            - facebook
            - instagram
            - youtube
            - tiktok
        connectionId:
          type: string
          nullable: true
          description: >-
            The connected account to publish through. Omit it (or send null) to select this platform's
            MANUAL destination instead — the one a human publishes by hand. There is exactly one manual
            destination per platform, so the platform alone identifies it.
        format:
          $ref: "#/components/schemas/PostFormat"
        publishOptions:
          $ref: "#/components/schemas/PublishOptions"
        captionOverride:
          type: string
          nullable: true
          description: >-
            Copy for this destination alone, replacing the Post's caption when it goes out here. Omit it or
            send null to use the Post's caption. Set-replace like every other field on this schema: a client
            that re-sends a target without this field clears an override it previously set.
        assetIds:
          type: array
          nullable: true
          description: >-
            An ordered subset of the Post's uploaded media that this destination publishes. Omit it or send
            an empty array to inherit the Post's whole media set in Post order — which is the default, and
            keeps following the Post as files are added and removed.


            Order is content, not presentation: Instagram crops every carousel item to the first item's
            aspect ratio, and TikTok takes a photo post's cover from the first image. Each id must be a file
            asset of this Work Item. Set-replace, like `captionOverride`.
          items:
            type: string

    PostFormat:
      type: string
      description: >-
        The shape a destination publishes in. `feed` is the platform's ordinary post — an image, a video, a
        carousel, a photo set — and the default. `reel` is short vertical video on Facebook or Instagram.
        `story` is a single image or clip on Facebook or Instagram that disappears after 24 hours, takes
        no caption, and is fired by Conductor at its time because the platforms cannot schedule one. Each
        option row lists the formats its platform offers under `formats`; selecting one it does not offer
        is refused.
      enum:
        - feed
        - reel
        - story
      default: feed

    PublishOptions:
      type: object
      additionalProperties: true
      description: >-
        How the post goes out on this one platform — a per-platform bag of option keys, read against the
        target's own `platform` and nothing else. Omitted or null means nothing has been chosen, which is
        not the same as "the defaults are fine": a TikTok target with no `privacyLevel` blocks approval
        rather than publishing to the creator alone. (TIK-1.)


        TikTok keys: `privacyLevel` (string — one of the connection's cached privacyLevelOptions, e.g.
        PUBLIC_TO_EVERYONE, MUTUAL_FOLLOW_FRIENDS, FOLLOWER_OF_CREATOR, SELF_ONLY), `disableComment`,
        `disableDuet`, `disableStitch` (booleans), `brandContentToggle` (boolean — paid partnership; TikTok
        refuses it combined with SELF_ONLY) and `brandOrganicToggle` (boolean — the creator's own brand).


        Conductor-only key (TikTok, Instagram, Facebook, YouTube; never sent to a platform): `carouselAs`
        (`photos` | `video`) — for a target whose media comes from a CAROUSEL Creative with a music
        track, whether it publishes the slide images or the companion 9x16 slideshow video. Attaching the
        Creative writes the resolved value (`video` for TikTok, YouTube and Reel-format targets, `photos`
        for Instagram and Facebook feed); changing it re-selects that target's media. Ignored, with a
        warning, when the target's media is not from such a Creative.
      example:
        privacyLevel: PUBLIC_TO_EVERYONE
        disableComment: false
        brandContentToggle: true

    PublishConsentResponse:
      type: object
      description: >-
        The creator's posting consent on a Post, and whether it still describes the Post. (MKT-1.)
      required:
        - workItemId
        - required
        - valid
        - verdict
      properties:
        workItemId:
          type: string
        required:
          type: boolean
          description: >-
            True when the Post publishes to at least one `tiktok` account. A Facebook-only or
            YouTube-only Post is never gated on consent.
        valid:
          type: boolean
          description: >-
            True only when consent was given and still covers the Post's current accounts, publish
            options and uploaded media. False on a Post that needs no consent at all.
        verdict:
          type: string
          description: >-
            The same fact in one word, for a client that needs to say what is wrong.
            `NOT_REQUIRED` — no TikTok target. `VALID` — consent stands. `NEVER_GIVEN` — nobody has
            consented (or it was withdrawn). `SUPERSEDED` — consent was given, then the accounts,
            options or media changed under it and it has to be given again.
          enum:
            - NOT_REQUIRED
            - VALID
            - NEVER_GIVEN
            - SUPERSEDED
        consentedAt:
          type: string
          format: date-time
          nullable: true
          description: When consent was last given; null when it never was, or was withdrawn.
        consentedByUserId:
          type: string
          nullable: true
          description: The member who consented; null when consent has never been given.
        consentedByName:
          type: string
          nullable: true
          description: That member's display name, so the record reads as a name rather than an id.
        etag:
          type: string
          nullable: true
          description: >-
            The strong ETag of the Post's consent subject, quotes included — the value to send as
            `If-Match` on `PUT .../tiktok-consent`. Populated on every `publish-consent` read and write
            and on the `tiktok-consent` write.

    RecordPublishConsentRequest:
      type: object
      required:
        - consented
      properties:
        consented:
          type: boolean
          description: >-
            True to consent to this Post going out to its current accounts under their current publish
            options, with its current media. False to withdraw consent.

    RecordTikTokConsentRequest:
      type: object
      description: >-
        What the creator chose and agreed to, for every non-MANUAL TikTok target on the Post.
      required:
        - targets
        - declarationVersion
        - channel
      properties:
        targets:
          type: array
          description: Exactly one entry per non-MANUAL TikTok target, keyed by `connectionId`.
          items:
            $ref: "#/components/schemas/TikTokConsentChoice"
        declarationVersion:
          type: string
          maxLength: 64
          description: Identifies the wording of the declaration the person was shown, kept in the audit.
        channel:
          type: string
          description: Where the person consented — the Post's own page or the bulk consent page.
          enum:
            - POST_PAGE
            - BULK_PAGE
        requestId:
          type: string
          nullable: true
          description: >-
            The consent request being worked through (bulk page). Must belong to the caller and include
            this Post; 410 once expired.

    TikTokConsentChoice:
      type: object
      description: >-
        One TikTok account's human-only choices. Every field is required so that a choice is always
        explicit; there is no default. `disable*` true means that interaction is **not** allowed.
      required:
        - connectionId
        - privacyLevel
        - disableComment
        - disableDuet
        - disableStitch
        - brandContentToggle
        - brandOrganicToggle
      properties:
        connectionId:
          type: string
        privacyLevel:
          type: string
          description: One of the levels the creator's account offers (e.g. `PUBLIC_TO_EVERYONE`, `SELF_ONLY`).
        disableComment:
          type: boolean
        disableDuet:
          type: boolean
        disableStitch:
          type: boolean
        brandContentToggle:
          type: boolean
          description: Paid-partnership disclosure. Cannot be combined with `SELF_ONLY`.
        brandOrganicToggle:
          type: boolean
          description: Promotes the creator's own brand.

    CreateTikTokConsentRequest:
      type: object
      properties:
        workItemIds:
          type: array
          nullable: true
          description: >-
            The Posts to ask about, by id or display id (e.g. `RE-80`). Unknown ids do not fail the request;
            they come back in `skipped` as NOT_FOUND. Omit for every Post in the project pending TikTok consent.
          items:
            type: string

    TikTokConsentRequestItem:
      type: object
      required:
        - workItemId
        - displayId
        - title
        - verdict
      properties:
        workItemId:
          type: string
        displayId:
          type: string
          description: The human id, e.g. `RE-81`.
        title:
          type: string
        verdict:
          type: string
          enum:
            - NOT_REQUIRED
            - VALID
            - NEVER_GIVEN
            - SUPERSEDED
        consentedAt:
          type: string
          format: date-time
          nullable: true
        consentedByUserId:
          type: string
          nullable: true
        consentedByName:
          type: string
          nullable: true

    TikTokConsentSkipped:
      type: object
      description: A Post that was asked about but is not part of the request.
      required:
        - workItemId
        - reason
      properties:
        workItemId:
          type: string
          description: The id as given when it was not found, otherwise the Post's id.
        displayId:
          type: string
          nullable: true
          description: The Post's display id (e.g. `RE-80`) when it was found.
        reason:
          type: string
          enum:
            - NOT_FOUND
            - NOT_REQUIRED
            - ALREADY_VALID

    TikTokConsentRequestResponse:
      type: object
      required:
        - id
        - consentUrl
        - expiresAt
        - items
        - skipped
        - complete
      properties:
        id:
          type: string
          description: Opaque request id; also the MCP `elicitationId`.
        consentUrl:
          type: string
          description: >-
            The page to give the person: `<frontend>/app/projects/{projectId}/marketing/consent?request=<id>`.
            Carries no other data and no credentials.
        expiresAt:
          type: string
          format: date-time
        items:
          type: array
          description: The Posts the person still has to consent to.
          items:
            $ref: "#/components/schemas/TikTokConsentRequestItem"
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/TikTokConsentSkipped"
        complete:
          type: boolean
          description: True when nothing is left to consent to (`items` is empty).

    TikTokConsentRequestStatus:
      type: object
      required:
        - id
        - consentUrl
        - expiresAt
        - expired
        - complete
        - items
      properties:
        id:
          type: string
        consentUrl:
          type: string
          description: The same link the create call returned, so a client resuming with the id can show it again.
        expiresAt:
          type: string
          format: date-time
        expired:
          type: boolean
        complete:
          type: boolean
          description: True once every Post in the request has been `VALID`; stays true after.
        completedAt:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/TikTokConsentRequestItem"

    TikTokConsentCreator:
      type: object
      description: >-
        A TikTok account's creator options as TikTok reports them now (cached at most 60 seconds).
        The avatar URL expires after about two hours.
      required:
        - connectionId
        - privacyLevelOptions
        - commentDisabled
        - duetDisabled
        - stitchDisabled
        - canPost
        - reconnectRequired
      properties:
        connectionId:
          type: string
        nickname:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        privacyLevelOptions:
          type: array
          items:
            type: string
        commentDisabled:
          type: boolean
          description: The creator has turned comments off; the page must not offer to allow them.
        duetDisabled:
          type: boolean
        stitchDisabled:
          type: boolean
        maxVideoPostDurationSec:
          type: integer
          nullable: true
        canPost:
          type: boolean
          description: False when TikTok will not accept a post from this account right now.
        cannotPostReason:
          type: string
          nullable: true
        reconnectRequired:
          type: boolean

    TikTokConsentTarget:
      type: object
      required:
        - targetId
        - connectionId
        - format
        - effectiveAssetIds
      properties:
        targetId:
          type: string
        connectionId:
          type: string
        format:
          type: string
        effectiveAssetIds:
          type: array
          description: The media this target will publish, in order (its own selection, or the Post's).
          items:
            type: string
        captionOverride:
          type: string
          nullable: true
        effectiveCaption:
          type: string
          nullable: true
        consented:
          nullable: true
          description: The stored human-only choices; present only when the Post's verdict is `VALID`.
          allOf:
            - $ref: "#/components/schemas/TikTokConsentChoice"

    TikTokConsentPost:
      type: object
      required:
        - workItemId
        - displayId
        - title
        - verdict
        - etag
        - targets
      properties:
        workItemId:
          type: string
        displayId:
          type: string
        title:
          type: string
        caption:
          type: string
          nullable: true
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        verdict:
          type: string
          enum:
            - NOT_REQUIRED
            - VALID
            - NEVER_GIVEN
            - SUPERSEDED
        etag:
          type: string
          description: The strong ETag (quotes included) to send as `If-Match` when consenting.
        consentedAt:
          type: string
          format: date-time
          nullable: true
        consentedByUserId:
          type: string
          nullable: true
        consentedByName:
          type: string
          nullable: true
        targets:
          type: array
          description: The Post's non-MANUAL TikTok targets.
          items:
            $ref: "#/components/schemas/TikTokConsentTarget"

    TikTokConsentSummary:
      type: object
      required:
        - pendingCount
      properties:
        pendingCount:
          type: integer

    TikTokConsentPage:
      type: object
      required:
        - posts
        - creators
      properties:
        requestId:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        posts:
          type: array
          items:
            $ref: "#/components/schemas/TikTokConsentPost"
        creators:
          type: array
          description: One entry per distinct TikTok connection used by `posts`.
          items:
            $ref: "#/components/schemas/TikTokConsentCreator"

    CompleteManualPublishRequest:
      type: object
      required:
        - permalink
      properties:
        permalink:
          type: string
          description: >-
            Link to the post that actually went out. Required, and the reason this endpoint exists: it is
            the only record that a manual destination was ever published, so a blank one is refused rather
            than stored.
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When it actually went out. Defaults to now. Recorded as the target's fireTime so the calendar
            and the outcome panel show when the post really happened rather than when it was scheduled to.

    ReplacePublishTargetsRequest:
      type: object
      required:
        - targets
      properties:
        targets:
          type: array
          description: The complete selection. An empty array clears every target on the Work Item.
          items:
            $ref: "#/components/schemas/PublishTargetSelection"

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: string

    BrandImageSlot:
      type: string
      description: One of the four optional Brand Kit image slots.
      enum:
        - mark
        - wordmark_dark
        - wordmark_light
        - badge

    CopyRuleField:
      type: string
      enum:
        - headline
        - body
        - caption

    CopyRule:
      type: object
      description: >-
        One brand copy rule, enforced by CreativeValidator against every field it names. The frontend
        runs the same rule in JS for live validation, so `pattern`/`exceptPattern`/`flags` stick to the
        regex subset both a Java `Pattern` and a JS `RegExp` accept — no lookbehind, no named groups,
        no Java-only or JS-only escapes.
      required:
        - id
        - pattern
        - message
        - fields
      properties:
        id:
          type: string
        pattern:
          type: string
          description: A regular expression tested against the field's text.
        flags:
          type: string
          nullable: true
          description: Any combination of `i` (case-insensitive) and `m` (multiline). Omit for neither.
        message:
          type: string
          description: Shown verbatim when the rule fails — this is the text AC-P0-2.1 checks for.
        fields:
          type: array
          items:
            $ref: "#/components/schemas/CopyRuleField"
        exceptPattern:
          type: string
          nullable: true
          description: >-
            When set, every match of this pattern is stripped from the field's text before `pattern`
            is tested — the "Add All to Shopping List" exact-button-name exemption in nexus.

    BrandKitResponse:
      type: object
      required:
        - id
        - projectId
        - slug
        - name
        - isDefault
        - configured
        - tokens
        - accentPhraseRequired
        - copyRules
        - approvedLines
        - enabledPlacements
        - knowledgePagePath
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        projectId:
          type: string
        slug:
          type: string
        name:
          type: string
        isDefault:
          type: boolean
        configured:
          type: boolean
          description: >-
            True when this kit carries any customisation beyond the neutral starting point: tokens
            differ from the default palette, a font family is set, any logo slot is set, a CTA claim is
            set, copy rules or approved lines are non-empty, an accent phrase is required, or the kit's
            name differs from the default kit's name. Computed server-side on every read; never based on
            timestamps.
        tokens:
          type: object
          description: "CSS custom properties the renderer maps to: accent, accent2, darkBg, darkInk, lightBg, lightCard, ink, ink2. Each value is a #RRGGBB hex colour."
          additionalProperties:
            type: string
        fontFamily:
          type: string
          nullable: true
        fontUrl:
          type: string
          nullable: true
        markUrl:
          type: string
          nullable: true
          description: Short-lived signed GET URL, or null when this slot has no image.
        wordmarkDarkUrl:
          type: string
          nullable: true
        wordmarkLightUrl:
          type: string
          nullable: true
        badgeUrl:
          type: string
          nullable: true
        ctaClaim:
          type: string
          nullable: true
        accentPhraseRequired:
          type: boolean
        copyRules:
          type: array
          items:
            $ref: "#/components/schemas/CopyRule"
        approvedLines:
          type: array
          items:
            type: string
        enabledPlacements:
          type: array
          description: Placement keys (from the creative registry) this kit exports by default.
          items:
            type: string
        knowledgePagePath:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateBrandKitRequest:
      type: object
      required:
        - slug
        - name
      properties:
        slug:
          type: string
        name:
          type: string
        tokens:
          type: object
          nullable: true
          additionalProperties:
            type: string
        fontFamily:
          type: string
          nullable: true
        fontUrl:
          type: string
          nullable: true
        ctaClaim:
          type: string
          nullable: true
        accentPhraseRequired:
          type: boolean
          default: false
        copyRules:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CopyRule"
        approvedLines:
          type: array
          nullable: true
          items:
            type: string
        enabledPlacements:
          type: array
          nullable: true
          items:
            type: string
        knowledgePagePath:
          type: string
          nullable: true

    PatchBrandKitRequest:
      type: object
      description: >-
        Every field is optional; omit a field to leave it unchanged. Most fields are set-replace, except
        `tokens` (merged — see below) and `approvedLines`/`addApprovedLines` (mutually exclusive — see
        below).
      properties:
        name:
          type: string
        isDefault:
          type: boolean
        tokens:
          type: object
          nullable: true
          description: >-
            Merged into the kit's existing tokens: keys given here override, keys omitted keep their
            current value, and a key sent with a JSON `null` value is removed.
          additionalProperties:
            type: string
            nullable: true
        fontFamily:
          type: string
          nullable: true
        fontUrl:
          type: string
          nullable: true
        ctaClaim:
          type: string
          nullable: true
        accentPhraseRequired:
          type: boolean
        copyRules:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CopyRule"
        approvedLines:
          type: array
          nullable: true
          description: Set-replace. Cannot be sent together with `addApprovedLines` — 422 if both are set.
          items:
            type: string
        addApprovedLines:
          type: array
          nullable: true
          description: >-
            Appended to the kit's existing approved lines server-side (deduped against the existing
            list, order kept). Cannot be sent together with `approvedLines` — 422 if both are set.
          items:
            type: string
        enabledPlacements:
          type: array
          nullable: true
          items:
            type: string
        knowledgePagePath:
          type: string

    MintUploadRequest:
      type: object
      required:
        - contentType
        - sizeBytes
      properties:
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64

    UploadTicketResponse:
      type: object
      required:
        - uploadUrl
        - gcsPath
      properties:
        uploadUrl:
          type: string
        gcsPath:
          type: string

    ConfirmUploadRequest:
      type: object
      required:
        - gcsPath
      properties:
        gcsPath:
          type: string

    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string

    FieldValidationProblem:
      type: object
      description: A 422 ProblemDetail body carrying which field(s) failed and why.
      required:
        - message
        - fieldErrors
      properties:
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    CreativeViolation:
      type: object
      required:
        - field
        - ruleId
        - message
      properties:
        field:
          type: string
        ruleId:
          type: string
          description: >-
            A stable rule identifier (e.g. `layout`, `theme`, `accentPhrase`, `sequence`, or a Brand
            Kit copy rule's own `id`) — never a positional index, so a client can key off it.
        message:
          type: string
          description: The failing rule's own message (a Brand Kit copy rule's `message` verbatim, per AC-P0-2.1).

    CreativeValidationProblem:
      type: object
      description: The 422 ProblemDetail body CreativeValidator produces.
      required:
        - message
        - violations
      properties:
        message:
          type: string
        violations:
          type: array
          items:
            $ref: "#/components/schemas/CreativeViolation"

    MediaKind:
      type: string
      enum:
        - IMAGE
        - VIDEO
        - AUDIO
      description: A Creative media library item's kind (COND-24 PR1). Defaults to IMAGE.

    CreativePhotoResponse:
      type: object
      required:
        - id
        - projectId
        - contentType
        - sizeBytes
        - aiGenerated
        - checked
        - blocked
        - focal
        - uploadStatus
        - mediaKind
        - warnings
        - createdAt
      properties:
        id:
          type: string
        projectId:
          type: string
        label:
          type: string
          nullable: true
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        mediaKind:
          $ref: "#/components/schemas/MediaKind"
        durationSeconds:
          type: number
          nullable: true
          description: Running time in seconds; set for VIDEO/AUDIO.
        hasAudio:
          type: boolean
          nullable: true
          description: Whether a VIDEO carries an audio track; null for IMAGE/AUDIO.
        posterUrl:
          type: string
          nullable: true
          description: Short-lived signed GET URL of a VIDEO's poster JPEG, once set.
        source:
          type: string
          nullable: true
        licence:
          type: string
          nullable: true
        aiGenerated:
          type: boolean
        checked:
          type: boolean
        blocked:
          type: boolean
        blockedReason:
          type: string
          nullable: true
        focal:
          type: object
          description: 'Per-placement focal point, e.g. `{"9x16": "50% 30%"}`.'
          additionalProperties:
            type: string
        uploadStatus:
          type: string
          enum:
            - PENDING
            - UPLOADED
        url:
          type: string
          nullable: true
          description: Short-lived signed GET URL, present only once UPLOADED.
        uploadUrl:
          type: string
          nullable: true
          description: The signed PUT URL to upload bytes to — present only on the create response.
        postCount:
          type: integer
          nullable: true
          description: >-
            How many Work Items (Posts) use this item, directly or through a Creative's rendered frame.
            Set on list and get; null on create.
        creativeCount:
          type: integer
          nullable: true
          description: How many Creatives reference this item. Set on list and get; null on create.
        warnings:
          type: array
          items:
            type: string
          description: e.g. a long edge under 2160px. Advisory only — never a refusal.
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    AddAssetsFromMediaRequest:
      type: object
      required:
        - mediaIds
      properties:
        mediaIds:
          type: array
          minItems: 1
          maxItems: 35
          items:
            type: string
          description: Media library ids, in the order they should appear on the Work Item.

    MediaUsageResponse:
      type: object
      required:
        - creatives
        - posts
      properties:
        creatives:
          type: array
          items:
            $ref: "#/components/schemas/MediaUsageCreative"
        posts:
          type: array
          items:
            $ref: "#/components/schemas/MediaUsagePost"

    MediaUsageCreative:
      type: object
      required:
        - id
        - displayId
        - name
        - state
      properties:
        id:
          type: string
        displayId:
          type: string
        name:
          type: string
        state:
          type: string

    MediaUsagePost:
      type: object
      required:
        - workItemId
        - displayId
        - title
        - status
        - workflow
      properties:
        workItemId:
          type: string
        displayId:
          type: string
          description: Human-facing key, `{projectKey}-{sequenceNumber}` (e.g. MK-12).
        title:
          type: string
        status:
          type: string
        workflow:
          type: string
          description: Slug of the Workflow the Work Item is bound to.

    CreateCreativePhotoRequest:
      type: object
      required:
        - contentType
        - sizeBytes
      properties:
        label:
          type: string
          maxLength: 200
          nullable: true
        mediaKind:
          allOf:
            - $ref: "#/components/schemas/MediaKind"
          default: IMAGE
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - video/mp4
            - video/quicktime
            - video/webm
            - audio/mpeg
            - audio/mp4
            - audio/aac
            - audio/wav
        sizeBytes:
          type: integer
          format: int64
        width:
          type: integer
          nullable: true
          description: Required for IMAGE/VIDEO; ignored for AUDIO.
        height:
          type: integer
          nullable: true
          description: Required for IMAGE/VIDEO; ignored for AUDIO.
        durationSeconds:
          type: number
          nullable: true
          description: Required for VIDEO/AUDIO.
        hasAudio:
          type: boolean
          nullable: true
          description: Whether a VIDEO carries an audio track. Optional.
        codec:
          type: string
          nullable: true
          description: Advisory codec hint (e.g. h264); never validated.
        source:
          type: string
          maxLength: 200
          nullable: true
        licence:
          type: string
          maxLength: 200
          nullable: true
        aiGenerated:
          type: boolean
          default: false

    ConfirmCreativePhotoRequest:
      type: object
      properties:
        sizeBytes:
          type: integer
          format: int64
          nullable: true
          description: The byte count actually written, re-validated against the upload ceiling.

    MintCreativePhotoPosterResponse:
      type: object
      required:
        - uploadUrl
        - gcsPath
      properties:
        uploadUrl:
          type: string
          description: The signed PUT URL to upload the JPEG poster bytes to.
        gcsPath:
          type: string
          description: The object path the poster will live at — hand back unchanged to the confirm call.

    ConfirmCreativePhotoPosterRequest:
      type: object
      required:
        - gcsPath
      properties:
        gcsPath:
          type: string
          description: The path this same mint call returned.

    PatchCreativePhotoRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 200
        source:
          type: string
          maxLength: 200
        licence:
          type: string
          maxLength: 200
        aiGenerated:
          type: boolean
        checked:
          type: boolean
        blocked:
          type: boolean
        blockedReason:
          type: string
        focal:
          type: object
          nullable: true
          additionalProperties:
            type: string

    CreativeState:
      type: string
      enum:
        - DRAFT
        - READY
        - ARCHIVED

    CreativeTheme:
      type: string
      enum:
        - dark
        - light

    CreativeLockup:
      type: string
      enum:
        - plain
        - chip
      description: '"chip" puts the logo lockup on a white pill instead of bare on the photo, for busy photography.'

    CreativeKind:
      type: string
      enum:
        - STILL
        - MOTION
        - CLIP
        - CAROUSEL
      description: >-
        CAROUSEL is a set of finished images used as-is, ordered per placement (`slides`); a 1-slide
        CAROUSEL is a finished still. No brand layout. Without an `audio` track the backend assembles
        CAROUSEL renders by copying the chosen images; with `audio.source` "track" the render is local
        (MCP/CLI): the backend links the slide images and the local job adds one more frame, a 9x16
        `video/mp4` slideshow of the slides set to the track (see `slideshow`, `renderedVideo`).
        STILL (default) is today's brand-layout Creative. CLIP is a finished video used as-is, one file
        for all placements or one per placement (COND-24 PR1) — no brand layout; the backend assembles
        CLIP renders by copying the chosen media, unless `audio.source` is "track", "mix" or "none", in
        which case the render is local and produces a new MP4 with that sound. MOTION (PR2) is a branded
        animated video rendered by a local job.

    CreativeLayoutOverrides:
      type: object
      nullable: true
      description: "Per-placement overrides of layout-derived numbers, in pixels. An absent placement key falls back to the layout's own default."
      properties:
        band:
          type: object
          nullable: true
          description: 'Overrides the stacked layout''s photo band height per placement, e.g. {"9x16": 1200}.'
          additionalProperties:
            type: integer
        padBottom:
          type: object
          nullable: true
          description: Overrides the 9x16 panel's bottom safe-zone clearance per placement.
          additionalProperties:
            type: integer

    CreativeMotionBackground:
      type: object
      nullable: true
      description: >-
        A MOTION creative's animated background (COND-24 PR2). `source` and `motion` are plain strings
        (not OpenAPI enums) so an invalid value comes back as a 422 CreativeValidationProblem with a
        `motion.background.source`/`motion.background.motion` field path, not a generic 400.
      properties:
        source:
          type: string
          nullable: true
          description: 'photo | clip. Defaults to "photo".'
        motion:
          type: string
          nullable: true
          description: 'zoom-in | zoom-out | pan-left | pan-right | none — photo backgrounds only. Defaults to "zoom-in".'
        clipMediaId:
          type: string
          nullable: true
          description: A VIDEO media id, required when source is "clip".
        clipStartSec:
          type: number
          nullable: true
          description: Where in the source clip the background starts, in seconds. Must be less than the clip's own duration.

    CreativeMotion:
      type: object
      nullable: true
      description: >-
        The branded animation timeline for a MOTION creative (COND-24 PR2) — copy and look come from the
        same fields a STILL Creative uses (layout, theme, headline, body, photoId, ...); this is the
        motion-only part.
      properties:
        preset:
          type: string
          nullable: true
          description: 'fade-up | word-by-word | accent-pop | none. Defaults to "fade-up".'
        durationSec:
          type: number
          nullable: true
          description: 3-60 seconds. Defaults to 8.
        background:
          $ref: "#/components/schemas/CreativeMotionBackground"
        endCard:
          type: boolean
          nullable: true
          description: When true (the default), the last 2 seconds hold the full composition with the CTA.

    CreativeAudio:
      type: object
      nullable: true
      description: >-
        The sound of a MOTION, CAROUSEL or CLIP creative. `source` is a plain string, not an OpenAPI enum —
        same reasoning as CreativeMotionBackground. MOTION: clip | track | none. CAROUSEL: track | none
        (a track makes the render produce a companion 9x16 slideshow MP4; see `slideshow`). CLIP: clip
        (the clip's own sound, the default) | track (replace it) | mix (the track under the clip's sound) |
        none (mute). Any source other than `clip` makes a CLIP render local (MCP/CLI) and produce a new MP4.
      properties:
        source:
          type: string
          nullable: true
          description: >-
            MOTION: clip | track | none; defaults to "clip" when the background is a clip with sound, else
            "none". CAROUSEL: track | none; defaults to "none". CLIP: clip | track | mix | none; defaults
            to "clip". "mix" is refused when the CLIP's clip has no sound.
        trackId:
          type: string
          nullable: true
          description: An uploaded, unblocked AUDIO media id in the project; required when source is "track" or "mix".
        volume:
          type: number
          nullable: true
          description: >-
            0-1. Defaults to 0.8 on MOTION, and on CAROUSEL and CLIP to 1.0 for "track" and 0.3 for "mix"
            (the track under the clip's own sound).
        fadeOutSec:
          type: number
          nullable: true
          description: 0-5. Defaults to 1.

    CreativeSlideshow:
      type: object
      nullable: true
      description: >-
        How a CAROUSEL with a music track becomes its companion 9x16 video (CAROUSEL only; refused with 422
        on any other kind). Crossfade between slides is fixed at 0.5 s.
      properties:
        slideDurations:
          type: array
          nullable: true
          description: >-
            Seconds each 9x16 slide is shown, one entry per slide of the 9x16 list (the default list when
            there is none), each 1-10. Defaults to 3.0 s for the first slide and 2.5 s for the rest.
          items:
            type: number
        zoom:
          type: boolean
          nullable: true
          description: Slow push-in on every slide. Defaults to true.

    CreativeRenderedVideo:
      type: object
      description: >-
        The video/mp4 frame of the latest SUCCEEDED, non-preview render of a CAROUSEL (the slideshow with
        its track) or CLIP (the video with its new sound).
      required:
        - renderId
        - frameId
        - placementKey
        - url
      properties:
        renderId:
          type: string
        frameId:
          type: string
        placementKey:
          type: string
        url:
          type: string
          description: Short-lived signed GET URL.
        posterUrl:
          type: string
          nullable: true
        durationSeconds:
          type: number
          nullable: true
        hasAudio:
          type: boolean
          nullable: true

    SequenceKind:
      type: string
      enum:
        - story
        - carousel

    SequenceBeat:
      type: object
      description: One story beat or carousel card; each inherits the Creative and overrides only what changes.
      properties:
        headline:
          type: string
          nullable: true
        body:
