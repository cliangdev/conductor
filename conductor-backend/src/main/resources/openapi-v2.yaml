  /projects/{projectId}/work-items/{workItemId}/publish-consent:
    get:
      tags:
        - publish-targets
      summary: Read the creator's posting consent on a Post
      description: >-
        Whether the creator's TikTok posting consent stands for this Post **as it is now**. `required`
        is true when the Post carries at least one `tiktok` target; every other Post needs no consent
        and reports `valid: false, required: false`, which blocks nothing.


        `valid` is not a stored flag — consent is recorded against the exact target set (accounts and
        their `publishOptions`) and uploaded media it was given for, so swapping a destination account,
        changing a privacy level or replacing the video silently withdraws it. Read `consentedAt`
        alongside `valid` to tell the two apart: null means nobody ever consented, and a timestamp with
        `valid: false` means someone did and the Post has changed since. (MKT-1.)
      operationId: getPublishConsent
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The Post's consent as it currently stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishConsentResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - publish-targets
      summary: Record or withdraw the creator's posting consent on a Post
      description: >-
        Records that the creator has reviewed the preview and the destination accounts and consents to
        this Post going out, or withdraws that consent (`consented: false`). TikTok's Content Sharing
        Guidelines require the consent before anything is uploaded, and a Post with a `tiktok` target
        cannot enter a review-gated status without it.


        What is consented to is computed server-side from the Post's current targets and media — a
        client never supplies it, because a client-supplied subject would let a caller consent to
        something the Post is not. Idempotent: re-recording rewrites the same single consent with the
        current subject, and withdrawing returns the Post to "never consented". (MKT-1.)


        **Recording consent (`consented: true`) needs a person in their own signed-in session** — a user
        JWT sent in the `Authorization` header; an API key, project key, run token or cookie-only JWT gets
        403 (and the attempt is audited). Withdrawing stays open to any member. To record the creator's
        choices as well, use `PUT .../tiktok-consent`.
      operationId: recordPublishConsent
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPublishConsentRequest"
      responses:
        "200":
          description: The Post's consent after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishConsentResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Recording consent from anything but a person's own session (see above)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/work-items/{workItemId}/tiktok-consent:
    put:
      tags:
        - publish-targets
      summary: Record the creator's posting consent and TikTok choices on a Post (person only)
      description: >-
        The atomic consent write behind the TikTok consent page. In one transaction it checks the caller,
        the `If-Match` ETag and the choices against TikTok's live creator options, merges the six
        human-only publish options (`privacyLevel`, `disableComment`, `disableDuet`, `disableStitch`,
        `brandContentToggle`, `brandOrganicToggle`) into each TikTok target, upserts the standing consent
        and appends an audit event.


        **Only a person in their own signed-in browser session can call this** — a user JWT sent in the
        `Authorization` header. A user API key, a project key, a run token or a cookie-only JWT gets 403,
        and the refusal is audited. TikTok requires the creator to choose the privacy level and each
        interaction personally, so no agent can.


        `If-Match` carries the Post's current consent ETag (`"<hash>"`, from `etag` in the consent page
        read, or in this response). Missing is 428; a stale value is 412 ("This post changed — review it
        again"). The body must hold exactly one entry per non-MANUAL TikTok target, keyed by
        `connectionId`. Allowed while the Post is frozen under review: consent normally happens during
        review and publish options are not part of the review bundle.
      operationId: recordTikTokConsent
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: false
          description: >-
            The strong ETag of the Post's consent subject. Declared optional here only so the server can
            answer 428 itself with a problem body; a request without it is refused.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordTikTokConsentRequest"
      responses:
        "200":
          description: Consent recorded; the Post's consent after the change, with its new `etag`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishConsentResponse"
        "400":
          description: >-
            The choices are not valid for this creator or Post (a level the account does not offer, an
            interaction the creator has disabled, branded content with `SELF_ONLY`, a missing or unknown
            target) or the creator cannot post right now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Not a person in their own session (API key, project key, run token, cookie-only token), or the
            `requestId` was created for someone else
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: The `requestId` has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "412":
          description: The Post changed since the ETag was read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "428":
          description: No `If-Match` header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/tiktok-consent-requests:
    post:
      tags:
        - publish-targets
      summary: Ask a person to review and consent to TikTok Posts in their browser
      description: >-
        Creates a consent request: a short-lived (24 hours) pointer to a set of Posts, bound to the calling
        user, that the consent page opens. This is how an agent gets ten Posts consented without ten
        trips — it makes one request and hands the person the returned `consentUrl`. **The agent cannot
        consent**; the request grants no authority, and the page works only for the user who created it.


        `workItemIds` omitted means every Post in the project that still needs TikTok consent. Posts that
        need no consent, already have valid consent, or do not exist are not included and are reported in
        `skipped`. Accepts a user API key or JWT (there must be a user to bind the request to); a project
        key or run token gets 403. Poll `GET .../tiktok-consent-requests/{requestId}` for progress.
      operationId: createTikTokConsentRequest
      security:
        - bearerAuth: []
        - apiKeyAuth: []
