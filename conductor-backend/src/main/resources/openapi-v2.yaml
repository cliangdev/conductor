    ReviewAutoTransition:
      type: object
      description: >-
        What an APPROVED verdict did to the item's status, when its Workflow declares `review_approved`
        edges (MARKETING: In Review → Approved → Scheduled). Absent when the Workflow declares none.
        `applied` false with a `blockedReason` means the approval stands but the item could not take the
        edge — read the publish preflight for the full list and fix the item; nobody needs to approve again.
      required:
        - applied
        - fromStatus
        - toStatus
      properties:
        applied:
          type: boolean
          description: Whether the item's status changed at all.
        fromStatus:
          type: string
          description: The status the item was in when the verdict landed.
        toStatus:
          type: string
          description: The status the item is in now — how far the cascade got.
        blockedReason:
          type: string
          nullable: true
          description: Why the cascade stopped short, verbatim from the gate; null when nothing blocked it.

    ReviewWithUserResponse:
      type: object
      required:
