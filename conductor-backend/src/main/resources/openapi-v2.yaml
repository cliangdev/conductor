        request fall back to the `baseCreativeId` Creative's when one is given.
      allOf:
        - $ref: "#/components/schemas/CreateCreativeRequest"
        - type: object
          properties:
            previewOnly:
              type: boolean
              default: true
              description: Echoed into `spec.previewOnly`.
            baseCreativeId:
              type: string
              nullable: true
              description: A saved Creative to start from; every field present on this request overlays it.
            localMedia:
              type: object
              nullable: true
              description: >-
