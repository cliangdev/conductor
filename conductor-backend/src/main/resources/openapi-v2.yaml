        description:
          type: string
          nullable: true
        targetOn:
          type: string
          format: date
          nullable: true
        state:
          type: string
          enum: [OPEN, CLOSED]
        sortOrder:
          type: integer
        progress:
          $ref: "#/components/schemas/MilestoneProgress"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateMilestoneRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
        targetOn:
          type: string
          format: date
        state:
          type: string
          enum: [OPEN, CLOSED]
          description: Defaults to OPEN.
        sortOrder:
          type: integer

    PatchMilestoneRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
          description: Omit to leave unchanged; send an empty string to clear it.
        targetOn:
          type: string
          description: >-
            Target date (yyyy-MM-dd). Omit to leave unchanged; send an empty string to clear it. (A string
            rather than a nullable date because the generated models cannot tell an omitted field from an
            explicit null.)
        state:
          type: string
          enum: [OPEN, CLOSED]
        sortOrder:
          type: integer

    WorkItemPublishTargetSummary:
      type: object
      required:
        - platform
        - state
      properties:
        platform:
          type: string
          description: facebook | instagram | youtube | tiktok
        state:
          type: string
          description: The target's lifecycle state (PENDING, HANDED_OFF, PUBLISHING, AWAITING_MANUAL, PUBLISHED, FAILED, REVOKED).
        stateLabel:
          type: string
          description: The human word for the state ("Waiting", "Published", "Failed", ...).
        label:
          type: string
          nullable: true
          description: The account this target posts to (page name or handle).

    WorkItemCreativeRef:
      type: object
      description: >-
        List response only (as WorkItemResponse.creative): the Creative whose rendered frame is attached to
        the item. Null when there is none.
      required:
        - id
        - displayId
      properties:
        id:
          type: string
        displayId:
          type: string
          description: The Creative's human number (e.g. "17a").
        name:
          type: string
          nullable: true

    WorkItemExternalLink:
      type: object
      required:
        - url
        - type
      properties:
        url:
          type: string
          description: The Asset's ref — the address of the thing itself.
        type:
          type: string
          description: >-
            The Asset type, one of the bound Workflow's declared `asset_types` (e.g. `instagram_post`,
            `github_pr`). A client uses it to choose an icon or a label; it is not an enum here because the
            set is Workflow-defined.
        label:
          type: string
          nullable: true
          description: Human-readable name captured when the link was recorded (e.g. the account it went to).

    WorkItemAssignee:
      type: object
      required:
        - userId
        - name
      properties:
        userId:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
          nullable: true

    CreateWorkItemCriterion:
      type: object
      required:
        - text
      properties:
        text:
          type: string
        kind:
          type: string
          enum: [auto, manual]
          description: Whether an agent can verify it (`auto`) or a person must (`manual`).
        externalRef:
          type: string
          maxLength: 32
          description: The id the criterion carries in the PRD (e.g. AC-P0-1.1).

    CreateWorkItemRequest:
      type: object
      required:
        - title
      properties:
        workflow:
          type: string
          description: >-
            Required unless `parentWorkItemId` is set (enforced by the controller, not schema-`required`, so
            the 400 carries actionable guidance rather than a generic "must not be null"). The lifecycle
            Workflow definition id (slug, e.g. ENGINEERING) that governs this Work Item — the canonical v2
            surface never silently defaults it; discover options via
            `GET /projects/{projectId}/workflows?lifecycle=true`. A sub-item with no Workflow lands on TASK.
            (The legacy v1 `/issues` create keeps an ENGINEERING default for back-compat.)
        type:
          type: string
          description: >-
            Required unless `parentWorkItemId` is set and `workflow` is not (then TASK). Work Item type — a
            Workflow-defined string (e.g. PRD), validated against the chosen Workflow's allowed types.
        parentWorkItemId:
          type: string
          description: >-
            Make this a sub-item of that Work Item (same project, at most five levels deep). It inherits the
            parent's milestone unless `milestoneId` is given.
        priority:
          $ref: "#/components/schemas/WorkItemPriority"
        milestoneId:
          type: string
          description: Group the item under this milestone of the project.
        appetite:
          type: string
          description: The time box the item is worth, such as "2 weeks", "2w", "10 days" or "1 month".
        criteria:
          type: array
          description: >-
            Acceptance criteria to create with the item.
          items:
            $ref: "#/components/schemas/CreateWorkItemCriterion"
        blockedBy:
          type: array
          description: >-
            Ids of Work Items that must finish first: each is recorded as `<id> BLOCKS <this item>`.
          items:
            type: string
        title:
          type: string
          maxLength: 255
        description:
          type: string
        tags:
          type: array
          description: >-
            Freeform labels for this Work Item. Sent whole — the stored set becomes exactly this list, so
            omit the field to leave existing tags alone and send an empty array to clear them. Values are
            trimmed, lower-cased and de-duplicated.
          items:
            type: string
        fields:
          type: object
          additionalProperties: true
          description: >-
            Typed field values, keyed by the field keys the Workflow declares. Unknown keys, wrong types
            and a Workflow that declares no fields are rejected with a 400.
        dueOn:
          type: string
          format: date
          description: Calendar date this Work Item is due (yyyy-MM-dd).

    PatchWorkItemRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
        status:
          type: string
          description: >-
            Target status — a Workflow-defined status id (e.g. IN_REVIEW). The move is
            validated against the bound Workflow and the Review gate.
        assigneeId:
          type: string
          nullable: true
          description: User ID to assign to this Work Item, or null to unassign
        scheduledFor:
          type: string
          format: date-time
          nullable: true
          description: >-
            When this Work Item is due, as an ISO-8601 date-time. Omit to leave the existing schedule
            unchanged.
        scheduleTimezone:
          type: string
          nullable: true
          description: >-
            IANA zone id the schedule is authored in (e.g. America/New_York). Omit to leave unchanged, or
            send an empty string to clear it. An unrecognized zone is rejected with a 400.
        publishOnApproval:
          type: boolean
          nullable: true
          description: >-
            Publish as soon as approved (see WorkItemResponse.publishOnApproval). Omit to leave unchanged.
        tags:
          type: array
          nullable: true
          description: >-
            Freeform labels for this Work Item. Sent whole — the stored set becomes exactly this list, so
            omit the field to leave existing tags alone and send an empty array to clear them. Values are
            trimmed, lower-cased and de-duplicated.
          items:
            type: string
        fields:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Typed field values to set, merged key by key into the stored ones: a key sent with a value
            sets it, a key sent as null (or an empty string) clears it, a key not sent is left alone.
            Validated against the Workflow's declared fields (400 on unknown keys or wrong types). Applied
            before `status`, so one patch can fill the fields a transition requires and take it.
        dueOn:
          type: string
          description: >-
            Calendar date this Work Item is due (yyyy-MM-dd). Omit to leave unchanged; send an empty
            string to clear it. (A string rather than a nullable date because the generated models cannot
            tell an omitted field from an explicit null.)
        parentWorkItemId:
          type: string
          description: >-
            Move this Work Item under another (same project, no cycles, at most five levels deep). Omit to
            leave unchanged; send an empty string to make it top-level.
        priority:
          type: string
          pattern: "^(P[0-3])?$"
          description: >-
            P0 (most urgent) to P3. Omit to leave unchanged; send an empty string to clear it. (A string
            with a pattern rather than the `WorkItemPriority` enum, which has no way to say "clear".)
        milestoneId:
          type: string
          description: Group under this milestone of the project. Omit to leave unchanged; empty string detaches.
        appetite:
          type: string
          description: >-
            The time box, such as "2 weeks", "2w", "10 days" or "1 month". Omit to leave unchanged; send an
            empty string to clear it.

    AvailableTransition:
      type: object
      required:
        - toStatus
        - label
      properties:
        toStatus:
          type: string
          description: The status this transition moves the Work Item to.
        label:
          type: string
          description: Human-readable action label (e.g. "Submit for review").
        requiresReview:
          type: boolean
          description: Whether taking this transition will open a Review gate.

    AvailableTransitionsResponse:
      type: object
      required:
        - workflow
        - currentStatus
        - transitions
      properties:
        workflow:
          type: string
          description: The Work Item's Workflow definition id (slug).
        currentStatus:
          type: string
        noun:
          type: string
          description: The Workflow's display noun (e.g. Issue, Post).
        transitions:
          type: array
          items:
            $ref: "#/components/schemas/AvailableTransition"

    AssignReviewerRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          description: User ID to assign as reviewer

    AssignReviewerResponse:
      type: object
      required:
        - workItemId
        - userId
        - assignedAt
      properties:
        workItemId:
          type: string
        userId:
          type: string
        assignedAt:
          type: string
          format: date-time

    ReviewerResponse:
      type: object
      required:
        - userId
        - assignedAt
      properties:
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        avatarUrl:
          type: string
        reviewVerdict:
          type: string

    DocumentResponse:
      type: object
      required:
        - id
        - workItemId
        - filename
        - contentType
        - createdAt
      properties:
        id:
          type: string
        workItemId:
          type: string
        filename:
          type: string
        contentType:
          type: string
        content:
          type: string
          nullable: true
          description: Inline content for text/markdown, text/plain and text/html; null for binary types
        contentHash:
          type: string
          nullable: true
          description: |
            SHA-256 of the document's current inline content (its UTF-8 bytes), as 64 lowercase hex characters.
            Null when the document has no inline content (for example a binary file). It changes whenever the
            content changes, so a client that sends it back as `documentHash` when commenting records the
            version of the document the reviewer was looking at.
        storagePath:
          type: string
        storageUrl:
          type: string
          description: GCP V4 signed URL (valid for configured expiry, default 15 minutes)
        storageUrlExpiresAt:
          type: string
          format: date-time
          description: ISO timestamp when the signed URL expires
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DocumentSummaryResponse:
      type: object
      description: A document without its body, as returned by the list endpoint.
      required:
        - id
        - workItemId
        - filename
        - contentType
        - createdAt
      properties:
        id:
          type: string
        workItemId:
          type: string
        filename:
          type: string
        contentType:
          type: string
        contentHash:
          type: string
          nullable: true
          description: |
            SHA-256 of the document's current inline content (its UTF-8 bytes), as 64 lowercase hex characters.
            Null when the document has no inline content (for example a binary file). It changes whenever the
            content changes, so a client that sends it back as `documentHash` when commenting records the
            version of the document the reviewer was looking at.
        storagePath:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateDocumentRequest:
      type: object
      required:
        - filename
      properties:
        filename:
          type: string
        content:
          type: string
        contentType:
          type: string

    UpsertDocumentByFilenameRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
        contentType:
          type: string
          default: text/markdown

    TextQuoteAnchor:
      type: object
      description: |
        A W3C TextQuoteSelector: the selected text plus a little surrounding context, and a hint at the
        nearest section of the page. Used for comments on HTML documents.
      required:
        - exact
      properties:
        exact:
          type: string
          minLength: 1
          maxLength: 2000
        prefix:
          type: string
          maxLength: 64
        suffix:
          type: string
          maxLength: 64
        sectionId:
          type: string
          maxLength: 255
        sectionTitle:
          type: string
          maxLength: 500

    CreateCommentRequest:
      type: object
      description: |
        A comment on a document. HTML documents (content type text/html, or a .html/.htm filename) require
        `anchor` and reject `lineNumber`; every other document requires `lineNumber` and rejects `anchor`.
      required:
        - documentId
        - content
      properties:
        documentId:
          type: string
        content:
          type: string
        lineNumber:
          type: integer
        anchor:
          $ref: "#/components/schemas/TextQuoteAnchor"
        documentHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            The `contentHash` of the document version the reviewer was looking at when they wrote the comment
            (64 lowercase hex characters; anything else is a 400). The comment is stamped with it, so the
            response and later reads report `outdated: true` if the document has changed since. Omit it and
            the comment is stamped with the document's current `contentHash` instead, which is right only if
            the reviewer's copy is current; clients that cache a document should send it.

    CommentResponse:
      type: object
      required:
        - id
        - documentId
        - authorId
        - content
        - createdAt
        - outdated
      properties:
        id:
          type: string
        documentId:
          type: string
