      summary: Mint an upload URL for a file Asset
      description: >-
        Creates a PENDING file Asset row and returns the URL the client PUTs the raw bytes to
        directly, so payloads never traverse the backend. On GCS this is a signed PUT URL bound to
        the declared contentType; on the local profile (no signed-upload mechanism) it is the
        internal passthrough `PUT /internal/v1/work-items/{workItemId}/assets/{assetId}/content`.
        Content type, size and filename are validated before any row or URL is produced, so a
        disallowed request yields neither. Finish with
        `POST .../assets/{assetId}/confirm`. (COND-23.)
      operationId: createWorkItemAssetUpload
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetUploadRequest"
      responses:
        "201":
          description: PENDING Asset created and upload URL minted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAssetUploadResponse"
        "400":
          description: >-
            Validation error — content type off the allowlist, size missing/over the ceiling,
            unusable filename, asset type not allowed by the Workflow, or the Work Item is past its
            review gate (assets locked).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found (also returned to a non-member of the project)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
