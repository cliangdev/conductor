  /projects/{projectId}/areas/{area}/assets:
    get:
      tags:
        - area-assets
      summary: The Area's asset library — every uploaded file Asset produced under it
      description: >-
        Lists UPLOADED, `kind=file` Assets across every Work Item whose bound Workflow belongs to the
        given Area, newest first. The query keys on the Area, never on a Workflow slug or noun, so a
        Workflow added to the Area later contributes its media here with no server change (COND-23
        T7.1). PENDING uploads and `kind=link` Assets are never listed. Every row carries a
        short-lived signed `previewUrl` minted per response — never persist or cache one.
      operationId: listAreaAssets
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: area
          in: path
          required: true
          description: Area slug, matched case-insensitively against the Workflow's `area` (e.g. `MARKETING`).
          schema:
            type: string
        - name: mediaType
          in: query
          required: false
          description: >-
            Narrow to one media family, derived from the stored `contentType` prefix (`image/`,
            `video/`). Omit for both.
          schema:
            type: string
            enum:
              - image
              - video
        - name: workflow
          in: query
          required: false
          description: >-
            Narrow to one owning Workflow slug (e.g. `MARKETING`). A slug outside the Area matches
            nothing rather than escaping the Area scope.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Narrow to Assets whose owning Work Item is in this Workflow-defined status.
          schema:
            type: string
        - name: uploadedAfter
          in: query
          required: false
          description: Only Assets uploaded at or after this instant.
          schema:
            type: string
            format: date-time
        - name: uploadedBefore
          in: query
          required: false
          description: Only Assets uploaded at or before this instant.
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: The Area's uploaded file Assets, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaAssetResponse"
        "400":
          description: Unrecognized mediaType, or a negative page/size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/publish-targets:
