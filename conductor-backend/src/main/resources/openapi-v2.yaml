            schema:
              $ref: "#/components/schemas/PatchCreativeRequest"
      responses:
        "200":
          description: The updated Creative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
