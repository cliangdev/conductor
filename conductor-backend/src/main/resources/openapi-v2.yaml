      description: >-
        Per-variant roll-ups for every lettered sibling of this Creative's family: posts, views,
        engagement rate, average view percentage where a platform reports it, and 72h views, each sliced
        by platform. Attribution follows creative_render_frame → assets.creative_frame_id to every
        published destination whose actual media (inherited or explicit) still includes one of this
        Creative's rendered frames — a frame later replaced on its Post no longer counts. A variant with
        no attributed, reporting destination yet comes back with posts: 0 and null rates rather than
        being omitted.
      operationId: getCreativePerformance
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
