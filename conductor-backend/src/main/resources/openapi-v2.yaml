    ReviewAutoTransition:
      type: object
      description: >-
        What an APPROVED verdict did to the item's status, when its Workflow declares `review_approved`
        edges (MARKETING: In Review → Approved → Scheduled). Absent when the Workflow declares none.
        `applied` false with a `blockedReason` means the approval stands but the item could not take the
        edge — read the publish preflight for the full list and fix the item; nobody needs to approve again.
      required:
        - applied
        - fromStatus
        - toStatus
      properties:
        applied:
          type: boolean
          description: Whether the item's status changed at all.
        fromStatus:
          type: string
          description: The status the item was in when the verdict landed.
        toStatus:
          type: string
          description: The status the item is in now — how far the cascade got.
        blockedReason:
          type: string
          nullable: true
          description: Why the cascade stopped short, verbatim from the gate; null when nothing blocked it.

    ReviewWithUserResponse:
      type: object
      required:
        - reviewerId
        - verdict
        - submittedAt
      properties:
        reviewerId:
          type: string
        name:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        verdict:
          type: string
        body:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: >-
            Whether this review still describes the Work Item as it stands, and so still counts toward the
            review gate. False for one cast in an earlier review round, or — on an item with publish
            targets — against a different publish bundle: changing the caption, the schedule, the targets
            or the media withdraws an approval rather than letting it cover a post nobody has seen.


            Computed exactly the way the server's own gate computes it, so a client can never show
            "approved" for a review the gate is ignoring.

    AssetResponse:
      type: object
      required:
        - id
        - workItemId
        - type
        - kind
        - ref
        - done
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        workItemId:
          type: string
        type:
          type: string
          description: Asset type validated against the Workflow's asset_types (e.g. github_pr).
        label:
          type: string
        kind:
          type: string
          enum:
            - link
            - file
        ref:
          type: string
          description: A URL (kind=link) or a stored-file reference (kind=file).
        done:
          type: boolean
        uploadStatus:
          type: string
          nullable: true
          description: >-
            Upload lifecycle of a kind=file Asset: PENDING once the upload URL is minted, UPLOADED
            once the client confirms. Null for kind=link Assets and for file rows recorded without
            the upload flow. One of PENDING, UPLOADED. (COND-23.)
        contentType:
          type: string
          nullable: true
          description: Media type of the stored object (kind=file only).
        sizeBytes:
          type: integer
          format: int64
          nullable: true
          description: Size of the stored object in bytes (kind=file only).
        width:
          type: integer
          format: int32
          nullable: true
          description: >-
            Pixel width of the media, or null when unknown. Derived from the bytes at confirm for
            images; for video it is only ever what the client measured at upload. (COND-23.)
        height:
          type: integer
          format: int32
          nullable: true
          description: Pixel height of the media, or null when unknown. Same provenance as width.
        durationSeconds:
          type: number
          nullable: true
          description: >-
            Playback length in seconds for a video Asset, or null when unknown. The browser is the
            only source — no container parser ships with the JDK.
        mediaId:
          type: string
          nullable: true
          description: >-
            The Media library item (`/marketing/photos/{id}`) this file Asset links to. A Post's file
            is a link to Media, never a copy: the Asset reuses the Media item's stored object. Null for
            kind=link Assets, for a Creative's rendered frame (see creativeFrameId), and for file rows
            from before the Media library existed.
        creativeFrameId:
          type: string
          nullable: true
          description: The Creative render frame this file Asset links to, when it came from "Use in Post".
        placementKey:
          type: string
          nullable: true
          description: Placement of the Creative frame this file came from (e.g. 9x16). Read-only; null unless creativeFrameId is set.
        sequenceIndex:
          type: integer
          format: int32
          nullable: true
          description: Zero-based slide position within a carousel or story Creative. Read-only; null for non-sequence frames.
        creativeId:
          type: string
          nullable: true
          description: The Creative this file's frame belongs to. Read-only; null unless creativeFrameId is set.
        creativeDisplayId:
          type: string
          nullable: true
          description: The Creative's display id (e.g. 18a). Read-only; null unless creativeFrameId is set.
        creativeName:
          type: string
          nullable: true
          description: The Creative's name. Read-only; null unless creativeFrameId is set, or when the Creative has no name.
        previewUrl:
          type: string
          nullable: true
          description: >-
            Short-lived (15 minute) signed read URL for the stored object. Populated only for a
            kind=file Asset whose uploadStatus is UPLOADED; null otherwise. Never persisted — it is
            minted per response, so don't cache it.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAssetUploadRequest:
      type: object
      required:
        - type
        - filename
        - contentType
        - sizeBytes
      properties:
        type:
          type: string
          description: Asset type, validated against the Workflow's asset_types (e.g. instagram_post).
        label:
          type: string
          description: Human label; defaults to the sanitized filename.
        filename:
          type: string
          description: >-
            Client-supplied file name. Sanitized to a single safe path segment before it is appended
            to the storage path.
        contentType:
          type: string
          description: >-
            Media type of the bytes about to be uploaded. Must be on the server's allowlist
            (image/png, image/jpeg, image/gif, image/webp, video/mp4, video/quicktime).
        sizeBytes:
          type: integer
          format: int64
          description: Size of the bytes about to be uploaded. Must be positive and within the server ceiling.
        width:
          type: integer
          format: int32
          description: >-
            Client-measured pixel width of the media. Optional. An image's real width is re-derived
            from the bytes at confirm, so this only matters for video.
        height:
          type: integer
          format: int32
          description: Client-measured pixel height of the media. Same provenance as width.
        durationSeconds:
          type: number
          description: >-
            Client-measured playback length in seconds. Video only, and the browser is the only
            source — no container parser ships with the JDK, so a video that omits it can never
            satisfy a per-target duration rule at approval.

