    get:
      tags:
        - work-item-health
      summary: Health updates on a Work Item, newest first
      operationId: listWorkItemHealthUpdates
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: workItemId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Confirmed updates and drafts, newest first (at most 50)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkItemHealthUpdateResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - work-item-health
      summary: Record a health update
      description: >-
        `draft=true` records a pending draft attributed to the caller (an agent or a person) that a person
        confirms later; it is ignored once it is 48 hours old. `draft=false` records a confirmed update
        directly and needs a person (a user JWT or a user API key, not a project key or run token).
      operationId: createWorkItemHealthUpdate
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: workItemId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkItemHealthUpdateRequest"
      responses:
        "201":
          description: The recorded update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemHealthUpdateResponse"
        "400":
          description: Unknown health, or a missing or over-long note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: A machine credential tried to record a confirmed update, or the caller is not an editor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/work-items/{workItemId}/health-updates/{updateId}/confirm:
    post:
      tags:
        - work-item-health
      summary: Confirm a drafted health update
      description: >-
        A person confirms a pending draft, optionally editing its health or note first. Machine credentials
        get 403. An already-confirmed or expired (older than 48 hours) draft is a 409.
      operationId: confirmWorkItemHealthUpdate
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: workItemId, in: path, required: true, schema: {type: string}}
        - {name: updateId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmWorkItemHealthUpdateRequest"
      responses:
        "200":
          description: The confirmed update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemHealthUpdateResponse"
        "400":
          description: Unknown health or an empty note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Machine credential, or not an editor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item or update not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already confirmed, or the draft expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

