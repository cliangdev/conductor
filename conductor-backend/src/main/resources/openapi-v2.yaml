    PublishTargetOption:
      type: object
      description: >-
        One selectable publishing destination, derived from an ACTIVE connection rather than stored.
        (COND-23 T3.6.)
      required:
        - platform
        - label
        - lane
      properties:
        platform:
          type: string
          description: The surface a post goes out on.
          enum:
            - facebook
            - instagram
            - youtube
            - tiktok
        connectorId:
          type: string
          nullable: true
          description: >-
            Connector the target publishes through (meta, youtube, tiktok). Null on the MANUAL lane, which
            publishes through no connector.
        connectionId:
          type: string
          nullable: true
          description: >-
            The specific connected account. Two accounts on one platform differ only here, so it is
            what a selection must carry. Null on the MANUAL lane, where there is no account — a manual
            destination is identified by its platform alone, and there is exactly one per platform.
        label:
          type: string
          description: Human-readable account name (Page name, @handle, channel title, creator nickname).
        lane:
          type: string
          description: >-
            NATIVE hands the post and its schedule to the platform's own scheduler; APP_MANAGED keeps
            it here until its fire time and Conductor publishes it; MANUAL publishes nothing at all — at
            fire time the target waits for a human to post it and record the live URL. A MANUAL option is
            offered for every platform whether or not the project has connected one, and is the only
            destination available to a project with no social integration.
          enum:
            - NATIVE
            - APP_MANAGED
            - MANUAL
        healthStatus:
          type: string
          nullable: true
          description: >-
            Last credential verdict on the underlying connection — HEALTHY or UNHEALTHY, or null when
            it has never been checked. An UNHEALTHY target should be offered disabled, not hidden.
        healthMessage:
          type: string
          nullable: true
          description: The platform's own explanation of an UNHEALTHY verdict; null while healthy.
        privacyLevelOptions:
          type: array
          nullable: true
          items:
            type: string
          description: >-
            The privacy levels this one creator may publish under, cached on the connection when the
            account was connected (e.g. PUBLIC_TO_EVERYONE, MUTUAL_FOLLOW_FRIENDS, FOLLOWER_OF_CREATOR,
            SELF_ONLY). TikTok reports a different set per creator — a private account is offered fewer
            than a public one — so this is the only source for a target's allowed `privacyLevel`, and it
            is what `PublishOptionsValidator` checks the chosen level against at the approval gate.
            Null for every non-TikTok platform, and null for a TikTok connection made before the levels
            were cached: that account has to be reconnected, not guessed for. (TIK-3.)
        creatorNickname:
          type: string
          nullable: true
          description: >-
            The handle the creator would recognise, for the consent step's "you are posting to @…".
            TikTok's audit requirement is that the creator sees which account a post is going to, so
            this is the account's own name rather than the connection's label. Null for every
            non-TikTok platform, and null when the connection never cached it. (TIK-3.)

    PublishTargetResponse:
      type: object
      description: One publish target selected on a Work Item (a persisted post_publish_target row).
      required:
        - id
        - workItemId
        - platform
        - lane
        - state
      properties:
        id:
          type: string
        workItemId:
          type: string
        platform:
          type: string
          enum:
            - facebook
            - instagram
            - youtube
            - tiktok
        connectorId:
          type: string
          nullable: true
          description: Null on the MANUAL lane, which publishes through no connector.
        connectionId:
          type: string
          nullable: true
          description: >-
            The connected account this target publishes through. Null on the MANUAL lane, which reaches its
            platform through a human rather than a credential.
        label:
          type: string
          nullable: true
          description: Account label captured at selection time (post_publish_target.platform_account_label).
        lane:
          type: string
          description: >-
            How this target reaches its platform. NATIVE hands the post to the platform's own scheduler;
            APP_MANAGED means Conductor publishes it at fire time; MANUAL means nobody automates it — a
            human posts it and records the result, and no credential is used.
          enum:
            - NATIVE
            - APP_MANAGED
            - MANUAL
        state:
          type: string
          description: >-
            One of PENDING, HANDED_OFF, PUBLISHING, AWAITING_MANUAL, PUBLISHED, FAILED, REVOKED.
            AWAITING_MANUAL is a MANUAL target whose fire time has passed and which is waiting on a person
            to publish it by hand.
        platformPostId:
          type: string
          nullable: true
          description: The platform's id for the created post, once it exists.
        permalink:
          type: string
          nullable: true
          description: >-
            Link to the live post on the platform, captured when the target reaches PUBLISHED. This is the
            per-target evidence the Post detail renders; null until the publish is confirmed.
        errorMessage:
          type: string
          nullable: true
          description: >-
            The platform's own failure text, preserved verbatim for a human to read. Null unless the target
            is FAILED.
        fireTime:
          type: string
          format: date-time
          nullable: true
          description: >-
            When this target publishes. Copied from the Work Item's scheduledFor and re-stamped whenever the
            Post re-enters its scheduled status, so it is the authoritative time for this target.
        publishOptions:
          $ref: "#/components/schemas/PublishOptions"

    RetryPublishResponse:
      type: object
      description: >-
        The result of re-firing a Post's failed publish targets: the Post's status afterwards and
        every one of its targets, so a client can render the new state without a second request.
      required:
        - workItemId
        - status
        - retriedCount
        - targets
      properties:
        workItemId:
          type: string
        status:
          type: string
          description: >-
            The Post's Workflow-defined status after the retry — its scheduled status when anything
            was re-fired, otherwise whatever it already was.
        retriedCount:
          type: integer
          format: int32
          description: How many targets were reset to PENDING. Zero when nothing had failed.
        targets:
          type: array
          description: Every publish target on the Post after the retry, failed or not.
          items:
            $ref: "#/components/schemas/PublishTargetResponse"

    PublishTargetSelection:
      type: object
      required:
        - platform
      properties:
        platform:
          type: string
          enum:
            - facebook
            - instagram
            - youtube
            - tiktok
        connectionId:
          type: string
          nullable: true
          description: >-
            The connected account to publish through. Omit it (or send null) to select this platform's
            MANUAL destination instead — the one a human publishes by hand. There is exactly one manual
            destination per platform, so the platform alone identifies it.
        publishOptions:
          $ref: "#/components/schemas/PublishOptions"

    PublishOptions:
      type: object
      additionalProperties: true
      description: >-
        How the post goes out on this one platform — a per-platform bag of option keys, read against the
        target's own `platform` and nothing else. Omitted or null means nothing has been chosen, which is
        not the same as "the defaults are fine": a TikTok target with no `privacyLevel` blocks approval
        rather than publishing to the creator alone. (TIK-1.)


        TikTok keys: `privacyLevel` (string — one of the connection's cached privacyLevelOptions, e.g.
        PUBLIC_TO_EVERYONE, MUTUAL_FOLLOW_FRIENDS, FOLLOWER_OF_CREATOR, SELF_ONLY), `disableComment`,
        `disableDuet`, `disableStitch` (booleans), `brandContentToggle` (boolean — paid partnership; TikTok
        refuses it combined with SELF_ONLY) and `brandOrganicToggle` (boolean — the creator's own brand).
      example:
        privacyLevel: PUBLIC_TO_EVERYONE
        disableComment: false
        brandContentToggle: true

    PublishConsentResponse:
      type: object
      description: >-
        The creator's posting consent on a Post, and whether it still describes the Post. (MKT-1.)
      required:
        - workItemId
        - required
        - valid
        - verdict
      properties:
        workItemId:
          type: string
        required:
          type: boolean
          description: >-
            True when the Post publishes to at least one `tiktok` account. A Facebook-only or
            YouTube-only Post is never gated on consent.
        valid:
          type: boolean
          description: >-
            True only when consent was given and still covers the Post's current accounts, publish
            options and uploaded media. False on a Post that needs no consent at all.
        verdict:
          type: string
          description: >-
            The same fact in one word, for a client that needs to say what is wrong.
            `NOT_REQUIRED` — no TikTok target. `VALID` — consent stands. `NEVER_GIVEN` — nobody has
            consented (or it was withdrawn). `SUPERSEDED` — consent was given, then the accounts,
            options or media changed under it and it has to be given again.
          enum:
            - NOT_REQUIRED
            - VALID
            - NEVER_GIVEN
            - SUPERSEDED
        consentedAt:
          type: string
          format: date-time
          nullable: true
          description: When consent was last given; null when it never was, or was withdrawn.
        consentedByUserId:
          type: string
          nullable: true
          description: The member who consented; null when consent has never been given.
        consentedByName:
          type: string
          nullable: true
          description: That member's display name, so the record reads as a name rather than an id.

    RecordPublishConsentRequest:
      type: object
      required:
        - consented
      properties:
        consented:
          type: boolean
          description: >-
            True to consent to this Post going out to its current accounts under their current publish
            options, with its current media. False to withdraw consent.

    CompleteManualPublishRequest:
      type: object
      required:
        - permalink
      properties:
        permalink:
          type: string
          description: >-
            Link to the post that actually went out. Required, and the reason this endpoint exists: it is
            the only record that a manual destination was ever published, so a blank one is refused rather
            than stored.
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When it actually went out. Defaults to now. Recorded as the target's fireTime so the calendar
            and the outcome panel show when the post really happened rather than when it was scheduled to.

    ReplacePublishTargetsRequest:
      type: object
      required:
        - targets
      properties:
        targets:
          type: array
          description: The complete selection. An empty array clears every target on the Work Item.
          items:
            $ref: "#/components/schemas/PublishTargetSelection"

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: string
