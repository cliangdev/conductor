        workflow:
          type: string
        fromStatus:
          type: string
        toStatus:
          type: string
        stepKind:
          type: string
        skill:
          type: string
        status:
          type: string
        inputBrief:
          type: string
        reportedBy:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        produced:
          type: array
