        - name: creativeId
          in: path
          required: true
          schema:
            type: string
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmCreativePhotoRequest"
      responses:
        "200":
          description: The confirmed, UPLOADED image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativePhotoResponse"
        "400":
          description: The bytes are not in storage yet, or their size is disallowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: A run token for another run or Creative, or a caller who is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Revision, Creative or media not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The revision is no longer PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/performance:
    get:
      tags:
        - creatives
      summary: A Creative family's attributed performance (COND-24 T5)
      description: >-
        Per-variant roll-ups for every lettered sibling of this Creative's family: posts, views,
        engagement rate, average view percentage where a platform reports it, and 72h views, each sliced
        by platform. Attribution follows creative_render_frame → assets.creative_frame_id to every
        published destination whose actual media (inherited or explicit) still includes one of this
        Creative's rendered frames — a frame later replaced on its Post no longer counts. A variant with
        no attributed, reporting destination yet comes back with posts: 0 and null rates rather than
        being omitted.
      operationId: getCreativePerformance
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The family's performance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativePerformanceResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/render-runs:
    post:
      tags:
        - creatives
      summary: Render a Creative on the workspace's self-hosted daemon
      description: >-
        Dispatches the system workflow `conductor-creative-render` (seeded on first use) for a Creative that
        needs a browser or ffmpeg: a STILL or MOTION, a CAROUSEL with a music track, or a CLIP whose sound is
        replaced, mixed or muted. The run executes on the workspace's conductor daemon, which renders and
        uploads the result as a normal render. Requires ADMIN or CREATOR. Returns 202 with the run; follow it
        through `GET .../render-runs/latest`. Refused with 422 `RENDER_NOT_NEEDED` when the render is assembled
        in the backend (use the normal render), 422 with `violations` when the Creative fails the render
        validation, 409 `RENDER_RUN_ACTIVE` while a run for this Creative is queued or running, 409
        `RENDER_WORKFLOW_DISABLED` when the workflow was switched off, 409 `RENDER_WORKFLOW_NAME_TAKEN` when a
        user workflow already uses the name.
      operationId: createCreativeRenderRun
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: The render run was queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeRenderRun"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not an ADMIN or CREATOR of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found in this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            `RENDER_RUN_ACTIVE` (body carries the active run's `workflowId` and `runId`),
            `RENDER_WORKFLOW_DISABLED` or `RENDER_WORKFLOW_NAME_TAKEN` (body carries `workflowId`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - type: object
                    properties:
                      workflowId:
                        type: string
                      runId:
                        type: string
        "422":
          description: >-
            `RENDER_NOT_NEEDED`, or the Creative failed the render validation (body carries `violations`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/render-runs/latest:
    get:
      tags:
        - creatives
      summary: The latest render run of a Creative
      description: >-
        The most recent `conductor-creative-render` run dispatched for this Creative, with its status, why it
        is waiting (`waitReason`, e.g. `AWAITING_RUNNER`) and, once it failed, the reason. 204 when none was
        ever dispatched. Cheap enough to poll.
      operationId: getLatestCreativeRenderRun
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The latest render run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeRenderRun"
        "204":
          description: No render run was ever dispatched for this Creative
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not a member of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found in this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/renders:
    get:
      tags:
        - creatives
      summary: List a Creative's renders
      description: Latest first, at most 20. A RUNNING render older than 30 minutes is reported (and persisted) as FAILED "timed out" — there is no scheduler; the sweep happens on this read.
      operationId: listCreativeRenders
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The Creative's renders, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreativeRenderResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - creatives
      summary: Request a render
      description: >-
        Rendering happens on the user's own machine (the Conductor MCP server or CLI, or a self-hosted
        Workflow) — this only records the render as RUNNING and returns the render input (`spec`) the
        local job renders from. `spec` is only ever returned by this call, never by a GET. Refuses with
        422 (same shape as the Creative validator) if the Creative lacks a photo or headline, or fails any
        other T2 structural rule. Requires ADMIN or CREATOR.
      operationId: createCreativeRender
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCreativeRenderRequest"
      responses:
        "201":
          description: The new render, RUNNING, plus its spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeRenderResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The Creative lacks a photo or headline, or fails a T2 structural rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeValidationProblem"

  /projects/{projectId}/marketing/creatives/{creativeId}/renders/{renderId}:
    get:
      tags:
        - creatives
      summary: Get one render
      description: >-
        As with the list, a RUNNING render older than 30 minutes is reported (and persisted) as FAILED
        "timed out" on this read.
      operationId: getCreativeRender
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
        - name: renderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The render
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeRenderResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Render not found, does not belong to this Creative, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/renders/{renderId}/frames/{placementKey}:
    put:
      tags:
        - creatives
      summary: Upload one rendered frame
      description: >-
        The local render job PUTs each placement's frame here as it finishes, one call per frame. A STILL
        placement frame is JPEG (Instagram feed images and TikTok photo posts both refuse PNG); the `sheet`
        contact sheet for a preview-only render stays PNG; a MOTION render's frame is `video/mp4` (COND-24
        PR2), with `durationSeconds`/`hasAudio` query params stored on the frame. Upserts the frame row on
        `(placementKey, index)`; `platform` is derived from the placement registry. Only accepted while the
        render is RUNNING — 409 once it has SUCCEEDED or FAILED. Requires ADMIN or CREATOR.
      operationId: putCreativeRenderFrame
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
        - name: renderId
          in: path
          required: true
          schema:
            type: string
        - name: placementKey
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: query
          required: false
          description: Sequence position for a story/carousel frame; omitted for a single-frame placement.
          schema:
            type: integer
        - name: width
          in: query
          required: true
          schema:
            type: integer
        - name: height
          in: query
          required: true
          schema:
            type: integer
        - name: durationSeconds
          in: query
          required: false
          description: A MOTION (video/mp4) frame's running time, in seconds. Ignored for an image frame.
          schema:
            type: number
        - name: hasAudio
          in: query
          required: false
          description: Whether a MOTION (video/mp4) frame carries an audio track. Ignored for an image frame.
          schema:
            type: boolean
      requestBody:
        required: true
        description: >-
          Raw bytes. A STILL placement frame is JPEG (at most 20 MB); the `sheet` contact sheet is PNG (at
          most 20 MB); a MOTION frame is video/mp4 (at most 500 MB).
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          video/mp4:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Frame stored
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Render not found, does not belong to this Creative, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The render is no longer RUNNING (already SUCCEEDED or FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Content-Type is not image/jpeg, image/png or video/mp4
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/renders/{renderId}/frames/{placementKey}/poster:
    put:
      tags:
        - creatives
      summary: Upload a MOTION render frame's poster
      description: >-
        COND-24 PR2: the local render job PUTs a MOTION frame's poster JPEG here (the end-card frame) once
        the frame itself is stored. Sets the frame's `posterUrl`, exactly as a CLIP frame's poster is a copy
        of its source media's. Only accepted while the render is RUNNING — 409 once it has SUCCEEDED or
        FAILED; refused with a plain 400 if no frame is stored yet for this placement/index. Requires ADMIN
        or CREATOR.
      operationId: putCreativeRenderFramePoster
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
        - name: renderId
          in: path
          required: true
          schema:
            type: string
        - name: placementKey
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: query
          required: false
          description: Sequence position for a story/carousel frame; omitted for a single-frame placement.
          schema:
            type: integer
      requestBody:
        required: true
        description: Raw JPEG bytes, at most 20 MB.
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Poster stored
        "400":
          description: No frame is stored yet for this placement/index
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Render not found, does not belong to this Creative, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The render is no longer RUNNING (already SUCCEEDED or FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Content-Type is not image/jpeg
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/renders/{renderId}/complete:
    post:
      tags:
        - creatives
      summary: Mark a render SUCCEEDED
      operationId: completeCreativeRender
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
        - name: renderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteCreativeRenderRequest"
      responses:
        "200":
          description: The render, now SUCCEEDED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeRenderResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Render not found, does not belong to this Creative, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The render is no longer RUNNING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/renders/{renderId}/fail:
    post:
      tags:
        - creatives
      summary: Mark a render FAILED
      description: Deletes every frame already written for this render (AC-P0-3.2) — a failed render leaves nothing behind for attach to find.
      operationId: failCreativeRender
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
        - name: renderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailCreativeRenderRequest"
      responses:
        "200":
          description: The render, now FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeRenderResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Render not found, does not belong to this Creative, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The render is no longer RUNNING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/attach:
    post:
      tags:
        - creatives
      summary: Attach a render's frames to a Post
      description: >-
        Links every non-`sheet` frame of a SUCCEEDED render to the Post as its own asset (one Asset per frame, all pointing at the frame's stored object; nothing is copied), then — for
        targets with `custom_media = false` only — sets each destination's media by placement (`9x16` to
        TikTok and Instagram Reels, `4x5` to Instagram feed, `1x1` to Facebook, `story` to story-format
        targets; sequences in index order, never sorted) through the same target media-selection path a
        person uses, so the approval gate and bundle hash treat it exactly like any other customisation.
        A target with `custom_media = true` is reported in `targetsSkipped` and left untouched. Requires
        ADMIN or CREATOR, and the Work Item must be a Post in this project the caller can edit. A DRAFT
        Creative that passes its readiness checklist becomes READY as part of the attach (`creativeState`);
        one that does not stays DRAFT and `stateNote` says why. READY and ARCHIVED Creatives are left as they are.
      operationId: attachCreative
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachCreativeRequest"
      responses:
        "200":
          description: What was attached and how each target's media selection changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachCreativeResponse"
        "400":
          description: The Work Item is not a Post (its Workflow does not declare publishing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found; render not found or does not belong to this Creative; Work Item not found or not in this project; or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The render is not SUCCEEDED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/experiments:
    get:
      tags:
        - creatives
      summary: List hook experiments (COND-24 T5)
      operationId: listCreativeExperiments
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: query
          required: false
          schema:
            type: string
          description: Restrict to one Creative family — any lettered variant or the root, resolved automatically.
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CreativeExperimentState"
      responses:
        "200":
          description: Experiments, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreativeExperimentResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: creativeId given but not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - creatives
      summary: Start a hook experiment
      description: >-
        Opens one RUNNING experiment on a Creative family. The family (found from creativeId, any
        lettered variant or the root) must have at least two variants, and may have at most one RUNNING
        experiment at a time. Call getCreativeExperiment (or getCreative, which carries
        activeExperimentId) after to verify.
      operationId: createCreativeExperiment
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCreativeExperimentRequest"
      responses:
        "201":
          description: The new RUNNING experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeExperimentResponse"
        "400":
          description: The family has fewer than two variants, or an unknown metric was given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The family already has a RUNNING experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/experiments/{experimentId}:
    get:
      tags:
        - creatives
      summary: Read one hook experiment
      operationId: getCreativeExperiment
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: experimentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeExperimentResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Experiment not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/experiments/{experimentId}/decide:
    post:
      tags:
        - creatives
      summary: Decide a hook experiment
      description: >-
        Settles a RUNNING experiment once every variant in the family has at least one published,
        attributed destination with a snapshot at or after fireTime + windowHours: the winner is the
        variant with the highest avg_view_pct when every variant reports it, else the experiment's own
        metric (default views). An exact tie among the leaders settles INCONCLUSIVE immediately. While any
        variant is still missing window data this is a safe no-op that leaves the experiment RUNNING and
        returns it unchanged — unless the last outstanding variant's deadline is more than seven days
        past, in which case the experiment gives up and settles INCONCLUSIVE rather than wait forever.
        Calling this on an already-DECIDED or already-INCONCLUSIVE experiment returns it unchanged.
      operationId: decideCreativeExperiment
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: experimentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The experiment after the decision attempt (state may be unchanged)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeExperimentResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Experiment not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/experiments/{experimentId}/confirm-winner:
    post:
      tags:
        - creatives
      summary: Confirm a decided experiment's winning headline into the Brand Kit
      description: >-
        Appends the winning variant's headline to its family's Brand Kit approved_lines (deduplicated) and
        stamps who confirmed it and when. Requires ADMIN or CREATOR — this is the one human action that
        lets a decided winner influence future brand copy; it is never automatic, and decide never calls
        it. Refused with 400 when the experiment has no decided winner. Idempotent: calling it again on an
        already-confirmed experiment is a no-op that never appends the line twice.
      operationId: confirmCreativeExperimentWinner
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: experimentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The experiment with winnerLineConfirmedAt/By set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeExperimentResponse"
        "400":
          description: The experiment has no decided winner (not DECIDED, or DECIDED with no winner)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Experiment not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: http
      scheme: bearer
      description: API key authentication (Bearer token)

  schemas:
    WorkItemResponse:
      type: object
      required:
        - id
        - projectId
        - type
        - title
        - status
        - createdBy
        - createdAt
        - updatedAt
        - sequenceNumber
        - displayId
      properties:
        id:
          type: string
        projectId:
          type: string
        type:
          type: string
          description: Work Item type — a Workflow-defined string (e.g. PRD).
        title:
          type: string
        description:
          type: string
        status:
          type: string
          description: Current status — a Workflow-defined status id (e.g. DRAFT).
        statusLabel:
          type: string
          readOnly: true
          description: >-
            The status's human display label from the item's resolved Workflow statechart (e.g. "In
            Review" for IN_REVIEW), or a humanized form of the id when the statechart sets none.
        workflow:
          type: string
          description: The bound Workflow definition id (slug, e.g. ENGINEERING).
        createdBy:
          type: string
          nullable: true
          description: >-
            Creating user's id. Null when a machine actor (e.g. an addressable agent) created this
            item — createdByLabel carries its identity instead. Exactly one of the two is set.
        createdByLabel:
          type: string
          description: Machine actor's display label (e.g. "Agent (ceo)"), set only when createdBy is null.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sequenceNumber:
          type: integer
        displayId:
          type: string
          description: Human-readable ID (e.g. "COND-42")
        unresolvedCommentCount:
          type: integer
        assignee:
          $ref: "#/components/schemas/WorkItemAssignee"
        scheduledFor:
          type: string
          format: date-time
          nullable: true
          description: >-
            When this Work Item is due, as an ISO-8601 date-time. Workflow-agnostic — any Workflow may put
            an item on a clock. Null when the item is not scheduled.
        scheduleTimezone:
          type: string
          nullable: true
          description: >-
            IANA zone id the schedule was authored in (e.g. America/New_York), retained alongside the
            absolute instant so a local-wall-clock reading survives DST. Null when unscheduled.
        fields:
          type: object
          additionalProperties: true
          description: >-
            Values for the typed fields the bound Workflow declares, keyed by field key. Absent keys are
            empty. See the Workflow definition's `fields` for keys, types and the statuses that require them.
        dueOn:
          type: string
          format: date
          nullable: true
          description: >-
            Calendar date this Work Item is due (yyyy-MM-dd); the Workflow's `dueLabel` names it (e.g.
            "Review on"). Null when it has none.
        publishOnApproval:
          type: boolean
          description: >-
            Publish as soon as approved. The Post needs no fire time before its scheduled status; entering
            it stamps scheduledFor with the earliest time every destination accepts.
        currentReviewRound:
          type: integer
          description: >-
            The review round currently open on this Work Item (0 until its first review is closed or its bundle
            edited under review). A verdict or content change belongs to the round it was made in, so compare it
            with `PostContentChange.reviewRoundAfter` to tell whether a change opened the current round.
        tags:
          type: array
          description: >-
            Freeform labels on this Work Item, for grouping work across type, status and Workflow.
            Stored lower-cased, so "Autumn" and "autumn" are one tag rather than two that look identical
            in a filter list. Empty until something is tagged.
          items:
            type: string
        reviewers:
          type: array
          description: >-
            The reviewers assigned to this Work Item. Populated on the list response only (loaded in one
            batch for the whole page, so the list never needs a per-row reviewers call); omitted on the
            single-item reads, which have GET .../reviewers.
          items:
            $ref: "#/components/schemas/ReviewerResponse"
        externalLinks:
          type: array
          description: >-
            Where this Work Item ended up outside Conductor: every link Asset recorded on it, oldest first.
            Workflow-agnostic by construction — it is whatever the item's own `asset_types` allow, so a
            Post carries the live posts it published to and an Issue carries its pull request. Empty until
            something is recorded.


            It is on the list response, not only the detail one, because a link nobody can reach without
            opening the item is a link nobody finds: the calendar and list surfaces are where a human looks
            to ask "did that go out, and where is it?".
          items:
            $ref: "#/components/schemas/WorkItemExternalLink"
        thumbnailUrl:
          type: string
          nullable: true
          readOnly: true
          description: >-
            List response only. A short-lived signed URL for the first image attached to this item (the
            Post's first media), for a thumbnail. Null when it has no image, and on single-item reads.
        publishTargets:
          type: array
          readOnly: true
          description: >-
            List response only. Where this item is going out to and how each destination stands, one entry
            per (platform, account) target, so a list can show a failed destination without opening the
            item. Loaded in one batch for the whole page. Empty for items that publish nowhere; omitted on
            single-item reads (use GET .../publish-targets).
          items:
            $ref: "#/components/schemas/WorkItemPublishTargetSummary"
        creative:
          $ref: "#/components/schemas/WorkItemCreativeRef"
        enrichmentFailed:
          type: boolean
          nullable: true
          readOnly: true
          description: >-
            List response only, with `enrich=true`. True when the extras could not be worked out for this item
            (its Workflow could not be resolved), so whether it has live destinations is UNKNOWN. A client
            must not treat such an item as one that is not live. Absent otherwise.
        parentWorkItemId:
          type: string
          nullable: true
          description: The Work Item this one is a sub-item of; null for a top-level item.
        priority:
          $ref: "#/components/schemas/WorkItemPriority"
        milestoneId:
          type: string
          nullable: true
          description: The milestone this item is grouped under; null when it has none.
        milestoneName:
          type: string
          nullable: true
          readOnly: true
        appetite:
          type: string
          nullable: true
          description: The time box this item is worth, normalised (e.g. "2 weeks"); null when none is set.
        appetiteDays:
          type: integer
          nullable: true
          readOnly: true
          description: "`appetite` in days (a week is 7, a month 30)."
        startedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: When the item first moved into an in-progress status. Null until it does.
        completedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: When the item entered a terminal status. Null while it is open or if it was reopened.
        childCount:
          type: integer
          readOnly: true
          description: How many direct sub-items this item has.
        progress:
          $ref: "#/components/schemas/WorkItemProgress"
        signals:
          $ref: "#/components/schemas/WorkItemSignals"
        agentActivity:
          $ref: "#/components/schemas/WorkItemAgentActivity"
        health:
          $ref: "#/components/schemas/WorkItemHealth"

    WorkItemBlocker:
      type: object
      description: A blocker that has not finished yet.
      required: [id, displayId, title]
      properties:
        id:
          type: string
        displayId:
          type: string
        title:
          type: string

    WorkItemSignals:
      type: object
      description: >-
        Facts derived on read from the item's dependencies, status and agent sessions (see docs/prd-tracking.md).
      required: [blocked, blockedBy, ready, stale, needsInput]
      properties:
        blocked:
          type: boolean
          description: A BLOCKS blocker has not reached a terminal status in its own Workflow.
        blockedBy:
          type: array
          items:
            $ref: "#/components/schemas/WorkItemBlocker"
        ready:
          type: boolean
          description: Not blocked, in an `open` status and not terminal; assignee is irrelevant.
        stale:
          type: boolean
          description: In progress, untouched for seven days, and no agent session WORKING within seven days.
        needsInput:
          type: boolean
          description: The latest open agent session (for an item with children, on it or any descendant) is NEEDS_INPUT.

    WorkItemAgentActivity:
      type: object
      description: The latest open agent session on the item.
      required: [agentLabel, mode, activity, updatedAt]
      properties:
        agentLabel:
          type: string
        mode:
          type: string
          enum: [DELEGATE, ASSIGNEE]
        activity:
          type: string
          enum: [WORKING, NEEDS_INPUT, DONE, ERRORED]
        note:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time

    WorkItemHealthStatus:
      type: string
      enum: [ON_TRACK, AT_RISK, OFF_TRACK]

    WorkItemHealthDraft:
      type: object
      description: A health update an agent proposed that no person has confirmed yet (and is under 48 hours old).
      required: [updateId, health, note, createdAt]
      properties:
        updateId:
          type: string
        health:
          $ref: "#/components/schemas/WorkItemHealthStatus"
        note:
          type: string
        draftedByLabel:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    WorkItemHealth:
      type: object
      description: >-
        The item's health: the latest *confirmed* update, any newer pending draft, and the derived `atRisk`.
        Null on the item when it has no confirmed update, no pending draft and is not at risk. `health`,
        `note` and `updatedAt` are null when only a draft (or only a forecast risk) exists.
      required: [stale, atRisk]
      properties:
        health:
          $ref: "#/components/schemas/WorkItemHealthStatus"
        note:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the current (confirmed) update was confirmed.
        stale:
          type: boolean
          description: The confirmed update is older than seven days while the item is in progress.
        pendingDraft:
          $ref: "#/components/schemas/WorkItemHealthDraft"
        atRisk:
          type: boolean
          description: >-
            Confirmed AT_RISK or OFF_TRACK, or stale, or (where a forecast was computed: single reads and the
            overview) the P85 date is past the appetite end or milestone target.

    WorkItemHealthUpdateResponse:
      type: object
      required: [id, health, note, confirmed, createdAt]
      properties:
        id:
          type: string
        health:
          $ref: "#/components/schemas/WorkItemHealthStatus"
        note:
          type: string
        draftedByLabel:
          type: string
          nullable: true
        confirmed:
          type: boolean
        confirmedByName:
          type: string
          nullable: true
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateWorkItemHealthUpdateRequest:
      type: object
      required: [health, note, draft]
      properties:
        health:
          $ref: "#/components/schemas/WorkItemHealthStatus"
        note:
          type: string
          minLength: 1
          maxLength: 2000
        draft:
          type: boolean
          description: True records a pending draft; false records a confirmed update (a person only).

    ConfirmWorkItemHealthUpdateRequest:
      type: object
      properties:
        health:
          $ref: "#/components/schemas/WorkItemHealthStatus"
        note:
          type: string
          maxLength: 2000

    ForecastFit:
      type: string
      enum: [FITS, TIGHT, EXCEEDS]
      description: P85 fits the date (FITS), only P50 does (TIGHT), or neither (EXCEEDS).

    WorkItemForecast:
      type: object
      description: >-
        When the open leaf tasks under the item will be done. `state` DONE: nothing left. NO_PLAN: the item
        has no sub-items. INSUFFICIENT_DATA: fewer than `needed` completed tasks to learn from. OK: dates present.
      required: [state, remaining, samples]
      properties:
        state:
          type: string
          enum: [DONE, NO_PLAN, INSUFFICIENT_DATA, OK]
        mode:
          type: string
          enum: [THROUGHPUT, CYCLE_TIME]
          nullable: true
          description: Only when state is OK. CYCLE_TIME has no p85Date and no weeklyThroughputMedian.
        remaining:
          type: integer
          description: Open leaf tasks left.
        samples:
          type: integer
          description: Completed leaf tasks learned from (last 90 days).
        needed:
          type: integer
          nullable: true
          description: Samples required, present for INSUFFICIENT_DATA.
        weeklyThroughputMedian:
          type: number
          format: double
          nullable: true
        p50Date:
          type: string
          format: date
          nullable: true
        p85Date:
          type: string
          format: date
          nullable: true
        appetiteEndsOn:
          type: string
          format: date
          nullable: true
          description: Start (or creation, if never started) plus the appetite; null without an appetite.
        appetiteFit:
          $ref: "#/components/schemas/ForecastFit"
        milestoneFit:
          $ref: "#/components/schemas/ForecastFit"

