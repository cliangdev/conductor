          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
          type: array
          nullable: true
          description: >-
            Set only for a CAROUSEL render with a track: the 9x16 slide list (the `default` list when there
            is no 9x16 one), in order. In a draft spec a local file is the literal `local:<key>`.
          items:
            $ref: "#/components/schemas/CreativeRenderSpecSlide"
        slideshow:
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
          allOf:
            - $ref: "#/components/schemas/CreativeRenderSpecSlideshow"
          nullable: true
          description: Set only for a CAROUSEL render with a track.

    CreativeRenderSpecMotionBackground:
      type: object
      description: The resolved background for a MOTION render — `clipUrl` is a signed GET (valid at least 30 minutes), set only when `source` is "clip".
      properties:
        source:
          type: string
        motion:
          type: string
        clipUrl:
          type: string
          nullable: true
        clipStartSec:
          type: number
          nullable: true

    CreativeRenderSpecMotion:
      type: object
      description: The resolved animation timeline for a MOTION render, defaults already applied.
      properties:
        preset:
          type: string
        durationSec:
          type: number
        background:
          $ref: "#/components/schemas/CreativeRenderSpecMotionBackground"
        endCard:
          type: boolean

    CreativeRenderSpecSlide:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: A signed GET (valid at least 30 minutes), or `local:<key>` in a draft spec.

    CreativeRenderSpecSlideshow:
      type: object
      description: The resolved slideshow of a CAROUSEL render with a track, defaults already applied.
      required:
        - slideDurations
        - zoom
        - crossfadeSec
      properties:
        slideDurations:
          type: array
          description: Seconds per slide, one entry per entry of `creative.slides`.
          items:
            type: number
        zoom:
          type: boolean
        crossfadeSec:
          type: number
          description: Fixed at 0.5.

    CreativeRenderSpecAudio:
      type: object
      description: >-
        The resolved audio for a local render, defaults already applied. `trackUrl` is a signed GET (valid
        at least 30 minutes), set only when `source` is "track" or "mix". `fadeInSec` and `targetLufs`
        are set for CAROUSEL and CLIP (0.5 s and -14); MOTION leaves them null and is not normalised.
      properties:
        source:
          type: string
        trackUrl:
          type: string
          nullable: true
        volume:
          type: number
          nullable: true
        fadeOutSec:
          type: number
          nullable: true
        fadeInSec:
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
          type: number
          nullable: true
        targetLufs:
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
          type: number
          nullable: true

    CreativeRenderSpec:
      type: object
      description: The render input a local job (MCP tool or CLI) renders from. Returned only by the POST that creates a render (and, with renderId `draft`, by the draft-spec POST), never by a GET.
      required:
        - renderId
        - previewOnly
        - creative
        - brand
        - placements
      properties:
        renderId:
          type: string
        previewOnly:
          type: boolean
        creative:
          $ref: "#/components/schemas/CreativeRenderSpecCreative"
        brand:
          $ref: "#/components/schemas/CreativeRenderSpecBrand"
        placements:
          type: array
          items: {}
          description: >-
            The resolved placements this render must produce one frame per. STILL and MOTION: placement key
            strings, (kit-enabled ∪ Creative opt-ins) ∩ registry, or ["story"]/[carouselRatio] for a
            sequence Creative. CAROUSEL with a track: one object `{key: "9x16", width: 1080, height: 1920}`.
            CLIP with a new sound: one object per placement frame, `{key, width, height, clipUrl,
            clipStartSec?, durationSec, clipHasAudio}`, `clipUrl` a signed GET (a local file in a draft is
            `local:<key>`).

    CreativeRenderFrameResponse:
      type: object
      required:
        - id
        - placementKey
        - url
        - width
        - height
        - sizeBytes
        - contentType
        - warnings
      properties:
        id:
          type: string
        placementKey:
          type: string
        platform:
          type: string
          nullable: true
        sequenceIndex:
          type: integer
          nullable: true
        url:
          type: string
          description: Short-lived signed GET URL.
        width:
          type: integer
        height:
          type: integer
        sizeBytes:
          type: integer
          format: int64
        contentType:
          type: string
          description: image/jpeg or image/png for an image frame (a STILL, or a CAROUSEL slide); video/mp4 for a video frame (CLIP, MOTION, or a CAROUSEL's slideshow with its track).
        durationSeconds:
          type: number
          nullable: true
          description: Set for a video frame; null for an image frame.
        hasAudio:
          type: boolean
          nullable: true
          description: Set for a video frame; null for an image frame.
        posterUrl:
          type: string
          nullable: true
          description: Short-lived signed GET URL of a video frame's poster JPEG, if it has one.
        warnings:
          type: array
          items:
            type: string

    CreativeRenderResponse:
      type: object
      required:
        - id
        - state
        - previewOnly
        - creativeVersion
        - requestedAt
        - frames
      properties:
        id:
          type: string
        state:
          $ref: "#/components/schemas/CreativeRenderState"
        previewOnly:
          type: boolean
        renderer:
          type: string
          nullable: true
        workflowRunId:
          type: string
          nullable: true
        creativeVersion:
          type: integer
        requestedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
        frames:
          type: array
          items:
            $ref: "#/components/schemas/CreativeRenderFrameResponse"
        spec:
          allOf:
            - $ref: "#/components/schemas/CreativeRenderSpec"
          nullable: true
          description: Only ever set on the response to the POST that creates the render.

    CreativeRenderWarning:
      type: object
      required:
        - placementKey
        - message
      properties:
        placementKey:
          type: string
        index:
          type: integer
          nullable: true
        message:
          type: string

    CompleteCreativeRenderRequest:
      type: object
      properties:
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/CreativeRenderWarning"

    FailCreativeRenderRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        log:
          type: string
          nullable: true

    # ── Attach (COND-24 T3) ────────────────────────────────────────────────────────────────────────

    AttachCreativeRequest:
      type: object
      required:
        - renderId
        - workItemId
      properties:
        renderId:
          type: string
        workItemId:
          type: string
          description: The Post (Work Item) this render's frames attach to.

    AttachedCreativeAsset:
      type: object
      required:
        - assetId
        - frameId
        - placementKey
      properties:
        assetId:
          type: string
        frameId:
          type: string
        placementKey:
          type: string
        sequenceIndex:
          type: integer
          nullable: true

    AttachCreativeTargetUpdate:
      type: object
      required:
        - targetId
        - platform
        - assetIds
      properties:
        targetId:
          type: string
        platform:
          type: string
        assetIds:
          type: array
          items:
            type: string
          description: In publish order — never re-sorted.
        altText:
          type: string
          nullable: true
          description: >-
            The alt text attach set on this Instagram destination's `altText` option (from the Creative's
            alt text). Null when attach set none.
        carouselAs:
          type: string
          nullable: true
          enum:
            - photos
            - video
          description: >-
            For a CAROUSEL Creative with a track: how attach resolved this destination, now stored in its
            `carouselAs` option. Null for any other Creative.
        warning:
          type: string
          nullable: true
          description: Something the person should know about what this destination got (e.g. video wanted but none rendered).

    AttachCreativeTargetSkip:
      type: object
      required:
        - targetId
        - platform
        - reason
      properties:
        targetId:
          type: string
        platform:
          type: string
        reason:
          type: string

    AttachCreativeResponse:
      type: object
      required:
        - assets
        - targetsUpdated
        - targetsSkipped
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/AttachedCreativeAsset"
        targetsUpdated:
          type: array
          items:
            $ref: "#/components/schemas/AttachCreativeTargetUpdate"
        targetsSkipped:
          type: array
          items:
            $ref: "#/components/schemas/AttachCreativeTargetSkip"

    CreativePerformancePlatform:
      type: object
      description: One platform's slice of one Creative variant's numbers.
      required:
        - platform
        - posts
        - views
      properties:
        platform:
          type: string
        posts:
          type: integer
        views:
          type: integer
          format: int64
        engagementRate:
          type: number
          format: double
          nullable: true

    CreativePerformanceEntry:
      type: object
      description: One Creative variant's attributed performance — published destinations whose media traces back to one of its rendered frames.
      required:
        - creativeId
        - label
        - posts
        - views
        - byPlatform
      properties:
        creativeId:
          type: string
        label:
          type: string
          description: The variant's display id, e.g. "12b".
        headline:
          type: string
          nullable: true
        posts:
          type: integer
          description: Published, attributed destinations with at least one reported snapshot.
        views:
          type: integer
          format: int64
        engagementRate:
          type: number
          format: double
          nullable: true
          description: (likes + comments + shares + saves) / views across every attributed destination; null when views are zero or there is no data.
        avgViewPct:
          type: number
          format: double
          nullable: true
          description: Mean average-view-percentage where a platform reports it (YouTube); null otherwise.
        views72h:
          type: integer
          format: int64
          nullable: true
          description: Summed views at the snapshot nearest at or after each destination's fireTime + 72h; null when no destination has reached that snapshot yet.
        byPlatform:
          type: array
          items:
            $ref: "#/components/schemas/CreativePerformancePlatform"

    CreativePerformanceResponse:
      type: object
      required:
        - creativeId
        - family
      properties:
        creativeId:
          type: string
          description: The Creative id this performance read was requested for (echoed back).
        family:
          type: array
          items:
            $ref: "#/components/schemas/CreativePerformanceEntry"
          description: Every lettered variant of this Creative's family, oldest letter first.

    CreativeExperimentMetric:
      type: string
      enum:
        - views
        - engagement_rate
        - avg_view_pct
      description: >-
        The metric requested at creation. The decision itself prefers avg_view_pct whenever every variant
        reports it, regardless of this value — see CreativeExperimentService.

    CreativeExperimentState:
      type: string
      enum:
        - RUNNING
        - DECIDED
        - INCONCLUSIVE

    CreateCreativeExperimentRequest:
      type: object
      required:
        - creativeId
      properties:
        creativeId:
          type: string
          description: Any Creative in the family (a lettered variant or the root) — resolved to the family's root automatically.
        metric:
          $ref: "#/components/schemas/CreativeExperimentMetric"
        windowHours:
          type: integer
          description: Defaults to 72.

    CreativeExperimentResponse:
      type: object
      required:
        - id
        - projectId
        - parentCreativeId
        - metric
        - windowHours
        - state
        - createdAt
      properties:
        id:
          type: string
        projectId:
          type: string
        parentCreativeId:
          type: string
          description: The family's root Creative id (variant letter "a").
        metric:
          $ref: "#/components/schemas/CreativeExperimentMetric"
        windowHours:
          type: integer
        state:
          $ref: "#/components/schemas/CreativeExperimentState"
        winnerCreativeId:
          type: string
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        summary:
          type: object
          nullable: true
          additionalProperties: true
          description: Per-variant numbers used to decide (or why a decision could not be made yet). Shape documented in docs/creatives.md.
        winnerLineConfirmedAt:
          type: string
          format: date-time
          nullable: true
        winnerLineConfirmedBy:
          type: string
          nullable: true
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
