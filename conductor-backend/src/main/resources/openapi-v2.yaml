              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags:
        - creatives
      summary: Update a Creative
      description: >-
        `version` must match the Creative's current version or the write is refused with 409 — read
        the Creative again, reapply the edit on top of the newer version. Changing `headline` or
        `layout` clears any pinned `typeOverrides` for the fields that changed, exactly like nexus's
        `setConcept`. Requires ADMIN or CREATOR.
      operationId: patchCreative
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchCreativeRequest"
      responses:
        "200":
          description: The updated Creative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The supplied `version` is stale — the Creative was changed since it was read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            The patched Creative fails a structural or (if `state` is or becomes `READY`) readiness
            rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeValidationProblem"
    delete:
      tags:
        - creatives
      summary: Delete a Creative
      description: >-
        Refused when a render frame of this Creative is still referenced by a Post asset (remove it
        from the Post first), or when this is a family root (variant letter `a`) and other lettered
        variants still exist (delete those first). Otherwise deletes, in one transaction, this
        Creative's hook experiments (where it is the family root, and nulling out any experiment
        elsewhere that names it as winner), its renders and render frames, then the Creative itself;
        the stored frame objects are removed from storage best-effort after the delete commits.
        Requires ADMIN or CREATOR.
      operationId: deleteCreative
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A render frame is still on a Post, or this is a family root with variants still present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/variants:
