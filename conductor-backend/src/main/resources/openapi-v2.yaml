                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/revisions/{revisionId}:
    get:
      tags:
        - creatives
      summary: One slideshow-spec revision, with what the render job needs
      description: >-
        The revision plus its candidate `spec`, `baseVersion`, `changedSlides`, `renderLists`, `altTextFlags` and the
        Creative's current `slides` map and `slideStyle`, so the render job needs one call. Any project member may read; a
        workflow run token only for the revision's own run. A PENDING revision whose run ended without
