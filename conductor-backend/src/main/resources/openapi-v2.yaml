          description: The render, now FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeRenderResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Render not found, does not belong to this Creative, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The render is no longer RUNNING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/attach:
    post:
      tags:
        - creatives
      summary: Attach a render's frames to a Post
      description: >-
        Links every non-`sheet` frame of a SUCCEEDED render to the Post as its own asset (one Asset per frame, all pointing at the frame's stored object; nothing is copied), then — for
        targets with `custom_media = false` only — sets each destination's media by placement (`9x16` to
        TikTok and Instagram Reels, `4x5` to Instagram feed, `1x1` to Facebook, `story` to story-format
        targets; sequences in index order, never sorted) through the same target media-selection path a
        person uses, so the approval gate and bundle hash treat it exactly like any other customisation.
        A target with `custom_media = true` is reported in `targetsSkipped` and left untouched. Requires
        ADMIN or CREATOR, and the Work Item must be a Post in this project the caller can edit.
      operationId: attachCreative
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachCreativeRequest"
      responses:
        "200":
          description: What was attached and how each target's media selection changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachCreativeResponse"
        "400":
          description: The Work Item is not a Post (its Workflow does not declare publishing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found; render not found or does not belong to this Creative; Work Item not found or not in this project; or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The render is not SUCCEEDED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/experiments:
    get:
      tags:
        - creatives
      summary: List hook experiments (COND-24 T5)
      operationId: listCreativeExperiments
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: query
          required: false
          schema:
            type: string
          description: Restrict to one Creative family — any lettered variant or the root, resolved automatically.
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CreativeExperimentState"
      responses:
        "200":
          description: Experiments, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreativeExperimentResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: creativeId given but not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - creatives
      summary: Start a hook experiment
      description: >-
        Opens one RUNNING experiment on a Creative family. The family (found from creativeId, any
        lettered variant or the root) must have at least two variants, and may have at most one RUNNING
        experiment at a time. Call getCreativeExperiment (or getCreative, which carries
        activeExperimentId) after to verify.
      operationId: createCreativeExperiment
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCreativeExperimentRequest"
      responses:
        "201":
          description: The new RUNNING experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeExperimentResponse"
        "400":
          description: The family has fewer than two variants, or an unknown metric was given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The family already has a RUNNING experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/experiments/{experimentId}:
    get:
      tags:
        - creatives
      summary: Read one hook experiment
      operationId: getCreativeExperiment
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: experimentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeExperimentResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Experiment not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/experiments/{experimentId}/decide:
    post:
      tags:
        - creatives
      summary: Decide a hook experiment
      description: >-
        Settles a RUNNING experiment once every variant in the family has at least one published,
        attributed destination with a snapshot at or after fireTime + windowHours: the winner is the
        variant with the highest avg_view_pct when every variant reports it, else the experiment's own
        metric (default views). An exact tie among the leaders settles INCONCLUSIVE immediately. While any
        variant is still missing window data this is a safe no-op that leaves the experiment RUNNING and
        returns it unchanged — unless the last outstanding variant's deadline is more than seven days
        past, in which case the experiment gives up and settles INCONCLUSIVE rather than wait forever.
        Calling this on an already-DECIDED or already-INCONCLUSIVE experiment returns it unchanged.
      operationId: decideCreativeExperiment
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: experimentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The experiment after the decision attempt (state may be unchanged)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeExperimentResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Experiment not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/experiments/{experimentId}/confirm-winner:
    post:
      tags:
        - creatives
      summary: Confirm a decided experiment's winning headline into the Brand Kit
      description: >-
        Appends the winning variant's headline to its family's Brand Kit approved_lines (deduplicated) and
        stamps who confirmed it and when. Requires ADMIN or CREATOR — this is the one human action that
        lets a decided winner influence future brand copy; it is never automatic, and decide never calls
        it. Refused with 400 when the experiment has no decided winner. Idempotent: calling it again on an
        already-confirmed experiment is a no-op that never appends the line twice.
      operationId: confirmCreativeExperimentWinner
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: experimentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The experiment with winnerLineConfirmedAt/By set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeExperimentResponse"
        "400":
          description: The experiment has no decided winner (not DECIDED, or DECIDED with no winner)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Experiment not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: http
      scheme: bearer
      description: API key authentication (Bearer token)

  schemas:
    WorkItemResponse:
      type: object
      required:
        - id
        - projectId
        - type
        - title
        - status
        - createdBy
        - createdAt
        - updatedAt
        - sequenceNumber
        - displayId
      properties:
        id:
          type: string
        projectId:
          type: string
        type:
          type: string
          description: Work Item type — a Workflow-defined string (e.g. PRD).
        title:
          type: string
        description:
          type: string
        status:
          type: string
          description: Current status — a Workflow-defined status id (e.g. DRAFT).
        statusLabel:
          type: string
          readOnly: true
          description: >-
            The status's human display label from the item's resolved Workflow statechart (e.g. "In
            Review" for IN_REVIEW), or a humanized form of the id when the statechart sets none.
        workflow:
          type: string
          description: The bound Workflow definition id (slug, e.g. ENGINEERING).
        createdBy:
          type: string
          nullable: true
          description: >-
            Creating user's id. Null when a machine actor (e.g. an addressable agent) created this
            item — createdByLabel carries its identity instead. Exactly one of the two is set.
        createdByLabel:
          type: string
          description: Machine actor's display label (e.g. "Agent (ceo)"), set only when createdBy is null.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sequenceNumber:
          type: integer
        displayId:
          type: string
          description: Human-readable ID (e.g. "COND-42")
        unresolvedCommentCount:
          type: integer
        assignee:
          $ref: "#/components/schemas/WorkItemAssignee"
        scheduledFor:
          type: string
          format: date-time
          nullable: true
          description: >-
            When this Work Item is due, as an ISO-8601 date-time. Workflow-agnostic — any Workflow may put
            an item on a clock. Null when the item is not scheduled.
        scheduleTimezone:
          type: string
          nullable: true
          description: >-
            IANA zone id the schedule was authored in (e.g. America/New_York), retained alongside the
            absolute instant so a local-wall-clock reading survives DST. Null when unscheduled.
        fields:
          type: object
          additionalProperties: true
          description: >-
            Values for the typed fields the bound Workflow declares, keyed by field key. Absent keys are
            empty. See the Workflow definition's `fields` for keys, types and the statuses that require them.
        dueOn:
          type: string
          format: date
          nullable: true
          description: >-
            Calendar date this Work Item is due (yyyy-MM-dd); the Workflow's `dueLabel` names it (e.g.
            "Review on"). Null when it has none.
        publishOnApproval:
          type: boolean
          description: >-
            Publish as soon as approved. The Post needs no fire time before its scheduled status; entering
            it stamps scheduledFor with the earliest time every destination accepts.
        tags:
          type: array
          description: >-
            Freeform labels on this Work Item, for grouping work across type, status and Workflow.
            Stored lower-cased, so "Autumn" and "autumn" are one tag rather than two that look identical
            in a filter list. Empty until something is tagged.
          items:
            type: string
        reviewers:
          type: array
          description: >-
            The reviewers assigned to this Work Item. Populated on the list response only (loaded in one
            batch for the whole page, so the list never needs a per-row reviewers call); omitted on the
            single-item reads, which have GET .../reviewers.
          items:
            $ref: "#/components/schemas/ReviewerResponse"
        externalLinks:
          type: array
          description: >-
            Where this Work Item ended up outside Conductor: every link Asset recorded on it, oldest first.
            Workflow-agnostic by construction — it is whatever the item's own `asset_types` allow, so a
            Post carries the live posts it published to and an Issue carries its pull request. Empty until
            something is recorded.


            It is on the list response, not only the detail one, because a link nobody can reach without
            opening the item is a link nobody finds: the calendar and list surfaces are where a human looks
            to ask "did that go out, and where is it?".
          items:
            $ref: "#/components/schemas/WorkItemExternalLink"

    WorkItemExternalLink:
      type: object
      required:
        - url
        - type
      properties:
        url:
          type: string
          description: The Asset's ref — the address of the thing itself.
        type:
          type: string
          description: >-
            The Asset type, one of the bound Workflow's declared `asset_types` (e.g. `instagram_post`,
            `github_pr`). A client uses it to choose an icon or a label; it is not an enum here because the
            set is Workflow-defined.
        label:
          type: string
          nullable: true
          description: Human-readable name captured when the link was recorded (e.g. the account it went to).

