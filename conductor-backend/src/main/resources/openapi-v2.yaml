      operationId: getCreativeRevision
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeRevisionDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: A run token for another run or Creative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Revision or Creative not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/revisions/{revisionId}/complete:
    post:
      tags:
        - creatives
      summary: Report the re-rendered slides of a PENDING revision
      description: >-
        Called by the render job with the media it uploaded. `slideMedia` is keyed by ratio (`9x16`, `4x5`) then
        1-based slide number (as a string) and must cover exactly the revision's changed slides for every ratio
        the revision's `renderLists` have (anything else FAILS the revision, 200, with the reason in `error`). Any check with severity `error` FAILS the revision (checks
        stored, nothing else changes, still 200). Otherwise, in one transaction: the version guard (the
        Creative must still be at the revision's `baseVersion`, else FAILED), the new media is marked checked,
        the changed slide entries are replaced in every affected list, `slideshowSpec` is set to the revision's
        spec, `version` is bumped, alt-text flags and the snapshots are stored and the revision is APPLIED; then
        the Creative is re-rendered (instantly without a track, as a queued render run with one). Every
        validation runs before anything is written: a FAILED revision leaves the Creative untouched, and the images
        the revision minted that did not end up in the Creative are deleted (so are those of a revision failed through
        `.../fail`). A run token may only name images minted for this revision (anything else FAILS it). A Creative that has gained a 1x1 (or other unsupported) list since the edit was accepted FAILS
        the revision too. Auth: the revision's own run token, or a project
        ADMIN / CREATOR.
      operationId: completeCreativeRevision
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteCreativeRevisionRequest"
      responses:
        "200":
          description: The revision, now APPLIED or FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeRevision"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: A run token for another run or Creative, or a caller who is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Revision or Creative not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The revision is no longer PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            `slideMediaInvalid`: the body is malformed (a ratio other than `9x16` / `4x5`, a slide that is not a
            positive number, an empty media id). The revision stays PENDING. Media that does not cover the changed
            slides, or is not an uploaded image of the project, is not a 422: it FAILS the revision (200).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeValidationProblem"

  /projects/{projectId}/marketing/creatives/{creativeId}/revisions/{revisionId}/fail:
    post:
      tags:
        - creatives
      summary: Mark a PENDING revision FAILED
      description: >-
        Called by the render job when it cannot produce the slides. Stores `error` and any `checks`; the
        Creative is unchanged. Same auth as `complete`.
      operationId: failCreativeRevision
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailCreativeRevisionRequest"
      responses:
        "200":
          description: The revision, now FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeRevision"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: A run token for another run or Creative, or a caller who is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Revision or Creative not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The revision is no longer PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/revisions/{revisionId}/media:
    post:
      tags:
        - creatives
      summary: Mint a signed upload for a re-rendered slide of a PENDING revision
      description: >-
        Called by the render job for each slide image it composed: mint here, `PUT` the bytes to `uploadUrl`, then
        `.../media/{mediaId}/confirm`, and report the ids to `.../complete`. The photo endpoints refuse a workflow run
        token; this is the one place a run may create Media, and only an image, only for its own PENDING revision.
        The Media is attributed to the revision's author (the system acting for them) when a run token calls, and to
        the caller otherwise; the author must still be an ADMIN / CREATOR, else the revision is FAILED with that reason
        and the call is a 403. The image is marked as this revision's (`.../confirm` and a run token's `.../complete`
        accept only such images), and at most one image per changed slide and ratio may be minted (409 past that).
        Same body and response as `createCreativePhoto`, restricted to image content types.
        Auth: the revision's own run token, or a project ADMIN / CREATOR.
      operationId: createCreativeRevisionMedia
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCreativePhotoRequest"
      responses:
        "201":
          description: The pending image and its signed upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativePhotoResponse"
        "400":
          description: Disallowed content type (only images), or a disallowed size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            A run token for another run or Creative, a caller who is not ADMIN or CREATOR, or (run token) a revision
            whose author is no longer an editor (the revision is FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Revision, Creative or media not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The revision is no longer PENDING, or it has already minted an image for every changed slide and ratio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/marketing/creatives/{creativeId}/revisions/{revisionId}/media/{mediaId}/confirm:
    post:
      tags:
        - creatives
      summary: Confirm an image uploaded for a PENDING revision
      description: >-
        Marks the image minted by `.../revisions/{revisionId}/media` as UPLOADED. Only an image minted for this
        revision can be confirmed here; any other Media is a 404. The bytes must already be in storage (else 400) and
        the size is read from storage: `sizeBytes` in the body is ignored. Auth as `.../media`.
      operationId: confirmCreativeRevisionMedia
      security:
        - bearerAuth: []
        - apiKeyAuth: []
