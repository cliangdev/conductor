      summary: List the publishable targets a project can select
      description: >-
        Derived at request time from the project's ACTIVE social connections — nothing is stored.
        One target per (platform, connection): a Meta connection yields a `facebook` target and,
        only when the Page has a linked Instagram Business account, an `instagram` one; a YouTube
        connection yields `youtube`; a TikTok connection yields `tiktok`. A platform the project has
        no connection for simply does not appear, and two accounts on the same platform appear as
        two targets with different `connectionId`s. `healthStatus`/`healthMessage` carry the last
        credential verdict so a picker can disable an unhealthy account and explain why. (COND-23.)
      operationId: listProjectPublishTargets
