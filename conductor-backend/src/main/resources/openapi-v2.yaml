    CreateWorkItemRequest:
      type: object
      required:
        - type
        - title
      properties:
        workflow:
          type: string
          description: >-
            Required (enforced by the controller, not schema-`required`, so the 400 carries actionable
            guidance rather than a generic "must not be null"). The lifecycle Workflow definition id (slug,
            e.g. ENGINEERING) that governs this Work Item — the canonical v2 surface never silently defaults it;
            discover options via `GET /projects/{projectId}/workflows?lifecycle=true`. (The legacy v1 `/issues`
            create keeps an ENGINEERING default for back-compat.)
        type:
          type: string
          description: >-
            Work Item type — a Workflow-defined string (e.g. PRD), validated against the
            chosen Workflow's allowed types.
        title:
          type: string
          maxLength: 255
        description:
          type: string
        tags:
          type: array
          description: >-
            Freeform labels for this Work Item. Sent whole — the stored set becomes exactly this list, so
            omit the field to leave existing tags alone and send an empty array to clear them. Values are
            trimmed, lower-cased and de-duplicated.
          items:
            type: string
        fields:
          type: object
          additionalProperties: true
          description: >-
            Typed field values, keyed by the field keys the Workflow declares. Unknown keys, wrong types
            and a Workflow that declares no fields are rejected with a 400.
        dueOn:
          type: string
          format: date
          description: Calendar date this Work Item is due (yyyy-MM-dd).

    PatchWorkItemRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
        status:
          type: string
          description: >-
            Target status — a Workflow-defined status id (e.g. IN_REVIEW). The move is
            validated against the bound Workflow and the Review gate.
        assigneeId:
          type: string
          nullable: true
          description: User ID to assign to this Work Item, or null to unassign
        scheduledFor:
          type: string
          format: date-time
          nullable: true
          description: >-
            When this Work Item is due, as an ISO-8601 date-time. Omit to leave the existing schedule
            unchanged.
        scheduleTimezone:
          type: string
          nullable: true
          description: >-
            IANA zone id the schedule is authored in (e.g. America/New_York). Omit to leave unchanged, or
            send an empty string to clear it. An unrecognized zone is rejected with a 400.
        publishOnApproval:
          type: boolean
          nullable: true
          description: >-
            Publish as soon as approved (see WorkItemResponse.publishOnApproval). Omit to leave unchanged.
        tags:
          type: array
          nullable: true
          description: >-
            Freeform labels for this Work Item. Sent whole — the stored set becomes exactly this list, so
            omit the field to leave existing tags alone and send an empty array to clear them. Values are
            trimmed, lower-cased and de-duplicated.
          items:
            type: string
        fields:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Typed field values to set, merged key by key into the stored ones: a key sent with a value
            sets it, a key sent as null (or an empty string) clears it, a key not sent is left alone.
            Validated against the Workflow's declared fields (400 on unknown keys or wrong types). Applied
            before `status`, so one patch can fill the fields a transition requires and take it.
        dueOn:
          type: string
          description: >-
            Calendar date this Work Item is due (yyyy-MM-dd). Omit to leave unchanged; send an empty
            string to clear it. (A string rather than a nullable date because the generated models cannot
            tell an omitted field from an explicit null.)

    AvailableTransition:
