    get:
      tags:
        - creatives
      summary: List a Creative's renders
      description: Latest first, at most 20. A RUNNING render older than 30 minutes is reported (and persisted) as FAILED "timed out" — there is no scheduler; the sweep happens on this read.
      operationId: listCreativeRenders
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The Creative's renders, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreativeRenderResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - creatives
      summary: Request a render
      description: >-
        Rendering happens on the user's own machine (the Conductor MCP server or CLI, or a self-hosted
        Workflow) — this only records the render as RUNNING and returns the render input (`spec`) the
        local job renders from. `spec` is only ever returned by this call, never by a GET. Refuses with
        422 (same shape as the Creative validator) if the Creative lacks a photo or headline, or fails any
        other T2 structural rule. Requires ADMIN or CREATOR.
      operationId: createCreativeRender
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: creativeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCreativeRenderRequest"
      responses:
        "201":
          description: The new render, RUNNING, plus its spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeRenderResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creative not found, or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
