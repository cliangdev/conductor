        brand:
          $ref: "#/components/schemas/CreativeRenderSpecBrand"
        placements:
          type: array
          items: {}
          description: >-
            The resolved placements this render must produce one frame per. STILL and MOTION: placement key
            strings, (kit-enabled ∪ Creative opt-ins) ∩ registry, or ["story"]/[carouselRatio] for a
            sequence Creative. CAROUSEL with a track: one object `{key: "9x16", width: 1080, height: 1920}`.
            CLIP with a new sound: one object per placement frame, `{key, width, height, clipUrl,
            clipStartSec?, durationSec, clipHasAudio}`, `clipUrl` a signed GET (a local file in a draft is
            `local:<key>`).

    CreativeRenderFrameResponse:
      type: object
      required:
