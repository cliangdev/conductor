    post:
      tags:
        - creatives
      summary: Build the render spec for a Creative that has not been saved
      description: >-
        Preview-first creatives: validates the proposed Creative exactly as `createCreative` would and
        returns the render input (`spec`) a local job renders from, plus its readiness checklist, WITHOUT
        persisting anything — no Creative, no render, no media row, no storage write. Anything that takes
        a library media id (`photoId`, a sequence beat's `photoId`, `motion.background.clipMediaId`,
        `audio.trackId`, a `clipMedia` value) may instead be `local:<key>` (key matching
        `^[a-z0-9][a-z0-9-]{0,63}$`) naming a file on the caller's machine declared in `localMedia`; such a
        reference is not looked up in the library, and the spec carries the literal `local:<key>` as its
        URL (with a null focal) for the local job to resolve. `baseCreativeId` starts from a saved Creative's
        fields and overlays every field present on the request, to preview an edit. CLIP creatives have no
        render and are refused with 422. A CAROUSEL is accepted for validation and readiness only (the
        `spec` is minimal; clients ignore it). `spec.renderId` is the literal `draft`. Requires ADMIN or CREATOR.
      operationId: buildCreativeDraftSpec
