  /projects/{projectId}/work-items/{workItemId}/forecast:
    get:
      tags:
        - work-item-forecast
      summary: When will the open work under this item be done
      description: >-
        Computed on read from the weekly throughput of leaf tasks completed in the last 90 days (widened to
        the whole project when the subtree has fewer than 8): a 2 000-run bootstrap gives P50 and P85 dates.
        With fewer than 3 weeks of history it falls back to a median cycle-time estimate (P50 only).
        See docs/prd-tracking.md "Forecast".
      operationId: getWorkItemForecast
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: workItemId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemForecast"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
