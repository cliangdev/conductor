  /projects/{projectId}/work-items/{workItemId}/publish-targets/{targetId}/manual-publish:
    post:
      tags:
        - publish-outcomes
      summary: Record that a human published a manual target by hand
      description: >-
        Marks one MANUAL publish target as published, storing the live URL the person pasted back. This is
        the only way a target reaches PUBLISHED without a platform reporting it, and it is refused for any
        target that is not on the MANUAL lane: an automated target has a poller that will publish it and
        report the real outcome, so letting a human declare it published would strand a post that is still
        queued to go out.


        Everything downstream is the ordinary success path — the target moves to PUBLISHED, a typed
        destination Asset is recorded on the Post, and the Post rolls up to its published status once every
        target has landed. Idempotent: a second call on an already-published target changes nothing.
      operationId: completeManualPublish
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
        - name: targetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteManualPublishRequest"
      responses:
        "200":
          description: The target as it stands after being recorded as published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishTargetResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
