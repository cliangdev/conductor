        agentActivity:
          $ref: "#/components/schemas/WorkItemAgentActivity"
        health:
          $ref: "#/components/schemas/WorkItemHealth"
        children:
          type: array
          items:
            $ref: "#/components/schemas/WorkItemTreeNode"

    MilestoneProgress:
      type: object
      description: How far a milestone has got, counted by top-level item (the PRDs) and by leaf item (the tasks).
      required:
        - topLevelTotal
        - topLevelDone
        - leafTotal
        - leafDone
      properties:
        topLevelTotal:
          type: integer
        topLevelDone:
          type: integer
        leafTotal:
          type: integer
        leafDone:
          type: integer

    MilestoneResponse:
      type: object
      required:
