          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativePerformanceResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
