    MarketingOverviewResponse:
      type: object
      required: [window, funnel, channels]
      properties:
        window:
          $ref: "#/components/schemas/OverviewWindow"
        funnel:
          type: array
          items:
            $ref: "#/components/schemas/OverviewFunnelStage"
        channels:
          type: array
          items:
            $ref: "#/components/schemas/OverviewChannel"
        funnelBasis:
          type: string
          enum: [EVENT, COHORT]
          description: COHORT when the in-app stages count people who first opened in the window and followed them to now (each stage carries its own `basis`); EVENT otherwise.

    OverviewWindow:
      type: object
      description: >-
        Inclusive UTC day ranges. Each channel's window ends at its dataCompleteThrough (at most yesterday) and
        the previous window is the same length immediately before `from`. On the overview this is the overall
        range: the earliest channel `from` to the latest channel `to`.
      required: [from, previousFrom, previousTo]
      properties:
        from: {type: string, format: date}
        to:
          type: string
          format: date
          nullable: true
          description: Overview - the latest dataCompleteThrough among channels that have data; null when none has. Channel detail - the channel's dataCompleteThrough.
        previousFrom: {type: string, format: date}
        previousTo: {type: string, format: date}
        dataCompleteThroughMin:
          type: string
          format: date
          nullable: true
          description: The earliest dataCompleteThrough among channels that have data (equal to `to` on a channel); null when none has.

    OverviewFunnelStage:
      type: object
      required: [key, label, source, available, path]
      properties:
        key: {type: string}
        label: {type: string}
        value: {type: number, format: double, nullable: true}
        previous: {type: number, format: double, nullable: true}
        change: {type: number, format: double, nullable: true}
        source:
          type: string
          description: The channel (WEB, SEARCH, SOCIAL, STORE, ADS, PRODUCT) the stage reads from.
        available: {type: boolean}
        unavailableReason: {type: string, nullable: true}
        path:
          type: string
          enum: [WEB, STORE, ADS, PRODUCT]
          description: The parallel path the stage belongs to; stages convert only within a path, except that the first PRODUCT stage converts from store downloads.
        conversionFromKey:
          type: string
          nullable: true
          description: Key of the previous stage on the same path that this stage converts from; null at a path start and when either stage is unavailable.
        dataCompleteThrough:
          type: string
          format: date
          nullable: true
          description: The last day included in the stage's value (its channel's dataCompleteThrough); null when the stage has no channel yet.
        basis:
          type: string
          enum: [EVENT, COHORT]
          description: EVENT counts what happened in the window. COHORT (in-app stages a product backend declares so) counts the people who first opened in the window and reached the stage by now, so a later stage can still grow as the cohort matures.

    OverviewChannel:
      type: object
      required: [channel, label, status, connections, metrics, dataCompleteThrough]
      properties:
        dataCompleteThrough:
          type: string
          format: date
          description: The channel's window ends here, the latest day with non-provisional data across its connections (never later than yesterday; yesterday when there is none). In a fixed window it is never later than the window's last day.
        channel: {type: string, description: "WEB, SEARCH, SOCIAL, STORE, ADS or PRODUCT."}
        label: {type: string}
        status:
          type: string
          enum: [LIVE, STALE, NOT_CONNECTED, COMING_SOON, MISMATCH]
          description: MISMATCH means a second source disagrees with this channel's own connector - the product metrics feed's reference figure (ad spend and installs, store downloads and downloads of record) or a direct platform read - outside the band of 1 unit for counts under 50 and 2% above that and for money; see `mismatches`. STALE also covers a feed that keeps running while this channel's data ends more than 7 days before the freshest channel's; such a channel no longer holds the funnel window back and its funnel stages are unavailable ("No Web data since Sep 10").
        lastFetchedAt: {type: string, format: date-time, nullable: true}
        targetsEditable:
          type: boolean
          description: False when the channel's targets are owned by its connection (PRODUCT), so a target cannot be set or cleared here.
        mismatch:
          allOf:
            - $ref: "#/components/schemas/OverviewMismatch"
          nullable: true
          description: The entry of `mismatches` with the largest relative gap (a BACKEND one when there is any), kept for clients that read one mismatch. New clients read `mismatches`.
        mismatches:
          type: array
          description: Every second source that disagrees with this channel's own figure, largest gap first - the product backend's reference per pair (ADS spend and installs, STORE downloads and downloads of record) and any direct platform read that disagrees. Empty when none do. The channel is MISMATCH while this is not empty (a lagging channel stays STALE).
          items:
            $ref: "#/components/schemas/OverviewMismatch"
        partial:
          type: boolean
          description: Set to true only in a fixed window, when this channel's settled data ends before the window's last day; its values then cover only the days up to `dataCompleteThrough` and its previous-window comparison is withheld.
        connections:
          type: array
          items:
            $ref: "#/components/schemas/OverviewConnection"
        connectHint:
          allOf:
            - $ref: "#/components/schemas/OverviewConnectHint"
          nullable: true
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/OverviewMetric"

    OverviewMismatch:
      type: object
      description: >-
        One second source that disagrees with the channel's own figure, over the same settled days `from` to `to`
        (outside the band: 1 unit for counts under 50, 2% of the larger figure above that and for money).
      required: [metric, label, referenceValue, channelValue, gapPct, from, to]
      properties:
        kind:
          type: string
          enum: [BACKEND, PLATFORM]
          description: BACKEND when the second figure is the product metrics feed's reference; PLATFORM when it is a direct platform read recorded in the verification ledger. Absent means BACKEND.
        channelSource: {type: string, description: "Name of the connection(s) behind this channel's own figure, e.g. App Store Connect."}
        referenceSource: {type: string, description: "Name of the source of the second figure: the product metrics connection(s) for BACKEND, or the name given to the direct read (for example Apple Ads console) for PLATFORM."}
        metric: {type: string, description: "The channel metric compared, e.g. downloads or spend."}
        label: {type: string}
        referenceValue: {type: number, format: double, description: "What the second source reports: the product metrics feed (BACKEND) or the platform read (PLATFORM)."}
        channelValue: {type: number, format: double, description: "What this channel's own connector reports."}
        gapPct: {type: number, format: double, description: "Absolute gap as a fraction of the larger figure (0.05 is 5%)."}
        from: {type: string, format: date}
        to: {type: string, format: date}

    MarketingVerificationLedger:
      type: object
      required: [window, rows, summary]
      properties:
        window:
          $ref: "#/components/schemas/VerificationWindow"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/VerificationRow"
        summary:
          $ref: "#/components/schemas/VerificationSummary"

    VerificationWindow:
      type: object
      description: The days the ledger was asked about. Each row says which days its own Conductor value covers (a channel's rolling window ends at its own last settled day).
      required: [from]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date, nullable: true, description: "Null when no channel has data yet."}

    VerificationRow:
      type: object
      required: [channel, metric, metricRef, label, unit, verdict, mismatch, readStale, trustNote]
      properties:
        channel: {type: string, description: "WEB, SEARCH, SOCIAL, STORE, ADS or PRODUCT."}
        metric: {type: string, description: "The metric key within the channel, e.g. installs."}
        metricRef: {type: string, description: "CHANNEL.metric, e.g. ADS.installs."}
        label: {type: string}
        unit:
          type: string
          enum: [COUNT, CURRENCY, PERCENT, POSITION, RATING]
        definition:
          allOf:
            - $ref: "#/components/schemas/OverviewMetricDefinition"
          nullable: true
        windowFrom: {type: string, format: date, nullable: true, description: "First day `conductorValue` covers."}
        windowTo: {type: string, format: date, nullable: true, description: "Last day `conductorValue` covers."}
        conductorValue: {type: number, format: double, nullable: true, description: "Conductor's value for the window; null when it has none (unknown, never 0)."}
        backend:
          allOf:
            - $ref: "#/components/schemas/VerificationBackend"
          nullable: true
          description: Present when the product backend reports this metric over days Conductor also has settled.
        platformRead:
          allOf:
            - $ref: "#/components/schemas/VerificationPlatformRead"
          nullable: true
          description: The latest direct platform read for this metric, if any.
        verdict:
          type: string
          enum: [BOTH, CONNECTOR, BACKEND, PLATFORM, UNCHECKED]
        mismatch: {type: boolean, description: "True when any second source that could be compared disagrees with Conductor's figure."}
        readStale: {type: boolean, description: "True when the latest platform read was recorded more than 7 days ago."}
        trustNote: {type: string, description: "One plain sentence saying which figure to trust and why."}

    VerificationBackend:
      type: object
      required: [value, conductorValue, daysCompared, source, from, to, matches]
      properties:
        value: {type: number, format: double, description: "The product backend's sum over the days compared."}
        conductorValue: {type: number, format: double, description: "Conductor's sum over the same days."}
        daysCompared: {type: integer, description: "Settled days both sides have."}
        source: {type: string, description: "Name of the product metrics connection(s)."}
        from: {type: string, format: date, description: "First day compared."}
        to: {type: string, format: date, description: "Last day compared."}
        matches: {type: boolean}

    VerificationPlatformRead:
      type: object
      required: [id, value, from, to, sourceName, recordedAt]
      properties:
        id: {type: string}
        value: {type: number, format: double, description: "What the platform showed for the read's days."}
        from: {type: string, format: date}
        to: {type: string, format: date}
        sourceName: {type: string, description: "Where it was read, e.g. Apple Ads console."}
        note: {type: string, nullable: true}
        recordedBy: {type: string, nullable: true, description: "User id of whoever recorded it."}
        recordedAt: {type: string, format: date-time}
        conductorValueOverReadDays:
          type: number
          format: double
          nullable: true
          description: "Conductor's own figure over exactly the read's days (a level: its value on the last day; unique visitors: the stored count for a window of that length ending on the last day). Null when it cannot be said: Conductor has not settled those days, or unique visitors were read over a length other than 7, 28 or 90 days."
        matches:
          type: boolean
          nullable: true
          description: "Whether the read agrees with Conductor's figure over its days; null when that cannot be compared."

    VerificationSummary:
      type: object
      required: [both, connector, backend, platform, unchecked, mismatched, staleReads]
      properties:
        both: {type: integer}
        connector: {type: integer}
        backend: {type: integer}
        platform: {type: integer}
        unchecked: {type: integer}
        mismatched: {type: integer, description: "Rows with `mismatch` true."}
        staleReads: {type: integer, description: "Rows whose latest platform read is more than 7 days old."}

    MarketingPlatformReadRequest:
      type: object
      required: [channel, metric, from, to, value, sourceName]
      properties:
        channel: {type: string, description: "WEB, SEARCH, SOCIAL, STORE, ADS or PRODUCT (case-insensitive)."}
        metric: {type: string, description: "The metric key within the channel, e.g. installs; a sum, a level or window-unique visitors (not a derived ratio)."}
        from: {type: string, format: date, description: "First day of the range the platform showed."}
        to: {type: string, format: date, description: "Last day of the range; yesterday or earlier. At most 92 days from `from`."}
        value: {type: number, format: double, minimum: 0, description: "The platform's figure for those days."}
        sourceName: {type: string, maxLength: 120, description: "Where it was read, e.g. Apple Ads console or Search Console UI."}
        note: {type: string, maxLength: 500}

    MarketingPlatformReadList:
      type: object
      required: [reads]
      properties:
        reads:
          type: array
          items:
            $ref: "#/components/schemas/MarketingPlatformReadEntry"

    MarketingPlatformReadEntry:
      type: object
      description: One recorded read with what Conductor and the backend showed when it was recorded.
      required: [id, channel, metric, from, to, value, sourceName, recordedAt]
      properties:
        id: {type: string}
        channel: {type: string}
        metric: {type: string}
        from: {type: string, format: date}
        to: {type: string, format: date}
        value: {type: number, format: double}
        sourceName: {type: string}
        note: {type: string, nullable: true}
        recordedBy: {type: string, nullable: true}
        recordedAt: {type: string, format: date-time}
        conductorValue: {type: number, format: double, nullable: true, description: "Conductor's figure over the read's days at the time of recording."}
        backendValue: {type: number, format: double, nullable: true, description: "The product backend's figure over the same days at the time of recording, if it had one."}
        verdict:
          type: string
          nullable: true
          enum: [BOTH, CONNECTOR, BACKEND, PLATFORM, UNCHECKED]
          description: The verdict at the time of recording.

    OverviewConnection:
      type: object
      required: [id, connectorId, name, status]
      properties:
        id: {type: string}
        connectorId: {type: string}
        name: {type: string}
        status:
          type: string
          enum: [LIVE, STALE]

    OverviewConnectHint:
      type: object
      required: [connectorId, connectors]
      properties:
        connectorId:
          type: string
          description: Deprecated; the first connector not yet connected. Use `connectors`.
        connectors:
          type: array
          description: Every connector that can feed the channel, with its display name.
          items:
            $ref: "#/components/schemas/OverviewConnectorRef"

    OverviewConnectorRef:
      type: object
      required: [connectorId, name]
      properties:
        connectorId: {type: string}
        name: {type: string}

    OverviewMetric:
      type: object
      required: [metric, label, unit, goodDirection, noise, provisionalDays, series]
      properties:
        metric: {type: string}
        label: {type: string}
        unit:
          type: string
          enum: [COUNT, CURRENCY, PERCENT, POSITION, RATING]
        goodDirection:
          type: string
          enum: [UP, DOWN]
          description: Which way a move reads as good news (DOWN for cost per install or search position).
        value: {type: number, format: double, nullable: true}
        previous: {type: number, format: double, nullable: true}
        change: {type: number, format: double, nullable: true}
        changePct: {type: number, format: double, nullable: true}
        asOf:
          type: string
          format: date
          nullable: true
          description: For a level metric (followers etc.), the day of the snapshot `value` reads, the latest at or before today whatever the flow window; `previous` is the snapshot one window earlier. Null for flow metrics and when no snapshot exists.
        historyStartsOn:
          type: string
          format: date
          nullable: true
          description: When `previous` is null, the first day this metric has data (history starts here); null otherwise.
        noise:
          type: boolean
          description: True when the change is within normal variation (it did not clear the change detector's gates).
        insufficientData:
          type: boolean
          description: True when the feed reported a sample size under 20 for the window; `noise` is then also true.
        aggregation:
          type: string
          description: "How daily values combine over a window: SUM (a window total, so a target is a total and does not belong on a per-day chart), LEVEL (a stock, latest value) or DERIVED (a ratio of two metrics)."
        funnelOrder:
          type: integer
          nullable: true
          description: PRODUCT only - the metric's place among the in-app funnel stages (1 first); null for a metric that is not a stage.
        status:
          type: string
          enum: [ON_TRACK, WATCH, OFF_TRACK, TOO_EARLY, NO_TARGET]
          description: Where the value stands against its target (Conductor-owned or declared by the product feed). TOO_EARLY - no value, or a rate resting on fewer than 20 observations. NO_TARGET - no target. ON_TRACK - target met. WATCH - missed by no more than the target's watchBandPct (default 10%). OFF_TRACK - missed by more. A count or currency total is compared with its target prorated to the requested window.
        missPct:
          type: number
          format: double
          nullable: true
          description: How far short of the (prorated) target the value is, as a fraction of the target (0.05 is 5%); 0 when the target is met. Null with NO_TARGET, TOO_EARLY or a zero target.
        sampleSize:
          type: integer
          format: int64
          nullable: true
          description: Observations behind the value when known (the feed's own count, or a ratio's denominator); null otherwise.
        area:
          type: string
          nullable: true
          enum: [ACQUISITION, ACTIVATION, RETENTION, REVENUE]
          description: PRODUCT only - the part of the growth scorecard the metric belongs to, when the feed says.
        description:
          type: string
          nullable: true
          description: PRODUCT only - what the metric counts, in the feed's words (for example "Installs that started a free trial").
        headline:
          type: integer
          nullable: true
          description: PRODUCT only - the metric's priority among the feed's headline metrics (1 first); null when it is not one.
        basis:
          type: string
          enum: [EVENT, COHORT]
          description: PRODUCT only - COHORT when each day's value counts the people who first opened that day, followed to now.
        definition:
          allOf:
            - $ref: "#/components/schemas/OverviewMetricDefinition"
          nullable: true
          description: Where the number comes from and what it counts. Set on every metric of every channel.
        note:
          type: string
          nullable: true
          description: Set only when `value` is null because the stored data cannot answer, for example a unique-visitor count asked for a window length that is not stored (7, 28 and 90 days are). The value is never rebuilt from daily counts.
        provisionalDays:
          type: integer
          description: Number of provisional days after the channel's dataCompleteThrough that appear at the end of the series. Values and changes exclude them.
        target:
          allOf:
            - $ref: "#/components/schemas/MarketingTarget"
          nullable: true
        series:
          type: array
          items:
            $ref: "#/components/schemas/OverviewSeriesPoint"

    OverviewSeriesPoint:
      type: object
      required: [day, provisional]
      properties:
        day: {type: string, format: date}
        value: {type: number, format: double, nullable: true}
        provisional:
          type: boolean
          description: True for days the source may still restate, including every day after the channel's dataCompleteThrough. Draw them differently; they are not in the totals.

    BudgetPacing:
      type: object
      required: [month, daysElapsed, daysInMonth, mtdSpend, provisionalSpend, daily, channels]
      properties:
        month: {type: string, description: "YYYY-MM (UTC)."}
        capAmount: {type: number, format: double, nullable: true, description: "The month's cap. Null when none is set; never 0."}
        currency: {type: string, nullable: true, description: "The cap's currency. Null when no cap is set."}
        through: {type: string, format: date, nullable: true, description: "The latest settled day counted toward the month. Null before any settled spend."}
        daysElapsed: {type: integer, description: "Days from the 1st through `through`; 0 before any settled spend."}
        daysInMonth: {type: integer}
        mtdSpend: {type: number, format: double, description: "Settled spend this month across paid channels, as the ad platforms report it."}
        provisionalSpend: {type: number, format: double, description: "Spend on days the source may still restate. Not in mtdSpend, pace or the projection."}
        expectedSpend: {type: number, format: double, nullable: true, description: "Straight-line spend to `through` (capAmount * daysElapsed / daysInMonth). Null without a cap or settled spend."}
        pacePct: {type: number, format: double, nullable: true, description: "mtdSpend / expectedSpend as a fraction: 1.0 on pace, above 1 ahead of the cap. Null without a cap or settled spend."}
        projectedSpend: {type: number, format: double, nullable: true, description: "mtdSpend / daysElapsed * daysInMonth. Null before any settled spend."}
        daily:
          type: array
          description: Every day from the 1st to the last day with a spend row, across paid channels.
          items:
            $ref: "#/components/schemas/BudgetDay"
        channels:
          type: array
          description: Paid channels, by name. A channel with an active rule is listed even before its first spend row of the month.
          items:
            $ref: "#/components/schemas/BudgetChannel"

    BudgetDay:
      type: object
      required: [day, cumulativeSpend]
      properties:
        day: {type: string, format: date}
        spend: {type: number, format: double, nullable: true, description: "Settled spend that day. Null when no settled row was reported (not 0)."}
        provisionalSpend: {type: number, format: double, nullable: true, description: "Spend the source may still restate. Null when none. Draw it differently."}
        cumulativeSpend: {type: number, format: double, description: "Settled spend from the 1st through this day; provisional days add nothing."}
        expectedSpend: {type: number, format: double, nullable: true, description: "Straight-line cumulative cap to this day. Only on the cross-channel series, and null without a cap."}

    BudgetChannel:
      type: object
      required: [channel, mtdSpend, provisionalSpend, compliant, daily, rules]
      properties:
        channel: {type: string, description: "ADS, SOCIAL, ..."}
        through: {type: string, format: date, nullable: true, description: "The channel's latest settled spend day on or before the as-of day; it can precede the month. Null before any settled spend."}
        mtdSpend: {type: number, format: double}
        provisionalSpend: {type: number, format: double}
        installs: {type: number, format: double, nullable: true, description: "Settled installs this month. Null when the channel reports none."}
        cpi: {type: number, format: double, nullable: true, description: "Month-to-date cost per install. Null when installs are null or 0 (read as 'no installs')."}
        compliant: {type: boolean, description: "False when the channel has spend and no active stop rule."}
        complianceReason: {type: string, nullable: true, description: "'no stop rule' when not compliant."}
        daily:
          type: array
          items:
            $ref: "#/components/schemas/BudgetDay"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/BudgetRuleEvaluation"
        marginalCpi:
          nullable: true
          description: Null when the channel has no settled spend yet.
          allOf:
            - $ref: "#/components/schemas/BudgetMarginalCpi"

    BudgetMarginalCpi:
      type: object
      required: [last7, prior7, monthToDate]
      properties:
        last7: {$ref: "#/components/schemas/BudgetCpiWindow"}
        prior7: {$ref: "#/components/schemas/BudgetCpiWindow"}
        monthToDate: {$ref: "#/components/schemas/BudgetCpiWindow"}

    BudgetCpiWindow:
      type: object
      required: [from]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date, nullable: true}
        spend: {type: number, format: double, nullable: true, description: "Settled spend in the window. Null when no row was reported."}
        installs: {type: number, format: double, nullable: true, description: "Settled installs in the window. Null when no row was reported; 0 when reported zero."}
        cpi: {type: number, format: double, nullable: true, description: "spend / installs. Null when installs are null or 0 (read as 'no installs')."}

    BudgetRuleEvaluation:
      type: object
      required: [ruleId, channel, scope, metric, comparator, threshold, minSample, windowDays, tripped, belowMinSample]
      properties:
        ruleId: {type: string}
        channel: {type: string}
        scope: {type: string, description: "channel, campaign:<id> or keyword:<id>."}
        metric: {type: string}
        comparator: {type: string, description: "GT or LT."}
        threshold: {type: number, format: double}
        minSample: {type: integer}
        windowDays: {type: integer}
        note: {type: string, nullable: true}
        windowFrom: {type: string, format: date, nullable: true, description: "First day of the settled window. Null when the channel has no settled data."}
        windowTo: {type: string, format: date, nullable: true}
        observed: {type: number, format: double, nullable: true, description: "The metric over the window. Null when it cannot be computed (no data, a zero denominator, or a cost per install with no installs)."}
        sample: {type: number, format: double, nullable: true, description: "Taps in the window. Null when taps are not reported."}
        tripped: {type: boolean, description: "The comparator holds and the sample reaches minSample. A cost per install above the threshold also holds when there is spend and zero installs."}
        belowMinSample: {type: boolean, description: "minSample is above 0 and the window's taps are fewer (or not reported). Such a rule never trips."}
        detail: {type: string, nullable: true, description: "Why the rule is not computed or not tripped, in words."}

    MarketingBudgetCap:
      type: object
      required: [month, capAmount, currency, updatedAt]
      properties:
        month: {type: string}
        capAmount: {type: number, format: double}
        currency: {type: string}
        updatedAt: {type: string, format: date-time}

    BudgetCapRequest:
      type: object
      required: [capAmount]
      properties:
        capAmount: {type: number, format: double, description: "Greater than 0 and below 1,000,000,000,000; two decimals are kept."}
        currency: {type: string, maxLength: 3, description: "Three-letter code. Defaults to USD."}

    StopRule:
      type: object
      required: [id, channel, scope, metric, comparator, threshold, minSample, windowDays, createdAt]
      properties:
        id: {type: string}
        channel: {type: string}
        scope: {type: string, description: "channel, campaign:<id> or keyword:<id>."}
        metric: {type: string, description: "cost_per_install, spend, installs, taps, tap_through_rate or install_rate."}
        comparator: {type: string, description: "GT (above) or LT (below)."}
        threshold: {type: number, format: double}
        minSample: {type: integer}
        windowDays: {type: integer}
        note: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}

    StopRuleRequest:
      type: object
      required: [channel, metric, comparator, threshold]
      properties:
        channel: {type: string, maxLength: 32, description: "WEB, SEARCH, SOCIAL, STORE, ADS or PRODUCT (case-insensitive). A paid channel is one with a spend metric."}
        scope: {type: string, maxLength: 200, description: "channel (default: the channel's total rows), campaign:<id> or keyword:<id> (rows of that campaign or keyword; the id is matched whole)."}
        metric: {type: string, maxLength: 64, description: "cost_per_install, spend, installs, taps, tap_through_rate (taps / impressions) or install_rate (installs / taps). Rates are fractions."}
        comparator: {type: string, maxLength: 2, description: "GT (trips above the threshold) or LT (trips below)."}
        threshold: {type: number, format: double, description: "0 or more, in the metric's own unit."}
        minSample: {type: integer, description: "Taps the window must hold before the rule can trip. Default 0 (no minimum); set one for any rate or cost per install."}
        windowDays: {type: integer, description: "Settled days the rule reads, 1 to 90. Default 7."}
        note: {type: string, maxLength: 500, description: "What a human should consider when it trips."}

    StopRuleListResponse:
      type: object
      required: [stopRules]
      properties:
        stopRules:
          type: array
          items:
            $ref: "#/components/schemas/StopRule"

    TrackedLink:
      type: object
      required: [id, kind, family, token, url, createdAt]
      properties:
        id: {type: string}
        kind: {type: string, enum: [POST, BIO, CREATOR, EMAIL, OTHER]}
        family: {type: string, description: "The group tokens roll up into, e.g. posts."}
        token: {type: string, description: "The campaign token (`ct`)."}
        url: {type: string, description: "The App Store campaign link, as handed out when the link was made."}
        workItemId: {type: string, nullable: true, description: "The Post (or creator) this link belongs to. Null once that Work Item is deleted, or for a link not tied to one."}
        label: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}

    TrackedLinkListResponse:
      type: object
      required: [links, total]
      properties:
        links:
          type: array
          items:
            $ref: "#/components/schemas/TrackedLink"
        total:
          type: integer
          format: int64
          description: How many links match, which can exceed the number returned.

    CreateTrackedLinkRequest:
      type: object
      required: [kind, family, token]
      properties:
        kind: {type: string, enum: [POST, BIO, CREATOR, EMAIL, OTHER]}
        family: {type: string, description: "Lowercase letters, digits and dashes, starting with a letter or digit, at most 64 characters."}
        token: {type: string, description: "Lowercase letters, digits and dashes, starting with a letter or digit, at most 40 characters."}
        label: {type: string, description: "What the link is for, at most 200 characters."}
        workItemId: {type: string, description: "The Work Item the link belongs to. Required for kind POST."}

    LinkFamilyPerformance:
      type: object
      required: [family, kind, tokens, belowThreshold]
      properties:
        family: {type: string}
        kind: {type: string, enum: [POST, BIO, CREATOR, EMAIL, OTHER]}
        tokens: {type: integer, description: "How many links the family holds."}
        downloads: {type: integer, format: int64, nullable: true, description: "First-time downloads over the window, settled days. Null (never 0) when no token of the family has a row in the window."}
        belowThreshold: {type: boolean, description: "True when no token of the family has a row in the window: Apple reports nothing under its privacy threshold."}
        note: {type: string, nullable: true, description: "The words \"below Apple's reporting threshold\" when belowThreshold."}
        views: {type: integer, format: int64, nullable: true, description: "POST families only: the latest views of the linked Posts' destinations, cumulative. Null when none has reported views."}

    LinkPerformanceResponse:
      type: object
      required: [from, to, families]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        families:
          type: array
          items:
            $ref: "#/components/schemas/LinkFamilyPerformance"

    OverviewMetricDefinition:
      type: object
      description: >-
        What a metric counts. `numerator` and `denominator` are measure names from one closed list
        (impressions, unique_impressions, page_views, unique_page_views, first_time_downloads, redownloads,
        total_downloads, downloads_of_record, tap_installs, tap_new_downloads, view_through_installs, taps,
        spend, visitors, sessions, pageviews, conversion_sessions, conversion_events, clicks, followers, posts,
        likes, channel_views, website_clicks, rating_count, rating_avg, position), or `product:<key>` for a metric a
        product backend declared. Two metrics compare only when numerator, denominator and sourceType all match.
      required: [source, numerator]
      properties:
        source: {type: string, description: "One plain line naming the platform report or field the number comes from."}
        numerator: {type: string, description: "The measure counted (the top of a ratio)."}
        denominator:
          type: string
          nullable: true
          description: The measure divided by; null for a plain count.
        sourceType:
          type: string
          nullable: true
          description: ALL, or one App Store traffic source type (APP_STORE_SEARCH, APP_STORE_BROWSE, APP_REFERRER, WEB_REFERRER ...). Null means ALL.
        exclusions:
          type: string
          nullable: true
          description: One plain line naming what is left out of the number; null when nothing is.
        timeZone:
          type: string
          nullable: true
          description: The time zone that decides which day a row belongs to; null when the source does not say.

    MarketingDefinitionEntry:
      type: object
      required: [metricRef, channel, key, label, unit, aggregation, definition]
      properties:
        metricRef: {type: string, description: "CHANNEL.key, the reference a benchmark or target uses (for example ADS.installs)."}
        channel: {type: string, description: "WEB, SEARCH, SOCIAL, STORE, ADS or PRODUCT."}
        key: {type: string}
        label: {type: string}
        unit:
          type: string
          enum: [COUNT, CURRENCY, PERCENT, POSITION, RATING]
        aggregation:
          type: string
          description: "How daily values combine over a window: SUM, LEVEL, DERIVED or WINDOW_UNIQUE."
        definition:
          $ref: "#/components/schemas/OverviewMetricDefinition"

    MarketingDefinitionsResponse:
      type: object
      required: [definitions]
      properties:
        definitions:
          type: array
          items:
            $ref: "#/components/schemas/MarketingDefinitionEntry"

    MarketingBenchmark:
      type: object
      required: [metricRef, value, sourceName, sourceUrl, checkedOn, updatedAt]
      properties:
        metricRef: {type: string, description: "CHANNEL.metric, e.g. STORE.conversion_rate, or PRODUCT.<key>."}
        label: {type: string, nullable: true}
        value: {type: number, format: double}
        rangeText: {type: string, nullable: true, description: "The published range the value summarises, e.g. \"2-4%\"."}
        segment: {type: string, nullable: true, description: "What the benchmark covers, e.g. \"Health and fitness, US\"."}
        sourceName: {type: string}
        sourceUrl: {type: string}
        checkedOn: {type: string, format: date}
        notes: {type: string, nullable: true}
        numerator: {type: string, nullable: true, description: "What the benchmark counts: a measure name (e.g. total_downloads) or product:<key>. Null means the definition is missing and the benchmark is never judged."}
        denominator: {type: string, nullable: true, description: "What the numerator is divided by, same vocabulary. Null for a count."}
        sourceType: {type: string, nullable: true, description: "The traffic source the benchmark covers: ALL, APP_STORE_SEARCH, APP_STORE_BROWSE, APP_REFERRER, WEB_REFERRER, APP_CLIP, INSTITUTIONAL_PURCHASE or OTHER. Null means ALL."}
        updatedAt: {type: string, format: date-time}

    MarketingBenchmarkRequest:
      type: object
      required: [value, sourceName, sourceUrl, checkedOn]
      properties:
        label: {type: string, maxLength: 200}
        value: {type: number, format: double}
        rangeText: {type: string, maxLength: 200}
        segment: {type: string, maxLength: 200}
        sourceName: {type: string, maxLength: 200}
        sourceUrl: {type: string, maxLength: 2000}
        checkedOn: {type: string, format: date, description: "The day the source was read; not in the future."}
        notes: {type: string, maxLength: 2000}
        numerator: {type: string, maxLength: 80, description: "A measure name (impressions, unique_impressions, page_views, unique_page_views, first_time_downloads, redownloads, total_downloads, downloads_of_record, tap_installs, tap_new_downloads, view_through_installs, taps, spend, visitors, sessions, pageviews, conversion_sessions, conversion_events, clicks, followers, posts, likes, channel_views, website_clicks, rating_count, rating_avg, position) or product:<key> (key lower-case letters, digits and underscores, starting with a letter, up to 64). Required when denominator or sourceType is given."}
        denominator: {type: string, maxLength: 80, description: "Same vocabulary as numerator; omit for a count. Needs a numerator."}
        sourceType: {type: string, maxLength: 32, description: "ALL (the default), APP_STORE_SEARCH, APP_STORE_BROWSE, APP_REFERRER, WEB_REFERRER, APP_CLIP, INSTITUTIONAL_PURCHASE or OTHER. Needs a numerator."}

    MarketingBenchmarkListResponse:
      type: object
      required: [benchmarks]
      properties:
        benchmarks:
          type: array
          items:
            $ref: "#/components/schemas/MarketingBenchmark"

    GrowthSignals:
      type: object
      required: [moments, ratings, reviews, competitorChanges, keywordPresence, trackedKeywords]
      properties:
        moments:
          type: array
          items:
            $ref: "#/components/schemas/GrowthMoment"
        ratings:
          $ref: "#/components/schemas/GrowthRatings"
        reviews:
          $ref: "#/components/schemas/GrowthReviews"
        competitorChanges:
          type: array
          description: Only competitors whose listing changed between their last two snapshots.
          items:
            $ref: "#/components/schemas/GrowthCompetitorChange"
        keywordPresence:
          type: array
          items:
            $ref: "#/components/schemas/GrowthKeywordPresence"
        trackedKeywords:
          $ref: "#/components/schemas/GrowthTrackedKeywords"

    GrowthMoment:
      type: object
      required: [key, name, date, leadDays, status, surfaces]
      properties:
        key: {type: string}
        name: {type: string}
        date: {type: string, format: date}
        leadDays: {type: integer, description: "How many days before the date its surfaces start to count as upcoming."}
        status: {type: string, description: "warning (a surface is past due with no change), upcoming (within leadDays of the date with a surface not yet overdue), scheduled, or past. Computed on read from UTC today."}
        surfaces:
          type: array
          items:
            $ref: "#/components/schemas/GrowthSurface"

    GrowthSurface:
      type: object
      required: [id, surface, dueOn]
      properties:
        id: {type: string}
        surface: {type: string, description: "Where the change goes, e.g. App Store promotional text, TikTok post, Email."}
        dueOn: {type: string, format: date}
        changeWorkItemId: {type: string, nullable: true, description: "The MARKETING_CHANGES Work Item that handled the surface; null until one is linked."}
        changeDisplayId: {type: string, nullable: true, description: "Display id of that Work Item, e.g. RE-12."}
        warning: {type: string, nullable: true, description: "Present only when UTC today is after dueOn and no change is linked."}

    GrowthRatings:
      type: object
      required: [competitors]
      properties:
        ours:
          $ref: "#/components/schemas/GrowthAppRating"
        competitors:
          type: array
          items:
            $ref: "#/components/schemas/GrowthAppRating"

    GrowthAppRating:
      type: object
      required: [appId, country]
      properties:
        appId: {type: string}
        name: {type: string, nullable: true}
        country: {type: string, description: "The App Store country the app is read from."}
        latest:
          $ref: "#/components/schemas/GrowthSnapshot"
        previous:
          $ref: "#/components/schemas/GrowthSnapshot"
        weeklyGrowth: {type: integer, format: int64, nullable: true, description: "Rating count in latest minus previous; null unless both snapshots are from the same storefront and have a rating count. Never 0 for missing data."}

    GrowthSnapshot:
      type: object
      required: [capturedOn]
      properties:
        capturedOn: {type: string, format: date, description: "The Monday of the ISO week the snapshot stands for (UTC)."}
        country: {type: string, nullable: true, description: "The App Store storefront the snapshot was read from. Snapshots of different storefronts are never compared, so weeklyGrowth and the competitor change list are empty across a country change."}
        price: {type: number, format: double, nullable: true}
        currency: {type: string, nullable: true}
        ratingAvg: {type: number, format: double, nullable: true}
        ratingCount: {type: integer, format: int64, nullable: true}
        version: {type: string, nullable: true}
        title: {type: string, nullable: true}
        subtitle: {type: string, nullable: true}

    GrowthReviews:
      type: object
      required: [ours, competitors]
      properties:
        ours:
          type: array
          description: The latest 10 reviews of our app.
          items:
            $ref: "#/components/schemas/GrowthReview"
        competitors:
          type: array
          description: The latest 5 reviews of each watched competitor.
          items:
            $ref: "#/components/schemas/GrowthAppReviews"

    GrowthAppReviews:
      type: object
      required: [appId, name, reviews]
      properties:
        appId: {type: string}
        name: {type: string}
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/GrowthReview"

    GrowthReview:
      type: object
      properties:
        rating: {type: integer, nullable: true}
        title: {type: string, nullable: true}
        body: {type: string, nullable: true}
        author: {type: string, nullable: true}
        reviewedAt: {type: string, format: date-time, nullable: true}

    GrowthCompetitorChange:
      type: object
      required: [appId, name, changes]
      properties:
        appId: {type: string}
        name: {type: string}
        changes:
          type: array
          description: "Plain lines such as \"price 0.99 -> 1.99\"; a field missing in either week is not compared."
          items: {type: string}

    GrowthKeywordPresence:
      type: object
      required: [keyword, competitors]
      properties:
        keyword: {type: string}
        ours: {type: integer, nullable: true, description: "Our app's 1-based search position in the latest snapshot; null when it was not among the first 50 results or was not checked."}
        competitors:
          type: object
          description: "Competitor appId to its 1-based search position in its latest snapshot; null when it was not among the first 50 results, and no entry when its latest snapshot did not check the keyword."
          additionalProperties:
            type: integer
            nullable: true

    GrowthTrackedKeywords:
      type: object
      required: [source, country, keywords]
      properties:
        source: {type: string, description: "PRODUCT_FEED (the feed's aso:<keyword> rows) or PROJECT_LIST (the list set with the PUT)."}
        country: {type: string}
        keywords:
          type: array
          items: {type: string}

    MarketingMomentRequest:
      type: object
      required: [name, date, surfaces]
      properties:
        name: {type: string, maxLength: 200}
        date: {type: string, format: date, description: "The day of the moment, e.g. 2026-11-26 for Thanksgiving."}
        leadDays: {type: integer, minimum: 0, maximum: 365, description: "Default 21."}
        surfaces:
          type: array
          maxItems: 25
          items:
            $ref: "#/components/schemas/MarketingMomentSurfaceRequest"

    MarketingMomentSurfaceRequest:
      type: object
      required: [surface, dueOn]
      properties:
        surface: {type: string, maxLength: 120}
        dueOn: {type: string, format: date}

    LinkMomentChangeRequest:
      type: object
      required: [workItemId]
      properties:
        workItemId: {type: string, description: "A MARKETING_CHANGES Work Item of this project, by id or display id (RE-12)."}

    AddGrowthCompetitorRequest:
      type: object
      required: [appId, name]
      properties:
        appId: {type: string, maxLength: 20, description: "Numeric App Store id, digits only."}
        name: {type: string, maxLength: 200}
        country: {type: string, maxLength: 2, description: "Two-letter App Store country; defaults to the workspace's own."}

    GrowthCompetitor:
      type: object
      required: [appId, name, country, active]
      properties:
        appId: {type: string}
        name: {type: string}
        country: {type: string}
        active: {type: boolean}

    SetTrackedKeywordsRequest:
      type: object
      required: [keywords]
      properties:
        keywords:
          type: array
          maxItems: 25
          items: {type: string, maxLength: 100}
        country: {type: string, maxLength: 2, description: "Two-letter App Store country the keywords are searched in; defaults to the workspace's own."}

    AiVisibility:
      type: object
      required: [brandTerms, questions, skipped]
      properties:
        brandTerms:
          type: array
          items: {type: string}
        questions:
          type: array
          items:
            $ref: "#/components/schemas/AiVisibilityQuestion"
        skipped:
          type: array
          description: Assistants the workspace has no credential for. Computed on read.
          items:
            $ref: "#/components/schemas/AiVisibilitySkipped"

    AiVisibilityQuestion:
      type: object
      required: [id, question, active, assistants]
      properties:
        id: {type: string}
        question: {type: string}
        active: {type: boolean}
        assistants:
          type: array
          description: Only assistants with at least one reading in the window.
          items:
            $ref: "#/components/schemas/AiVisibilityAssistant"

    AiVisibilityAssistant:
      type: object
      required: [assistant, latest, trend]
      properties:
        assistant: {type: string, description: "The model provider id: claude, openai, ..."}
        latest:
          $ref: "#/components/schemas/AiVisibilityResult"
        trend:
          type: array
          description: One point per week read, oldest first. A week with no reading is absent.
          items:
            $ref: "#/components/schemas/AiVisibilityTrendPoint"

    AiVisibilityResult:
      type: object
      required: [weekStart, named]
      properties:
        weekStart: {type: string, format: date, description: "The Monday (UTC) of the ISO week read."}
        named: {type: boolean}
        rankInAnswer: {type: integer, nullable: true, description: "1-based position of the first list item naming the brand; null when not named or the answer was not a list."}
        excerpt: {type: string, nullable: true}
        model: {type: string, nullable: true, description: "The model asked; null when the provider chose its own."}

    AiVisibilityTrendPoint:
      type: object
      required: [weekStart, named]
      properties:
        weekStart: {type: string, format: date}
        named: {type: boolean}

    AiVisibilitySkipped:
      type: object
      required: [assistant, reason]
      properties:
        assistant: {type: string}
        reason: {type: string, description: "no credential, or the weekly limit of 20 checks reached."}

    AiVisibilityFailure:
      type: object
      required: [assistant, reason]
      properties:
        assistant: {type: string}
        question: {type: string, nullable: true, description: "Null when the failure is not about one question (a credential that could not be read)."}
        reason: {type: string, description: "One line with any key removed."}

    AiVisibilityRunResult:
      type: object
      required: [weekStart, recorded, alreadyRecorded, skipped, errors]
      properties:
        weekStart: {type: string, format: date}
        recorded: {type: integer, description: "Readings written by this run."}
        alreadyRecorded: {type: integer, description: "Question and assistant pairs already read this week; no call was made for them."}
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/AiVisibilitySkipped"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/AiVisibilityFailure"

    SetAiQuestionsRequest:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          maxItems: 20
          items: {type: string, maxLength: 400}

    AiQuestionList:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/AiQuestion"

    AiQuestion:
      type: object
      required: [id, question, active]
      properties:
        id: {type: string}
        question: {type: string}
        active: {type: boolean}

    SetAiBrandTermsRequest:
      type: object
      required: [brandTerms]
      properties:
        brandTerms:
          type: array
          maxItems: 10
          items: {type: string, maxLength: 80}

    AiBrandTerms:
      type: object
      required: [brandTerms]
      properties:
        brandTerms:
          type: array
          items: {type: string}

    MarketingReport:
      type: object
      required: [window, generatedAt, sources, headline, acquisition, funnel, daily, scorecard, keywords, ads, benchmarks, changes]
      properties:
        window:
          $ref: "#/components/schemas/ReportWindow"
        generatedAt: {type: string, format: date-time}
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ReportSource"
        headline:
          type: array
          items:
            $ref: "#/components/schemas/ReportMetric"
        acquisition:
          type: array
          items:
            $ref: "#/components/schemas/ReportAcquisitionRow"
        funnel:
          $ref: "#/components/schemas/ReportFunnel"
        daily:
          type: array
          items:
            $ref: "#/components/schemas/ReportDay"
        scorecard:
          type: array
          items:
            $ref: "#/components/schemas/ReportScorecardRow"
        keywords:
          type: array
          items:
            $ref: "#/components/schemas/ReportKeyword"
        ads:
          type: array
          items:
            $ref: "#/components/schemas/ReportAd"
        benchmarks:
          type: array
          items:
            $ref: "#/components/schemas/ReportBenchmark"
        changes:
          $ref: "#/components/schemas/ReportChanges"
        adsCoverage:
          type: array
          description: One row per Apple Ads campaign, largest spend first. Empty when Apple Ads is not connected.
          items:
            $ref: "#/components/schemas/ReportAdsCoverage"
        changeMarkers:
          type: array
          description: The day each LIVE or REVIEWED change went live (its liveSince field), oldest first, for a chart to mark.
          items:
            $ref: "#/components/schemas/ReportChangeMarker"
        definitions:
          type: object
          description: "What each metric the report mentions counts, keyed by CHANNEL.key (for example ADS.installs): the headline and scorecard metrics, the metrics the acquisition rows read and the metric each benchmark was compared with."
          additionalProperties:
            $ref: "#/components/schemas/OverviewMetricDefinition"
        store:
          allOf:
            - $ref: "#/components/schemas/ReportStore"
          nullable: true
          description: Both store download figures. Null when App Store Connect is not connected.

    ReportWindow:
      type: object
      required: [from]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date, nullable: true, description: "Null when no channel has data."}

    ReportSource:
      type: object
      required: [channel, status]
      properties:
        channel: {type: string, description: "WEB, SEARCH, SOCIAL, STORE, ADS or PRODUCT."}
        connector: {type: string, nullable: true, description: "The connected connector id(s); null when none is connected."}
        status: {type: string, description: "LIVE, STALE, MISMATCH, NOT_CONNECTED or COMING_SOON."}
        dataCompleteThrough: {type: string, format: date, nullable: true}
        lastFetchedAt: {type: string, format: date-time, nullable: true}
        timeZone: {type: string, nullable: true, description: "The time zone that decides which day a row of this channel belongs to (Apple Ads: UTC). Null when the connector does not state one."}
        searchTermTimeZone: {type: string, nullable: true, description: "Apple Ads only: search-term rows are days in the org's report time zone (ORTZ), which is not the zone of every other Apple Ads row."}

    ReportMetric:
      type: object
      required: [channel, key, label, unit, goodDirection, status]
      properties:
        channel: {type: string}
        key: {type: string}
        label: {type: string}
        unit: {type: string, description: "COUNT, CURRENCY, PERCENT, POSITION or RATING."}
        value: {type: number, format: double, nullable: true}
        previous: {type: number, format: double, nullable: true}
        target: {type: number, format: double, nullable: true}
        status: {type: string, description: "ON_TRACK, WATCH, OFF_TRACK, TOO_EARLY or NO_TARGET."}
        missPct: {type: number, format: double, nullable: true}
        sampleSize: {type: integer, format: int64, nullable: true}
        goodDirection: {type: string, enum: [UP, DOWN]}
        definition:
          allOf:
            - $ref: "#/components/schemas/OverviewMetricDefinition"
          nullable: true

    ReportDerivation:
      type: object
      required: [from, to, days]
      description: >-
        Where an organic figure comes from: gross (the store's) and paid (Apple Ads') figures, each summed over the
        same settled days before flooring at 0. The days need not be consecutive.
      properties:
        from: {type: string, format: date, description: First day both sources have settled.}
        to: {type: string, format: date, description: Last day both sources have settled.}
        days: {type: integer, description: How many days were summed.}
        grossInstalls: {type: number, format: double, nullable: true, description: App Store search first-time downloads over those days.}
        paidInstalls: {type: number, format: double, nullable: true, description: Apple Ads first-time downloads (tap new downloads) over those days.}
        grossReach: {type: number, format: double, nullable: true, description: App Store search impressions over those days. Null when either source lacks impressions for some of them.}
        paidReach: {type: number, format: double, nullable: true, description: Apple Ads impressions over those days.}

    ReportCoverage:
      type: object
      required: [daysCovered, daysInWindow]
      properties:
        daysCovered: {type: integer, description: Days of the window the figure was read on.}
        daysInWindow: {type: integer, description: Days in the window.}

    ReportStore:
      type: object
      properties:
        downloadsOfRecord: {type: number, format: double, nullable: true, description: "Apple Sales Reports first-time downloads for the window (never privacy-thresholded). Null when the connection has none."}
        analyticsDownloads: {type: number, format: double, nullable: true, description: "App Store Connect Analytics first-time downloads for the window (privacy-thresholded); the source-type splits stay on these."}
        coverage:
          allOf:
            - $ref: "#/components/schemas/ReportCoverage"
          nullable: true
          description: The days Sales Reports were read on. Null when there is no figure of record, or no day count was stored.

    ReportAcquisitionRow:
      type: object
      required: [key, label, status, derived]
      properties:
        key: {type: string}
        label: {type: string}
        status: {type: string, description: "The status of the channel the row reads from."}
        reach: {type: number, format: double, nullable: true}
        reachLabel: {type: string, nullable: true}
        actions: {type: number, format: double, nullable: true}
        actionsLabel: {type: string, nullable: true}
        installs: {type: number, format: double, nullable: true}
        cost: {type: number, format: double, nullable: true}
        derived: {type: boolean, description: "True when the installs are computed from two sources rather than read."}
        note: {type: string, nullable: true}
        viewThroughInstalls: {type: number, format: double, nullable: true, description: "Apple Ads row only: installs with no tap. Never added to installs. Null when the feed reports none."}
        likes: {type: number, format: double, nullable: true, description: "Social row only: total likes the connected accounts have received (TikTok). Null when none is reported."}
        derivation:
          allOf:
            - $ref: "#/components/schemas/ReportDerivation"
          nullable: true
          description: "Organic search row only: the days and the gross and paid figures behind installs and reach. Null when the row was not derived."

    ReportFunnel:
      type: object
      required: [basis, stages]
      properties:
        basis: {type: string, enum: [EVENT, COHORT]}
        stages:
          type: array
          items:
            $ref: "#/components/schemas/ReportFunnelStage"

    ReportFunnelStage:
      type: object
      required: [key, label, biggestDrop]
      properties:
        key: {type: string}
        label: {type: string}
        value: {type: number, format: double, nullable: true}
        dropPct: {type: number, format: double, nullable: true, description: "Share lost since the previous stage (0.25 = 25% fewer)."}
        biggestDrop: {type: boolean}
        coverage:
          allOf:
            - $ref: "#/components/schemas/ReportCoverage"
          nullable: true
          description: "Set on a stage read from Apple Sales Reports (downloads of record): the days they were read on."
        note: {type: string, nullable: true, description: "Where the stage's value comes from when it is not the overview's own metric (Sales Reports downloads; web sessions with an App Store tap)."}

    ReportDay:
      type: object
      required: [day, provisional]
      properties:
        day: {type: string, format: date}
        storeImpressions: {type: number, format: double, nullable: true}
        adSpend: {type: number, format: double, nullable: true}
        provisional: {type: boolean}

    ReportScorecardRow:
      type: object
      required: [key, label, status, source]
      properties:
        key: {type: string}
        label: {type: string}
        area: {type: string, nullable: true, description: "ACQUISITION, ACTIVATION, RETENTION or REVENUE."}
        value: {type: number, format: double, nullable: true}
        target: {type: number, format: double, nullable: true}
        targetWindow: {type: string, nullable: true, description: "The period a count or currency target is stated for, e.g. \"28d\"."}
        status: {type: string}
        missPct: {type: number, format: double, nullable: true}
        basis: {type: string, nullable: true, description: "What the number counts, or \"2 of 30\" for a ratio with no description."}
        sampleSize: {type: integer, format: int64, nullable: true}
        source:
          $ref: "#/components/schemas/ReportScorecardSource"
        definition:
          allOf:
            - $ref: "#/components/schemas/OverviewMetricDefinition"
          nullable: true

    ReportScorecardSource:
      type: object
      required: [channel]
      properties:
        channel: {type: string}
        connector: {type: string, nullable: true}

    ReportKeyword:
      type: object
      required: [keywordId, text, judgeable]
      properties:
        keywordId: {type: string}
        text: {type: string}
        adGroup: {type: string, nullable: true}
        campaign: {type: string, nullable: true}
        status: {type: string, nullable: true}
        matchType: {type: string, nullable: true}
        bid: {type: number, format: double, nullable: true}
        impressions: {type: number, format: double, nullable: true}
        taps: {type: number, format: double, nullable: true}
        tapRate: {type: number, format: double, nullable: true}
        installs: {type: number, format: double, nullable: true, description: "Apple's tap installs (tap new downloads plus tap redownloads), the same meaning as on the campaign rows. Before RE-99 this was first-time downloads."}
        installRate: {type: number, format: double, nullable: true, description: "Tap installs per tap."}
        spend: {type: number, format: double, nullable: true}
        cpi: {type: number, format: double, nullable: true, description: "Spend per tap install."}
        trials: {type: number, format: double, nullable: true, description: "In-app trial starts attributed to the keyword; null when the product feed has none."}
        activations: {type: number, format: double, nullable: true}
        judgeable: {type: boolean, description: "True with at least 20 taps; fewer is too early to judge."}
        newDownloads: {type: number, format: double, nullable: true, description: "First-time downloads from taps (Apple's tapNewDownloads), a subset of installs. Null when the feed has none."}

    ReportAd:
      type: object
      required: [adId, name]
      properties:
        adGroup: {type: string, nullable: true}
        adId: {type: string}
        name: {type: string}
        creativeType: {type: string, nullable: true}
        productPageId: {type: string, nullable: true}
        status: {type: string, nullable: true}
        impressions: {type: number, format: double, nullable: true}
        taps: {type: number, format: double, nullable: true}
        installs: {type: number, format: double, nullable: true}
        installRate: {type: number, format: double, nullable: true}
        spend: {type: number, format: double, nullable: true}
        cpi: {type: number, format: double, nullable: true}

    ReportBenchmark:
      type: object
      required: [metricRef, value, judged, stale, benchmark, sourceName, sourceUrl, checkedOn]
      properties:
        metricRef: {type: string}
        label: {type: string, nullable: true}
        value: {type: number, format: double, nullable: true, description: "The report's own value for the metric; null when there is none."}
        benchmark: {type: number, format: double}
        rangeText: {type: string, nullable: true}
        segment: {type: string, nullable: true}
        sourceName: {type: string}
        sourceUrl: {type: string}
        checkedOn: {type: string, format: date}
        ratio: {type: number, format: double, nullable: true, description: "value / benchmark."}
        goodDirection: {type: string, enum: [UP, DOWN], nullable: true}
        sampleSize: {type: integer, format: int64, nullable: true}
        judged: {type: boolean, description: "False when there is no value, when the benchmark is not comparable to any metric of the channel (see comparable), or when a rate rests on fewer than 20 observations."}
        stale: {type: boolean, description: "True when checkedOn is more than 90 days old."}
        numerator: {type: string, nullable: true, description: "The benchmark's own numerator; null when it has no definition."}
        denominator: {type: string, nullable: true, description: "The benchmark's own denominator; null for a count or when it has no definition."}
        sourceType: {type: string, nullable: true, description: "The benchmark's own traffic source; null means ALL."}
        comparedMetricRef:
          type: string
          nullable: true
          description: "CHANNEL.key of the metric value was read from: the metric the benchmark names, or another metric of the same channel whose definition matches the benchmark's."
        metricDefinition:
          allOf:
            - $ref: "#/components/schemas/OverviewMetricDefinition"
          nullable: true
          description: The compared metric's definition.
        comparable:
          type: boolean
          description: "True when the compared metric's numerator, denominator and source type equal the benchmark's. False when the benchmark has no definition or no metric of the channel matches; judged is then false."
        reason:
          type: string
          nullable: true
          description: "When comparable is false: \"definition missing\", or the two definitions named side by side. Null when comparable."

    ReportAdsCoverage:
      type: object
      required: [campaignId, name, rows]
      properties:
        campaignId: {type: string}
        name: {type: string}
        spend: {type: number, format: double, nullable: true, description: "The campaign's spend over the window."}
        keywordSpend: {type: number, format: double, nullable: true, description: "Spend of the keyword rows whose state names this campaign. 0 with rows 0 means no keyword row reached it."}
        searchTermSpend: {type: number, format: double, nullable: true, description: "Spend of the search-term rows whose key starts with this campaign's id. Only the account's 50 largest search-term rows are read, so on a larger account this is a lower bound."}
        keywordCoveragePct: {type: number, format: double, nullable: true, description: "keywordSpend / spend (0.98 = 98%). Null when the campaign has no spend."}
        rows: {type: integer, description: Keyword rows plus search-term rows that belong to this campaign.}

    ReportChangeMarker:
      type: object
      required: [day, changeId, displayId, title, status]
      properties:
        day: {type: string, format: date, description: The change's liveSince date.}
        changeId: {type: string}
        displayId: {type: string}
        title: {type: string}
        status: {type: string, description: LIVE or REVIEWED.}

    ReportChanges:
      type: object
      required: [open, dueForReview, reviewedInWindow]
      properties:
        open:
          type: array
          description: Changes still PLANNED or LIVE.
          items:
            $ref: "#/components/schemas/ReportChange"
        dueForReview:
          type: array
          description: PLANNED or LIVE changes whose review date has passed and that have no verdict yet.
          items:
            $ref: "#/components/schemas/ReportChange"
        reviewedInWindow:
          type: array
          description: Changes that reached REVIEWED during the report window (by completion time, else last edit).
          items:
            $ref: "#/components/schemas/ReportChange"

    ReportChange:
      type: object
      required: [id, displayId, title, type, status]
      properties:
        id: {type: string}
        displayId: {type: string}
        title: {type: string}
        type: {type: string}
        status: {type: string}
        assignee:
          allOf:
            - $ref: "#/components/schemas/WorkItemAssignee"
          nullable: true
        dueOn: {type: string, format: date, nullable: true}
        fields:
          type: object
          additionalProperties: true
          nullable: true

    MarketingChangesImportRequest:
      type: object
      required: [records]
      properties:
        source:
          type: string
          maxLength: 64
          default: rexipe
          description: "Names the change log the records come from. A record is idempotent on (source, id), so two logs may reuse an id."
        records:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/MarketingChangeRecord"

    MarketingChangeRecord:
      type: object
      description: >-
        One record of the outside change log, in that log's own shape (so live_since, review_on and stop_rules keep
        their snake_case names). Every key is optional except that a record needs an `id` and a known `status`; a
        missing key is the same as null.
      properties:
        id: {type: string, description: "The record's id in the source log; the idempotency key (at most 190 characters)."}
        date: {type: string, nullable: true, description: "When the change was made, yyyy-MM-dd. Stands in for a missing or unreadable live_since on a live or reviewed record."}
        type: {type: string, nullable: true, description: "seo, asa-change, asa-campaign, aso-visible, aso-keywords, cpp, ppo, release, onboarding, paywall or baseline; anything else is imported as OTHER."}
        title: {type: string, nullable: true, description: "At most 255 characters."}
        status: {type: string, description: "planned, live, reviewed, abandoned, stopped or reference (skipped). Any other value refuses the record."}
        changed: {type: string, nullable: true, description: "What changed; becomes the description."}
        evidence:
          type: array
          nullable: true
          items: {type: string}
        hypothesis: {type: string, nullable: true}
        baseline: {type: string, nullable: true}
        control: {type: string, nullable: true}
        live_since: {type: string, nullable: true, description: "A leading yyyy-MM-dd fills liveSince; any further text is kept in the description."}
        review_on: {type: string, nullable: true, description: "A leading yyyy-MM-dd fills the review date (dueOn); any further text is kept in the description."}
        outcome: {type: string, nullable: true}
        verdict: {type: string, nullable: true, description: "worked, hurt, no effect, expected..., or inconclusive. Anything else refuses the record."}
        lesson: {type: string, nullable: true}
        stop_rules: {type: string, nullable: true}
        stop_rules_note: {type: string, nullable: true}

    MarketingChangesImportResponse:
      type: object
      required: [created, alreadyImported, skipped, refused, items]
      properties:
        created: {type: integer, format: int32}
        alreadyImported: {type: integer, format: int32, description: "Records whose (source, id) was imported before; left untouched."}
        skipped:
          type: array
          description: Records that are not changes (reference records).
          items:
            $ref: "#/components/schemas/MarketingChangeImportNote"
        refused:
          type: array
          description: Records that could not be imported, each with the reason. The rest of the request is unaffected.
          items:
            $ref: "#/components/schemas/MarketingChangeImportNote"
        items:
          type: array
          description: The Work Items this call created.
          items:
            $ref: "#/components/schemas/MarketingChangeImportItem"

    MarketingChangeImportNote:
      type: object
      required: [id, reason]
      properties:
        id: {type: string, description: "The record id, or #<position> for a record that has none."}
        reason: {type: string}

    MarketingChangeImportItem:
      type: object
      required: [id, displayId, recordId, status]
      properties:
        id: {type: string, description: "The Work Item id."}
        displayId: {type: string}
        recordId: {type: string, description: "The id the record has in the source log."}
        status: {type: string, description: "The status the Work Item was created in."}

    MarketingTarget:
      type: object
      required: [value, direction]
      properties:
        value: {type: number, format: double}
        direction:
          type: string
          enum: [UP, DOWN]
        readOnly:
          type: boolean
          description: True when a connector feed owns the target (cannot be set or cleared here).
        window:
          type: string
          nullable: true
          description: The period a count or currency total target is stated for, e.g. "28d"; the status prorates it to the requested window. Null means the target is compared as stated, never prorated.
        effectiveValue:
          type: number
          format: double
          nullable: true
          description: The target the value was judged against in the requested window - value prorated from window when the target declares one, otherwise value. Present on metric output.
        watchBandPct:
          type: number
          format: double
          nullable: true
          description: How close a miss counts as WATCH rather than OFF_TRACK, in percent of the target. Null means 10.
        source:
          type: string
          nullable: true
          description: Where a read-only target is set, e.g. "Set in Product metrics".

    MarketingTargetRequest:
      type: object
      required: [target]
      properties:
        target:
          type: number
          format: double
          minimum: 0
        direction:
          type: string
          enum: [UP, DOWN]

    MarketingChannelDetailResponse:
      type: object
      required: [window, channel, dimensions]
      properties:
        window:
          $ref: "#/components/schemas/OverviewWindow"
        channel:
          $ref: "#/components/schemas/OverviewChannel"
        dimensions:
          type: array
          items:
            $ref: "#/components/schemas/OverviewDimension"
        topPosts:
          type: array
          description: SOCIAL only; the top 5 posts of the window by engagement rate.
          items:
            $ref: "#/components/schemas/InsightsPost"

    OverviewDimension:
      type: object
      required: [key, label, columns, rows]
      properties:
        key: {type: string, description: "referrers, queries, campaigns or platforms."}
        label: {type: string}
        columns:
          type: array
          items:
            $ref: "#/components/schemas/OverviewDimensionColumn"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/OverviewDimensionRow"

    OverviewDimensionColumn:
      type: object
      required: [key, label, unit]
      properties:
        key: {type: string}
        label: {type: string}
        unit:
          type: string
          enum: [COUNT, CURRENCY, PERCENT, POSITION, RATING]

    OverviewDimensionRow:
      type: object
      required: [key, label, values]
      properties:
        key: {type: string}
        label: {type: string}
        values:
          type: array
          description: One entry per column, in column order.
          items: {type: number, format: double, nullable: true}
        state:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            The member's current state as its connector reports it (for an Apple Ads keyword: status, bidAmount,
            matchType, adGroupName, campaignName, campaignStatus); absent when the connector reports none.

    MarketingInsightsResponse:
      type: object
      required:
        - window
        - totals
        - byPlatform
        - byFormat
        - byHour
        - byWeekday
        - topPosts
        - bottomPosts
        - movers
        - coverage
        - creatives
      properties:
        window:
          $ref: "#/components/schemas/InsightsWindow"
        totals:
          $ref: "#/components/schemas/InsightsGroup"
        byPlatform:
          type: array
          items:
            $ref: "#/components/schemas/InsightsGroup"
          description: One row per platform, key = platform id, sorted by engagement rate descending (nulls last).
        byFormat:
          type: array
          items:
            $ref: "#/components/schemas/InsightsGroup"
          description: One row per format (FEED, REEL, STORY, …), key = format.
        byHour:
          type: array
          items:
            $ref: "#/components/schemas/InsightsGroup"
          description: One row per UTC hour of the destination's fire time that has at least one post, key = "0".."23", sorted by hour.
        byWeekday:
          type: array
          items:
            $ref: "#/components/schemas/InsightsGroup"
          description: One row per UTC weekday of the fire time, key = MONDAY..SUNDAY, sorted Monday first.
        topPosts:
          type: array
          items:
            $ref: "#/components/schemas/InsightsPost"
          description: Up to ten destinations with the highest engagement rate (views ≥ 1), best first.
        bottomPosts:
          type: array
          items:
            $ref: "#/components/schemas/InsightsPost"
          description: Up to five destinations with the lowest engagement rate (views ≥ 1), worst first. Empty when fewer than ten destinations reported.
        movers:
          type: array
          items:
            $ref: "#/components/schemas/InsightsMover"
          description: How this window's totals compare with the window of the same length immediately before it.
        coverage:
          $ref: "#/components/schemas/InsightsCoverage"
        creatives:
          type: array
          items:
            $ref: "#/components/schemas/CreativePerformanceEntry"
          description: >-
            Up to ten Creative variants (COND-24 T5) with the highest views among destinations published
            through them that fired inside the window, best first. Empty on a workspace that has not
            attached any Creative to a Post yet.

    InsightsWindow:
      type: object
      required:
        - from
        - to
        - days
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        days:
          type: integer

    InsightsGroup:
      type: object
      description: The counters of one grouping of destinations, summed over each destination's latest snapshot.
      required:
        - key
        - posts
        - views
        - likes
        - comments
        - shares
        - saves
      properties:
        key:
          type: string
          description: The group's identity — a platform, a format, an hour, a weekday, or "all" for totals.
        label:
          type: string
          nullable: true
          description: A display name where the key is not one (e.g. "Instagram").
        posts:
          type: integer
          description: Destinations in the group with at least one snapshot.
        views:
          type: integer
          format: int64
        likes:
          type: integer
          format: int64
        comments:
          type: integer
          format: int64
        shares:
          type: integer
          format: int64
        saves:
          type: integer
          format: int64
        engagementRate:
          type: number
          format: double
          nullable: true
          description: (likes + comments + shares + saves) / views; null when views are zero.
        medianViews:
          type: integer
          format: int64
          nullable: true
          description: The median of the group's latest per-destination views; null when no destination has views.
        avgViewPct:
          type: number
          format: double
          nullable: true
          description: Mean of the destinations' average-view-percentage where a platform reports it (YouTube); null otherwise.

    InsightsPost:
      type: object
      required:
        - workItemId
        - targetId
        - platform
        - views
        - observedAt
      properties:
        workItemId:
          type: string
        displayId:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        workflowSlug:
          type: string
          nullable: true
          description: The Work Item's Workflow slug (e.g. "posts"), so a client can build the Post page route without guessing the Area's Workflow.
        captionExcerpt:
          type: string
          nullable: true
          description: The first 140 characters of the caption that went to this destination.
        targetId:
          type: string
        platform:
          type: string
        format:
          type: string
          nullable: true
        accountLabel:
          type: string
          nullable: true
        permalink:
          type: string
          nullable: true
        firedAt:
          type: string
          format: date-time
          nullable: true
        views:
          type: integer
          format: int64
        likes:
          type: integer
          format: int64
          nullable: true
        comments:
          type: integer
          format: int64
          nullable: true
        shares:
          type: integer
          format: int64
          nullable: true
        saves:
          type: integer
          format: int64
          nullable: true
        engagementRate:
          type: number
          format: double
          nullable: true
        avgViewPct:
          type: number
          format: double
          nullable: true
        observedAt:
          type: string
          format: date-time

    InsightsMover:
      type: object
      required:
        - metric
        - current
        - previous
      properties:
        metric:
          type: string
          description: posts, views, likes, comments, shares, saves or engagementRate.
        current:
          type: number
          format: double
        previous:
          type: number
          format: double
        deltaPct:
          type: number
          format: double
          nullable: true
          description: (current − previous) / previous × 100; null when previous is zero.

    InsightsCoverage:
      type: object
      required:
        - platforms
        - notes
      properties:
        platforms:
          type: array
          items:
            type: string
          description: Platforms with at least one snapshot in the window.
        notes:
          type: array
          items:
            type: string
          description: Plain sentences about what is not being counted — a platform that reports no views, a connection that needs reconnecting for insights.

    PublishPreflightResponse:
      type: object
      description: The approval gate's verdict on a Work Item, read without attempting a transition.
      required:
        - publishing
        - ready
        - blockers
        - warnings
        - consent
        - review
      properties:
        publishing:
          type: boolean
          description: Whether the Work Item's Workflow publishes at all. False means nothing else applies.
        ready:
          type: boolean
          description: True when no blocker stands — the next gate transition would be accepted by the validators.
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/PublishPreflightFinding"
          description: >-
            What the gate would refuse the item for, in the order a 422 lists them. Empty when ready.
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PublishPreflightFinding"
          description: Advisories a platform will act on without refusing (a Short, a cropped carousel).
        nextTransition:
          $ref: "#/components/schemas/PublishPreflightTransition"
        consent:
          $ref: "#/components/schemas/PublishPreflightConsent"
        review:
          $ref: "#/components/schemas/PublishPreflightReview"
        earliestFireTime:
          type: string
          format: date-time
          nullable: true
          description: >-
            The soonest `scheduledFor` the current destinations accept — "as soon as possible". Now plus the
            longest lead any selected platform demands (ten minutes for Facebook's native scheduler, a
            minute for an app-managed destination, nothing for a manual one). Null off a publishing Workflow.

    PublishPreflightFinding:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: >-
            Stable, machine-readable rule name — NO_FIRE_TIME, NO_TIMEZONE, UNKNOWN_TIMEZONE,
            FIRE_TIME_TOO_SOON, NO_TARGETS, NO_MEDIA, TARGET_MEDIA_MISSING, MEDIA_FORMAT, MEDIA_COMPOSITION,
            COPY_TOO_LONG, PUBLISH_OPTIONS, CONSENT_NEVER_GIVEN, CONSENT_SUPERSEDED; warnings carry
            MEDIA_ADVISORY. Messages may be reworded; codes may not.
        message:
          type: string
          description: The human sentence, exactly as a refused transition's 422 would carry it.
        targetId:
          type: string
          nullable: true
          description: The publish target the finding is about, or null for a Post-level finding.

    PublishPreflightTransition:
      type: object
      description: >-
        The move a ready item takes next: the first gate edge out of the current status, else the edge that
        hands it to review (Draft → In Review). Absent when the current status has neither (already
        scheduled, or published).
      required:
        - to
        - requiresReview
      properties:
        to:
          type: string
        label:
          type: string
          nullable: true
        requiresReview:
          type: boolean

    PublishPreflightConsent:
      type: object
      required:
        - required
        - verdict
      properties:
        required:
          type: boolean
          description: Whether a selected destination needs the creator's recorded consent.
        verdict:
          type: string
          enum:
            - NOT_REQUIRED
            - VALID
            - NEVER_GIVEN
            - SUPERSEDED

    PublishPreflightReview:
      type: object
      required:
        - gated
        - assignedReviewers
        - satisfied
      properties:
        gated:
          type: boolean
          description: Whether the Workflow has a review gate at all. A Workflow without one publishes on schedule entry.
        assignedReviewers:
          type: integer
          description: How many reviewers are assigned to this item. Zero on a gated Workflow means nobody has been asked.
        satisfied:
          type: boolean
          description: Whether an approval currently opens the gate — bound to the open review round and the bundle as it stands.
        reviewerRole:
          type: string
          nullable: true
          description: The project role the gate asks its approval from, or null when any approval satisfies it.
        requireIndependentReviewer:
          type: boolean
          description: When true, the gate ignores approvals by the item's own creator (self-approval does not count).
        authorId:
          type: string
          nullable: true
          description: The user id of the item's creator (null for an agent-created item). A client excludes this user from reviewer pickers when requireIndependentReviewer is true.

    PublishTargetResponse:
      type: object
      description: One publish target selected on a Work Item (a persisted post_publish_target row).
      required:
        - id
        - workItemId
        - platform
        - lane
        - state
        - effectiveAssetIds
      properties:
        id:
          type: string
        workItemId:
          type: string
        platform:
          type: string
          enum:
            - facebook
            - instagram
            - youtube
            - tiktok
        connectorId:
          type: string
          nullable: true
          description: Null on the MANUAL lane, which publishes through no connector.
        connectionId:
          type: string
          nullable: true
          description: >-
            The connected account this target publishes through. Null on the MANUAL lane, which reaches its
            platform through a human rather than a credential.
        label:
          type: string
          nullable: true
          description: Account label captured at selection time (post_publish_target.platform_account_label).
        lane:
          type: string
          description: >-
            How this target reaches its platform. NATIVE hands the post to the platform's own scheduler;
            APP_MANAGED means Conductor publishes it at fire time; MANUAL means nobody automates it — a
            human posts it and records the result, and no credential is used.
          enum:
            - NATIVE
            - APP_MANAGED
            - MANUAL
        state:
          type: string
          description: >-
            One of PENDING, HANDED_OFF, PUBLISHING, AWAITING_MANUAL, PUBLISHED, FAILED, REVOKED.
            AWAITING_MANUAL is a target waiting on a person: a MANUAL one whose fire time has passed, or an
            automated one the platform handed back (TikTok's pre-audit inbox upload, explained in
            errorMessage). Either is finished with the manual-publish call.
        stateLabel:
          type: string
          readOnly: true
          description: >-
            The human label for `state` (Waiting, Handed off, Publishing, Post it now, Published, Failed,
            Taken back), for direct display — the same words the UI's own status pill uses.
        platformPostId:
          type: string
          nullable: true
          description: The platform's id for the created post, once it exists.
        permalink:
          type: string
          nullable: true
          description: >-
            Link to the live post on the platform, captured when the target reaches PUBLISHED. This is the
            per-target evidence the Post detail renders; null until the publish is confirmed.
        errorMessage:
          type: string
          nullable: true
          description: >-
            The first human sentence of the platform's failure, with any JSON body, trace id and HTTP
            status prefix stripped. Null unless the target is FAILED or AWAITING_MANUAL.
        errorDetail:
          type: string
          nullable: true
          readOnly: true
          description: >-
            The platform's full failure text behind errorMessage — JSON body and all — for support and
            debugging. Null unless the target is FAILED or AWAITING_MANUAL.
        fireTime:
          type: string
          format: date-time
          nullable: true
          description: >-
            When this target publishes. Copied from the Work Item's scheduledFor and re-stamped whenever the
            Post re-enters its scheduled status, so it is the authoritative time for this target.
        publishOptions:
          $ref: "#/components/schemas/PublishOptions"
        captionOverride:
          type: string
          nullable: true
          description: >-
            This destination's own copy, or null when it uses the Post's caption. See `effectiveCaption`
            for what actually goes out.
        format:
          $ref: "#/components/schemas/PostFormat"
        assetIds:
          type: array
          nullable: true
          description: >-
            This destination's own ordered media selection, or **null when it inherits the Post's whole
            set**. Null and a list matching the Post's assets are different states: the first keeps
            following the Post as files change, the second does not.
          items:
            type: string
        effectiveAssetIds:
          type: array
          description: >-
            The media that actually goes out here, in order — this target's own selection, or the Post's
            set when it inherits. Empty when there is none to send, which blocks approval. A client
            rendering a preview should read this rather than re-deriving the inherit rule.
          items:
            type: string
        effectiveCaption:
          type: string
          nullable: true
          description: The copy that actually goes out here — `captionOverride` if set, else the Post's caption.

    RetryPublishResponse:
      type: object
      description: >-
        The result of re-firing a Post's failed publish targets: the Post's status afterwards and
        every one of its targets, so a client can render the new state without a second request.
      required:
        - workItemId
        - status
        - retriedCount
        - targets
      properties:
        workItemId:
          type: string
        status:
          type: string
          description: >-
            The Post's Workflow-defined status after the retry — its scheduled status when anything
            was re-fired, otherwise whatever it already was.
        retriedCount:
          type: integer
          format: int32
          description: How many targets were reset to PENDING. Zero when nothing had failed.
        targets:
          type: array
          description: Every publish target on the Post after the retry, failed or not.
          items:
            $ref: "#/components/schemas/PublishTargetResponse"

    PublishTargetSelection:
      type: object
      required:
        - platform
      properties:
        platform:
          type: string
          enum:
            - facebook
            - instagram
            - youtube
            - tiktok
        connectionId:
          type: string
          nullable: true
          description: >-
            The connected account to publish through. Omit it (or send null) to select this platform's
            MANUAL destination instead — the one a human publishes by hand. There is exactly one manual
            destination per platform, so the platform alone identifies it.
        format:
          $ref: "#/components/schemas/PostFormat"
        publishOptions:
          $ref: "#/components/schemas/PublishOptions"
        captionOverride:
          type: string
          nullable: true
          description: >-
            Copy for this destination alone, replacing the Post's caption when it goes out here. Omit it or
            send null to use the Post's caption. Set-replace like every other field on this schema: a client
            that re-sends a target without this field clears an override it previously set.
        assetIds:
          type: array
          nullable: true
          description: >-
            An ordered subset of the Post's uploaded media that this destination publishes. Omit it or send
            an empty array to inherit the Post's whole media set in Post order — which is the default, and
            keeps following the Post as files are added and removed.


            Order is content, not presentation: Instagram crops every carousel item to the first item's
            aspect ratio, and TikTok takes a photo post's cover from the first image. Each id must be a file
            asset of this Work Item. Set-replace, like `captionOverride`.
          items:
            type: string

    PostFormat:
      type: string
      description: >-
        The shape a destination publishes in. `feed` is the platform's ordinary post — an image, a video, a
        carousel, a photo set — and the default. `reel` is short vertical video on Facebook or Instagram.
        `story` is a single image or clip on Facebook or Instagram that disappears after 24 hours, takes
        no caption, and is fired by Conductor at its time because the platforms cannot schedule one. Each
        option row lists the formats its platform offers under `formats`; selecting one it does not offer
        is refused.
      enum:
        - feed
        - reel
        - story
      default: feed

    PublishOptions:
      type: object
      additionalProperties: true
      description: >-
        How the post goes out on this one platform — a per-platform bag of option keys, read against the
        target's own `platform` and nothing else. Omitted or null means nothing has been chosen, which is
        not the same as "the defaults are fine": a TikTok target with no `privacyLevel` blocks approval
        rather than publishing to the creator alone. (TIK-1.)


        TikTok keys: `privacyLevel` (string — one of the connection's cached privacyLevelOptions, e.g.
        PUBLIC_TO_EVERYONE, MUTUAL_FOLLOW_FRIENDS, FOLLOWER_OF_CREATOR, SELF_ONLY), `disableComment`,
        `disableDuet`, `disableStitch` (booleans), `brandContentToggle` (boolean — paid partnership; TikTok
        refuses it combined with SELF_ONLY) and `brandOrganicToggle` (boolean — the creator's own brand).


        Conductor-only key (TikTok, Instagram, Facebook, YouTube; never sent to a platform): `carouselAs`
        (`photos` | `video`) — for a target whose media comes from a CAROUSEL Creative with a music
        track, whether it publishes the slide images or the companion 9x16 slideshow video. Attaching the
        Creative writes the resolved value (`video` for TikTok, YouTube and Reel-format targets, `photos`
        for Instagram and Facebook feed); changing it re-selects that target's media. Ignored, with a
        warning, when the target's media is not from such a Creative.
      example:
        privacyLevel: PUBLIC_TO_EVERYONE
        disableComment: false
        brandContentToggle: true

    PublishConsentResponse:
      type: object
      description: >-
        The creator's posting consent on a Post, and whether it still describes the Post. (MKT-1.)
      required:
        - workItemId
        - required
        - valid
        - verdict
      properties:
        workItemId:
          type: string
        required:
          type: boolean
          description: >-
            True when the Post publishes to at least one `tiktok` account. A Facebook-only or
            YouTube-only Post is never gated on consent.
        valid:
          type: boolean
          description: >-
            True only when consent was given and still covers the Post's current accounts, publish
            options and uploaded media. False on a Post that needs no consent at all.
        verdict:
          type: string
          description: >-
            The same fact in one word, for a client that needs to say what is wrong.
            `NOT_REQUIRED` — no TikTok target. `VALID` — consent stands. `NEVER_GIVEN` — nobody has
            consented (or it was withdrawn). `SUPERSEDED` — consent was given, then the accounts,
            options or media changed under it and it has to be given again.
          enum:
            - NOT_REQUIRED
            - VALID
            - NEVER_GIVEN
            - SUPERSEDED
        consentedAt:
          type: string
          format: date-time
          nullable: true
          description: When consent was last given; null when it never was, or was withdrawn.
        consentedByUserId:
          type: string
          nullable: true
          description: The member who consented; null when consent has never been given.
        consentedByName:
          type: string
          nullable: true
          description: That member's display name, so the record reads as a name rather than an id.
        etag:
          type: string
          nullable: true
          description: >-
            The strong ETag of the Post's consent subject, quotes included — the value to send as
            `If-Match` on `PUT .../tiktok-consent`. Populated on every `publish-consent` read and write
            and on the `tiktok-consent` write.

    RecordPublishConsentRequest:
      type: object
      required:
        - consented
      properties:
        consented:
          type: boolean
          description: >-
            True to consent to this Post going out to its current accounts under their current publish
            options, with its current media. False to withdraw consent.

    RecordTikTokConsentRequest:
      type: object
      description: >-
        What the creator chose and agreed to, for every non-MANUAL TikTok target on the Post.
      required:
        - targets
        - declarationVersion
        - channel
      properties:
        targets:
          type: array
          description: Exactly one entry per non-MANUAL TikTok target, keyed by `connectionId`.
          items:
            $ref: "#/components/schemas/TikTokConsentChoice"
        declarationVersion:
          type: string
          maxLength: 64
          description: Identifies the wording of the declaration the person was shown, kept in the audit.
        channel:
          type: string
          description: Where the person consented — the Post's own page or the bulk consent page.
          enum:
            - POST_PAGE
            - BULK_PAGE
        requestId:
          type: string
          nullable: true
          description: >-
            The consent request being worked through (bulk page). Must belong to the caller and include
            this Post; 410 once expired.

    TikTokConsentChoice:
      type: object
      description: >-
        One TikTok account's human-only choices. Every field is required so that a choice is always
        explicit; there is no default. `disable*` true means that interaction is **not** allowed.
      required:
        - connectionId
        - privacyLevel
        - disableComment
        - disableDuet
        - disableStitch
        - brandContentToggle
        - brandOrganicToggle
      properties:
        connectionId:
          type: string
        privacyLevel:
          type: string
          description: One of the levels the creator's account offers (e.g. `PUBLIC_TO_EVERYONE`, `SELF_ONLY`).
        disableComment:
          type: boolean
        disableDuet:
          type: boolean
        disableStitch:
          type: boolean
        brandContentToggle:
          type: boolean
          description: Paid-partnership disclosure. Cannot be combined with `SELF_ONLY`.
        brandOrganicToggle:
          type: boolean
          description: Promotes the creator's own brand.

    CreateTikTokConsentRequest:
      type: object
      properties:
        workItemIds:
          type: array
          nullable: true
          description: >-
            The Posts to ask about, by id or display id (e.g. `RE-80`). Unknown ids do not fail the request;
            they come back in `skipped` as NOT_FOUND. Omit for every Post in the project pending TikTok consent.
          items:
            type: string

    TikTokConsentRequestItem:
      type: object
      required:
        - workItemId
        - displayId
        - title
        - verdict
      properties:
        workItemId:
          type: string
        displayId:
          type: string
          description: The human id, e.g. `RE-81`.
        title:
          type: string
        verdict:
          type: string
          enum:
            - NOT_REQUIRED
            - VALID
            - NEVER_GIVEN
            - SUPERSEDED
        consentedAt:
          type: string
          format: date-time
          nullable: true
        consentedByUserId:
          type: string
          nullable: true
        consentedByName:
          type: string
          nullable: true

    TikTokConsentSkipped:
      type: object
      description: A Post that was asked about but is not part of the request.
      required:
        - workItemId
        - reason
      properties:
        workItemId:
          type: string
          description: The id as given when it was not found, otherwise the Post's id.
        displayId:
          type: string
          nullable: true
          description: The Post's display id (e.g. `RE-80`) when it was found.
        reason:
          type: string
          enum:
            - NOT_FOUND
            - NOT_REQUIRED
            - ALREADY_VALID

    TikTokConsentRequestResponse:
      type: object
      required:
        - id
        - consentUrl
        - expiresAt
        - items
        - skipped
        - complete
      properties:
        id:
          type: string
          description: Opaque request id; also the MCP `elicitationId`.
        consentUrl:
          type: string
          description: >-
            The page to give the person: `<frontend>/app/projects/{projectId}/marketing/consent?request=<id>`.
            Carries no other data and no credentials.
        expiresAt:
          type: string
          format: date-time
        items:
          type: array
          description: The Posts the person still has to consent to.
          items:
            $ref: "#/components/schemas/TikTokConsentRequestItem"
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/TikTokConsentSkipped"
        complete:
          type: boolean
          description: True when nothing is left to consent to (`items` is empty).

    TikTokConsentRequestStatus:
      type: object
      required:
        - id
        - consentUrl
        - expiresAt
        - expired
        - complete
        - items
      properties:
        id:
          type: string
        consentUrl:
          type: string
          description: The same link the create call returned, so a client resuming with the id can show it again.
        expiresAt:
          type: string
          format: date-time
        expired:
          type: boolean
        complete:
          type: boolean
          description: True once every Post in the request has been `VALID`; stays true after.
        completedAt:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/TikTokConsentRequestItem"

    TikTokConsentCreator:
      type: object
      description: >-
        A TikTok account's creator options as TikTok reports them now (cached at most 60 seconds).
        The avatar URL expires after about two hours.
      required:
        - connectionId
        - privacyLevelOptions
        - commentDisabled
        - duetDisabled
        - stitchDisabled
        - canPost
        - reconnectRequired
      properties:
        connectionId:
          type: string
        nickname:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        privacyLevelOptions:
          type: array
          items:
            type: string
        commentDisabled:
          type: boolean
          description: The creator has turned comments off; the page must not offer to allow them.
        duetDisabled:
          type: boolean
        stitchDisabled:
          type: boolean
        maxVideoPostDurationSec:
          type: integer
          nullable: true
        canPost:
          type: boolean
          description: False when TikTok will not accept a post from this account right now.
        cannotPostReason:
          type: string
          nullable: true
        reconnectRequired:
          type: boolean

    TikTokConsentTarget:
      type: object
      required:
        - targetId
        - connectionId
        - format
        - effectiveAssetIds
      properties:
        targetId:
          type: string
        connectionId:
          type: string
        format:
          type: string
        effectiveAssetIds:
          type: array
          description: The media this target will publish, in order (its own selection, or the Post's).
          items:
            type: string
        captionOverride:
          type: string
          nullable: true
        effectiveCaption:
          type: string
          nullable: true
        consented:
          nullable: true
          description: The stored human-only choices; present only when the Post's verdict is `VALID`.
          allOf:
            - $ref: "#/components/schemas/TikTokConsentChoice"

    TikTokConsentPost:
      type: object
      required:
        - workItemId
        - displayId
        - title
        - verdict
        - etag
        - targets
      properties:
        workItemId:
          type: string
        displayId:
          type: string
        title:
          type: string
        caption:
          type: string
          nullable: true
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        verdict:
          type: string
          enum:
            - NOT_REQUIRED
            - VALID
            - NEVER_GIVEN
            - SUPERSEDED
        etag:
          type: string
          description: The strong ETag (quotes included) to send as `If-Match` when consenting.
        consentedAt:
          type: string
          format: date-time
          nullable: true
        consentedByUserId:
          type: string
          nullable: true
        consentedByName:
          type: string
          nullable: true
        targets:
          type: array
          description: The Post's non-MANUAL TikTok targets.
          items:
            $ref: "#/components/schemas/TikTokConsentTarget"

    TikTokConsentSummary:
      type: object
      required:
        - pendingCount
      properties:
        pendingCount:
          type: integer

    TikTokConsentPage:
      type: object
      required:
        - posts
        - creators
      properties:
        requestId:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        posts:
          type: array
          items:
            $ref: "#/components/schemas/TikTokConsentPost"
        creators:
          type: array
          description: One entry per distinct TikTok connection used by `posts`.
          items:
            $ref: "#/components/schemas/TikTokConsentCreator"

    CompleteManualPublishRequest:
      type: object
      required:
        - permalink
      properties:
        permalink:
          type: string
          description: >-
            Link to the post that actually went out. Required, and the reason this endpoint exists: it is
            the only record that a manual destination was ever published, so a blank one is refused rather
            than stored.
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When it actually went out. Defaults to now. Recorded as the target's fireTime so the calendar
            and the outcome panel show when the post really happened rather than when it was scheduled to.

    ReplacePublishTargetsRequest:
      type: object
      required:
        - targets
      properties:
        targets:
          type: array
          description: The complete selection. An empty array clears every target on the Work Item.
          items:
            $ref: "#/components/schemas/PublishTargetSelection"

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: string

    BrandImageSlot:
      type: string
      description: One of the four optional Brand Kit image slots.
      enum:
        - mark
        - wordmark_dark
        - wordmark_light
        - badge

    CopyRuleField:
      type: string
      enum:
        - headline
        - body
        - caption

    CopyRule:
      type: object
      description: >-
        One brand copy rule, enforced by CreativeValidator against every field it names. The frontend
        runs the same rule in JS for live validation, so `pattern`/`exceptPattern`/`flags` stick to the
        regex subset both a Java `Pattern` and a JS `RegExp` accept — no lookbehind, no named groups,
        no Java-only or JS-only escapes.
      required:
        - id
        - pattern
        - message
        - fields
      properties:
        id:
          type: string
        pattern:
          type: string
          description: A regular expression tested against the field's text.
        flags:
          type: string
          nullable: true
          description: Any combination of `i` (case-insensitive) and `m` (multiline). Omit for neither.
        message:
          type: string
          description: Shown verbatim when the rule fails — this is the text AC-P0-2.1 checks for.
        fields:
          type: array
          items:
            $ref: "#/components/schemas/CopyRuleField"
        exceptPattern:
          type: string
          nullable: true
          description: >-
            When set, every match of this pattern is stripped from the field's text before `pattern`
            is tested, e.g. to exempt one exact, quotable button name from a banned-phrase rule.

    SlideshowStyle:
      type: object
      description: >-
        How organic slideshow slides are styled. Every property is optional. Constraints are enforced by
        the service, not by OpenAPI keywords, so a violation answers 422 naming the field (RFC 7807)
        rather than a generic 400 — the same reasoning as `CreativeAudio.source`.
        `fontFamily`: max 200 chars; null/absent means the bundled TikTok Sans.
        `fontUrl`: an https URL to a CSS stylesheet (e.g. Google Fonts), max 2048 chars.
        `boxBg`, `boxInk`, `darkBg`, `darkInk`, `strokeInk`, `outline`, `accent`: `#RRGGBB` hex colours
        (pattern `^#[0-9a-fA-F]{6}$`). `strokeInk` is the colour of outlined (stroke) text and sub text;
        when absent it is white.
        `defaultText`: one of `box`, `dark`, `stroke`.
        `textSize`: headline text in px, integer 24-120. `subSize`: sub text in px, integer 16-96.
      properties:
        fontFamily:
          type: string
          nullable: true
        fontUrl:
          type: string
          nullable: true
        boxBg:
          type: string
        boxInk:
          type: string
        darkBg:
          type: string
        darkInk:
          type: string
        strokeInk:
          type: string
        outline:
          type: string
        accent:
          type: string
        defaultText:
          type: string
          description: "`box` | `dark` | `stroke`."
        textSize:
          type: integer
        subSize:
          type: integer

    BrandKitResponse:
      type: object
      required:
        - id
        - projectId
        - slug
        - name
        - isDefault
        - configured
        - tokens
        - accentPhraseRequired
        - copyRules
        - approvedLines
        - enabledPlacements
        - knowledgePagePath
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        projectId:
          type: string
        slug:
          type: string
        name:
          type: string
        isDefault:
          type: boolean
        configured:
          type: boolean
          description: >-
            True when this kit carries any customisation beyond the neutral starting point: tokens
            differ from the default palette, a font family is set, any logo slot is set, a CTA claim is
            set, copy rules or approved lines are non-empty, an accent phrase is required, or the kit's
            name differs from the default kit's name. Computed server-side on every read; never based on
            timestamps.
        tokens:
          type: object
          description: "CSS custom properties the renderer maps to: accent, accent2, darkBg, darkInk, lightBg, lightCard, ink, ink2. Each value is a #RRGGBB hex colour."
          additionalProperties:
            type: string
        fontFamily:
          type: string
          nullable: true
        fontUrl:
          type: string
          nullable: true
        markUrl:
          type: string
          nullable: true
          description: Short-lived signed GET URL, or null when this slot has no image.
        wordmarkDarkUrl:
          type: string
          nullable: true
        wordmarkLightUrl:
          type: string
          nullable: true
        badgeUrl:
          type: string
          nullable: true
        slideshowStyle:
          allOf:
            - $ref: "#/components/schemas/SlideshowStyle"
          nullable: true
          description: >-
            How organic slideshow slides are styled; null means slides use the native look. Does not affect `configured`.
        ctaClaim:
          type: string
          nullable: true
        accentPhraseRequired:
          type: boolean
        copyRules:
          type: array
          items:
            $ref: "#/components/schemas/CopyRule"
        approvedLines:
          type: array
          items:
            type: string
        enabledPlacements:
          type: array
          description: Placement keys (from the creative registry) this kit exports by default.
          items:
            type: string
        knowledgePagePath:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateBrandKitRequest:
      type: object
      required:
        - slug
        - name
      properties:
        slug:
          type: string
          description: Lowercase letters a-z, digits 0-9 and hyphens, 1-64 characters; otherwise 422 naming `slug`.
        name:
          type: string
        tokens:
          type: object
          nullable: true
          additionalProperties:
            type: string
        fontFamily:
          type: string
          nullable: true
        fontUrl:
          type: string
          nullable: true
        slideshowStyle:
          allOf:
            - $ref: "#/components/schemas/SlideshowStyle"
          nullable: true
          description: >-
            Optional slideshow style. Null or absent means none.
        ctaClaim:
          type: string
          nullable: true
        accentPhraseRequired:
          type: boolean
          default: false
