      summary: Confirm a file Asset upload finished
      description: >-
        Flips a PENDING file Asset to UPLOADED after the client's PUT landed. The content type is not
        a parameter — the only type trusted is the one persisted at mint, which is what the signed URL
        was bound to; it is re-checked against the allowlist here as defence in depth. `sizeBytes` is
        the byte count actually written and is re-validated against the upload ceiling. (COND-23.)
