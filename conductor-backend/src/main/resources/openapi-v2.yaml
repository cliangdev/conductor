    PatchBrandKitRequest:
      type: object
      description: >-
        Every field is optional; omit a field to leave it unchanged. Most fields are set-replace, except
        `tokens` (merged — see below) and `approvedLines`/`addApprovedLines` (mutually exclusive — see
        below).
      properties:
        name:
          type: string
        isDefault:
          type: boolean
        tokens:
          type: object
          nullable: true
          description: >-
            Merged into the kit's existing tokens: keys given here override, keys omitted keep their
            current value, and a key sent with a JSON `null` value is removed.
          additionalProperties:
            type: string
            nullable: true
        fontFamily:
          type: string
          nullable: true
        fontUrl:
          type: string
          nullable: true
        slideshowStyle:
          allOf:
            - $ref: "#/components/schemas/SlideshowStyle"
          nullable: true
          description: >-
            Present: replaces the whole style. Explicit JSON `null` (or an empty object `{}`): clears
            it. Absent: unchanged.
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonSetter(nulls = com.fasterxml.jackson.annotation.Nulls.AS_EMPTY)"
        ctaClaim:
          type: string
          nullable: true
        accentPhraseRequired:
          type: boolean
        copyRules:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CopyRule"
        approvedLines:
          type: array
          nullable: true
          description: Set-replace. Cannot be sent together with `addApprovedLines` — 422 if both are set.
          items:
            type: string
        addApprovedLines:
          type: array
          nullable: true
          description: >-
            Appended to the kit's existing approved lines server-side (deduped against the existing
            list, order kept). Cannot be sent together with `approvedLines` — 422 if both are set.
          items:
            type: string
        enabledPlacements:
          type: array
          nullable: true
          items:
            type: string
        knowledgePagePath:
          type: string

