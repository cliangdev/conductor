openapi: "3.0.3"
info:
  title: Conductor API v2
  description: >-
    Conductor API v2 — the canonical Work Item resource. Supersedes the legacy
    v1 `issues` core endpoints, which have been fully removed (migration completed 2026).
  version: "2.0.0"
servers:
  - url: /api/v2
    description: API v2

tags:
  - name: marketing-overview
    description: Daily channel metrics, funnel and targets
  - name: marketing-budget
    description: The monthly paid budget, its pacing across paid channels, and the stop rules that guard each channel
  - name: marketing-definitions
    description: What every marketing metric counts, where it comes from and what it excludes
  - name: marketing-report
    description: The one-call marketing report and the industry benchmarks it compares against
  - name: marketing-verification
    description: The verification ledger - per metric, Conductor's value, the backend's, a direct platform read and which to trust
  - name: marketing-growth-signals
    description: Seasonal moments, the weekly ratings program and the competitor watch, from public data
  - name: marketing-ai-visibility
    description: Weekly checks of whether AI assistants name the brand for a fixed set of questions
  - name: marketing-changes
    description: Marketing change records (the MARKETING_CHANGES workflow), imported from an outside change log
  - name: marketing-links
    description: Tracked App Store campaign links for Posts, bios, creators and email, and the downloads they bring
  - name: work-items
    description: Work Item management endpoints (canonical successor to v1 issues)
  - name: work-item-tree
    description: A Work Item and the sub-items beneath it
  - name: work-item-dependencies
    description: BLOCKS and DISCOVERED_FROM links between Work Items, and the dependency graph
  - name: work-item-criteria
    description: Acceptance criteria on a Work Item
  - name: work-item-agent-sessions
    description: Liveness of agent runs on a Work Item
  - name: work-item-forecast
    description: Throughput forecast of when the open work under a Work Item will be done
  - name: work-item-health
    description: Health updates on a Work Item, drafted by an agent and confirmed by a person
  - name: delivery
    description: Project-wide delivery overview (active PRDs, milestones, what needs attention)
  - name: milestones
    description: Named, optionally dated groupings of Work Items, with their progress
  - name: work-item-reviewers
    description: Reviewer assignment for a Work Item
  - name: work-item-documents
    description: Documents attached to a Work Item
  - name: work-item-tasks
    description: Task breakdown stored on a Work Item
  - name: work-item-comments
    description: Comments and replies on a Work Item's documents
  - name: work-item-reviews
    description: Review verdicts on a Work Item
  - name: work-item-assets
    description: Produced outputs (Assets) on a Work Item
  - name: work-item-metric
    description: Outcome Metric series on a Work Item
  - name: work-item-step-runs
    description: Step-run records on a Work Item
  - name: creative-edits
    description: What a slide-text edit of a Creative would do, and where it renders
  - name: work-item-content-changes
    description: Creative edits that reached a Post (what changed since the last review)
  - name: publish-targets
    description: Publishable social accounts a project can select on a Post
  - name: publish-metrics
    description: What happened to published destinations after they went out — the post_metrics feeds' snapshots and the project ranking.
  - name: publish-outcomes
    description: Per-target publish outcomes on a Post, and retrying the ones that failed
  - name: brand-kits
    description: Per-project Brand Kits (tokens, logos, copy rules) a Creative renders with
  - name: creatives
    description: The Creative library — photos with provenance, and the creatives themselves

paths:
  /projects/{projectId}/work-items:
    post:
      tags:
        - work-items
      summary: Create a Work Item in a project
      operationId: createWorkItem
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkItemRequest"
      responses:
        "201":
          description: Work Item created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags:
        - work-items
      summary: List Work Items in a project
      operationId: listWorkItems
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Filter by Work Item type (validated against the bound Workflow's types).
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by Work Item status (a Workflow-defined status id, e.g. DRAFT).
          schema:
            type: string
        - name: workflow
          in: query
          required: false
          description: Filter by bound Workflow slug (e.g. ENGINEERING) — for per-Workflow view pages.
          schema:
            type: string
        - name: tag
          in: query
          required: false
          description: >-
            Filter to Work Items carrying this tag. Matched case-insensitively against the stored
            (lower-cased) form, so a tag typed with a capital still matches.
          schema:
            type: string
        - name: dueBefore
          in: query
          required: false
          description: >-
            Only Work Items still open (not in a terminal status of their Workflow) whose dueOn is before
            this date (yyyy-MM-dd), soonest first. Use it to find overdue items.
          schema:
            type: string
            format: date
        - name: creativeId
          in: query
          required: false
          description: Only Work Items that use a rendered frame of this Creative (the Creative's "Posts using this").
          schema:
            type: string
        - name: mediaId
          in: query
          required: false
          description: >-
            Only Work Items that use this Media library item, directly or through a Creative frame that
            reuses its stored object.
          schema:
            type: string
        - name: enrich
          in: query
          required: false
          description: >-
            When true, each item also carries `thumbnailUrl`, `publishTargets` and `creative` (the Posts
            list's extras). Off by default, so API and MCP callers get exactly the payload they always
            did, without the signed URLs.
          schema:
            type: boolean
            default: false
        - name: parentId
          in: query
          required: false
          description: >-
            Which level of the tree to list. `none` (the default) lists top-level items only, so a PRD's
            tasks do not crowd the list; `any` lists children too; any other value is a Work Item id and
            lists that item's direct children.
          schema:
            type: string
            default: none
        - name: rootId
          in: query
          required: false
          description: >-
            Every item beneath this Work Item, at any depth (the item itself excluded). Overrides
            `parentId`.
          schema:
            type: string
        - name: milestoneId
          in: query
          required: false
          description: Only Work Items grouped under this milestone.
          schema:
            type: string
        - name: priority
          in: query
          required: false
          description: Only Work Items with this priority.
          schema:
            $ref: "#/components/schemas/WorkItemPriority"
        - name: assigneeId
          in: query
          required: false
          description: Only Work Items assigned to this user.
          schema:
            type: string
        - name: withProgress
          in: query
          required: false
          description: >-
            When true, each item that has children also carries `progress`. Off by default, as it costs a
            read per parent.
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          required: false
          description: >-
            Order of the result. Omit for the default order. `updated` and `created` are newest first,
            `priority` is P0 first, `dueOn` is soonest first and `sequence` is oldest first; items missing
            the key (no priority, no due date) come last.
          schema:
            type: string
            enum: [updated, created, priority, dueOn, sequence]
        - name: ready
          in: query
          required: false
          description: >-
            When true, only items that can be picked up now: not blocked, in an `open` status, not terminal.
            When false, only items that are not. Omit for both.
          schema:
            type: boolean
        - name: blocked
          in: query
          required: false
          description: >-
            When true, only items held up by a BLOCKS blocker that has not finished. When false, only items
            that are not. Omit for both.
          schema:
            type: boolean
        - name: stale
          in: query
          required: false
          description: >-
            When true, only in-progress items untouched for seven days with no agent working on them. When
            false, only items that are not. Omit for both.
          schema:
            type: boolean
      responses:
        "200":
          description: List of Work Items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkItemResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found or caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/work-items/by-display/{displayId}:
    get:
      tags:
        - work-items
      summary: Get a Work Item by its human-readable display id
      description: >-
        Resolve a Work Item by its human-readable display id (e.g. "COND-42").
        The trailing number is the project-scoped sequence number.
      operationId: getWorkItemByDisplayId
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: displayId
          in: path
          required: true
          description: Human-readable Work Item id (e.g. "COND-42").
          schema:
            type: string
      responses:
        "200":
          description: Work Item detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/work-items/{workItemId}:
    get:
      tags:
        - work-items
      summary: Get Work Item detail
      operationId: getWorkItem
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Work Item detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags:
        - work-items
      summary: Update a Work Item
      operationId: patchWorkItem
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchWorkItemRequest"
      responses:
        "200":
          description: Work Item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemResponse"
        "400":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - work-items
      summary: Delete a Work Item
      description: >-
        Refused with 409 when the Work Item has a destination that is already PUBLISHED (live on a platform):
        deleting would only remove it from Conductor and leave the live post behind. Pass
        `confirmLive=true` to delete it anyway; a bulk or automated caller should not. Also refused with
        409 when the Work Item has sub-items, unless `cascade=true`, which deletes the whole subtree with it.
      operationId: deleteWorkItem
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
        - name: confirmLive
          in: query
          required: false
          description: Delete even though a destination is live on a platform.
          schema:
            type: boolean
            default: false
        - name: cascade
          in: query
          required: false
          description: Also delete every sub-item beneath this Work Item. Without it, a Work Item with sub-items is refused.
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: Work Item deleted
        "409":
          description: >-
            The Work Item is live on a platform and `confirmLive` was not set, or it has sub-items and
            `cascade` was not set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/work-items/{workItemId}/available-transitions:
    get:
      tags:
        - work-items
      summary: List the valid next transitions for a Work Item (doer projection)
      description: >-
        Returns only the transitions the calling actor may take from the Work Item's
        current status, computed server-side from the active (PUBLISHED) Workflow
        definition. This is the doer projection — it never exposes the raw statechart,
        gate conditions, or bound Steps. A Review-gated transition does not appear here
        until its Review is satisfied.
      operationId: getWorkItemAvailableTransitions
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The valid next transitions for this actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableTransitionsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/work-items/{workItemId}/reviewers:
    post:
      tags:
        - work-item-reviewers
      summary: Assign reviewer to Work Item
      operationId: assignWorkItemReviewer
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignReviewerRequest"
      responses:
        "201":
          description: Reviewer assigned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignReviewerResponse"
        "400":
          description: User is not a project member or cannot review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Reviewer already assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags:
        - work-item-reviewers
      summary: List reviewers for a Work Item
      operationId: listWorkItemReviewers
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of reviewers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewerResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/work-items/{workItemId}/reviewers/{userId}:
    delete:
      tags:
        - work-item-reviewers
      summary: Unassign reviewer from Work Item
      operationId: unassignWorkItemReviewer
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Reviewer unassigned successfully
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not ADMIN or CREATOR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Reviewer assignment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/work-items/{workItemId}/documents:
    post:
      tags:
        - work-item-documents
      summary: Create a document for a Work Item
      operationId: createWorkItemDocument
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentRequest"
      responses:
        "201":
          description: Document created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags:
        - work-item-documents
      summary: List documents for a Work Item
      operationId: listWorkItemDocuments
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >-
            Document summaries. `content` is deliberately absent; fetch a single document for its body.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentSummaryResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/work-items/{workItemId}/documents/{docId}:
    get:
      tags:
        - work-item-documents
      summary: Get document detail
      operationId: getWorkItemDocument
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
        - name: docId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - work-item-documents
      summary: Delete a document
      operationId: deleteWorkItemDocument
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
        - name: docId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Document deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/work-items/{workItemId}/documents/{filename}:
    put:
      tags:
        - work-item-documents
      summary: Upsert a document by filename
      operationId: upsertWorkItemDocumentByFilename
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
        - name: filename
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertDocumentByFilenameRequest"
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "200":
          description: Document updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Work Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - work-item-documents
      summary: Delete a document by filename
      operationId: deleteWorkItemDocumentByFilename
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Document deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/work-items/{workItemId}/tree:
    get:
      tags:
        - work-item-tree
      summary: Get a Work Item and everything beneath it as a tree
      description: >-
        The Work Item and its sub-items at every depth (at most five levels), nested, siblings in creation
        order. One read, so a client never walks the tree level by level.
      operationId: getWorkItemTree
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: workItemId
          in: path
          required: true
