        - creatives
      summary: Mint a signed upload for a new Creative photo
      description: >-
        Mint -> client `PUT`s the bytes to `uploadUrl` -> confirm. Dimensions are client-declared —
        Conductor has no image pipeline and WebP cannot be probed server-side — and a long edge under
        2160px on either axis surfaces as a `warnings` entry, never a refusal. Requires ADMIN or
        CREATOR.
      operationId: createCreativePhoto
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
