          nullable: true
          description: Set only for a MOTION render.
        audio:
          allOf:
            - $ref: "#/components/schemas/CreativeRenderSpecAudio"
          nullable: true
          description: Set for a MOTION render, a CAROUSEL render with a track, and a CLIP render whose audio is not its own sound.
