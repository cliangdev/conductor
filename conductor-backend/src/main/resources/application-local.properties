spring.config.activate.on-profile=local
logging.structured.format.console=
firebase.service-account-key=
gcp.storage.bucket-name=local
local.storage.path=${LOCAL_STORAGE_PATH:./local-uploads}
local.dev.password=${LOCAL_DEV_PASSWORD:conductor}
server.base-url=${SERVER_BASE_URL:http://localhost:8080}

# PostPublishScheduler off locally: a dev database routinely holds half-built scheduled Posts, and
# nothing should actually go out to a real Facebook Page from a laptop.
conductor.post-publish.enabled=false

# NativeHandoffService off locally for the same reason, and a sharper one: a native hand-off puts a real
# scheduled post on a real Facebook Page or YouTube channel, which no laptop run should ever do.
conductor.native-handoff.enabled=false

# NativePublishConfirmationPoller off locally too: it only observes, but observing means calling a real
# Facebook or YouTube account from a laptop on every dev database row that happens to be handed off.
conductor.native-publish-confirmation.enabled=false
