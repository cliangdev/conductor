spring.config.activate.on-profile=local
logging.structured.format.console=
firebase.service-account-key=
gcp.storage.bucket-name=local
local.storage.path=${LOCAL_STORAGE_PATH:./local-uploads}
local.dev.password=${LOCAL_DEV_PASSWORD:conductor}
server.base-url=${SERVER_BASE_URL:http://localhost:8080}

# PostPublishScheduler off locally: a dev database routinely holds half-built scheduled Posts, and
# nothing should actually go out to a real Facebook Page from a laptop.
conductor.post-publish.enabled=false
