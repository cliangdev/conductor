openapi: "3.0.3"
info:
  title: Conductor Internal API
  description: >
    Internal control-plane for the workflow execution engine. These endpoints are NOT part of the
    public API contract: they are called by the worker VM / daemon / DockerStepExecutor to stream
    logs and report job outcomes back to the backend, authenticated by a per-run bearer token
    (RunTokenService), not the app JWT. Served under /internal/v1 (the prefix is supplied centrally
    by ApiPathConfig; method paths below are bare).
  version: "1.0.0"
servers:
  - url: /internal/v1
    description: Internal control-plane, v1

tags:
  - name: workflow-internal
    description: Workflow run worker callbacks (logs, outputs, job failures)
  - name: work-item-assets-internal
    description: Local-profile passthrough for work-item file-Asset bytes
  - name: publish-internal
    description: Cloud Tasks targets for timed publishing work on post_publish_target rows

paths:
  /workflow-runs/{runId}/log-chunk:
    post:
      tags: [workflow-internal]
      summary: Append a chunk of log lines for a running workflow run
      operationId: appendWorkflowRunLogChunk
      security:
        - runToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogChunkRequest"
      responses:
        "200":
          description: Chunk accepted
        "401":
          description: Missing or invalid run token

  /workflow-runs/{runId}/outputs:
    post:
      tags: [workflow-internal]
      summary: Report step outputs for a worker job
      operationId: reportWorkflowRunOutputs
      security:
        - runToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutputsRequest"
      responses:
        "200":
          description: Outputs recorded (idempotent; unknown job is a no-op)
        "401":
          description: Missing or invalid run token

  /workflow-runs/{runId}/job-failed:
    post:
      tags: [workflow-internal]
      summary: Report that a worker job failed
      operationId: reportWorkflowRunJobFailed
      security:
        - runToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobFailedRequest"
      responses:
        "200":
          description: Failure recorded
        "400":
          description: Missing jobId
        "401":
          description: Missing or invalid run token

  /workflow-runs/{runId}/artifacts:
    post:
      tags: [workflow-internal]
      summary: Declare a workflow-step artifact and mint its upload URL
      description: >
        Creates (or reuses, on a step retry) a PENDING artifact row and returns a URL the caller PUTs
        the raw file bytes to directly. On GCS this is a signed PUT URL; on the local profile
        (no signed-upload mechanism) it is the internal passthrough URL
        `PUT /internal/v1/workflow-runs/{runId}/artifacts/{artifactId}/content`.
      operationId: createWorkflowArtifact
      security:
        - runToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflowArtifactRequest"
      responses:
        "201":
          description: Artifact declared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateWorkflowArtifactResponse"
        "401":
          description: Missing or invalid run token
    get:
      tags: [workflow-internal]
      summary: Resolve a named artifact's download URL
      description: >
        Only resolves artifacts that have been confirmed UPLOADED (see the complete endpoint below);
        an artifact that doesn't exist, or is still PENDING, resolves to an empty `downloadUrl`.
      operationId: resolveWorkflowArtifact
      security:
        - runToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resolved (downloadUrl is empty if the artifact isn't UPLOADED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveWorkflowArtifactResponse"
        "401":
          description: Missing or invalid run token

  /workflow-runs/{runId}/artifacts/{artifactId}/complete:
    post:
      tags: [workflow-internal]
      summary: Confirm an artifact upload finished
      operationId: completeWorkflowArtifact
      security:
        - runToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Marked UPLOADED (idempotent; unknown artifactId is a no-op)
        "401":
          description: Missing or invalid run token

  /workflow-runs/{runId}/jobs/{jobId}/dispatch:
    post:
      tags: [workflow-internal]
      summary: Dispatch and synchronously run a queued workflow job
      description: >
        Cloud Tasks' HTTP target for job dispatch (see CloudTasksJobDispatcher) — the sole way a
        queued job reaches execution. Claims the matching unclaimed workflow_job_queue row and, if
        claimed, runs the job to completion before responding — the request stays open for the job's
        full duration so Cloud Run's request-based billing allocates CPU for exactly that span. A
        no-op 200 if the row was already claimed (a duplicate Cloud Tasks delivery — at-least-once
        retries can occasionally overlap in flight).
      operationId: dispatchWorkflowJob
      security:
        - runToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job claimed and run to completion, or already claimed elsewhere (no-op)
        "401":
          description: Missing or invalid run token

  /workflow-runs/{runId}/steps/{workerJobId}/complete:
    post:
      tags: [workflow-internal]
      summary: Report that a pre-created worker step run has finished
      operationId: completeWorkflowRunStep
      security:
        - runToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/WorkerJobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepCompleteRequest"
      responses:
        "200":
          description: Step result recorded (idempotent; unknown workerJobId is a no-op)
        "401":
          description: Missing or invalid run token

  /work-items/{workItemId}/assets/{assetId}/content:
    put:
      tags: [work-item-assets-internal]
      summary: Upload a file Asset's raw bytes (local profile only)
      description: >
        Passthrough upload for a work-item file Asset, served ONLY on the `local` profile, where
        StorageService cannot mint signed upload URLs. This is the exact URL
        `POST /api/v2/projects/{projectId}/work-items/{workItemId}/assets/uploads` returns as its
        `uploadUrl` in that case, so the two must stay byte-for-byte identical. On GCS the client PUTs
        to a signed bucket URL instead and this endpoint is not registered at all.


        There is no run token to check here (no workflow run is involved). The URL itself is the
        capability: `assetId` is a server-minted UUID handed only to the member who minted it, and the
        request is scoped by requiring that asset to belong to `workItemId`. Same shape as the
        workflow-artifact passthrough `PUT /internal/v1/workflow-runs/{runId}/artifacts/{artifactId}/content`,
        which likewise reads a raw binary body.
      operationId: uploadWorkItemAssetContent
      security: []
      parameters:
        - name: workItemId
          in: path
          required: true
          schema:
            type: string
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: >
          The raw file bytes. Any media type is accepted: the browser PUTs the file with its own
          Content-Type (image/png, video/mp4, ...), exactly as it would to a signed bucket URL, and the
          type was already validated and persisted at mint — this endpoint only stores bytes.
        content:
          "*/*":
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Bytes stored. Confirm the upload via the v2 confirm endpoint.
        "404":
          description: No such Asset, or the Asset does not belong to this Work Item

  /publish-targets/{targetId}/dispatch:
    post:
      tags: [publish-internal]
      summary: Fire a due APP_MANAGED or MANUAL publish target
      description: >
        Cloud Tasks' HTTP target for a DISPATCH publish task (see CloudTasksPublishTaskScheduler),
        delivered at the target's fire time. Claims the row PENDING -> PUBLISHING (or -> AWAITING_MANUAL
        on the manual lane) with the same conditional UPDATE PostPublishScheduler's sweep uses, then
        publishes through the connector before responding. A no-op 200 when the row is no longer
        PENDING, when its fire time no longer matches `fireTime` (the Post was rescheduled and a fresh
        task exists), or when it is not due yet (re-armed for the right moment instead).
      operationId: dispatchPublishTarget
      security:
        - publishTaskToken: []
      parameters:
        - $ref: "#/components/parameters/TargetId"
        - $ref: "#/components/parameters/FireTime"
      responses:
        "200":
          description: Delivered — acted on, re-armed, or nothing left to do
        "401":
          description: Missing or invalid publish task token

  /publish-targets/{targetId}/handoff:
    post:
      tags: [publish-internal]
      summary: Hand a NATIVE publish target to the platform's own scheduler
      description: >
        Cloud Tasks' HTTP target for a HANDOFF publish task, delivered when the platform's hand-off
        window opens. Same claim as NativeHandoffService's sweep; on success a CONFIRM task is armed
        for the fire time. Same stale/not-due/no-op rules as the dispatch endpoint.
      operationId: handoffPublishTarget
      security:
        - publishTaskToken: []
      parameters:
        - $ref: "#/components/parameters/TargetId"
        - $ref: "#/components/parameters/FireTime"
      responses:
        "200":
          description: Delivered — acted on, re-armed, or nothing left to do
        "401":
          description: Missing or invalid publish task token

  /publish-targets/{targetId}/confirm:
    post:
      tags: [publish-internal]
      summary: Ask the platform whether a handed-off publish target is live
      description: >
        Cloud Tasks' HTTP target for a CONFIRM publish task, delivered at the fire time and re-armed
        a minute later while the platform does not yet report the post live, up to the confirmation
        poller's attempt cap. `attempt` is the row's attempts count this task expects; a mismatch
        means another confirmation chain owns the row and this one ends.
      operationId: confirmPublishTarget
      security:
        - publishTaskToken: []
      parameters:
        - $ref: "#/components/parameters/TargetId"
        - $ref: "#/components/parameters/FireTime"
        - $ref: "#/components/parameters/Attempt"
      responses:
        "200":
          description: Delivered — confirmed, re-armed, or nothing left to do
        "401":
          description: Missing or invalid publish task token

components:
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    WorkerJobId:
      name: workerJobId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
    TargetId:
      name: targetId
      in: path
      required: true
      schema:
        type: string
    FireTime:
      name: fireTime
      in: query
      required: true
      description: The target's fire time when the task was armed, as epoch seconds
      schema:
        type: integer
        format: int64
    Attempt:
      name: attempt
      in: query
      required: true
      description: The attempts count the row is expected to hold when this task arrives
      schema:
        type: integer
        format: int32
  securitySchemes:
    runToken:
      type: http
      scheme: bearer
      description: Per-run ephemeral token minted by RunTokenService
    publishTaskToken:
      type: http
      scheme: bearer
      description: Per-target token minted by RunTokenService for a Cloud Task carrying a PublishTask
  schemas:
    LogChunkRequest:
      type: object
      properties:
        workerJobId:
          type: string
        lines:
          type: array
          items:
            type: string
        timestamp:
          type: string
    OutputsRequest:
      type: object
      properties:
        workerJobId:
          type: string
        outputs:
          type: object
          additionalProperties:
            type: string
    JobFailedRequest:
      type: object
      properties:
        jobId:
          type: string
        exitCode:
          type: integer
        reason:
          type: string
    StepCompleteRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
        exitCode:
          type: integer
        errorReason:
          type: string
          nullable: true
        outputs:
          type: object
          additionalProperties:
            type: string
    CreateWorkflowArtifactRequest:
      type: object
      required: [jobId, name]
      properties:
        jobId:
          type: string
        name:
          type: string
          pattern: "^[a-z0-9_-]{1,160}$"
          description: "Artifact name, matching the step's declared artifacts[].name ([a-z0-9_-]{1,160})"
        contentType:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          format: int64
          nullable: true
    CreateWorkflowArtifactResponse:
      type: object
      required: [artifactId, uploadUrl]
      properties:
        artifactId:
          type: string
        uploadUrl:
          type: string
    ResolveWorkflowArtifactResponse:
      type: object
      required: [downloadUrl]
      properties:
        downloadUrl:
          type: string
          description: Empty string if the artifact doesn't exist or isn't UPLOADED yet
