<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Conductor app icon: the hub mark from src/components/brand/ConductorLogo.tsx on the brand
       teal. Full-bleed square with no rounded corners, because app stores and platform consoles
       apply their own mask. The mark spans 60% of the width; its corner nodes stay well inside a
       circle crop. Re-export PNGs from this file rather than editing them directly. -->
  <defs>
    <radialGradient id="bg" cx="20%" cy="10%" r="120%">
      <stop offset="0" stop-color="#2aa597"/>
      <stop offset="0.38" stop-color="#178677"/>
      <stop offset="0.72" stop-color="#0f5a51"/>
      <stop offset="1" stop-color="#0b3f39"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <!-- Units are the mark group's own (scaled 34x): 0.53 here is about 18px on the 1024 canvas. -->
      <feDropShadow dx="0" dy="0.53" stdDeviation="0.53" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g filter="url(#lift)" transform="translate(102 102) scale(34.1667)"
     fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
    <path d="M10.2 10.2 L7.6 7.6"/><path d="M13.8 10.2 L16.4 7.6"/>
    <path d="M10.2 13.8 L7.6 16.4"/><path d="M13.8 13.8 L16.4 16.4"/>
    <circle cx="12" cy="12" r="3.1" fill="#fff" stroke="none"/>
    <circle cx="5.2" cy="5.2" r="2.1" fill="#fff" stroke="none"/>
    <circle cx="18.8" cy="5.2" r="2.1" fill="#fff" stroke="none"/>
    <circle cx="5.2" cy="18.8" r="2.1" fill="#fff" stroke="none"/>
    <circle cx="18.8" cy="18.8" r="2.1" fill="#fff" stroke="none"/>
  </g>
</svg>
