name: Frontend CD

on:
  push:
    branches: [main]
    paths:
      - 'conductor-frontend/**'
      - 'conductor-creative/**'
  workflow_dispatch:

concurrency:
  group: frontend-cd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: ./.github/actions/frontend-test

  deploy-frontend:
    needs: build-and-test
    if: github.repository == 'cliangdev/conductor'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-cloudrun.yml
    with:
      service: conductor-frontend
      image-name: frontend
      # Repo-root context (not conductor-frontend/) so the image can COPY the sibling
      # conductor-creative/ package the frontend depends on via file:../conductor-creative.
      build-context: .
      dockerfile: conductor-frontend/Dockerfile
      is-frontend: true
      health-path: /api/health
      cloudrun-flags: --allow-unauthenticated
    secrets: inherit
