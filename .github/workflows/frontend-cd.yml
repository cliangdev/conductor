name: Frontend CD

on:
  push:
    branches: [main]
    paths:
      - 'conductor-frontend/**'
  workflow_dispatch:

concurrency:
  group: frontend-cd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/frontend-test

  deploy-frontend:
    needs: build-and-test
    if: github.repository == 'cliangdev/conductor'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-cloudrun.yml
    with:
      service: conductor-frontend
      image-name: frontend
      build-context: conductor-frontend/
      is-frontend: true
      health-path: /api/health
      cloudrun-flags: --allow-unauthenticated
    secrets: inherit
