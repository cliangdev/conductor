name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'conductor-backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/actions/backend-test/**'

# Cancel superseded runs when a PR branch is pushed again.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: backend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: ./.github/actions/backend-test
      - name: Publish test annotations
        if: always()
        uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe  # v4
        with:
          report_paths: conductor-backend/target/surefire-reports/*.xml
          check_name: backend-tests
