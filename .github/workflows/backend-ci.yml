name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'conductor-backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/actions/backend-test/**'

# Cancel superseded runs when a PR branch is pushed again.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: backend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/backend-test
