name: Backend CD

on:
  push:
    branches: [main]
    paths:
      - 'conductor-backend/**'
  workflow_dispatch:

# Serialize deploys to this service so two merges to main can't race to Cloud Run.
# Do not cancel an in-flight deploy.
concurrency:
  group: backend-cd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: ./.github/actions/backend-test

  deploy-backend:
    needs: build-and-test
    if: github.repository == 'cliangdev/conductor'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-cloudrun.yml
    with:
      service: conductor-backend
      image-name: backend
      build-context: conductor-backend/
      health-path: /api/v1/health
      # cpu=1/cpu-throttling/min-instances=0 is the safe, cheap combination: job dispatch arrives as a
      # real HTTP request via Cloud Tasks (billed CPU for its actual duration, see
      # CloudTasksJobDispatcher) instead of relying on an always-on background poller, which is what
      # previously required cpu=2/--no-cpu-throttling/min-instances=1 (~$99/mo instead of ~$1.50/mo)
      # just to keep scheduled tasks from starving. GCP_TASKS_DISPATCH_BASE_URL is required — job
      # dispatch has no other path. See docs/workflows.md#queued-and-waiting-work and the Aug 2026 cost report.
      # Timed publishing (scheduled Posts) rides the same mechanism on its own queue, publish-tasks — see
      # docs/publishing.md#firing-on-time. The publishing pollers only sweep behind it.
      cloudrun-flags: "--update-env-vars=GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},BACKEND_URL=${{ vars.BACKEND_URL }},GITHUB_APP_ID=${{ vars.GH_APP_ID }},GITHUB_APP_SLUG=${{ vars.GH_APP_SLUG }},GCP_CLOUDRUN_PROJECT_ID=${{ vars.GCP_CLOUDRUN_PROJECT_ID }},GCP_CLOUDRUN_REGION=${{ vars.GCP_CLOUDRUN_REGION }},GCP_CLOUDRUN_CLAUDE_JOB_NAME=${{ vars.GCP_CLOUDRUN_CLAUDE_JOB_NAME }},GCP_TASKS_DISPATCH_BASE_URL=${{ vars.BACKEND_URL }} --memory=1Gi --cpu=1 --cpu-throttling --min-instances=0 --timeout=3600"
      cloudrun-secrets: |
        DATABASE_URL=DATABASE_URL:latest
        DATABASE_USERNAME=DATABASE_USERNAME:latest
        DATABASE_PASSWORD=DATABASE_PASSWORD:latest
        APP_JWT_SECRET=APP_JWT_SECRET:latest
        FIREBASE_SERVICE_ACCOUNT_KEY=FIREBASE_SERVICE_ACCOUNT_KEY:latest
        RESEND_API_KEY=RESEND_API_KEY:latest
        GCP_SERVICE_ACCOUNT_KEY=GCP_SERVICE_ACCOUNT_KEY:latest
        GCP_STORAGE_BUCKET_NAME=GCP_STORAGE_BUCKET_NAME:latest
        FRONTEND_URL=FRONTEND_URL:latest
        WORKFLOW_SECRETS_KEY=WORKFLOW_SECRETS_KEY:latest
        GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID:latest
        GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET:latest
        GITHUB_APP_PRIVATE_KEY=GITHUB_APP_PRIVATE_KEY:latest
        GITHUB_APP_WEBHOOK_SECRET=GITHUB_APP_WEBHOOK_SECRET:latest
    secrets: inherit
