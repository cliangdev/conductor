name: PR Deploy Preview

on:
  pull_request:
    types: [labeled]

# Serialize preview deploys per PR + label; don't cancel an in-flight deploy.
concurrency:
  group: deploy-label-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-test-backend:
    if: github.repository == 'cliangdev/conductor' && github.event.label.name == 'deploy-backend'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: ./.github/actions/backend-test
        with:
          run-tests: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-tests') }}

  deploy-backend:
    needs: build-and-test-backend
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-cloudrun.yml
    with:
      service: conductor-backend
      image-name: backend
      build-context: conductor-backend/
      health-path: /api/v1/health
      cloudrun-flags: "--update-env-vars=GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},BACKEND_URL=${{ vars.BACKEND_URL }},GITHUB_APP_ID=${{ vars.GH_APP_ID }},GITHUB_APP_SLUG=${{ vars.GH_APP_SLUG }},GCP_CLOUDRUN_PROJECT_ID=${{ vars.GCP_CLOUDRUN_PROJECT_ID }},GCP_CLOUDRUN_REGION=${{ vars.GCP_CLOUDRUN_REGION }},GCP_CLOUDRUN_CLAUDE_JOB_NAME=${{ vars.GCP_CLOUDRUN_CLAUDE_JOB_NAME }} --memory=1Gi --cpu=2 --no-cpu-throttling --min-instances=1"
      cloudrun-secrets: |
        DATABASE_URL=DATABASE_URL:latest
        DATABASE_USERNAME=DATABASE_USERNAME:latest
        DATABASE_PASSWORD=DATABASE_PASSWORD:latest
        APP_JWT_SECRET=APP_JWT_SECRET:latest
        FIREBASE_SERVICE_ACCOUNT_KEY=FIREBASE_SERVICE_ACCOUNT_KEY:latest
        RESEND_API_KEY=RESEND_API_KEY:latest
        GCP_SERVICE_ACCOUNT_KEY=GCP_SERVICE_ACCOUNT_KEY:latest
        GCP_STORAGE_BUCKET_NAME=GCP_STORAGE_BUCKET_NAME:latest
        FRONTEND_URL=FRONTEND_URL:latest
        WORKFLOW_SECRETS_KEY=WORKFLOW_SECRETS_KEY:latest
        GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID:latest
        GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET:latest
        GITHUB_APP_PRIVATE_KEY=GITHUB_APP_PRIVATE_KEY:latest
        GITHUB_APP_WEBHOOK_SECRET=GITHUB_APP_WEBHOOK_SECRET:latest
    secrets: inherit

  build-and-test-frontend:
    if: github.repository == 'cliangdev/conductor' && github.event.label.name == 'deploy-frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: ./.github/actions/frontend-test
        with:
          run-checks: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-tests') }}

  deploy-frontend:
    needs: build-and-test-frontend
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-cloudrun.yml
    with:
      service: conductor-frontend
      image-name: frontend
      build-context: conductor-frontend/
      is-frontend: true
      health-path: /api/health
      cloudrun-flags: --allow-unauthenticated
    secrets: inherit

  notify-backend:
    needs: deploy-backend
    if: always() && github.repository == 'cliangdev/conductor' && github.event.label.name == 'deploy-backend'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const success = '${{ needs.deploy-backend.result }}' === 'success';
            const icon = success ? '✅' : '❌';
            const statusText = success ? 'succeeded' : 'failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `${context.payload.repository.html_url}/commit/${context.sha}`;
            const shortSha = context.sha.slice(0, 7);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                `## ${icon} Backend deployment ${statusText}`,
                '',
                `| | |`,
                `|---|---|`,
                `| **Commit** | [\`${shortSha}\`](${commitUrl}) |`,
                `| **Run** | [View logs](${runUrl}) |`,
                `| **Time** | ${new Date().toUTCString()} |`,
              ].join('\n'),
            });

  notify-frontend:
    needs: deploy-frontend
    if: always() && github.repository == 'cliangdev/conductor' && github.event.label.name == 'deploy-frontend'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const success = '${{ needs.deploy-frontend.result }}' === 'success';
            const icon = success ? '✅' : '❌';
            const statusText = success ? 'succeeded' : 'failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `${context.payload.repository.html_url}/commit/${context.sha}`;
            const shortSha = context.sha.slice(0, 7);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                `## ${icon} Frontend deployment ${statusText}`,
                '',
                `| | |`,
                `|---|---|`,
                `| **Commit** | [\`${shortSha}\`](${commitUrl}) |`,
                `| **Run** | [View logs](${runUrl}) |`,
                `| **Time** | ${new Date().toUTCString()} |`,
              ].join('\n'),
            });
