name: Publish Claude Runner Image

# Publishes when the dedicated claude-code image changes, and after every CLI release: the image installs
# conductor-tools/package.json's exact CLI version, so its MCP tools never fall behind the CLI (it once sat
# at 0.11.4 while workflows listed tools from 0.53). No manual tag needed (contrast with Publish Runner
# Image, which is tag-triggered for the general-purpose image).
on:
  # After the CLI is published to npm.
  workflow_run:
    workflows: ['Release CLI']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'runner-image/Dockerfile.claude-runner'
      - 'runner-image/conductor-claude-entrypoint.mjs'
      - 'runner-image/runner-protocol.mjs'
      - 'runner-image/runner-protocol.selftest.mjs'
      - 'runner-image/entrypoint.selftest.mjs'
      - '.github/workflows/publish-claude-runner.yml'

# Never run two publishes at once; don't cancel an in-flight one (a later push will just publish
# again after it finishes, rather than racing tags on the same registry).
concurrency:
  group: publish-claude-runner
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/conductor-claude-runner

jobs:
  build-and-push:
    # A workflow_run fires for failed/cancelled releases too; only a successful release has a new CLI.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # only consumed by the Google auth step below, itself gated to cliangdev/conductor

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          # For workflow_run: the exact commit the release built, not whatever main is by now.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: '20'

      - name: Lint entrypoint (syntax + self-test)
        run: |
          node --check runner-image/runner-protocol.mjs
          node --check runner-image/conductor-claude-entrypoint.mjs
          node runner-image/runner-protocol.selftest.mjs
          node runner-image/entrypoint.selftest.mjs

      - name: Resolve the CLI version to install
        id: cli
        env:
          STRICT: ${{ github.event_name == 'workflow_run' }}
        run: |
          VERSION=$(node -p "require('./conductor-tools/package.json').version")
          # The release publishes to npm before this runs (workflow_run), but the registry can lag a moment,
          # and a push that only touches the image may name a version not released yet: that push builds the
          # latest published CLI as validation only and pushes nothing; the post-release run publishes.
          FOUND=""
          PUBLISH=true
          for attempt in $(seq 1 30); do
            if npm view "@cliangdev/conductor@${VERSION}" version >/dev/null 2>&1; then
              FOUND=1
              break
            fi
            echo "@cliangdev/conductor@${VERSION} not on npm yet (attempt ${attempt}/30)"
            if [ "$STRICT" != "true" ] && [ "$attempt" -ge 3 ]; then
              break
            fi
            sleep 20
          done
          if [ -z "$FOUND" ]; then
            if [ "$STRICT" = "true" ]; then
              echo "::error::@cliangdev/conductor@${VERSION} never appeared on npm"
              exit 1
            fi
            echo "::notice::@cliangdev/conductor@${VERSION} is not on npm yet; building the latest published CLI for validation only (nothing is pushed)."
            VERSION=$(npm view @cliangdev/conductor version)
            PUBLISH=false
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"

      - name: Short SHA
        id: sha
        env:
          # The commit that was checked out above, which is not GITHUB_SHA on workflow_run.
          BUILT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: echo "short=${BUILT_SHA::7}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: runner-image
          file: runner-image/Dockerfile.claude-runner
          push: ${{ steps.cli.outputs.publish == 'true' }}
          platforms: linux/amd64
          build-args: |
            CONDUCTOR_TOOLS_VERSION=${{ steps.cli.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.sha.outputs.short }}

      # Mirrors the just-published image into Conductor's own Artifact Registry, the project this
      # repo's other CI (deploy-cloudrun.yml) already deploys conductor-backend/frontend into — not
      # a customer's cloud. This is NOT how a BYO runtime target's image ever gets updated (that
      # stays a deliberate, per-customer choice — see docs/workflows.md's "Image tags are pinned,
      # not floating" note); it only saves the dogfooding `byo-test` target the manual
      # pull/tag/push dance. A runtime target still needs "Sync to latest image" afterward — Cloud
      # Run pins whatever digest the tag resolved to at the last provision, and pushing here doesn't
      # call Conductor's API to trigger that.
      #
      # Gated to the canonical repo: WIF_PROVIDER/WIF_SERVICE_ACCOUNT are cliangdev/conductor-only
      # secrets, absent (and rightly so) on any fork.
      - name: Authenticate to Google Cloud
        if: github.repository == 'cliangdev/conductor' && steps.cli.outputs.publish == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: github.repository == 'cliangdev/conductor' && steps.cli.outputs.publish == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3

      - name: Configure Docker for Artifact Registry
        if: github.repository == 'cliangdev/conductor' && steps.cli.outputs.publish == 'true'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Mirror into Conductor's own Artifact Registry
        if: github.repository == 'cliangdev/conductor' && steps.cli.outputs.publish == 'true'
        run: |
          AR_IMAGE=us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/conductor/claude-runner
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest $AR_IMAGE:latest
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest $AR_IMAGE:sha-${{ steps.sha.outputs.short }}
          docker push $AR_IMAGE:latest
          docker push $AR_IMAGE:sha-${{ steps.sha.outputs.short }}
