name: Worker CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'conductor-worker/**'
      - '.github/workflows/worker-ci.yml'

concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: worker-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: conductor-worker
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: conductor-worker/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Test
        run: JEST_JUNIT_OUTPUT_FILE=junit.xml npm test -- --reporters=default --reporters=jest-junit
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: worker-junit
          path: conductor-worker/junit.xml
          if-no-files-found: ignore
      - name: Publish test annotations
        if: always()
        uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe  # v4
        with:
          report_paths: conductor-worker/junit.xml
          check_name: worker-tests
