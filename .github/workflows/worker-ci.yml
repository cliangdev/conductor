name: Worker CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'conductor-worker/**'
      - '.github/workflows/worker-ci.yml'

concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: worker-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: conductor-worker
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: conductor-worker/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Test
        run: JEST_JUNIT_OUTPUT_FILE=junit.xml npm test -- --reporters=default --reporters=jest-junit
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: worker-junit
          path: conductor-worker/junit.xml
          if-no-files-found: ignore
      - name: Publish test annotations
        if: always()
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d  # v6.5.0
        with:
          report_paths: conductor-worker/junit.xml
          check_name: worker-tests
