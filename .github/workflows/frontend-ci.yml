name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'conductor-frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/actions/frontend-test/**'

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: frontend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: ./.github/actions/frontend-test
      - name: Publish test annotations
        if: always()
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16  # v6.4.2
        with:
          report_paths: conductor-frontend/junit.xml
          check_name: frontend-tests
