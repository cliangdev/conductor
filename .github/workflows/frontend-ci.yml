name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'conductor-frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/actions/frontend-test/**'

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: frontend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/frontend-test
