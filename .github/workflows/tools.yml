name: Tools CI

on:
  push:
    branches: [main]
    paths:
      - 'conductor-tools/**'
      - '.github/workflows/tools.yml'
  pull_request:
    branches: [main]
    paths:
      - 'conductor-tools/**'
      - '.github/workflows/tools.yml'

concurrency:
  group: tools-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test-cli:
    name: tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: conductor-tools
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: conductor-tools/package-lock.json
      - name: Enable corepack to use pinned npm version
        run: corepack enable && corepack prepare --activate
      - run: npm ci
      - run: npm run build
      - name: Test
        run: npm run test -- --reporter=verbose --reporter=junit --outputFile.junit=junit.xml
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tools-junit
          path: conductor-tools/junit.xml
          if-no-files-found: ignore
      - name: Publish test annotations
        if: always()
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16  # v6.4.2
        with:
          report_paths: conductor-tools/junit.xml
          check_name: tools-tests

  version-bump-check:
    name: version-bump-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
      - name: Require version bump if CLI source changed
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          SRC_CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- \
            'conductor-tools/src/**' \
            'conductor-tools/assets/**' \
            'conductor-tools/scripts/**' \
            ':(exclude)conductor-tools/src/__tests__/**' | wc -l)
          VER_CHANGED=$(git diff "$BASE" "$HEAD" -- conductor-tools/package.json \
            | grep -E '^\+\s*"version":' | wc -l)
          if [ "$SRC_CHANGED" -gt 0 ] && [ "$VER_CHANGED" -eq 0 ]; then
            echo "::error::CLI source changed but conductor-tools/package.json version did not. Run: cd conductor-tools && npm version <patch|minor|major> --no-git-tag-version"
            exit 1
          fi
          echo "✓ Version-bump check passed (src changed: $SRC_CHANGED, version changed: $VER_CHANGED)"
