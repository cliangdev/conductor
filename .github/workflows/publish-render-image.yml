name: Publish Render Image

# Publishes ghcr.io/cliangdev/conductor-render, the image the system workflow
# `conductor-creative-render` runs on a self-hosted daemon. It bundles Playwright Chromium, ffmpeg and
# the conductor CLI, installed at an EXACT published version, so it must be rebuilt after each CLI
# release (the render core ships inside the CLI package). Tags: :1 (floating, what the workflow
# pins), :<cli version>, :sha-<short>.
on:
  # After the CLI is published to npm.
  workflow_run:
    workflows: ['Release CLI']
    types: [completed]
    branches: [main]
  # When the image definition itself changes.
  push:
    branches: [main]
    paths:
      - 'runner-image/Dockerfile.render'
      - '.github/workflows/publish-render-image.yml'
  workflow_dispatch:

# Never run two publishes at once; don't cancel an in-flight one (a later run just publishes again
# afterwards, rather than racing tags on the same registry).
concurrency:
  group: publish-render-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/conductor-render

jobs:
  build-and-push:
    # A workflow_run fires for failed/cancelled releases too; only a successful release has a new
    # version on npm.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          # For workflow_run: the exact commit the release built, not whatever main is by now.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: '22'

      - name: Resolve the CLI version to install
        id: cli
        env:
          STRICT: ${{ github.event_name == 'workflow_run' }}
        run: |
          VERSION=$(node -p "require('./conductor-tools/package.json').version")
          # The release publishes to npm before this runs (workflow_run) but the registry can lag a
          # moment, and a push that only touches the Dockerfile may name a version not released yet.
          FOUND=""
          for attempt in $(seq 1 30); do
            if npm view "@cliangdev/conductor@${VERSION}" version >/dev/null 2>&1; then
              FOUND=1
              break
            fi
            echo "@cliangdev/conductor@${VERSION} not on npm yet (attempt ${attempt}/30)"
            if [ "$STRICT" != "true" ] && [ "$attempt" -ge 3 ]; then
              break
            fi
            sleep 20
          done
          if [ -z "$FOUND" ]; then
            if [ "$STRICT" = "true" ]; then
              echo "::error::@cliangdev/conductor@${VERSION} never appeared on npm"
              exit 1
            fi
            VERSION=$(npm view @cliangdev/conductor version)
            echo "::warning::package.json's version is not published; building with the latest published ${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 builds on an amd64 runner)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mac daemons are arm64, Linux ones mostly amd64: publish both under every tag.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: runner-image
          file: runner-image/Dockerfile.render
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            CONDUCTOR_VERSION=${{ steps.cli.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:1
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.cli.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.sha.outputs.short }}
