name: Release CLI

on:
  push:
    branches: [main]
    paths:
      - 'conductor-tools/package.json'
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: conductor-tools
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      skip: ${{ steps.tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Set workflow run title
        run: |
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} \
            -X PATCH -f name="Release CLI v${{ steps.pkg.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if version is already released
        id: tag
        working-directory: ${{ github.workspace }}
        run: |
          if git rev-parse "cli-v${{ steps.pkg.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::notice::cli-v${{ steps.pkg.outputs.version }} already released — skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  build-and-test:
    name: Build & Test — CLI v${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conductor-tools
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: conductor-tools/package-lock.json

      - name: Install pinned npm version
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  publish-and-release:
    name: Publish & Release — CLI v${{ needs.check.outputs.version }}
    needs: [check, build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: conductor-tools
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: conductor-tools/package-lock.json

      - name: Install pinned npm version
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Tag and create GitHub Release
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "cli-v${{ needs.check.outputs.version }}"
          git push origin "cli-v${{ needs.check.outputs.version }}"
          gh release create "cli-v${{ needs.check.outputs.version }}" \
            --generate-notes \
            --title "CLI v${{ needs.check.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
