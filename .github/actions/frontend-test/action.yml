name: 'Frontend test'
description: 'Set up Node and run conductor-frontend typecheck, lint, and tests. Assumes the repo is already checked out.'

inputs:
  run-checks:
    description: 'Run typecheck/lint/test. Set to "false" to skip (e.g. skip-tests preview deploys).'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: conductor-frontend/package-lock.json
    - name: Install dependencies
      working-directory: conductor-frontend
      shell: bash
      run: npm ci
    - name: Typecheck
      if: ${{ inputs.run-checks == 'true' }}
      working-directory: conductor-frontend
      shell: bash
      run: npm run typecheck
    - name: Lint
      if: ${{ inputs.run-checks == 'true' }}
      working-directory: conductor-frontend
      shell: bash
      run: npm run lint
    - name: Test
      if: ${{ inputs.run-checks == 'true' }}
      working-directory: conductor-frontend
      shell: bash
      run: npm run test -- --reporter=verbose --reporter=junit --outputFile.junit=junit.xml
    - name: Upload test report
      if: ${{ failure() && inputs.run-checks == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: frontend-junit
        path: conductor-frontend/junit.xml
        if-no-files-found: ignore
